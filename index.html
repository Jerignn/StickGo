<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stick Fight</title>
<style>
  /* --sky and --ink are updated by the game for the day/night cycle */
  :root { --btn-size: 18vh; --gw: min(100vw, 300vh);   /* --gw: the game's on-screen width */ --sky: #f7f7f7; --ink: #535353; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--sky);
    display: flex;
    align-items: flex-start;   /* game sticks to the top; spare height goes below it */
    justify-content: center;
    font-family: "Courier New", monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #game {
    /* Keep the 3:1 shape and fill as much of the screen as possible */
    width: var(--gw);
    height: calc(var(--gw) / 3);
    background: var(--sky);
    image-rendering: pixelated;
  }
  /* Touch controls, laid out like a MOBA: a joystick under the left thumb, and under the right thumb a big
     basic-attack button in the corner with the skills curving around it and jump / dash on the outside.
     --b follows the BUTTON SIZE setting; every other size is a multiple of it. */
  :root {
    --b: max(var(--btn-size), 64px);
    --atk: calc(var(--b) * 1.35);   /* basic attack */
    --sk: calc(var(--b) * 0.8);     /* skills 1 - 3 */
    --sp: calc(var(--b) * 0.58);    /* jump and dash */
    --gap: calc(var(--b) * 0.09);
    --knob-x: 0px;
    --knob-y: 0px;
  }
  .btn {
    position: absolute;
    box-sizing: border-box;
    border-radius: 50%;
    /* Dark blue glass inside a polished steel rim */
    border: 3px solid transparent;
    background:
      radial-gradient(circle at 50% 30%, rgba(80, 120, 180, 0.55), rgba(12, 20, 38, 0.78) 72%) padding-box,
      linear-gradient(160deg, #f2f7ff, #8fb0dc 35%, #2b4370 70%, #a9c4ec) border-box;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45), inset 0 0 10px rgba(140, 190, 255, 0.25);
    color: #fff;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.55);
    font: bold 16px "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: transform 0.08s ease-out, filter 0.08s;
  }
  .btn svg { width: 50%; height: 50%; fill: #fff; stroke: none; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.55)); pointer-events: none; }
  /* Pressing: the button sinks a little and lights up, and a ring of light ripples out from its rim */
  .btn.pressed { transform: scale(0.9); filter: brightness(1.3); }
  .btn::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 3px solid rgba(160, 215, 255, 0.95);
    opacity: 0;
    pointer-events: none;
  }
  @keyframes tap-ring { 0% { opacity: 0.95; transform: scale(1); } 100% { opacity: 0; transform: scale(1.35); } }
  .btn.tap::before { animation: tap-ring 0.32s ease-out; }

  #pad { position: fixed; right: 3vw; bottom: 4vh; width: var(--atk); height: var(--atk); }
  #attackBtn { left: 0; top: 0; width: var(--atk); height: var(--atk); }
  #attackBtn svg { width: 54%; height: 54%; }
  /* Each button around attack sits at an angle (--c = cos, --s = sin) and a distance (--r) from its centre */
  #pad .skill, #pad .spell {
    --size: var(--sk);
    --r: calc(var(--atk) / 2 + var(--size) / 2 + var(--gap));
    width: var(--size);
    height: var(--size);
    left: calc(50% + var(--r) * var(--c) - var(--size) / 2);
    top: calc(50% - var(--r) * var(--s) - var(--size) / 2);
    font-size: 20px;
  }
  #pad .spell {
    --size: var(--sp);
    --r: calc(var(--atk) / 2 + var(--sk) + var(--sp) / 2 + var(--gap) * 2);
  }
  #sk1Btn { --c: -0.99; --s: -0.14; }   /* 188 deg: low on the left */
  #sk2Btn { --c: -0.77; --s: 0.64; }    /* 140 deg: up and left */
  #sk3Btn { --c: -0.03; --s: 1; }       /* 92 deg: straight above */
  #jumpBtn { --c: -0.98; --s: -0.17; }  /* outer ring, low */
  #dashBtn { --c: -0.93; --s: 0.37; }   /* outer ring, higher */
  #pad .skill, #pad .spell { background:
      radial-gradient(circle at 50% 30%, rgba(80, 120, 180, 0.55), rgba(12, 20, 38, 0.78) 72%) padding-box,
      linear-gradient(160deg, #e6f3ff, #5aa2ff 40%, #173a78 75%, #8cc4ff) border-box; }
  /* Skills each have their own theme: SLAM is ember orange, SPIN is wind cyan, the ULTIMATE royal gold.
     --th = the theme colour, --th-hi / --th-lo = its light and dark ends, --in-hi / --in-lo = the glass. */
  #sk1Btn { --th: #ff8a1f; --th-hi: #ffe0b0; --th-lo: #6e2204; --in-hi: rgba(200, 100, 40, 0.6); --in-lo: rgba(40, 12, 4, 0.85); }
  #sk2Btn { --th: #38e0ff; --th-hi: #e0fbff; --th-lo: #06405c; --in-hi: rgba(40, 170, 210, 0.55); --in-lo: rgba(4, 26, 40, 0.85); }
  #sk3Btn { --th: #ffc93a; --th-hi: #fff6cf; --th-lo: #5a2d00; --in-hi: rgba(170, 110, 220, 0.6); --in-lo: rgba(30, 10, 46, 0.88); }
  #pad .skill {
    border-width: 4px;
    background:
      radial-gradient(circle at 50% 28%, var(--in-hi), var(--in-lo) 72%) padding-box,
      conic-gradient(from 210deg, var(--th-hi), var(--th), var(--th-lo), var(--th), var(--th-hi)) border-box;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(0, 0, 0, 0.55), inset 0 0 12px var(--th);
  }
  #pad .skill::before { border-color: var(--th); }
  #pad .skill .glyph { filter: drop-shadow(0 0 4px var(--th)) drop-shadow(0 2px 0 rgba(0, 0, 0, 0.6)); }
  #pad .skill.cooling .glyph { filter: none; }
  #pad .skill .cd { background: conic-gradient(transparent calc((1 - var(--cd, 0)) * 1turn), rgba(6, 4, 14, 0.74) 0); }
  /* Ready: a soft aura breathes around the skill in its colour (the ultimate gets a turning ring of light) */
  .skill .aura {
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 12px 3px var(--th), inset 0 0 8px var(--th);
    animation: aura-breathe 1.6s ease-in-out infinite;
  }
  @keyframes aura-breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.95; } }
  #sk3Btn .aura {
    inset: -9px;
    box-shadow: 0 0 16px 4px rgba(255, 201, 58, 0.7);
    background: conic-gradient(#fff6cf, transparent 18%, #ffc93a 25%, transparent 45%, #c77dff 52%, transparent 70%, #ffc93a 78%, transparent 95%, #fff6cf);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
    animation: aura-spin 2.2s linear infinite;
  }
  @keyframes aura-spin { to { transform: rotate(1turn); } }
  .skill.cooling .aura { display: none; }
  /* Mana cost: a little pixel chip on the lower right; it turns red while he can't afford the skill */
  .skill .cost {
    position: absolute;
    right: -6px;
    bottom: -4px;
    min-width: 22px;
    padding: 1px 3px 1px 12px;
    box-sizing: border-box;
    border: 2px solid #8fd0ff;
    background: #123a86;
    box-shadow: 2px 2px 0 #000;
    font: bold 11px "Courier New", monospace;
    line-height: 13px;
    color: #fff;
    text-align: right;
    pointer-events: none;
  }
  .skill .cost::before {   /* a pixel mana drop */
    content: "";
    position: absolute;
    left: 3px;
    top: 3px;
    width: 6px;
    height: 7px;
    background: #5ec8ff;
    clip-path: polygon(50% 0, 100% 55%, 85% 100%, 15% 100%, 0 55%);
  }
  .skill.cooling .cost { border-color: #ff7a7a; background: #6a1020; }

  /* The joystick: a ring with faint arrows; the knob follows the thumb and springs back when it lifts */
  #stick {
    position: fixed;
    left: 4vw;
    bottom: 4vh;
    width: calc(var(--b) * 1.6);
    height: calc(var(--b) * 1.6);
    box-sizing: border-box;
    border-radius: 50%;
    border: 3px solid rgba(170, 200, 240, 0.55);
    background: radial-gradient(circle, rgba(40, 60, 95, 0.25), rgba(12, 20, 38, 0.5) 70%);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35), inset 0 0 14px rgba(140, 190, 255, 0.2);
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stick .arrow {
    position: absolute;
    width: 0;
    height: 0;
    border: 9px solid transparent;
    opacity: 0.6;
    pointer-events: none;
  }
  #stick .arrow.l { left: 7%; top: 50%; margin-top: -9px; border-right: 12px solid #dce8ff; border-left: 0; }
  #stick .arrow.r { right: 7%; top: 50%; margin-top: -9px; border-left: 12px solid #dce8ff; border-right: 0; }
  #stick .arrow.u { top: 7%; left: 50%; margin-left: -9px; border-bottom: 12px solid #dce8ff; border-top: 0; }
  #knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 46%;
    height: 46%;
    box-sizing: border-box;
    border-radius: 50%;
    border: 3px solid transparent;
    background:
      radial-gradient(circle at 50% 35%, rgba(150, 185, 235, 0.9), rgba(40, 65, 110, 0.9) 75%) padding-box,
      linear-gradient(160deg, #f2f7ff, #8fb0dc 40%, #2b4370) border-box;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
    transform: translate(calc(-50% + var(--knob-x)), calc(-50% + var(--knob-y)));
    transition: transform 0.12s ease-out;
    pointer-events: none;
  }
  #stick.active #knob { transition: none; }
  #stick.active { border-color: rgba(190, 220, 255, 0.85); }
  /* Arrow controls (SETTINGS > CONTROLS: ARROWS): left / right to walk, up to jump, under the left thumb */
  #arrows {
    --arr: calc(var(--b) * 0.78);
    position: fixed;
    left: 4vw;
    bottom: 4vh;
    width: calc(var(--arr) * 2 + var(--gap) * 2);
    height: calc(var(--arr) * 1.8 + var(--gap));
    touch-action: none;
  }
  #arrows .btn { width: var(--arr); height: var(--arr); }
  #arrows .btn svg { width: 46%; height: 46%; }
  #leftBtn { left: 0; bottom: 0; }
  #rightBtn { right: 0; bottom: 0; }
  #upBtn { left: calc(50% - var(--arr) / 2); top: 0; }
  #leftBtn svg { transform: rotate(-90deg); }
  #rightBtn svg { transform: rotate(90deg); }
  body:not(.ctrl-arrows) #arrows, body.ctrl-arrows #stick { display: none; }
  /* The cooldown clock: the unfinished part is shaded and is eaten away clockwise, with the seconds
     left in the middle. --cd runs from 1 (just used) down to 0 (ready). */
  .btn .cd {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(transparent calc((1 - var(--cd, 0)) * 1turn), rgba(0, 0, 0, 0.72) 0);
    pointer-events: none;
    display: none;
  }
  .btn .cdn {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font: bold 17px "Courier New", monospace;
    color: #fff;
    pointer-events: none;
  }
  .btn.cooling .cd { display: block; }
  .btn.cooling .cdn { display: flex; }
  .btn.cooling { filter: saturate(0.4); }
  .btn .glyph { width: 64%; height: 64%; image-rendering: pixelated; pointer-events: none; }
  .btn.cooling > .glyph { opacity: 0.35; }
  @keyframes ready-pop { 0% { transform: scale(1.18); box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.7); } 100% { transform: scale(1); } }
  .btn.ready { animation: ready-pop 0.35s ease-out; }
  /* A small caption under a button says what it does; it fades out a few seconds into the run */
  .btn[data-cap]::after, #stick[data-cap]::after {
    content: attr(data-cap);
    position: absolute;
    top: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    font: bold 11px "Courier New", monospace;
    letter-spacing: 1px;
    white-space: nowrap;
    color: var(--ink);
    text-shadow: none;
    opacity: 0;
    transition: opacity 2s;
    pointer-events: none;
  }
  body.show-hint .btn[data-cap]::after, body.show-hint #stick[data-cap]::after { opacity: 1; transition: opacity 0.2s; }
  /* Computers get the same hint as one line of keys along the bottom */
  #keyHint {
    position: fixed;
    top: calc(var(--gw) / 3 + 14px);   /* just under the game */
    left: 50%;
    transform: translateX(-50%);
    font: bold 14px "Courier New", monospace;
    letter-spacing: 1px;
    white-space: nowrap;
    color: var(--ink);
    opacity: 0;
    transition: opacity 2s;
    pointer-events: none;
  }
  body.playing #keyHint { opacity: 0.5; }   /* stays as a quiet reminder under the game */
  body.show-hint #keyHint { opacity: 0.9; transition: opacity 0.2s; }
  @media (hover: none), (pointer: coarse) { #keyHint { display: none; } }
  /* Hide the touch controls on computers with a mouse; keyboard is used there */
  @media (hover: hover) and (pointer: fine) {
    #pad, #stick, body.ctrl-arrows #arrows { display: none; }
  }
  /* Controls and pause only show while playing */
  body:not(.playing) #pad,
  body:not(.playing) #stick,
  body:not(.playing) #arrows,
  body:not(.playing) #pauseBtn { display: none; }

  #pauseBtn {
    /* Sits inside the game's top-left corner, scaled with it, next to the health bar */
    position: fixed;
    top: calc(var(--gw) * 14 / 900);
    left: calc((100vw - var(--gw)) / 2 + var(--gw) * 18 / 900);
    width: max(48px, calc(var(--gw) * 48 / 900));
    height: max(48px, calc(var(--gw) * 48 / 900));
    box-sizing: border-box;
    border-radius: 12px;
    border: 3px solid var(--ink);
    background: rgba(128, 128, 128, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  #pauseBtn span { width: 14%; height: 44%; background: var(--ink); border-radius: 2px; }

  .menu {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #14161c;
    color: #d6d6d6;
  }
  .menu.open { display: flex; }
  .menu h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: 4px; }
  .menu p { margin: 0; font-size: 14px; }
  .menu button {
    min-width: 240px;
    padding: 10px 20px;
    font: bold 18px "Courier New", monospace;
    color: #d6d6d6;
    background: #2a2d36;
    border: 3px solid #d6d6d6;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .menu button:active { background: #444855; }
  #settingsMenu {
    display: none;
    grid-template-columns: repeat(2, minmax(0, 300px));
    align-content: center;
    justify-content: center;
    gap: 12px 14px;
    padding: 0 5vw;
    box-sizing: border-box;
  }
  #settingsMenu.open { display: grid; }
  #settingsMenu h1 { grid-column: 1 / -1; text-align: center; margin: 0 0 4px; }
  #settingsMenu button { min-width: 0; width: 100%; }
  #settingsMenu button[data-action="back"] { grid-column: 1 / -1; justify-self: center; width: 50%; }

  /* Main menu: full-screen artwork (it already has the logo) with buttons on the left */
  #mainMenu {
    background: #1a1430 url("pictures/mainmenu_px.png") center 25% / cover no-repeat;
    image-rendering: pixelated;
    align-items: flex-start;
    justify-content: flex-end;
    padding: 0 0 9vh 6vw;
    box-sizing: border-box;
  }
  #mainMenu button, .store-menu button, #settingsMenu button, #pauseMenu button, #overMenu button {
    color: #fff;
    background: rgba(20, 12, 30, 0.6);
    border-color: #ff8a1f;
    border-radius: 0;   /* pixel style: square corners, a hard stepped shadow, no blur */
    box-shadow: 4px 4px 0 #000, inset -3px -3px 0 rgba(0, 0, 0, 0.45), inset 3px 3px 0 rgba(255, 190, 120, 0.25);
    text-shadow: 2px 2px 0 #000;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #mainMenu button:active, .store-menu button:active, #settingsMenu button:active, #pauseMenu button:active, #overMenu button:active { background: rgba(255, 120, 30, 0.55); transform: translate(3px, 3px); box-shadow: 1px 1px 0 #000; }
  #mainMenu p, .store-menu p {
    color: #fff;
    text-shadow: 0 1px 3px #000, 0 0 6px #000;
  }

  /* Gold and high score sit in the top-right corner of the main menu */
  .menu-stats {
    position: absolute;
    top: 2.5vh;
    right: 2vw;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 96px;
    box-sizing: border-box;
    padding: 4px 12px;
    border: 2px solid #ff8a1f;
    border-radius: 0;
    background: rgba(20, 12, 30, 0.8);
    box-shadow: 3px 3px 0 #000;
    font: bold 16px "Courier New", monospace;
    text-shadow: 0 1px 2px #000;
  }
  .stat .coin { width: 16px; height: 16px; margin: 0; }
  .stat-value { margin-left: auto; letter-spacing: 1px; }
  .stat-gold .stat-value { color: #ffd34d; }
  .stat-high {
    flex-direction: column;
    align-items: flex-end;
    gap: 0;
    padding: 3px 12px 4px;
  }
  .stat-high .stat-value { margin-left: 0; color: #fff; line-height: 1.1; }
  .stat-label { color: #ff8a1f; font-size: 10px; letter-spacing: 2px; }
  .stat-label small { color: #cbb7e0; font-size: 10px; letter-spacing: 1px; }

  /* Shop, inventory and customize share one layout: a top bar (BACK, title, gold), the content
     filling the rest of the screen (its grid scrolls), and a message line at the bottom.
     Same artwork as the main menu behind, dimmed so the cards stand out. */
  .store-menu, #settingsMenu {
    background: linear-gradient(rgba(12, 8, 24, 0.66), rgba(12, 8, 24, 0.66)),
                #1a1430 url("pictures/mainmenu_px.png") center 25% / cover no-repeat;
    image-rendering: pixelated;
  }
  .store-menu {
    justify-content: flex-start;
    align-items: stretch;
    gap: 6px;
    padding: 8px 3vw 4px;
    box-sizing: border-box;
  }
  .store-top { display: flex; align-items: center; gap: 12px; min-height: 40px; }
  .store-top h1 { flex: 1; margin: 0; text-align: center; color: #fff; font-size: 24px; letter-spacing: 6px; text-shadow: 3px 3px 0 #000; }
  .store-menu .back-btn, .store-menu .small-btn { min-width: 0; padding: 6px 14px; font-size: 14px; }
  .gold-chip {
    min-width: 110px;
    box-sizing: border-box;
    padding: 5px 12px;
    border: 2px solid #ff8a1f;
    background: rgba(20, 12, 30, 0.85);
    box-shadow: 3px 3px 0 #000;
    color: #ffd34d;
    font: bold 16px "Courier New", monospace;
    text-align: right;
    text-shadow: 0 1px 2px #000;
  }
  .store-body { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .grid {
    flex: 1;
    min-height: 0;
    width: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    justify-content: center;
    gap: 12px;
    padding: 4px 8px 10px 4px;
    box-sizing: border-box;
  }
  .store-msg { min-height: 1.2em; margin: 0; color: #ffd34d; font-size: 13px; text-align: center; text-shadow: 0 1px 3px #000; }
  /* A heading inside a grid (inventory rarity groups) takes a whole row */
  .group-head {
    flex-basis: 100%;
    margin-top: 4px;
    padding-bottom: 3px;
    border-bottom: 2px solid var(--rar);
    color: var(--rar);
    font: bold 12px "Courier New", monospace;
    letter-spacing: 4px;
    text-shadow: 0 1px 3px #000;
  }
  .group-head:first-child { margin-top: 0; }
  .coin {
    display: inline-block;
    width: 16px;
    height: 16px;
    margin-right: 6px;
    background: var(--coin-img) center / 100% 100% no-repeat;   /* same pixel coin as in the game */
    image-rendering: pixelated;
    vertical-align: -3px;
  }
  /* Inventory: the equipped sword on the left, everything owned on the right */
  .inv-body { flex-direction: row; align-items: stretch; gap: 14px; }
  .inv-equipped {
    width: 210px;
    flex: none;
    box-sizing: border-box;
    padding: 10px;
    border: 3px solid #ffd34d;
    background: rgba(20, 12, 30, 0.85);
    box-shadow: 4px 4px 0 #000, inset 0 0 22px rgba(255, 211, 77, 0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    overflow-y: auto;
  }
  .inv-equipped .label { color: #ffd34d; font: bold 11px "Courier New", monospace; letter-spacing: 4px; }
  .inv-equipped canvas { width: 100%; height: auto; }
  .inv-equipped .name { color: #fff; font: bold 15px "Courier New", monospace; text-align: center; text-shadow: 0 1px 2px #000; }
  .inv-equipped .perk { color: #9fe3ff; font: bold 11px "Courier New", monospace; text-align: center; line-height: 1.25; }
  /* Customize: the live preview on the left; sections (LOOK / EFFECTS / OUTFITS), their tabs and items on the right */
  .look-body { flex-direction: row; align-items: stretch; gap: 16px; }
  .look-left { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: none; }
  #lookPreview {
    height: min(calc(100vh - 130px), 300px);
    width: auto;
    border: 3px solid #ff8a1f;

  /* Shop and inventory share one row on the main menu */
  .menu-pair { display: flex; gap: 10px; width: 240px; }

  /* Settings and pause: the same pixel buttons as the main menu */

  #overMenu { background: radial-gradient(ellipse at center, rgba(70, 0, 12, 0.55), rgba(8, 0, 4, 0.92) 75%); }
  .over-panel {

  .over-stats { display: grid; grid-template-columns: repeat(3, minmax(118px, auto)); gap: 8px; }
  .ostat {

  .over-btns { display: flex; gap: 12px; margin-top: 4px; }

  #overMenu .over-btns button.primary { background: #ff8a1f; color: #111; text-shadow: none; }
</style>

<script>
const canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;   // swapped briefly to draw the hero into the customize preview

// Game world is always 900x300 units; the canvas is scaled to the screen's
// real pixel density so lines stay crisp instead of being stretched.
const W = 900;
const H = 300;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();
const GROUND_Y = 250;

// --- Tunable settings ---
const GRAVITY = 2400;        // px/s^2
const JUMP_VELOCITY = -780;  // px/s
const JUMP_BUFFER = 0.1;     // s a jump press is remembered while still in the air
const DASH_DIST = 150;       // px a dash covers
const DASH_TIME = 0.16;      // s a dash lasts (he can't be hurt during it)
const DASH_COOLDOWN = 2;     // s before he can dash again
const HINT_TIME = 8;         // s the control labels stay on screen before they've faded
const ATTACK_DURATION = 0.25;  // s a sword swing lasts (and can hit for)
const COMBO_RECOVERY = 0.35;   // s he is open after the 3rd swing before he can attack again
const LIGHT_PUSH = 0.35;       // how much of the shove the first two swings keep (only the finisher staggers)

// Speeds in px/s; gain is px/s added per second
const DIFFICULTIES = {
  easy:   { label: "EASY",   start: 320, max: 800,  gain: 5 },
  normal: { label: "NORMAL", start: 380, max: 1000, gain: 8 },
  hard:   { label: "HARD",   start: 460, max: 1200, gain: 12 }
};
const CONTROL_TYPES = {
  joystick: { label: "JOYSTICK" },
  arrows:   { label: "ARROWS" }
};
const BUTTON_SIZES = {
  small:  { label: "SMALL",  size: "14vh" },
  medium: { label: "MEDIUM", size: "18vh" },
  large:  { label: "LARGE",  size: "24vh" }
};

const settings = Object.assign(
  { difficulty: "normal", btnSize: "medium", sound: true, music: true, controls: "joystick" },
  JSON.parse(localStorage.getItem("stickgo-settings") || "{}")
);

function saveSettings() {
  localStorage.setItem("stickgo-settings", JSON.stringify(settings));
}

// High scores are kept per difficulty, since harder modes score faster
const highScores = JSON.parse(localStorage.getItem("stickgo-highs") || "{}");
// Older versions kept a single high score; carry it over to the current difficulty
const oldHigh = Number(localStorage.getItem("stickgo-high") || 0);
if (oldHigh) {
  highScores[settings.difficulty] = Math.max(oldHigh, highScores[settings.difficulty] || 0);
  localStorage.setItem("stickgo-highs", JSON.stringify(highScores));
  localStorage.removeItem("stickgo-high");
}
// One-time wipe of every saved high score. Bump the number in HIGH_RESET_ID to wipe them again.
const HIGH_RESET_ID = "1";
if (localStorage.getItem("stickgo-high-reset") !== HIGH_RESET_ID) {
  for (const key of Object.keys(highScores)) delete highScores[key];
  localStorage.removeItem("stickgo-highs");
  localStorage.setItem("stickgo-high-reset", HIGH_RESET_ID);
}
function high(diff) { return highScores[diff] || 0; }

// Gold dropped by enemies; the total is kept across runs
let totalGold = Number(localStorage.getItem("stickgo-gold") || 0);
// Dev testing gold: the browser version (not the phone app) gets this once, so the shop can be
// tried out. Bump the number in DEV_GRANT_ID to grant it again. Also ?gold=N sets any amount.
const DEV_GOLD = 99999999, DEV_GRANT_ID = "1";
const onPhone = location.pathname.includes("android_asset");
const devGold = Number(new URLSearchParams(location.search).get("gold"));
if (devGold > 0) {
  totalGold = devGold;
  localStorage.setItem("stickgo-gold", totalGold);
} else if (!onPhone && localStorage.getItem("stickgo-dev-grant") !== DEV_GRANT_ID) {
  totalGold = DEV_GOLD;
  localStorage.setItem("stickgo-gold", totalGold);
  localStorage.setItem("stickgo-dev-grant", DEV_GRANT_ID);
}
// The phone app gets a one-time gift of gold. Bump BONUS_ID to give it again.
const PHONE_BONUS = 50000, BONUS_ID = "2";
if (onPhone && localStorage.getItem("stickgo-bonus-grant") !== BONUS_ID) {
  totalGold += PHONE_BONUS;
  localStorage.setItem("stickgo-gold", totalGold);
  localStorage.setItem("stickgo-bonus-grant", BONUS_ID);
}

// --- Sword skins: every sword has the same reach; shop swords add a perk to basic attacks (SWORD_PERKS) ---
// The shop groups skins by rarity. How a skin is drawn (see drawBlade):
//   blade = fill colour (null = day/night palette), tip = colour the blade fades to,
//   edge = outline, hi = highlight ridge, guard = crossguard and grip, gem = jewel on the guard,
//   shape = blade outline from PROFILES, curve = sabre-like bend, glow = soft halo,
//   fx = animated effect (see swordFx) in fxColor, hilt = visible handle, wing = winged guard.
// skins that are removed from this list also disappear from saved inventories.
const RARITIES = {
  common:    { label: "COMMON",    color: "#7ed957", glow: "rgba(126, 217, 87, 0.40)" },
  uncommon:  { label: "UNCOMMON",  color: "#4aa8ff", glow: "rgba(74, 168, 255, 0.45)" },
  rare:      { label: "RARE",      color: "#b266ff", glow: "rgba(178, 102, 255, 0.50)" },
  legendary: { label: "LEGENDARY", color: "#ffa930", glow: "rgba(255, 169, 48, 0.60)" }
};
// Skins with img are pixel-art pictures from pictures/weapons/ (cut by tools/cut_weapons.py);
// slash = the SLASH_FX his basic attacks leave while it is equipped.
const SWORD_SKINS = {
  starter: { name: "STARTER SCYTHE", rarity: null, price: 0, blade: null, guard: null, len: 26, width: 3 },
  rusty:         { name: "RUSTY SABRE", rarity: "common", price: 100, img: "rusty" },
  wooden:        { name: "WOODEN SWORD", rarity: "common", price: 100, img: "wooden" },
  cleaver:       { name: "BUTCHER CLEAVER", rarity: "common", price: 150, img: "cleaver" },
  cutlass:       { name: "BRASS CUTLASS", rarity: "common", price: 150, img: "cutlass" },
  iron:          { name: "IRON SWORD", rarity: "common", price: 200, img: "iron" },
  serrated:      { name: "SERRATED BLADE", rarity: "uncommon", price: 400, img: "serrated" },
  frost_staff:   { name: "FROST STAFF", rarity: "uncommon", price: 450, img: "frost_staff" },
  void_blade:    { name: "VOID SHARD", rarity: "uncommon", price: 500, img: "void_blade" },
  vine:          { name: "VINE BLADE", rarity: "uncommon", price: 500, img: "vine" },
  bone:          { name: "BONE REAPER", rarity: "uncommon", price: 600, img: "bone" },
  inferno:       { name: "INFERNO EDGE", rarity: "rare", price: 1200, img: "inferno", slash: "crimson" },
  shadow:        { name: "SHADOW FANG", rarity: "rare", price: 1300, img: "shadow", slash: "shadow" },
  gale:          { name: "GALE CRESCENT", rarity: "rare", price: 1400, img: "gale", slash: "aero" },
  glacier:       { name: "GLACIER SWORD", rarity: "rare", price: 1500, img: "glacier", slash: "frostbite" },
  phoenix:       { name: "PHOENIX BLADE", rarity: "legendary", price: 4000, img: "phoenix", slash: "dragon" },
  plasma:        { name: "PLASMA SABER", rarity: "legendary", price: 4000, img: "plasma", slash: "laser" },
  nebula:        { name: "NEBULA SWORD", rarity: "legendary", price: 4500, img: "nebula", slash: "voidbringer" },
  seraph:        { name: "SERAPH WING", rarity: "legendary", price: 5000, img: "seraph", slash: "sun" },
  ember_feather: { name: "EMBER FEATHER", rarity: "legendary", price: 5000, img: "ember_feather", slash: "feather" },
  thunder:       { name: "THUNDER FANG", rarity: "legendary", price: 5500, img: "thunder", slash: "thunder" },
  toxic:         { name: "PLAGUE BLADE", rarity: "legendary", price: 5500, img: "toxic", slash: "plague" },
  gearblade:     { name: "CLOCKWORK BLADE", rarity: "legendary", price: 6000, img: "gearblade", slash: "clockwork" }
};
const fmt = (n) => n.toLocaleString("en-US");
const skinState = Object.assign(
  { owned: ["starter"], equipped: "starter" },
  JSON.parse(localStorage.getItem("stickgo-skins") || "{}")
);
skinState.owned = skinState.owned.filter((id) => SWORD_SKINS[id]);   // swords that are no longer sold leave the inventory
if (!skinState.owned.includes("starter")) skinState.owned.unshift("starter");
if (!SWORD_SKINS[skinState.equipped]) skinState.equipped = "starter";
function saveSkins() { localStorage.setItem("stickgo-skins", JSON.stringify(skinState)); }
function equippedSkin() { return SWORD_SKINS[skinState.equipped] || SWORD_SKINS.starter; }

// --- Game state ---
let state = "ready";         // "ready" | "countdown" | "running" | "paused" | "dying" | "over"
let speed, score, distance, obstacles, clouds, groundBits, spawnTimer, lastTime;
let runDiff = settings.difficulty;  // difficulty of the current run; settings changes apply next run
let flashTime = 0;
let potions = [];            // health / mana potions dropped by enemies, waiting to be picked up
let coins = [];              // gold coins dropped by enemies, waiting to be picked up
let corpses = [];            // slain enemies lying where they fell (they play their death animation)
let runGold = 0;
let popups = [];             // floating "+10" texts
let wave = 1;
let waveBanner = 0;          // time left showing the "WAVE n" banner
const COUNTDOWN_WORDS = ["READY", "SET", "FIGHT!"];
const COUNTDOWN_STEP = 0.8;  // s each word stays up
let countdown = 0, countdownStage = -1;

const player = {
  x: 80,
  y: 0,
  vy: 0,
  onGround: true,
  ducking: false,
  runPhase: 0,
  facing: 1,                 // 1 = looking right, -1 = left
  dash: 0,                   // time left in the current dash
  dashDir: 1,
  dashCooldown: 0,
  act: null,                 // the attack or skill being played (see COMBO / SKILLS)
  actT: 0,
  fired: [],
  buffered: false,           // another attack was pressed during a combo swing
  lungeV: 0,
  combo: 0,                  // which swing of the 3-hit combo comes next
  comboTimer: 0,
  recover: 0,                // time left before a basic attack can start again (after the finisher)
  mana: 100,                 // spent by skills 1, 2 and 3 (they have no cooldown of their own)
  stun: 0,                   // time left flinching after a hit
  inv: 0,                    // time left where nothing can hurt him (dash, skills)
  runT: 0,
  moving: false,
  hp: 100,
  hurt: 0,                   // time left before he can be hurt again

// --- Screens & menus ---
const menus = {
  main: document.getElementById("mainMenu"),
  pause: document.getElementById("pauseMenu"),
  settings: document.getElementById("settingsMenu"),
  over: document.getElementById("overMenu"),
  shop: document.getElementById("shopMenu"),
  inventory: document.getElementById("invMenu"),
  look: document.getElementById("lookMenu")
};
let settingsReturnTo = "main";   // which menu BACK returns to
let resetArmed = false;          // reset high score needs a second tap

function showMenu(name) {
  for (const [key, el] of Object.entries(menus)) el.classList.toggle("open", key === name);
  document.body.classList.toggle("playing", name === null);
  if (name === "main") {
    document.getElementById("highText").textContent = pad5(high(settings.difficulty));
    document.getElementById("highDiff").textContent = DIFFICULTIES[settings.difficulty].label;
    document.getElementById("goldText").textContent = fmt(totalGold);
  }
  if (name === "settings") refreshSettingsLabels();
  if (name === "shop") { shopMessage(""); refreshShop(); }
  if (name === "inventory") { invMessage(""); refreshInventory(); }
  if (name === "look") { lookMessage(""); refreshLook(); }
  animatePreviews();
  animateLook();
}

function refreshSettingsLabels() {
  const nextRun = state === "paused" && settings.difficulty !== runDiff ? " (NEXT RUN)" : "";
  document.getElementById("difficultyBtn").textContent =
    `DIFFICULTY: ${DIFFICULTIES[settings.difficulty].label}${nextRun}`;
  document.getElementById("btnSizeBtn").textContent =
    `BUTTON SIZE: ${BUTTON_SIZES[settings.btnSize].label}`;
  document.getElementById("soundBtn").textContent = `SOUND FX: ${settings.sound ? "ON" : "OFF"}`;
  document.getElementById("musicBtn").textContent = `MUSIC: ${settings.music ? "ON" : "OFF"}`;
  document.getElementById("controlsBtn").textContent = `CONTROLS: ${(CONTROL_TYPES[settings.controls] || CONTROL_TYPES.joystick).label}`;
  document.body.classList.toggle("ctrl-arrows", settings.controls === "arrows");
  document.getElementById("resetHighBtn").textContent =
    resetArmed ? "TAP AGAIN TO CONFIRM" : "RESET HIGH SCORES";
  document.documentElement.style.setProperty("--btn-size", BUTTON_SIZES[settings.btnSize].size);
}

function nextKey(obj, current) {
  const keys = Object.keys(obj);
  return keys[(keys.indexOf(current) + 1) % keys.length];
}

// PLAY starts a short READY - SET - RUN! countdown; the run itself begins on "RUN!"
function startGame() {
  reset();
  state = "countdown";
  countdown = 0;
  countdownStage = -1;
  showMenu(null);
}

function updateCountdown(dt) {
  countdown += dt;
  player.runPhase += dt * 5.5;   // walking in place while the words count down
  const stage = Math.min(COUNTDOWN_WORDS.length - 1, Math.floor(countdown / COUNTDOWN_STEP));
  if (stage !== countdownStage) {
    countdownStage = stage;
    [sfx.ready, sfx.ready, sfx.go][stage]();
  }
  if (countdown >= COUNTDOWN_STEP * COUNTDOWN_WORDS.length) {
    state = "running";
    startWave(1);
    hintTimer = HINT_TIME;
    document.body.classList.add("show-hint");
  }
}

function pauseGame() {
  if (state !== "running") return;
  state = "paused";
  releaseInput();
  showMenu("pause");
}

function resumeGame() {
  state = "running";
  showMenu(null);
}

function goToMainMenu() {
  reset();
  state = "ready";
  showMenu("main");
}

function openSettings(from) {
  settingsReturnTo = from;
  resetArmed = false;
  showMenu("settings");
}

const menuActions = {
  play: startGame,
  shop: () => showMenu("shop"),
  shopBack: () => showMenu("main"),
  inventory: () => showMenu("inventory"),
  invBack: () => showMenu("main"),
  look: () => showMenu("look"),
  lookBack: () => showMenu("main"),
  lookRandom: () => randomLook(),
  resume: resumeGame,
  main: goToMainMenu,
  settings: () => openSettings(state === "paused" ? "pause" : "main"),
  back: () => showMenu(settingsReturnTo),
  difficulty: () => {
    settings.difficulty = nextKey(DIFFICULTIES, settings.difficulty);
    saveSettings();
    refreshSettingsLabels();
  },
  btnSize: () => {
    settings.btnSize = nextKey(BUTTON_SIZES, settings.btnSize);
    saveSettings();
    refreshSettingsLabels();
  },
  sound: () => {
    settings.sound = !settings.sound;
    saveSettings();
    refreshSettingsLabels();
  },
  controls: () => {
    settings.controls = nextKey(CONTROL_TYPES, settings.controls);
    saveSettings();
    refreshSettingsLabels();
  },
  music: () => {
    settings.music = !settings.music;
    saveSettings();
    refreshSettingsLabels();
  },
  resetHigh: () => {
    if (resetArmed) {
      for (const key of Object.keys(highScores)) delete highScores[key];
      localStorage.removeItem("stickgo-highs");
      resetArmed = false;
    } else {
      resetArmed = true;
    }
    refreshSettingsLabels();
  }
};

document.querySelectorAll(".menu button").forEach((b) => {
  b.addEventListener("click", () => menuActions[b.dataset.action]());
});

// --- Shop ---
let shopTab = "common";   // which rarity tab is showing
let previewTimer = null;

// A card with the sword picture, name and rarity. The caller adds the button's text and action.
function swordCard(id) {
  const skin = SWORD_SKINS[id];
  const info = RARITIES[skin.rarity] || { label: "STARTER", color: "#ffffff" };
  const card = document.createElement("div");
  card.className = "card";
  if (RARITIES[skin.rarity]) {
    card.style.setProperty("--rar", info.color);
    card.style.setProperty("--rar-glow", info.glow);
  }
  card.innerHTML = `<canvas width="320" height="128"></canvas>
    <div class="name">${skin.name}</div>
    <div class="tag" style="color:${info.color}">${info.label}</div>
    <div class="perk">${(SWORD_PERKS[id] || { text: "NO PERK" }).text}</div>
    <button></button>`;
  const canvas = card.querySelector("canvas");
  if (skin.fx || skin.glow || skin.slash) canvas.dataset.anim = id;   // animated while the menu is open
  drawSwordPreview(canvas, skin);
  return card;
}

// Keeps the glowing, sparking swords moving while the shop or inventory is open
function animatePreviews() {
  const open = menus.shop.classList.contains("open") || menus.inventory.classList.contains("open");
  if (!open) { clearInterval(previewTimer); previewTimer = null; return; }
  if (previewTimer) return;
  previewTimer = setInterval(() => {
    for (const c of document.querySelectorAll("#shopMenu canvas[data-anim], #invMenu canvas[data-anim]")) {
      drawSwordPreview(c, SWORD_SKINS[c.dataset.anim]);
    }
  }, 70);
}

// One tab per rarity, and below it that rarity's swords
function refreshShop() {
  document.getElementById("shopGold").innerHTML = `<span class="coin"></span>${fmt(totalGold)}`;
  const tabs = document.getElementById("shopTabs");
  const row = document.getElementById("shopItems");
  tabs.innerHTML = "";
  row.innerHTML = "";
  for (const [rarity, info] of Object.entries(RARITIES)) {
    const ids = Object.keys(SWORD_SKINS).filter((id) => SWORD_SKINS[id].rarity === rarity && !SWORD_SKINS[id].legacy);
    const owned = ids.filter((id) => skinState.owned.includes(id)).length;
    const tab = document.createElement("button");
    tab.className = "tab" + (rarity === shopTab ? " active" : "");
    tab.style.setProperty("--rar", info.color);
    tab.innerHTML = `${info.label}<small>${owned}/${ids.length}</small>`;
    tab.addEventListener("click", () => { shopTab = rarity; shopMessage(""); refreshShop(); });
    tabs.appendChild(tab);
  }
  for (const [id, skin] of Object.entries(SWORD_SKINS)) {
    if (skin.rarity !== shopTab || skin.legacy) continue;
    const owned = skinState.owned.includes(id);
    const card = swordCard(id);
    const btn = card.querySelector("button");
    btn.innerHTML = owned ? "OWNED" : `<span class="coin"></span>${fmt(skin.price)}`;
    btn.classList.toggle("owned", owned);
    btn.classList.toggle("cant", !owned && totalGold < skin.price);
    btn.addEventListener("click", () => shopTap(id));
    row.appendChild(card);
  }
}

function shopMessage(text) { document.getElementById("shopMsg").textContent = text; }

// Tapping a card buys it if there's enough gold. Equipping is done in the inventory.
function shopTap(id) {
  const skin = SWORD_SKINS[id];
  if (skinState.owned.includes(id)) {
    shopMessage("YOU OWN THIS — EQUIP IT FROM YOUR INVENTORY");
    return;
  } else if (totalGold >= skin.price) {
    totalGold -= skin.price;
    localStorage.setItem("stickgo-gold", totalGold);
    skinState.owned.push(id);
    shopMessage(`BOUGHT ${skin.name}! EQUIP IT FROM YOUR INVENTORY`);
    sfx.coin();
  } else {
    shopMessage(`NOT ENOUGH GOLD — NEED ${fmt(skin.price - totalGold)} MORE`);
    return;
  }
  saveSkins();
  refreshShop();
}

// --- Inventory ---
// Every owned sword (starter first, then by rarity) with an EQUIP button.
function refreshInventory() {
  document.getElementById("invGold").innerHTML = `<span class="coin"></span>${fmt(totalGold)}`;
  const eq = SWORD_SKINS[skinState.equipped] || SWORD_SKINS.starter;
  const eqInfo = RARITIES[eq.rarity] || { label: "STARTER", color: "#ffffff" };
  const panel = document.getElementById("invEquipped");
  panel.innerHTML = `<div class="label">EQUIPPED</div><canvas width="320" height="128"></canvas>
    <div class="name">${eq.name}</div>
    <div class="tag" style="color:${eqInfo.color}">${eqInfo.label}</div>
    <div class="perk">${(SWORD_PERKS[skinState.equipped] || { text: "NO PERK" }).text}</div>`;
  const big = panel.querySelector("canvas");
  if (eq.fx || eq.glow || eq.slash) big.dataset.anim = skinState.equipped;
  drawSwordPreview(big, eq);

  const row = document.getElementById("invItems");
  row.innerHTML = "";
  for (const rarity of [null, ...Object.keys(RARITIES)]) {
    const ids = Object.keys(SWORD_SKINS).filter((id) => SWORD_SKINS[id].rarity === rarity && skinState.owned.includes(id));
    if (!ids.length) continue;
    const info = RARITIES[rarity] || { label: "STARTER", color: "#ffffff" };
    const head = document.createElement("div");
    head.className = "group-head";
    head.style.setProperty("--rar", info.color);
    head.textContent = `${info.label} (${ids.length})`;
    row.appendChild(head);
    for (const id of ids) {
      const equipped = skinState.equipped === id;
      const card = swordCard(id);
      card.classList.toggle("equipped", equipped);
      const btn = card.querySelector("button");
      btn.textContent = !equipped ? "EQUIP" : id === "starter" ? "EQUIPPED" : "UNEQUIP";
      btn.addEventListener("click", () => equipSkin(id));
      row.appendChild(card);
    }
  }
  if (skinState.owned.length < 2) invMessage("BUY MORE WEAPONS IN THE SHOP");
}

function equipSkin(id) {
  if (skinState.equipped === id) {
    // Unequipping puts the starter sword back (he always carries one)
    if (id === "starter") return;
    skinState.equipped = "starter";
    saveSkins();
    refreshInventory();
    invMessage(`${SWORD_SKINS[id].name} UNEQUIPPED`);
    return;
  }
  skinState.equipped = id;
  saveSkins();
  refreshInventory();
  invMessage(`${SWORD_SKINS[id].name} EQUIPPED`);
}

function invMessage(text) { document.getElementById("invMsg").textContent = text; }

// A rarity from the price unless the item names one; free items have none
function rarityOf(item) {
  if (item.rarity) return item.rarity;
  if (!item.price) return null;
  return item.price < 100 ? "common" : item.price < 300 ? "uncommon" : item.price < 1000 ? "rare" : "legendary";
}

// Free items are owned from the start; the first one in each group is the default
const look = { owned: {}, equipped: {}, outfits: Array(OUTFIT_SLOTS).fill(null) };
for (const [g, info] of Object.entries(LOOK_GROUPS)) {
  look.owned[g] = Object.keys(info.items).filter((id) => !info.items[id].price && !info.items[id].unlock);
  look.equipped[g] = info.multi ? [] : look.owned[g][0];
}
// Puts on a saved set of items (only the ones he still owns; anything else goes back to the default)
function applyOutfit(eq) {
  for (const [g, info] of Object.entries(LOOK_GROUPS)) {
    if (info.multi) look.equipped[g] = (eq[g] || []).filter((id) => look.owned[g].includes(id));
    else look.equipped[g] = look.owned[g].includes(eq[g]) ? eq[g] : look.owned[g][0];
  }
}
try {
  const saved = JSON.parse(localStorage.getItem("stickgo-look2") || "{}");
  for (const [g, info] of Object.entries(LOOK_GROUPS)) {
    for (const id of (saved.owned || {})[g] || []) if (info.items[id] && !look.owned[g].includes(id)) look.owned[g].push(id);
  }
  applyOutfit(saved.equipped || {});
  if (Array.isArray(saved.outfits)) look.outfits = look.outfits.map((_, i) => saved.outfits[i] || null);
} catch (e) { /* a broken save just means the defaults */ }
function saveLook() { localStorage.setItem("stickgo-look2", JSON.stringify(look)); }

// Gives him any item whose unlock goal he has reached, and says so if he is mid-run
function checkUnlocks() {
  for (const [g, info] of Object.entries(LOOK_GROUPS)) {
    for (const [id, item] of Object.entries(info.items)) {
      if (!item.unlock || look.owned[g].includes(id) || STATS[item.unlock.stat] < item.unlock.n) continue;
      look.owned[g].push(id);
      saveLook();
      if (state === "running") {
        popups.push({ x: W / 2, y: 190, t: 0, text: `UNLOCKED: ${item.name}`, life: 2.6, unlock: true });
        sfx.point();
      }
    }
  }
}

// A sheet in one flat colour (for the glow outline), made once per sheet and colour
const silCache = {};
function silhouette(img, key, color) {
  key += color;
  if (silCache[key]) return silCache[key];
  const c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = "source-in";
  g.fillStyle = color;
  g.fillRect(0, 0, c.width, c.height);
  return (silCache[key] = c);
}
// The outline: his silhouette one pixel out on every side, with a soft blur of the same colour
function drawGlow(img, key, frame, glow, t) {
  const color = glow.anim ? "#ff3030" : glow.color;
  const sil = silhouette(img, key, color);
  ctx.save();
  if (glow.anim) ctx.filter = `hue-rotate(${Math.round((t * 90) % 360)}deg)`;
  if (glow.pulse) ctx.globalAlpha *= 0.55 + 0.45 * Math.sin(t * 5);
  ctx.shadowColor = color;
  ctx.shadowBlur = 10;
  for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) ctx.drawImage(sil, frame * FRAME_W, 0, FRAME_W, FRAME_H, dx, dy, FRAME_W, FRAME_H);
  ctx.restore();
}

// Orbiting orbs (an aura): the ones behind him are drawn before him, the rest after
function drawOrbs(cx, cy, color, t, front) {
  for (let i = 0; i < 3; i++) {
    const a = t * 2.5 + i * Math.PI * 2 / 3;
    if ((Math.sin(a) > 0) !== front) continue;
    const x = Math.round(cx + Math.cos(a) * 24), y = Math.round(cy + Math.sin(a) * 7 + Math.sin(t * 3 + i) * 3);
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = color;
    ctx.fillRect(x - 4, y - 4, 8, 8);
    ctx.globalAlpha = 1;
    ctx.fillRect(x - 2, y - 2, 4, 4);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(x - 1, y - 1, 2, 2);
  }
}

// One cosmetic particle, t seconds after it was made
function drawFxPart(p, t) {
  const k = t / p.life;
  if (k < 0 || k >= 1) return;
  const x = p.x + p.vx * t + (p.wob ? Math.sin(t * 6 + p.ph) * p.wob : 0);
  const y = p.y + p.vy * t + 0.5 * p.g * t * t;
  const s = Math.max(1, p.s + (p.grow || 0) * t);
  ctx.globalAlpha = (p.a || 1) * (1 - k);
  ctx.fillStyle = p.c;
  const R = Math.round;
  switch (p.shape) {
    case "star": {
      const u = Math.max(2, R(s / 2));
      ctx.fillRect(R(x - s), R(y - u / 2), R(s * 2), u);
      ctx.fillRect(R(x - u / 2), R(y - s), u, R(s * 2));
      break;
    }
    case "heart": {
      const u = Math.max(1, R(s / 4));
      for (const [r, row] of [".X.X.", "XXXXX", ".XXX.", "..X.."].entries()) {
        for (let i = 0; i < 5; i++) if (row[i] === "X") ctx.fillRect(R(x - 2.5 * u) + i * u, R(y - 2 * u) + r * u, u, u);
      }
      break;
    }
    case "petal": ctx.fillRect(R(x), R(y), R(s * 1.6), Math.max(1, R(s * 0.8))); break;
    case "ring":
      ctx.strokeStyle = p.c;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.stroke();
      break;
    case "soul":
      ctx.fillRect(R(x - s), R(y - s), R(s * 2), R(s * 2));
      ctx.fillRect(R(x - s * 0.6), R(y + s), R(s * 1.2), R(s * 0.9));
      ctx.fillStyle = "#1a2a40";
      ctx.fillRect(R(x - s * 0.5), R(y - s * 0.3), 2, 3);
      ctx.fillRect(R(x + s * 0.2), R(y - s * 0.3), 2, 3);
      break;
    default: ctx.fillRect(R(x - s / 2), R(y - s / 2), R(s), R(s));
  }
}
// Adds particles to a list (never more than `max`); dvx shifts them sideways (the preview's fake running)
const fxAdder = (list, dvx = 0, max = 600, rnd = Math.random) => (p) => {
  if (list.length < max) list.push({ t: 0, vx: 0, vy: 0, g: 0, ph: rnd() * 6, ...p, vx: (p.vx || 0) + dvx });
};
let fxParts = [];               // cosmetic particles in the game
const addFx = (p) => fxAdder(fxParts)(p);
let trailAcc = 0, auraAcc = 0;

// Emits his trail and aura particles; called every frame of a run
function emitCosmetics(dt) {
  const cx = player.x + player.w / 2, feet = player.y + player.h;
  const tr = TRAILS[look.equipped.trail], au = AURAS[look.equipped.aura];
  if (tr.emit && (player.moving || player.dash > 0)) {
    trailAcc += dt * tr.rate * (player.dash > 0 ? 3 : 1);
    for (; trailAcc >= 1; trailAcc--) tr.emit(addFx, cx - player.facing * 6, feet, player.facing, Math.random);
  }
  if (au.emit) {
    auraAcc += dt * au.rate;
    for (; auraAcc >= 1; auraAcc--) au.emit(addFx, cx, feet, Math.random);
  }
}

// A damage number in one of the DMG_STYLES
function drawDmgText(id, text, x, y, t, hue) {
  const st = DMG_STYLES[id] || DMG_STYLES.none;
  ctx.save();
  ctx.translate(x, y);
  if (st.pop) { const k = 1 + 0.5 * Math.max(0, 1 - t / 0.15); ctx.scale(k, k); }
  ctx.font = `bold ${st.size || 16}px 'Courier New', monospace`;
  ctx.textAlign = "center";
  if (!st.fill && !st.rainbow) {
    ctx.fillStyle = colors.ink;
    ctx.fillText(text, 0, 0);
  } else {
    ctx.lineWidth = 4;
    ctx.lineJoin = "round";
    ctx.strokeStyle = st.edge;
    ctx.strokeText(text, 0, 0);
    ctx.fillStyle = st.rainbow ? `hsl(${Math.round(hue)}, 100%, 62%)` : st.fill;
    ctx.fillText(text, 0, 0);
  }
  ctx.restore();
}

// Draws into another canvas by pointing ctx at it for a moment
function withContext(g, fn) {
  const savedCtx = ctx, savedColors = colors;
  ctx = g;
  colors = paletteAt(0);          // the day colours, so everything shows on the light preview
  try { fn(); } finally { ctx = savedCtx; colors = savedColors; }
}

// The big preview: the stickman as he will look in the game. On the trail tab he runs; on the
// kill / numbers / coin tabs those effects play next to him.
let pvParts = [], pvNums = [], pvLast = 0, pvTimer = 0, pvTrailAcc = 0, pvAuraAcc = 0, pvCoinT = 0;
function drawLookPreview() {
  const cv = document.getElementById("lookPreview");
  const g = cv.getContext("2d");
  const now = performance.now() / 1000, dt = Math.min(0.1, pvLast ? now - pvLast : 0);
  pvLast = now;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
  const sc = 4.2, k = sc / SC, ox = cv.width / 2 + 6 * sc, oy = cv.height - 28;
  const lk = look.equipped, running = lookTab === "trail";
  const tr = TRAILS[lk.trail], au = AURAS[lk.aura], cfx = COIN_FX[lk.coin];

  // Effects are worked out in game units around his feet at (0, 0)
  if (running && tr.emit) {
    pvTrailAcc += dt * tr.rate;
    for (; pvTrailAcc >= 1; pvTrailAcc--) tr.emit(fxAdder(pvParts, -110, 300), -6, 0, 1, Math.random);
  }
  if (au.emit) {
    pvAuraAcc += dt * au.rate;
    for (; pvAuraAcc >= 1; pvAuraAcc--) au.emit(fxAdder(pvParts, 0, 300), 0, 0, Math.random);
  }
  pvTimer += dt;
  if (lookTab === "kill" && pvTimer > 1.4) {
    pvTimer = 0;
    if (KILL_FX[lk.kill].burst) KILL_FX[lk.kill].burst(fxAdder(pvParts, 0, 300), 30, -40, Math.random);
  }
  if (lookTab === "dmg" && pvTimer > 0.45) {
    pvTimer = 0;
    pvNums.push({ x: 18 + Math.random() * 26, y: -62 - Math.random() * 12, t: 0, text: String(randInt(8, 40)), hue: Math.random() * 360 });
  }
  let coin = null;
  if (lookTab === "coin") {   // a coin flies up past him, over and over
    pvCoinT += dt;
    if (pvCoinT > 0.9) { pvCoinT = 0; if (cfx.pop) cfx.pop(fxAdder(pvParts, 0, 300), 34, -74, Math.random); }
    const q = pvCoinT / 0.9;
    coin = { x: -30 + q * 64, y: -10 - q * 64 - Math.sin(q * Math.PI) * 14, spin: now * 8 };
    if (cfx.trail && Math.random() < dt * 25) cfx.trail(fxAdder(pvParts, 0, 300), coin.x, coin.y, Math.random);
  }
  for (const p of pvParts) p.t += dt;
  pvParts = pvParts.filter((p) => p.t < p.life);
  for (const n of pvNums) { n.t += dt; n.y -= 40 * dt; }
  pvNums = pvNums.filter((n) => n.t < 0.8);

  withContext(g, () => {
    g.setTransform(k, 0, 0, k, ox, oy);
    if (au.orbs) drawOrbs(0, -32, au.orbs, now, false);
    g.setTransform(1, 0, 0, 1, 0, 0);
    const st = running ? HS.run : HS.idle;
    const fr = stateFrame(st, (now * (st.fps || 8)) % st.frames.length);
    drawSprite(fr.sheet, fr.frame, ox, oy, 1, 0, sc);
    g.setTransform(k, 0, 0, k, ox, oy);
    if (au.orbs) drawOrbs(0, -32, au.orbs, now, true);
    for (const p of pvParts) drawFxPart(p, p.t);
    g.globalAlpha = 1;
    if (coin) drawCoin(coin);
    for (const n of pvNums) {
      g.globalAlpha = Math.min(1, (0.8 - n.t) / 0.3);
      drawDmgText(lk.dmg, n.text, n.x, n.y, n.t, n.hue);
    }
    g.globalAlpha = 1;
  });
}

// A little random generator that always gives the same numbers for the same seed (for the icons)
function seeded(seed) {
  let s = seed >>> 0 || 1;
  return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
}
const NO_LOOK = { color: "yellow", acc: [] };

// The card pictures. Effects loop: a stream for trails and auras, a burst for kills and coins.
function drawLookIcon(cv, group, id) {
  const g = cv.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
  const now = performance.now() / 1000;
  const item = LOOK_GROUPS[group].items[id];
  const hero = (lk, sc = 1.8) => {
    const fr = stateFrame(HS.idle, (now * (HS.idle.fps || 8)) % HS.idle.frames.length);
    drawSprite(fr.sheet, fr.frame, cv.width / 2 + 6 * sc, cv.height - 6, 1, 0, sc, lk);
  };
  withContext(g, () => {
    const none = id === "none";
    if (group === "color") hero({ ...NO_LOOK, color: id });
    else if (group === "glow") hero({ ...NO_LOOK, glow: id });
    else if (group === "back") hero({ ...NO_LOOK, back: id }, 2.6);
    else if (group === "hat" || group === "acc") {
      const S = cv.height / 30;
      g.setTransform(S, 0, 0, S, cv.width / 2, cv.height * 0.62);
      g.fillStyle = "#fbf236";
      g.beginPath(); g.arc(0, 0, 6, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#d0c817";
      g.fillRect(-1, 5, 2, 9);
      if (group === "acc") drawAccessory(id, 0, 0);
      else drawHat(id, 0, 0, now);
    } else if (none) {
      g.fillStyle = "#c9c2d6";
      g.font = "bold 22px 'Courier New', monospace";
      g.textAlign = "center";
      g.fillText("NONE", cv.width / 2, cv.height / 2 + 8);
    } else if (group === "dmg") {
      g.setTransform(2, 0, 0, 2, cv.width / 2, cv.height / 2 + 10);
      const t = (now % 1.2);
      drawDmgText(id, "27", 0, -t * 6, t, (now * 120) % 360);
    } else if (group === "aura") {
      const sc = 1.8, k = sc / SC;
      if (item.orbs) { g.setTransform(k, 0, 0, k, cv.width / 2 + 6 * sc, cv.height - 6); drawOrbs(0, -32, item.orbs, now, false); g.setTransform(1, 0, 0, 1, 0, 0); }
      hero(NO_LOOK, sc);
      g.setTransform(k, 0, 0, k, cv.width / 2 + 6 * sc, cv.height - 6);
      if (item.orbs) drawOrbs(0, -32, item.orbs, now, true);
      if (item.emit) loopStream(item.rate, (add, r) => item.emit(add, 0, 0, r), now, 0);
    } else {
      const z = group === "kill" ? 1 : 2;
      g.setTransform(z, 0, 0, z, cv.width / 2, cv.height / 2 + 14 * z);
      if (group === "trail") loopStream(item.rate, (add, r) => item.emit(add, 22, 6, 1, r), now, -40);
      else if (group === "kill") loopBurst(0.8, (add, r) => item.burst(add, 0, -10, r), now);
      else if (group === "coin") {
        if (item.trail) loopStream(20, (add, r) => item.trail(add, 24 - r() * 48, -8, r), now, 0);
        if (item.pop) loopBurst(0.9, (add, r) => item.pop(add, 0, -8, r), now);
        drawCoin({ x: 0, y: -8, spin: now * 6 });
      }
    }
    g.globalAlpha = 1;
  });
}
// Particles made at a steady rate, replayed on a loop so the icon never runs dry
function loopStream(rate, emit, now, dvx) {
  const r = seeded(7), n = Math.min(60, Math.ceil(rate * 1.6)), period = n / rate, list = [];
  for (let i = 0; i < n; i++) {
    const before = list.length;
    emit(fxAdder(list, dvx, 999, r), r);
    for (let j = before; j < list.length; j++) list[j].born = i / rate;
  }
  for (const p of list) drawFxPart(p, (((now - p.born) % period) + period) % period);
}
function loopBurst(period, burst, now) {
  const list = [], r = seeded(11);
  burst(fxAdder(list, 0, 999, r), r);
  for (const p of list) drawFxPart(p, now % period);
}

// The customize tabs are grouped into sections so there are never more than five tabs in a row
const LOOK_SECTIONS = {
  look:    { label: "LOOK", groups: ["color", "glow", "hat", "acc", "back"] },
  fx:      { label: "EFFECTS", groups: ["trail", "aura", "kill", "dmg", "coin"] },
  outfits: { label: "OUTFITS", groups: ["outfits"] }
};
const sectionOf = (group) => Object.keys(LOOK_SECTIONS).find((k) => LOOK_SECTIONS[k].groups.includes(group));
let lookTab = "color";
let lookTimer = null;

function refreshLook() {
  document.getElementById("lookGold").innerHTML = `<span class="coin"></span>${fmt(totalGold)}`;
  const sections = document.getElementById("lookSections");
  const tabs = document.getElementById("lookTabs");
  const row = document.getElementById("lookItems");
  sections.innerHTML = "";
  tabs.innerHTML = "";
  row.innerHTML = "";
  const openTab = (group) => {
    if (lookTab !== group) { pvParts = []; pvNums = []; pvTimer = 0; }
    lookTab = group;
    lookMessage("");
    refreshLook();
  };
  const section = sectionOf(lookTab);
  for (const [key, sec] of Object.entries(LOOK_SECTIONS)) {
    const tab = document.createElement("button");
    tab.className = "tab" + (key === section ? " active" : "");
    tab.style.setProperty("--rar", key === "outfits" ? "#ffd34d" : "#ff8a1f");
    tab.textContent = sec.label;
    tab.addEventListener("click", () => { if (key !== section) openTab(sec.groups[0]); });
    sections.appendChild(tab);
  }
  tabs.style.display = section === "outfits" ? "none" : "";
  if (section !== "outfits") {
    for (const group of LOOK_SECTIONS[section].groups) {
      const tab = document.createElement("button");
      tab.className = "tab" + (group === lookTab ? " active" : "");
      tab.style.setProperty("--rar", "#ffb45a");
      tab.textContent = LOOK_GROUPS[group].label;
      tab.addEventListener("click", () => openTab(group));
      tabs.appendChild(tab);
    }
  }
  if (lookTab === "outfits") { refreshOutfits(row); drawLookPreview(); return; }
  const multi = LOOK_GROUPS[lookTab].multi;
  for (const [id, item] of Object.entries(LOOK_GROUPS[lookTab].items)) {
    const owned = look.owned[lookTab].includes(id);
    const equipped = multi ? look.equipped[lookTab].includes(id) : look.equipped[lookTab] === id;
    const rar = RARITIES[rarityOf(item)];
    const card = document.createElement("div");
    card.className = "card" + (equipped ? " equipped" : "");
    card.style.setProperty("--rar", rar ? rar.color : "#ff8a1f");
    if (rar) card.style.setProperty("--rar-glow", rar.glow);
    card.innerHTML = `<canvas width="192" height="120"></canvas><div class="name">${item.name}</div><button></button>`;
    const cv = card.querySelector("canvas");
    cv.dataset.group = lookTab;
    cv.dataset.id = id;
    drawLookIcon(cv, lookTab, id);
    const btn = card.querySelector("button");
    if (equipped) btn.textContent = multi ? "TAKE OFF" : "EQUIPPED";
    else if (owned) btn.textContent = "EQUIP";
    else if (item.unlock) { btn.textContent = item.unlock.text; btn.classList.add("cant", "locked"); }
    else { btn.innerHTML = `<span class="coin"></span>${fmt(item.price)}`; btn.classList.toggle("cant", totalGold < item.price); }
    btn.addEventListener("click", () => lookTap(lookTab, id));
    row.appendChild(card);
  }
  drawLookPreview();
}

// Outfit slots: save what he is wearing now, or put a saved outfit back on
function refreshOutfits(row) {
  look.outfits.forEach((fit, i) => {
    const card = document.createElement("div");
    card.className = "card outfit";
    card.style.setProperty("--rar", "#ffd34d");
    card.innerHTML = `<canvas width="192" height="120"></canvas><div class="name">OUTFIT ${i + 1}</div><button>WEAR</button><button>SAVE</button>`;
    const cv = card.querySelector("canvas");
    const g = cv.getContext("2d");
    if (fit) {
      withContext(g, () => {
        const sc = 1.8, fr = stateFrame(HS.idle, 0);
        drawSprite(fr.sheet, fr.frame, cv.width / 2 + 6 * sc, cv.height - 6, 1, 0, sc, { ...NO_LOOK, ...fit });
      });
    } else {
      g.fillStyle = "#c9c2d6";
      g.font = "bold 22px 'Courier New', monospace";
      g.textAlign = "center";
      g.fillText("EMPTY", cv.width / 2, cv.height / 2 + 8);
    }
    const [wear, save] = card.querySelectorAll("button");
    wear.classList.toggle("cant", !fit);
    wear.addEventListener("click", () => {
      if (!fit) { lookMessage("THIS SLOT IS EMPTY — TAP SAVE FIRST"); return; }
      applyOutfit(fit);
      saveLook();
      lookMessage(`OUTFIT ${i + 1} ON`);
      refreshLook();
    });
    save.addEventListener("click", () => {
      look.outfits[i] = JSON.parse(JSON.stringify(look.equipped));
      saveLook();
      lookMessage(`SAVED TO OUTFIT ${i + 1}`);
      refreshLook();
    });
    row.appendChild(card);
  });
}

// Tapping an item equips it; if you don't own it yet it is bought first
function lookTap(group, id) {
  const info = LOOK_GROUPS[group], item = info.items[id];
  if (!look.owned[group].includes(id)) {
    if (item.unlock) {
      lookMessage(`LOCKED — ${item.unlock.text} (${fmt(Math.min(STATS[item.unlock.stat], item.unlock.n))}/${fmt(item.unlock.n)})`);
      return;
    }
    if (totalGold < item.price) { lookMessage(`NOT ENOUGH GOLD — NEED ${fmt(item.price - totalGold)} MORE`); return; }
    totalGold -= item.price;
    localStorage.setItem("stickgo-gold", totalGold);
    look.owned[group].push(id);
    sfx.coin();
  }
  if (info.multi) {   // accessories: tapping a worn one takes it off
    const worn = look.equipped[group];
    if (worn.includes(id)) { worn.splice(worn.indexOf(id), 1); lookMessage(`${item.name} TAKEN OFF`); }
    else { worn.push(id); lookMessage(`${item.name} EQUIPPED`); }
  } else {
    look.equipped[group] = id;
    lookMessage(`${item.name} EQUIPPED`);
  }
  saveLook();
  refreshLook();
}

// RANDOM: a random outfit from what he already owns (never spends gold)
function randomLook() {
  const r = Math.random;
  for (const [g, info] of Object.entries(LOOK_GROUPS)) {
    if (info.multi) look.equipped[g] = look.owned[g].filter(() => r() < 0.25).slice(0, 2);
    else look.equipped[g] = pick(r, look.owned[g]);
  }
  saveLook();
  lookMessage("RANDOM LOOK!");
  refreshLook();
}

function lookMessage(text) { document.getElementById("lookMsg").textContent = text; }

// Keeps the preview and the card pictures moving
function animateLook() {
  if (!menus.look.classList.contains("open")) { clearInterval(lookTimer); lookTimer = null; return; }
  if (lookTimer) return;
  lookTimer = setInterval(() => {
    drawLookPreview();
    for (const cv of document.querySelectorAll("#lookItems canvas[data-group]")) drawLookIcon(cv, cv.dataset.group, cv.dataset.id);
  }, 50);
}

// Called by the Android app when the phone's back button is pressed.
// Returns true if the game handled it, false to let the app close.
window.stickgoBack = function () {
  if (state === "dying") return true;
  if (state === "countdown") { goToMainMenu(); return true; }
  if (state === "running") { pauseGame(); return true; }
  if (menus.shop.classList.contains("open")) { showMenu("main"); return true; }
  if (menus.inventory.classList.contains("open")) { showMenu("main"); return true; }
  if (menus.look.classList.contains("open")) { showMenu("main"); return true; }
  if (menus.settings.classList.contains("open")) { showMenu(settingsReturnTo); return true; }
  if (state === "paused") { resumeGame(); return true; }
  if (state === "over") { goToMainMenu(); return true; }
  return false;
};

// Pause automatically if the app is switched away from mid-run
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseGame();
});

// --- Sound ---
// Small synthesized beeps, so no audio files are needed. Browsers only allow
// audio after the player has touched or pressed something, so it starts then.
let audio = null;

function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!audio && AC) audio = new AC();
  if (audio && audio.state === "suspended") audio.resume();
}
for (const ev of ["pointerdown", "pointerup", "keydown", "click", "touchstart", "touchend"]) {
  document.addEventListener(ev, initAudio, true);
}
initAudio();   // the app allows autoplay, so the menu music can start right away

function beep(freq, dur, { type = "square", vol = 0.06, slideTo, delay = 0 } = {}) {
  if (!settings.sound || !audio || audio.state !== "running") return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur);
}

// --- Music ---
// A looping synthesized tune (Am - F - C - G): bass, arpeggio and drums, scheduled a
// little ahead of time from the main loop. It plays only while a run is going.
const MUSIC_STEP = 60 / 150 / 2;   // one eighth note at 150 bpm
const MUSIC_CHORDS = [
  { bass: 45, notes: [69, 72, 76] },   // Am
  { bass: 41, notes: [65, 69, 72] },   // F
  { bass: 48, notes: [72, 76, 79] },   // C
  { bass: 43, notes: [71, 74, 79] }    // G
];
const ARP_ORDER = [0, 1, 2, 1, 0, 1, 2, 1];
let musicNext = 0, musicStep = 0, noiseBuf = null;

const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

function musicTone(freq, t, dur, type, vol, slideTo) {
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur);
}

function noiseBuffer() {
  if (!noiseBuf) {
    noiseBuf = audio.createBuffer(1, audio.sampleRate * 0.1, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

// A swish of filtered noise whose pitch sweeps from `from` to `to` Hz (whooshes, crackles, thunder)
function whoosh(dur, vol, from, to, delay = 0) {
  if (!settings.sound || !audio || audio.state !== "running") return;
  const t = audio.currentTime + delay;
  const src = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  src.buffer = noiseBuffer();
  src.loop = true;
  filter.type = "bandpass";
  filter.Q.value = 1.4;
  filter.frequency.setValueAtTime(from, t);
  filter.frequency.exponentialRampToValueAtTime(to, t + dur);
  gain.gain.setValueAtTime(0.001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + dur * 0.15);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filter).connect(gain).connect(audio.destination);
  src.start(t);
  src.stop(t + dur + 0.02);
}

function musicNoise(t, dur, vol) {
  noiseBuffer();
  const src = audio.createBufferSource();
  const gain = audio.createGain();
  src.buffer = noiseBuf;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(gain).connect(audio.destination);
  src.start(t);
}

function scheduleMusicStep(step, t) {
  const bar = Math.floor(step / 8) % MUSIC_CHORDS.length;
  const s = step % 8;
  const chord = MUSIC_CHORDS[bar];
  // Phone speakers are weak on low notes, so the bass is an octave up and doubled with a square
  musicTone(midiHz(chord.notes[ARP_ORDER[s]]), t, MUSIC_STEP * 0.9, "square", 0.05);
  if (s === 0 || s === 3 || s === 4 || s === 6) {
    musicTone(midiHz(chord.bass + 12), t, MUSIC_STEP * 1.6, "triangle", 0.2);
    musicTone(midiHz(chord.bass + 12), t, MUSIC_STEP * 1.2, "square", 0.03);
  }
  if (s === 0 || s === 4) musicTone(180, t, 0.12, "sine", 0.25, 60);
  if (s === 2 || s === 6) musicNoise(t, 0.09, 0.08);
  if (s % 2 === 1) musicNoise(t, 0.03, 0.03);
}

function musicTick() {
  if (!audio || audio.state !== "running" || !settings.music || (state !== "running" && state !== "ready" && state !== "countdown")) {
    musicNext = 0;   // restart cleanly from the next beat once it can play again
    return;
  }
  const now = audio.currentTime;
  if (musicNext < now) musicNext = now + 0.05;
  while (musicNext < now + 0.25) {
    scheduleMusicStep(musicStep++, musicNext);
    musicNext += MUSIC_STEP;
  }
}

// The joystick: only the sideways part walks; pushing it up past halfway jumps once per push.
// It keeps tracking the finger until it lifts, even outside the ring.
let stickId = null, stickUp = false;
function moveStick(e) {
  const r = stick.getBoundingClientRect();
  const max = r.width / 2;
  let dx = e.clientX - (r.left + max), dy = e.clientY - (r.top + max);
  const d = Math.hypot(dx, dy);
  if (d > max) { dx *= max / d; dy *= max / d; }
  stick.style.setProperty("--knob-x", dx + "px");
  stick.style.setProperty("--knob-y", dy + "px");
  touchHeld.left = dx < -max * 0.25;
  touchHeld.right = dx > max * 0.25;
  const up = dy < -max * 0.55;
  if (up && !stickUp) press("jump");
  stickUp = up;
}
function releaseStick() {
  stickId = null;
  stickUp = false;
  touchHeld.left = touchHeld.right = false;
  stick.classList.remove("active");
  stick.style.setProperty("--knob-x", "0px");
  stick.style.setProperty("--knob-y", "0px");
}
stick.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  stick.setPointerCapture(e.pointerId);
  stickId = e.pointerId;
  stick.classList.add("active");
  moveStick(e);
});
stick.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) moveStick(e); });
for (const ev of ["pointerup", "pointercancel"]) {
  stick.addEventListener(ev, (e) => { if (e.pointerId === stickId) releaseStick(); });
}

// The arrow controls: each finger is on one arrow at a time and can slide from one to another.
// Up jumps once each time a finger reaches it.
const arrowsPad = document.getElementById("arrows");
const arrowBtns = { left: document.getElementById("leftBtn"), right: document.getElementById("rightBtn"), up: document.getElementById("upBtn") };
const arrowTouches = new Map();   // pointerId -> the arrow it is on (or null)
function arrowAt(x, y) {
  for (const [k, b] of Object.entries(arrowBtns)) {
    const r = b.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return k;
  }
  return null;
}
function syncArrows() {
  const on = new Set(arrowTouches.values());
  touchHeld.left = on.has("left");
  touchHeld.right = on.has("right");
  for (const [k, b] of Object.entries(arrowBtns)) b.classList.toggle("pressed", on.has(k));
}
function moveArrow(e) {
  const k = arrowAt(e.clientX, e.clientY);
  if (k === arrowTouches.get(e.pointerId)) return;
  if (k === "up") press("jump");
  arrowTouches.set(e.pointerId, k);
  syncArrows();
}
function releaseArrows() { arrowTouches.clear(); syncArrows(); }
arrowsPad.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  arrowsPad.setPointerCapture(e.pointerId);
  arrowTouches.set(e.pointerId, undefined);
  moveArrow(e);
});
arrowsPad.addEventListener("pointermove", (e) => { if (arrowTouches.has(e.pointerId)) moveArrow(e); });
for (const ev of ["pointerup", "pointercancel"]) {
  arrowsPad.addEventListener(ev, (e) => { arrowTouches.delete(e.pointerId); syncArrows(); });
}

// An action is a list of sheets played one after the other (parts) and hits that land when
// the animation reaches a frame. front/back = how far the hit reaches ahead of and behind him,
// kb = how far it shoves what it hits. prep() works out the timings.
function prep(def) {
  const spec = { ...def, hits: def.hits.map((h) => ({ ...h, part: h.part || 0 })) };
  let t = 0;
  spec.partStart = spec.parts.map((p) => { const s = t; t += p.frames.length / p.fps; return s; });
  spec.total = t;
  spec.hitT = spec.hits.map((h) => spec.partStart[h.part] + h.at / spec.parts[h.part].fps);
  return spec;
}
// The sheet frame showing t seconds into an action
function actFrame(spec, t) {
  let i = spec.parts.length - 1;
  while (i > 0 && t < spec.partStart[i]) i--;
  const p = spec.parts[i];
  const frame = p.frames[Math.min(p.frames.length - 1, Math.floor((t - spec.partStart[i]) * p.fps))];
  return { sheet: p.sheet, frame, flash: !!(p.flash && p.flash.includes(frame)) };
}
// One frame of a hero state (idle, run...), chosen by position in its frame list
function stateFrame(st, i) {
  return { sheet: st.sheet, frame: st.frames[Math.max(0, Math.min(st.frames.length - 1, Math.floor(i)))] };
}

  boss:   { look: "brute",   scale: 2.1, w: 52, h: 126, hp: 320, speed: 60,  dmg: 28, stand: 190, windup: 0.9,  rec: 1.0, gold: [60, 60], pts: 200 }
};
for (const [kind, data] of Object.entries(ANIM.foes)) Object.assign(FOES[kind], data.stats);   // stats come from animations.js
const SHOOTERS = new Set(["archer", "bomber"]);   // never more than two at a time
let foes = [];                 // enemies on the field
let portals = [];              // purple gates the enemies step out of
let arrows = [], bombs = [], blasts = [], shocks = [];   // enemy attacks in flight
let ghosts = [];               // fading afterimages left by a dash
let kills = 0;
let waveToSpawn = 0, waveTotal = 0, waveClearTimer = -1, bossDue = false;
let ghostTimer = 0, hintTimer = 0, dyingT = 0, heroFlash = null;
const queued = { attack: 0, s1: 0, s2: 0, s3: 0, jump: 0 };   // presses are remembered briefly (seconds left)

function inputDir() {
  return (held.right || touchHeld.right ? 1 : 0) - (held.left || touchHeld.left ? 1 : 0);
}

function startWave(n) {
  wave = n;
  player.revived = false;
  reachWave(n);
  setMapForWave(n);
  waveBanner = 2.2;
  bossDue = n % 5 === 0;
  waveToSpawn = waveTotal = Math.min(30, 4 + n * 2) + (bossDue ? 1 : 0);
  spawnTimer = 1.2;
  waveClearTimer = -1;
  sfx.wave();
}

function pickKind() {
  if (bossDue) { bossDue = false; return "boss"; }
  const shooters = foes.filter((o) => SHOOTERS.has(o.kind)).length + portals.filter((p) => SHOOTERS.has(p.kind)).length;
  const table = [
    ["grunt", 10],
    ["ninja", wave >= 2 ? 3 + wave * 0.5 : 0],
    ["guard", wave >= 3 ? 2 + wave * 0.4 : 0],
    ["brute", wave >= 3 ? 1.5 + wave * 0.3 : 0],
    ["archer", wave >= 3 && shooters < 2 ? 2 + wave * 0.3 : 0],
    ["bomber", wave >= 4 && shooters < 2 ? 1.5 + wave * 0.3 : 0],
    ["ghost", wave >= 5 ? 1.5 + wave * 0.25 : 0]
  ];
  let r = Math.random() * table.reduce((sum, e) => sum + e[1], 0);
  for (const [kind, weight] of table) { if ((r -= weight) < 0) return kind; }
  return "grunt";
}

// A portal opens at one of the two edges; half a second later an enemy steps out of it
function openPortal() {
