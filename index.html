function weaponFx() { const skin = equippedSkin(); return skin.slash ? WEAPON_FX[skin.slash] : null; }
function weaponIsLegendary() { return equippedSkin().rarity === "legendary"; }

// How far through the visible slash of the current basic attack he is (0..1), or -1 if none
function slashProgress() {
  const a = player.act;
  if (!a || !a.basic || !weaponFx()) return -1;
  const p = (player.actT - (a.hitT[0] - 0.06)) / 0.2;
  return p > 0 && p < 1 ? p : -1;
}
function slashAngle(p) { return -2.5 + 3.6 * Math.min(1, p * 1.3 + 0.2); }

// A rare or legendary weapon landing a basic hit: sparks in its colours, a flash ring, its sound
let impacts = [];
function weaponImpact(o) {
  const fx = weaponFx(), legend = weaponIsLegendary();
  const x = o.x + o.w / 2, y = o.y + 36;
  for (const c of fx.sparks) burst(x, y, legend ? 9 : 6, c, legend ? 320 : 260);
  impacts.push({ x, y, t: 0, color: fx.glow, bolt: fx.bolt, big: legend });
  fx.impact();
  if (legend) {
    beep(70, 0.3, { type: "sine", vol: 0.12, slideTo: 35 });
    shakeTime = Math.max(shakeTime, 0.16);
  }
}

function drawImpacts() {
  for (const m of impacts) {
    const k = m.t / 0.3, R = (m.big ? 34 : 24) * (0.3 + k);
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.shadowColor = m.color;
    ctx.shadowBlur = 12;
    ctx.strokeStyle = m.color;
    ctx.lineWidth = (m.big ? 5 : 3.5) * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(m.x, m.y, R, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#ffffff";   // a hard white pixel cross at the centre
    const c = (m.big ? 9 : 6) * (1 - k);
    ctx.fillRect(m.x - c, m.y - 1.5, c * 2, 3);
    ctx.fillRect(m.x - 1.5, m.y - c, 3, c * 2);
    if (m.bolt && k < 0.6) {   // thunder: a bolt strikes down from the sky onto the target
      let bx = m.x, by = 0;
      ctx.strokeStyle = "#fff9b0"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(bx, by);
      while (by < m.y) { by += 22; bx = m.x + (rnd(by + Math.floor(m.t * 30)) - 0.5) * 26; ctx.lineTo(bx, Math.min(by, m.y)); }
      ctx.stroke();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.restore();
  }
}

// --- Sword drawing ---
// Blade outlines. Each returns how far the top and bottom edges stick out (1 = half the
// skin's width) at t along the blade: 0 at the guard, 1 at the tip.
const table = (pts) => (t) => {
  for (let i = 1; i < pts.length; i++) {
    if (t <= pts[i][0]) {
      const [t0, a0, b0] = pts[i - 1], [t1, a1, b1] = pts[i];
      const f = (t - t0) / (t1 - t0 || 1);
      return [a0 + (a1 - a0) * f, b0 + (b1 - b0) * f];
    }
  }
  const last = pts[pts.length - 1];
  return [last[1], last[2]];
};
const PROFILES = {
  blade:    table([[0, 1, 1], [0.8, 1, 1], [1, 0, 0]]),
  bokken:   table([[0, 0.9, 0.9], [0.94, 1, 1], [1, 0, 0]]),
  saber:    table([[0, 1, 1], [0.7, 1, 1], [1, 0, 0]]),
  cleaver:  table([[0, 0.55, 0.55], [0.1, 1, 1], [0.94, 1, 0.92], [1, 0.9, 0.15]]),
  machete:  table([[0, 0.5, 0.5], [0.25, 0.6, 0.6], [0.8, 1, 1], [0.93, 1, 0.9], [1, 0, 0]]),
  broad:    table([[0, 0.6, 0.6], [0.1, 1, 1], [0.85, 1, 1], [1, 0, 0]]),
  shard:    table([[0, 0.5, 0.5], [0.12, 1, 0.7], [0.3, 0.75, 1], [0.5, 1, 0.8],
                   [0.7, 0.7, 0.95], [0.88, 0.55, 0.4], [1, 0, 0]]),
  ice:      table([[0, 0.6, 0.6], [0.1, 1, 0.9], [0.28, 0.7, 1], [0.45, 1, 0.75],
                   [0.62, 0.7, 0.95], [0.8, 0.8, 0.5], [1, 0, 0]]),
  laser:    table([[0, 1, 1], [0.96, 1, 1], [1, 0.3, 0.3]]),
  // Saw teeth along the top edge
  serrated: (t) => {
    const k = Math.min(1, (1 - t) / 0.12), f = (t * 6) % 1;
    return [k * (0.8 + 0.5 * f), k * 0.8];
  },
  // Wavy, like a flame
  flame: (t) => {
    const k = Math.min(1, (1 - t) / 0.15);
    return [k * (0.8 + 0.25 * Math.sin(t * 14)), k * (0.8 + 0.25 * Math.sin(t * 14 + 2))];
  }
};
const SWORD_START = 4;  // the blade starts this far from the hand, where the guard sits

function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// Animated effects around the blade. at(t, v) = a point t along the blade, v to the side.
function swordFx(g, skin, clock, at, w) {
  g.save();
  g.strokeStyle = g.fillStyle = skin.fxColor || "#ffffff";
  switch (skin.fx) {
    case "electric": {
      const seed = Math.floor(clock * 8);
      g.lineWidth = 0.5;
      for (let k = 0; k < 2; k++) {
        g.beginPath();
        for (let i = 0; i <= 10; i++) {
          const p = at(0.06 + 0.9 * i / 10, (rnd(seed * 7 + i + k * 31) - 0.5) * w * 1.7);
          i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y);
        }
        g.stroke();
      }
      break;
    }
    case "flame":
      for (let i = 0; i < 7; i++) {
        const t = 0.1 + 0.8 * i / 6;
        const h = 0.5 + 0.5 * Math.sin(clock * 9 + i * 2.1);
        const l = at(t - 0.03, w * 0.3), r = at(t + 0.05, w * 0.3);
        const apex = at(t + 0.035, w * 0.5 + 1.4 + 2.4 * h);
        g.globalAlpha = 0.85;
        g.beginPath(); g.moveTo(l.x, l.y); g.lineTo(apex.x, apex.y); g.lineTo(r.x, r.y); g.fill();
      }
      for (let i = 0; i < 4; i++) {   // embers drifting up
        const f = (clock * 0.9 + i * 0.27) % 1;
        const p = at(0.2 + 0.2 * i, w * 0.5 + 3 + 6 * f);
        g.globalAlpha = 1 - f;
        g.beginPath(); g.arc(p.x, p.y, 0.5, 0, Math.PI * 2); g.fill();
      }
      break;
    case "slime":
      g.lineWidth = 0.9;
      for (let i = 0; i < 3; i++) {
        const drop = 1.2 + 0.8 * (0.5 + 0.5 * Math.sin(clock * 2 + i * 2));
        const a = at(0.3 + 0.25 * i, -w * 0.45), b = at(0.3 + 0.25 * i, -w * 0.45 - drop);
        g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
        g.beginPath(); g.arc(b.x, b.y, 0.9, 0, Math.PI * 2); g.fill();
      }
      break;
    case "wisps":
      g.lineWidth = 0.45;
      g.globalAlpha = 0.6;
      for (let k = 0; k < 3; k++) {
        g.beginPath();
        for (let i = 0; i <= 14; i++) {
          const t = 0.05 + 0.95 * i / 14;
          const p = at(t, (k - 1) * w * 0.9 + 1.3 * Math.sin(t * 9 - clock * 7 + k * 2.1));
          i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y);
        }
        g.stroke();
      }
      break;
    case "sparkle":
      g.lineWidth = 0.4;
      for (let i = 0; i < 5; i++) {
        const s = Math.max(0, Math.sin(clock * 4 + i * 1.9)) * 1.5;
        if (s < 0.1) continue;
        const side = rnd(i + 9) > 0.5 ? 1 : -1;
        const p = at(0.15 + 0.8 * rnd(i + 3), side * (w * 0.4 + 1.2));
        g.beginPath();
        g.moveTo(p.x - s, p.y); g.lineTo(p.x + s, p.y);
        g.moveTo(p.x, p.y - s); g.lineTo(p.x, p.y + s);
        g.stroke();
      }
      break;
    case "void":
      for (let i = 0; i < 6; i++) {
        const p = at(((i / 6) + clock * 0.2) % 1, Math.sin(clock * 3 + i * 1.3) * w * 0.7);
        g.globalAlpha = 0.5 + 0.5 * Math.sin(clock * 4 + i);
        g.beginPath(); g.arc(p.x, p.y, 0.6, 0, Math.PI * 2); g.fill();
      }
      break;
    case "rust":
      g.globalAlpha = 0.8;
      for (const [t, v, r] of [[0.3, 0.2, 0.9], [0.55, -0.4, 0.7], [0.75, 0.3, 0.6]]) {
        const p = at(t, v);
        g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.fill();
      }
      break;
    case "laser": {
      g.globalAlpha = 0.9 + 0.1 * Math.sin(clock * 6);
      g.strokeStyle = "#ffffff";
      g.lineWidth = skin.width * 0.38;
      const a = at(0.02, 0), b = at(0.97, 0);
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
      break;
    }
  }
  g.restore();
}

// Draws a sword skin held at `hand`, pointing along `angle` (limb() convention).
// Also used by the shop previews, which pass their own canvas context.
function drawBlade(g, hand, angle, skin, clock = performance.now() / 1000) {
  const S = SWORD_START, L = skin.len - S, w = skin.width;
  const profile = PROFILES[skin.shape || "blade"];
  const bend = (skin.curve || 0) * skin.len;
  // Point on the blade: t runs from the guard (0) to the tip (1), v is the offset to the side
  const at = (t, v = 0) => ({ x: S + L * t, y: 2 * t * (1 - t) * bend + v });

  const N = 28, top = [], bot = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, [a, b] = profile(t);
    top.push(at(t, a * w / 2));
    bot.push(at(t, -b * w / 2));
  }
  const outline = () => {
    g.beginPath();
    top.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)));
    for (let i = N; i >= 0; i--) g.lineTo(bot[i].x, bot[i].y);
    g.closePath();
  };

  g.save();
  g.translate(hand.x, hand.y);
  // From here x runs along the blade and y across it
  g.transform(Math.sin(angle), Math.cos(angle), Math.cos(angle), -Math.sin(angle), 0, 0);
  g.lineCap = "round";
  g.lineJoin = "round";

  if (skin.glow) {
    const pulse = 0.8 + 0.2 * Math.sin(clock * 5);
    g.strokeStyle = skin.glow;
    outline();
    g.globalAlpha = 0.18 * pulse; g.lineWidth = 4.5; g.stroke();
    g.globalAlpha = 0.3 * pulse; g.lineWidth = 2.2; g.stroke();
    g.globalAlpha = 1;
  }

  let fill = skin.blade || colors.blade;
  if (skin.tip) {
    const grad = g.createLinearGradient(S, 0, S + L, 0);
    grad.addColorStop(0, fill);
    grad.addColorStop(1, skin.tip);
    fill = grad;
  }
  g.fillStyle = fill;
  outline();
  g.fill();
  if (skin.edge) { g.strokeStyle = skin.edge; g.lineWidth = 0.7; g.stroke(); }

  if (skin.hi) {   // light ridge down the middle
    g.strokeStyle = skin.hi;
    g.globalAlpha = 0.75;
    g.lineWidth = Math.max(0.5, w * 0.16);
    g.beginPath();
    for (let i = 0; i <= 8; i++) {
      const p = at(0.1 + 0.72 * i / 8);
      i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y);
    }
    g.stroke();
    g.globalAlpha = 1;
  }

  if (skin.fx) swordFx(g, skin, clock, at, w);

  g.strokeStyle = skin.guard || colors.ink;
  if (skin.hilt) {
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(-3, 0); g.lineTo(S + 1, 0); g.stroke();
  }
  g.beginPath();
  if (skin.wing) {
    g.lineWidth = 1.8;
    for (const s of [1, -1]) { g.moveTo(S, 0); g.quadraticCurveTo(S - 1, s * 4, S + 3, s * 7.5); }
  } else {
    g.lineWidth = 3;
    g.moveTo(S, -5); g.lineTo(S, 5);
  }
  g.stroke();
  if (skin.gem) {
    g.fillStyle = skin.gem;
    g.beginPath(); g.arc(S, 0, 1.2, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}

// Shop card picture: the sword lying almost flat, with a short handle
// The picture on a shop / inventory card: his scythe, in the colours and glow of that skin.
// (The starter one is black, like the one the hero carries.)
const SCYTHE_IMG = new Image();   // the hero's own scythe, cut out of his sprite (31x40 pixels)
SCYTHE_IMG.src = "pictures/scythe.png";
SCYTHE_IMG.onload = () => { if (menus.inventory.classList.contains("open")) refreshInventory(); };
let scytheRim = null;   // a light copy of the silhouette, so the black pixels stand out on the dark card
function drawPixelScythe(canvas, g) {
  if (!scytheRim) {
    scytheRim = document.createElement("canvas");
    scytheRim.width = SCYTHE_IMG.width; scytheRim.height = SCYTHE_IMG.height;
    const r = scytheRim.getContext("2d");
    r.drawImage(SCYTHE_IMG, 0, 0);
    r.globalCompositeOperation = "source-in";
    r.fillStyle = "#9a9ab4";
    r.fillRect(0, 0, scytheRim.width, scytheRim.height);
  }
  const k = Math.floor(canvas.height / (SCYTHE_IMG.height + 2));   // whole-number zoom keeps the pixels square
  const w = SCYTHE_IMG.width * k, h = SCYTHE_IMG.height * k;
  const x = Math.round((canvas.width - w) / 2), y = Math.round((canvas.height - h) / 2);
  g.imageSmoothingEnabled = false;
  for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) g.drawImage(scytheRim, x + dx * k, y + dy * k, w, h);
  g.drawImage(SCYTHE_IMG, x, y, w, h);
}
// The pixel-art weapons, loaded once; the open shop or inventory redraws as each one arrives
const WEAPON_IMGS = {};
for (const skin of Object.values(SWORD_SKINS)) {
  if (!skin.img || WEAPON_IMGS[skin.img]) continue;
  const img = new Image();
  img.src = `pictures/weapons/${skin.img}.png`;
  img.onload = () => {
    if (menus.shop.classList.contains("open")) refreshShop();
    if (menus.inventory.classList.contains("open")) refreshInventory();
  };
  WEAPON_IMGS[skin.img] = img;
}

// A pixel weapon fitted to the card; rare and legendary ones float and glow in their rarity colour
function drawWeaponImg(canvas, g, skin) {
  const img = WEAPON_IMGS[skin.img];
  if (!img.complete || !img.naturalWidth) return;
  const k = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.94;
  const w = img.width * k, h = img.height * k;
  const bob = skin.slash ? Math.round(Math.sin(performance.now() / 1000 * 3) * 3) : 0;
  g.imageSmoothingEnabled = false;
  if (skin.slash) {
    g.shadowColor = RARITIES[skin.rarity].color;
    g.shadowBlur = 10 + 6 * Math.sin(performance.now() / 1000 * 4);
  }
  g.drawImage(img, Math.round((canvas.width - w) / 2), Math.round((canvas.height - h) / 2) + bob, w, h);
  g.shadowBlur = 0;
}

function drawSwordPreview(canvas, skin) {
  const g = canvas.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, canvas.width, canvas.height);
  if (skin.img) { drawWeaponImg(canvas, g, skin); return; }
  if (!skin.blade && SCYTHE_IMG.complete && SCYTHE_IMG.naturalWidth) { drawPixelScythe(canvas, g); return; }
  const scale = canvas.width / 44;   // 44 units across, ~17 down
  g.setTransform(scale, 0, 0, scale, 0, 0);
  const clock = performance.now() / 1000;
  const blade = skin.blade || "#15151a", edge = skin.edge || "#000000", hi = skin.hi || "#5a5a66";
  const pulse = 0.6 + 0.4 * Math.sin(clock * 5);
  g.lineCap = "round";
  g.lineJoin = "round";

  // Haft, with a ring where the blade is mounted and a cap on the end
  g.strokeStyle = "#000000";
  g.lineWidth = 2.8;
  g.beginPath(); g.moveTo(4.5, 15); g.lineTo(32, 4); g.stroke();
  g.strokeStyle = skin.guard || "#4a3320";
  g.lineWidth = 1.7;
  g.beginPath(); g.moveTo(4.5, 15); g.lineTo(32, 4); g.stroke();
  g.fillStyle = skin.guard || "#3a2a1c";
  g.beginPath(); g.arc(4.5, 15, 1.7, 0, Math.PI * 2); g.fill();
  g.strokeStyle = edge;
  g.lineWidth = 1;
  g.beginPath(); g.moveTo(27, 6); g.lineTo(28.5, 7.8); g.stroke();   // collar

  // The blade: a crescent hooking down from the top of the haft
  const crescent = () => {
    g.beginPath();
    g.moveTo(30, 5.5);
    g.quadraticCurveTo(38, -1.5, 42.3, 10.5);   // outer (cutting) edge out to the tip
    g.quadraticCurveTo(37.5, 4.8, 30, 7.4);      // back along the inner edge
    g.closePath();
  };
  g.save();
  if (skin.glow) { g.shadowColor = skin.glow; g.shadowBlur = 5 + 4 * pulse; }
  crescent();
  if (skin.tip) {
    const grad = g.createLinearGradient(30, 6, 42, 10);
    grad.addColorStop(0, blade); grad.addColorStop(1, skin.tip);
    g.fillStyle = grad;
  } else g.fillStyle = blade;
  g.fill();
  g.shadowBlur = 0;
  g.strokeStyle = edge;
  g.lineWidth = 0.9;
  g.stroke();
  g.restore();
  g.strokeStyle = hi;   // highlight along the cutting edge
  g.lineWidth = 0.8;
  g.beginPath(); g.moveTo(31.5, 4.8); g.quadraticCurveTo(38, 0.3, 41.2, 9); g.stroke();
  if (skin.gem) { g.fillStyle = skin.gem; g.beginPath(); g.arc(29.5, 6.3, 1.2, 0, Math.PI * 2); g.fill(); }

  // Effects that drift off the cutting edge (sparkles, embers, wisps...)
  if (skin.fx) {
    const point = (t) => ({ x: (1 - t) * (1 - t) * 30 + 2 * (1 - t) * t * 38 + t * t * 42.3,
                           y: (1 - t) * (1 - t) * 5.5 + 2 * (1 - t) * t * -1.5 + t * t * 10.5 });
    const seed = Math.floor(clock * 7);
    g.fillStyle = skin.fxColor || "#ffffff";
    for (let i = 0; i < 6; i++) {
      const t = 0.15 + 0.8 * rnd(i * 3.7 + seed), p = point(t), r = 0.4 + 0.7 * rnd(i * 1.3 + seed);
      const lift = skin.fx === "flame" || skin.fx === "wisps" ? -2.5 * rnd(i + seed * 0.5) : 0;
      g.globalAlpha = 0.5 + 0.5 * rnd(i * 9 + seed);
      g.beginPath(); g.arc(p.x + (rnd(i * 5 + seed) - 0.5) * 2, p.y - 1 + lift, r, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;
  }
}
// A swirling purple gate: opens, holds while the enemy steps out, then closes
function drawPortal(p) {
  const open = Math.min(1, p.t / 0.4), shut = p.t > 1.0 ? Math.max(0, 1 - (p.t - 1.0) / 0.4) : 1;
  const k = open * shut;
  if (k <= 0) return;
  const cx = p.x, cy = GROUND_Y - 44, rx = 22 * k, ry = 52 * k, spin = p.t * 5;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.fillStyle = "rgba(178, 123, 255, 0.3)";
  pixEllipse(cx, cy, rx + 9, ry + 9);
  ctx.fillStyle = "#b27bff";
  pixEllipse(cx, cy, rx, ry);
  ctx.fillStyle = "#1a0833";
  pixEllipse(cx, cy, Math.max(0, rx - PX), Math.max(0, ry - PX));
  ctx.fillStyle = "#e0c8ff";
  for (let i = 0; i < 3; i++) {   // the swirl inside, as a trail of pixels
    const f = 0.8 - i * 0.22;
    for (let j = 0; j < 7; j++) {
      const ang = spin + i * 2.1 + j * 0.3;
      ctx.fillRect(snap(cx + Math.cos(ang) * rx * f), snap(cy + Math.sin(ang) * ry * f), PX, PX);
    }
  }
  ctx.restore();
}

// Which sheet and frame the hero is showing right now
function heroSprite() {
  const now = performance.now() / 1000;
  const rate = (st) => now * (st.fps || 10);
  if (state === "dying") { const st = HS.dying; return stateFrame(st, dyingT * st.fps); }
  if (player.stun > 0) return stateFrame(HS.hurt, (0.3 - player.stun) / 0.3 * HS.hurt.frames.length);
  if (player.act) return actFrame(player.act, player.actT);
  if (player.dash > 0) return stateFrame(HS.dash, (1 - player.dash / DASH_TIME) * HS.dash.frames.length);
  if (!player.onGround) {
    if (player.vy < -200) return stateFrame(HS.jump, (player.vy + 780) / 580 * HS.jump.frames.length);   // rising: faster = earlier frames
    if (player.vy > 200) return stateFrame(HS.fall, rate(HS.fall) % HS.fall.frames.length);
    return stateFrame(HS.jump_peak, rate(HS.jump_peak) % HS.jump_peak.frames.length);
  }
  if (player.moving) return stateFrame(HS.run, player.runT * HS.run.fps % HS.run.frames.length);
  return stateFrame(HS.idle, rate(HS.idle) % HS.idle.frames.length);
}

// --- Holding a shop weapon (see tools/make_hold.py) ---
// With a shop weapon equipped he is drawn from copies of his sheets with the scythe taken out,
// his black slash trails are tinted in the weapon's colour, and the weapon is drawn in his hand.
const HOLD = window.STICKGO_HOLD;
const HOLD_SHEETS = {}, TRAIL_SHEETS = {}, HELD_IMGS = {};
const loadImg = (src) => { const img = new Image(); img.src = src; return img; };
for (const name of Object.keys(SHEET_FRAMES)) {
  HOLD_SHEETS[name] = loadImg(`pictures/hold/hero_${name}.png`);
  TRAIL_SHEETS[name] = loadImg(`pictures/hold/trail_${name}.png`);
}
for (const id of Object.keys(HOLD.weapons)) HELD_IMGS[id] = loadImg(`pictures/hold/w_${id}.png`);
const ready = (img) => img.complete && img.naturalWidth;

// The equipped shop weapon, or null for the starter scythe that is already in his sprites
function heldWeapon() {
  const skin = equippedSkin();
  return skin.img && HOLD.weapons[skin.img] && ready(HELD_IMGS[skin.img]) ? skin : null;
}
function trailColor(skin) { return skin.slash ? WEAPON_FX[skin.slash].glow : HOLD.weapons[skin.img].color; }

// A trail sheet in one colour, made once per sheet and colour
const trailCache = {};
function tintedTrail(sheet, color) {
  const key = sheet + color;
  if (trailCache[key]) return trailCache[key];
  const img = TRAIL_SHEETS[sheet];
  if (!ready(img)) return null;
  const c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = "source-in";
  g.fillStyle = color;
  g.fillRect(0, 0, c.width, c.height);
  return (trailCache[key] = c);
}

// The weapon in his hand, in sprite pixels: its grip on his grip, turned the way the scythe pointed.
// It is alive in his hand: it sways while he stands, runs or is in the air, a glint runs up the blade now
// and then, uncommon ones shimmer, and rare and legendary ones glow in the colour of their slash with
// particles in that slash's style coming off the blade (the same look as on their shop card).
const SWAY_SHEETS = { idle: 2.2, run: 9, jump: 4, jump_peak: 4, fall: 4 };   // sway speed per sheet
const HELD_BLADE = 32;   // sprite pixels from the grip to the tip (tools/make_hold.py: HELD_LEN, held 10% up)
function drawHeldWeapon(skin, sheet, frame) {
  const grip = (HOLD.hero[sheet] || [])[frame];
  if (!grip) return;
  const w = HOLD.weapons[skin.img], t = performance.now() / 1000;
  const fx = skin.slash ? WEAPON_FX[skin.slash] : null, legend = skin.rarity === "legendary";
  const speed = SWAY_SHEETS[sheet];
  const ang = grip[2] + (speed ? Math.sin(t * speed) * (sheet === "run" ? 0.09 : 0.07) : 0);
  // Like on their shop card, rare and legendary ones float: a slow bob while he isn't swinging
  const bob = fx && speed ? Math.round(Math.sin(t * 3)) : 0;
  const gx = grip[0], gy = grip[1] + bob;
  const img = HELD_IMGS[skin.img];
  ctx.save();
  ctx.translate(gx, gy);
  ctx.rotate(ang - w.ang);
  if (fx) {
    // The card's halo in the rarity colour, then a tighter glow in the colour of the slash on top
    ctx.shadowColor = RARITIES[skin.rarity].color;
    ctx.shadowBlur = (legend ? 16 : 12) + 6 * Math.sin(t * 4);
    ctx.drawImage(img, -w.gx, -w.gy);
    ctx.shadowColor = fx.glow;
    ctx.shadowBlur = (legend ? 8 : 6) + 3 * Math.sin(t * 5);
  } else if (skin.rarity === "uncommon") {
    ctx.shadowColor = w.color;
    ctx.shadowBlur = 5 + 3 * Math.sin(t * 3);
  }
  ctx.drawImage(img, -w.gx, -w.gy);
  ctx.restore();
  // A point d pixels up the blade and `side` pixels across it, in sprite pixels
  const c = Math.cos(ang), s = Math.sin(ang);
  const along = (d, side = 0) => [gx + c * d - s * side, gy + s * d + c * side];
  drawGlint(along, t, skin);
  if (fx) drawWeaponAura(skin.slash, fx, along, t, legend);
}

// A pixel-sized "dot" of colour; held-weapon effects are drawn with these so they stay pixel art
function dot(x, y, size, color, alpha = 1) {
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x - size / 2), Math.round(y - size / 2), size, size);
}

// A small four-point star of light that slides from the grip to the tip every couple of seconds
function drawGlint(along, t, skin) {
  const period = skin.rarity === "legendary" ? 1.6 : skin.slash ? 2 : 2.6;
  const p = (t % period) / 0.45;
  if (p >= 1) return;
  const [x, y] = along(4 + (HELD_BLADE - 6) * p);
  const a = Math.sin(p * Math.PI), r = Math.round(1 + 2 * a);
  ctx.save();
  dot(x, y, 2, "#ffffff", a);
  for (let i = 1; i <= r; i++) {
    const k = a * (1 - i / (r + 1));
    dot(x + i, y, 1, "#ffffff", k); dot(x - i, y, 1, "#ffffff", k);
    dot(x, y + i, 1, "#ffffff", k); dot(x, y - i, 1, "#ffffff", k);
  }
  ctx.restore();
}

// Particles in the style of the weapon's slash, coming off the blade it is held by
function drawWeaponAura(slash, fx, along, t, legend) {
  const n = legend ? 9 : 5, col = (i) => fx.sparks[i % fx.sparks.length];
  ctx.save();
  for (let i = 0; i < n; i++) {
    const cyc = t * (legend ? 0.9 : 0.7) + i / n;   // each particle loops on its own clock
    const f = cyc % 1, seed = Math.floor(cyc) * 13 + i * 7;
    const d = 5 + (HELD_BLADE - 6) * rnd(seed), side = (rnd(seed + 3) - 0.5) * 4;
    const [x, y] = along(d, side), fade = Math.sin(f * Math.PI);
    switch (slash) {
      case "crimson": case "dragon": case "feather":   // embers rising off the blade
        dot(x + Math.sin(f * 6 + i) * 1.5, y - f * 12, legend && i % 3 === 0 ? 2 : 1, col(i), 1 - f);
        break;
      case "plague":   // toxic bubbles that swell as they float up, then pop
        dot(x + Math.sin(f * 4 + i) * 1.2, y - f * 9, f < 0.8 ? 1 + Math.round(f * 2) : 1, col(i), 1 - f * f);
        break;
      case "frostbite":   // frost flakes drifting down
        dot(x + Math.sin(f * 5 + i) * 2, y + f * 8, 1, col(i), fade);
        break;
      case "aero": {   // wind streaks rushing toward the tip
        const [sx, sy] = along(d * 0.5 + f * 20, side * 1.5 + (i % 2 ? 3 : -3));
        for (let k = 0; k < 3; k++) { const [tx, ty] = along(d * 0.5 + f * 20 - k, side * 1.5 + (i % 2 ? 3 : -3)); dot(tx, ty, 1, col(i), fade * (1 - k / 3)); }
        dot(sx, sy, 1, "#ffffff", fade);
        break;
      }
      case "sun": {   // twinkling stars around the blade
        const [sx, sy] = along(d, (i % 2 ? 1 : -1) * (3 + 3 * rnd(seed + 5))), r = Math.round(fade * 2);
        dot(sx, sy, 1, col(i), fade);
        for (let k = 1; k <= r; k++) { dot(sx + k, sy, 1, col(i), fade * 0.6); dot(sx - k, sy, 1, col(i), fade * 0.6); dot(sx, sy + k, 1, col(i), fade * 0.6); dot(sx, sy - k, 1, col(i), fade * 0.6); }
        break;
      }
      case "laser": {   // energy racing up both edges of the blade
        const [lx, ly] = along(f * HELD_BLADE, i % 2 ? 2 : -2);
        dot(lx, ly, 1, col(i), 1 - f * 0.5);
        const [bx, by] = along(f * HELD_BLADE - 1.5, i % 2 ? 2 : -2);
        dot(bx, by, 1, col(i), 0.5 - f * 0.4);
        break;
      }
      case "shadow": case "voidbringer":   // dark wisps peeling off and drifting back
        dot(x - f * 9, y - f * 4 + Math.sin(f * 5 + i) * 1.2, f < 0.5 ? 2 : 1, col(i), (1 - f) * 0.9);
        if (slash === "voidbringer" && i % 3 === 0) dot(x + side, y - 2, 1, "#ffffff", Math.max(0, Math.sin(t * 7 + i)));
        break;
      case "clockwork": {   // sparks circling the blade like gear teeth
        const a = t * 4 + i * (Math.PI * 2 / n);
        const [gx, gy] = along(HELD_BLADE * 0.55 + Math.cos(a) * HELD_BLADE * 0.4, Math.sin(a) * 4);
        dot(gx, gy, i % 2 ? 2 : 1, col(i), 0.6 + 0.4 * Math.sin(a));
        break;
      }
      case "thunder":   // lightning crackling along the blade, flickering on and off
        if (i === 0 && rnd(Math.floor(t * 14)) > 0.35) {
          const k = Math.floor(t * 14);
          for (let p = 2; p < HELD_BLADE; p += 1) {
            const [ex, ey] = along(p, (rnd(k * 31 + Math.floor(p / 3)) - 0.5) * 6);
            dot(ex, ey, 1, p % 4 ? "#fff04d" : "#ffffff", 0.95);
          }
        }
        dot(x + (rnd(seed + Math.floor(t * 20)) - 0.5) * 4, y + (rnd(seed + 9 + Math.floor(t * 20)) - 0.5) * 4, 1, col(i), fade);
        break;
      default:
        dot(x, y - f * 8, 1, col(i), 1 - f);
    }
  }
  ctx.restore();
}

// One frame of a sheet, feet at (cx, feet); face = 1 (right) or -1 (left). lk = what he wears
// (look.equipped by default): the yellow body is recoloured, outlined with the glow, back items
// hang behind him, accessories and the hat go on his head and the shop weapon in his hand.
function drawSprite(sheet, frame, cx, feet, face, rot = 0, sc = SC, lk = look.equipped, weapon = heldWeapon()) {
  const held = weapon && ready(HOLD_SHEETS[sheet]) ? weapon : null;
  const img = held ? HOLD_SHEETS[sheet] : SHEETS[sheet];
  if (!ready(img)) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(Math.round(cx), Math.round(feet + 2 * sc));
  if (rot) ctx.rotate(rot * face);
  ctx.scale(face * sc, sc);
  ctx.translate(-FRAME_W / 2, -FRAME_H);   // from here on, units are sprite pixels
  const t = performance.now() / 1000, head = (HERO_HEADS[sheet] || [])[frame];
  if (head && lk.back && lk.back !== "none") drawBack(lk.back, head[0], head[1], sheet, t);
  const glow = GLOWS[lk.glow];
  if (glow && glow.color) drawGlow(img, (held ? "h" : "") + sheet, frame, glow, t);
  const f = colorFilter(lk.color);
  if (f) ctx.filter = f;
  ctx.drawImage(img, frame * FRAME_W, 0, FRAME_W, FRAME_H, 0, 0, FRAME_W, FRAME_H);
  ctx.filter = "none";
  if (held) {
    const trail = tintedTrail(sheet, trailColor(held));
    if (trail) ctx.drawImage(trail, frame * FRAME_W, 0, FRAME_W, FRAME_H, 0, 0, FRAME_W, FRAME_H);
  }
  if (head) {
    for (const id of lk.acc || []) drawAccessory(id, head[0], head[1]);
    if (lk.hat && lk.hat !== "none") drawHat(lk.hat, head[0], head[1], t);
  }
  if (held) drawHeldWeapon(held, sheet, frame);
  ctx.restore();
}

// The slash effect of an equipped rare or legendary sword, drawn around his basic attacks
function drawSkinSlash(cx, feet) {
  const p = slashProgress();
  if (p < 0) return;
  const fx = SLASH_FX[equippedSkin().slash], glow = weaponFx().glow, legend = weaponIsLegendary();
  const cy = feet - 36, clock = performance.now() / 1000, seed = Math.floor(performance.now() / 60);
  const slash = (now, r) => fx({ sh: { x: cx, y: cy }, r, from: -2.5, now, pts: { neck: { x: cx, y: cy - 14 } }, seed, clock });
  ctx.save();
  if (player.facing < 0) { ctx.translate(cx, 0); ctx.scale(-1, 1); ctx.translate(-cx, 0); }
  ctx.shadowColor = glow;
  ctx.shadowBlur = legend ? 18 : 11;
  if (legend) {   // a wider, fainter echo trailing behind the blade
    ctx.globalAlpha = 0.35 * (1 - p);
    slash(slashAngle(p) - 0.35, 74);
  }
  ctx.globalAlpha = 1 - 0.6 * p;
  slash(slashAngle(p), 62);
  ctx.restore();
}

function drawStickman() {
  // Dash afterimages
  for (const g of ghosts) {
    ctx.save();
    ctx.globalAlpha = 0.4 * (1 - g.t / 0.25);
    drawSprite(g.sheet, g.frame, g.cx, g.feet, g.facing);
    ctx.restore();
  }
  let fr = heroSprite();
  const cx = player.x + player.w / 2, feet = player.y + player.h;
  heroFlash = null;
  if (fr.flash) {
    // Flash frames (the ultimate's) fill the whole screen
    heroFlash = fr;
    return;
  }
  drawSkinSlash(cx, feet);
  const orbs = AURAS[look.equipped.aura].orbs, t = performance.now() / 1000;
  if (orbs) drawOrbs(cx, feet - 32, orbs, t, false);
  ctx.save();
  if (player.hurt > 0 && state === "running") ctx.globalAlpha = 0.65;
  drawSprite(fr.sheet, fr.frame, cx, feet, player.facing, fr.rot || 0);
  ctx.restore();
  if (orbs) drawOrbs(cx, feet - 32, orbs, t, true);
}

// Arrows, bombs, blasts and ground shockwaves
function drawProjectiles() {
  for (const a of arrows) {
    const sg = Math.sign(a.vx), y = snap(a.y);
    ctx.fillStyle = colors.ink;
    ctx.fillRect(snap(Math.min(a.x - sg * 14, a.x + sg * 10)), y, 24, PX);          // shaft
    ctx.fillRect(snap(a.x + sg * 10 - (sg < 0 ? PX : 0)), y - PX, PX, PX * 3);       // head
    ctx.fillRect(snap(a.x + sg * 13 - (sg < 0 ? PX : 0)), y, PX, PX);                // tip
    ctx.fillStyle = "#c9c9c9";
    ctx.fillRect(snap(a.x - sg * 14 - (sg > 0 ? PX : 0)), y - PX, PX, PX * 3);       // fletching
  }
  for (const b of bombs) {
    const landed = b.t > 0.9;
    ctx.fillStyle = landed && Math.floor(b.t * 12) % 2 ? "#e02020" : "#222";   // blinks red before it goes off
    pixEllipse(b.x, b.y, 6, 6);
    ctx.fillStyle = "#ffb02e";
    ctx.fillRect(snap(b.x + 3), snap(b.y - 9), PX, PX);
  }
  for (const s of shocks) {
    ctx.globalAlpha = Math.max(0.2, 1 - s.dist / 360);
    ctx.fillStyle = "#ff9a2a";
    const rows = Math.round((24 + Math.sin(s.dist * 0.25) * 4) / PX);
    for (let r = 0; r < rows; r++) {
      const half = 15 * (1 - r / rows);
      ctx.fillRect(snap(s.x - half), GROUND_Y - PX * (r + 1), Math.max(PX, snap(half * 2)), PX);
    }
    ctx.globalAlpha = 1;
  }
  for (const b of blasts) {
    const k = b.t / 0.35;
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = "#ff9a2a";
    pixEllipse(b.x, GROUND_Y - 8, b.r * (0.4 + 0.6 * k), b.r * (0.4 + 0.6 * k));
    ctx.fillStyle = "#fff0a0";
    pixEllipse(b.x, GROUND_Y - 8, b.r * 0.5 * (1 - k), b.r * 0.5 * (1 - k));
    ctx.globalAlpha = 1;
  }
}

// --- Enemy sprites: one sheet per kind (see tools/make_enemy_sprites.py) ---
// 8 frames wide, rows: idle 4, walk 8, attack 6 (0-2 wind-up, 3-5 strike), hit 2, death 6 (which frames play is in animations.js)
const FOE_SHEETS = {};
for (const kind of Object.keys(FOES)) {
  const img = new Image();
  img.src = `pictures/foe_${kind}.png`;
  FOE_SHEETS[kind] = img;
}
const FOE_SC = { brute: 2.0, boss: 2.8 };   // everyone else is drawn at the hero's size (SC)

function drawFoeFrame(kind, row, col, cx, feet, face) {
  const img = FOE_SHEETS[kind], sc = FOE_SC[kind] || SC;
  if (!img.complete || !img.naturalWidth) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(Math.round(cx), Math.round(feet + 2 * sc));
  ctx.scale(face * sc, sc);
  ctx.drawImage(img, col * FRAME_W, row * FRAME_H, FRAME_W, FRAME_H, -FRAME_W / 2, -FRAME_H, FRAME_W, FRAME_H);
  ctx.restore();
}

// Which animation frame an enemy is showing, from what it's doing: [row, column] in its sheet
function foeFrame(o) {
  const d = FOES[o.kind], A = ANIM.foes[o.kind].anims;
  const at = (a, i) => [a.row, a.frames[Math.max(0, Math.min(a.frames.length - 1, Math.floor(i)))]];
  const across = (a, t, total) => at(a, t / total * a.frames.length);   // spread a list over a duration
  if (o.stagger > 0) return at(A.hit, o.stagger > 0.2 ? 0 : 1);
  switch (o.ai) {
    case "windup": case "warn": case "throw": case "aim": return across(A.windup, o.timer, d.windup);
    case "strike": return across(A.strike, o.timer, ATTACK_DURATION);
    case "charge": return at(A.charge, 0);
    case "recover":   // archers and bombers show the release; the rest just breathe
      if (o.kind === "archer" || o.kind === "bomber") return at(A.release, o.timer * (A.release.fps || 8));
      return at(A.idle, o.age * (A.idle.fps || 6) % A.idle.frames.length);
  }
  return at(A.walk, o.runPhase / (Math.PI * 2) * A.walk.frames.length % A.walk.frames.length);
}

function drawFoe(o) {
  const cx = o.x + o.w / 2, feet = o.y + o.h;
  const [row, col] = foeFrame(o);
  ctx.save();
  ctx.globalAlpha = Math.min(1, o.age / 0.25) * (o.solid === false ? 0.3 : 1);   // fades in from the portal; ghosts flicker
  if (o.flash > 0.04) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 10; }       // a white glow when it's hit or about to charge
  drawFoeFrame(o.kind, row, col, cx, feet, o.dir);
  ctx.restore();
  if (o.hp < o.maxHp) {   // how much it has left
    const top = feet - 54 * (FOE_SC[o.kind] || SC) - 8;
    ctx.fillStyle = colors.inkBack;
    ctx.fillRect(cx - 18, top, 36, 4);
    ctx.fillStyle = EYE_RED;
    ctx.fillRect(cx - 18, top, 36 * o.hp / o.maxHp, 4);
  }
}

function drawCorpse(c) {
  const A = ANIM.foes[c.kind].anims.death;
  const [row, col] = [A.row, A.frames[Math.min(A.frames.length - 1, Math.floor(c.t * (A.fps || 10)))]];
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, (3.5 - c.t) / 1));   // fades out at the end
  drawFoeFrame(c.kind, row, col, c.cx, c.feet, c.dir);
  ctx.restore();
}

function drawCoin(c) {
  // Spinning: the coin's width follows the spin
  const w = Math.max(2, Math.round(Math.abs(Math.cos(c.spin)) * 16 / 2) * 2);
  ctx.drawImage(coinCv, Math.round(c.x - w / 2), Math.round(c.y - 8), w, 16);
}

// Distant skyline: two layers of building silhouettes scrolling slower than the ground.
// Each layer is a repeating strip of buildings; windows light up as night falls.
const CITY_TILE = 1100;
function makeCityLayer(minW, maxW, minH, maxH) {
  const buildings = [];
  for (let x = 0; x < CITY_TILE;) {
    const w = Math.min(minW + Math.random() * (maxW - minW), CITY_TILE - x);
    buildings.push({ x, w, h: minH + Math.random() * (maxH - minH), seed: Math.random() });
    x += w + 2;
  }
  return buildings;
}
const CITY_FAR = { speed: 0.04, items: makeCityLayer(30, 60, 50, 110), fill: "cityFar", windows: false };
const CITY_NEAR = { speed: 0.1, items: makeCityLayer(40, 80, 40, 95), fill: "cityNear", windows: true };

// Everything in the world is drawn on a chunky PX-sized grid so it reads as pixel art
const PX = 3;
const snap = (v) => Math.round(v / PX) * PX;
// A filled ellipse built from PX-tall rows (never narrower than one pixel)
function pixEllipse(cx, cy, rx, ry) {
  if (ry < PX) { ctx.fillRect(snap(cx - rx), snap(cy), Math.max(PX, snap(rx * 2)), PX); return; }
  for (let y = -ry; y <= ry; y += PX) {
    const half = Math.max(PX / 2, Math.sqrt(Math.max(0, 1 - (y / ry) ** 2)) * rx);
    ctx.fillRect(snap(cx - half), snap(cy + y), Math.max(PX, snap(half * 2)), PX);
  }
}

function drawCityLayer(layer) {
  const shift = ((distance || 0) * layer.speed) % CITY_TILE;
  ctx.fillStyle = colors[layer.fill];
  for (let tile = -1; tile <= Math.ceil(W / CITY_TILE); tile++) {
    const ox = tile * CITY_TILE - shift;
    for (const b of layer.items) {
      const x = ox + b.x;
      if (x > W || x + b.w < 0) continue;
      const sx = snap(x), top = snap(GROUND_Y - b.h), sw = Math.max(PX * 4, snap(b.w));
      ctx.fillRect(sx, top, sw, GROUND_Y - top);
      ctx.fillRect(sx + PX * 2, top - PX, sw - PX * 4, PX);                       // stepped roof
      if (b.seed > 0.7) ctx.fillRect(sx + snap(sw / 2), top - PX * 4, PX, PX * 3);   // antenna
    }
  }
  if (!layer.windows || night <= 0) return;
  ctx.globalAlpha = night;
  ctx.fillStyle = colors.windowLit;
  for (let tile = -1; tile <= Math.ceil(W / CITY_TILE); tile++) {
    const ox = tile * CITY_TILE - shift;
    for (const b of layer.items) {
      const x = ox + b.x;
      if (x > W || x + b.w < 0) continue;
      let n = 0;
      for (let wy = GROUND_Y - b.h + 9; wy < GROUND_Y - 10; wy += 15) {
        for (let wx = snap(x) + 6; wx < x + b.w - 8; wx += 12, n++) {
          if (((b.seed * 997 + n * 7919) % 5) < 2) ctx.fillRect(wx, snap(wy), PX, PX * 2);
        }
      }
    }
  }
  ctx.globalAlpha = 1;
}

function drawCloud(c) {
  ctx.fillStyle = colors.cloud;
  const x = snap(c.x), y = snap(c.y);
  ctx.fillRect(x + 12, y - 18, 15, PX * 2);
  ctx.fillRect(x + 6, y - 12, 30, PX * 2);
  ctx.fillRect(x, y - 6, 48, PX * 2);
  ctx.fillRect(x + 3, y, 42, PX);
}

// Pixel backdrops, each a 3:1 slice of its picture scrolling slowly behind the action.
// Every other copy is mirrored so the strip repeats without a seam.
// The map changes every 3 waves (forest, city, forest...) with a short crossfade.
const MAPS = ["pictures/gameplay_bg.jpg", "pictures/gameplay_bg_city.png"].map((src) => { const i = new Image(); i.src = src; return i; });
const MAP_WAVES = 3, MAP_FADE = 1.5;
let bgFrom = 0, bgTo = 0, bgFade = 1;
function setMapForWave(n) {
  const idx = Math.floor((n - 1) / MAP_WAVES) % MAPS.length;
  if (idx === bgTo) return;
  bgFrom = bgTo; bgTo = idx; bgFade = 0;
}
function drawMap(img) {
  if (!img.complete || !img.naturalWidth) return;
  const sh = img.naturalWidth / 3, sy = Math.round(img.naturalHeight * 0.17);   // keep the sunset band and the skyline / tree line
  const shift = Math.round(((distance || 0) * 0.06) % (W * 2));
  for (let tile = 0; tile < 3; tile++) {
    const x = tile * W - shift;
    if (x > W || x + W < 0) continue;
    if (tile % 2) { ctx.save(); ctx.translate(x + W, 0); ctx.scale(-1, 1); ctx.drawImage(img, 0, sy, img.naturalWidth, sh, 0, 0, W, H); ctx.restore(); }
    else ctx.drawImage(img, 0, sy, img.naturalWidth, sh, x, 0, W, H);
  }
}
function drawBackdrop() {
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (bgFade < 1) drawMap(MAPS[bgFrom]);
  ctx.globalAlpha = Math.min(1, bgFade);
  drawMap(MAPS[bgTo]);
  ctx.restore();
}

function pad5(n) { return String(n).padStart(5, "0"); }

function draw() {
  updateColors();
  ctx.fillStyle = colors.sky;
  ctx.fillRect(0, 0, W, H);

  drawBackdrop();

  ctx.save();
  if (shakeTime > 0) {
    const m = shakeTime * 16 * 0.6;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }


  // Ground
  ctx.fillStyle = "rgba(10, 8, 18, 0.78)";
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = colors.inkBack;
  ctx.fillRect(0, GROUND_Y, W, PX);
  ctx.fillStyle = colors.ink;
  for (let i = 0; i < groundBits.length; i++) ctx.fillRect(snap(groundBits[i].x), snap(groundBits[i].y), Math.max(PX, snap(groundBits[i].w)), PX);

  for (const c of corpses) drawCorpse(c);
  portals.forEach(drawPortal);
  for (const o of foes) drawFoe(o);
  drawPerks();
  drawProjectiles();
  coins.forEach(drawCoin);
  potions.forEach(drawPotion);
  for (const p of sparks) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.color;
    const sz = Math.max(PX, snap(p.r));
    ctx.fillRect(snap(p.x - sz / 2), snap(p.y - sz / 2), sz, sz);
  }
  for (const p of fxParts) drawFxPart(p, p.t);
  ctx.globalAlpha = 1;
  drawStickman();
  drawImpacts();
  ctx.fillStyle = colors.ink;
  ctx.font = "bold 16px 'Courier New', monospace";
  ctx.textAlign = "center";
  for (const p of popups) {
    const life = p.life || 0.8;
    ctx.globalAlpha = Math.min(1, (life - p.t) / 0.3);
    if (p.gold) drawGoldPopup(p);
    else if (p.dmg) drawDmgText(look.equipped.dmg, p.text, p.x, p.y, p.t, p.hue);
    else if (p.unlock) drawDmgText("gold", p.text, p.x, p.y + p.t * 40, 1, 0);
    else if (p.perk) drawDmgText("fire", p.text, p.x, p.y, p.t, 0);
    else {
      ctx.fillStyle = colors.ink;
      ctx.font = "bold 16px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText(p.text, p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Gold collected this run, under the score
  drawCoin({ x: W - 100, y: 56, spin: 0 });
  ctx.fillStyle = colors.ink;
  ctx.font = "bold 18px 'Courier New', monospace";
  ctx.textAlign = "right";
  ctx.fillText(`x ${String(runGold).padStart(3, "0")}`, W - 20, 62);

  // Current wave, plus a big banner for a moment when a new one starts
  ctx.textAlign = "center";
  ctx.font = "bold 18px 'Courier New', monospace";
  ctx.fillText(`WAVE ${wave}`, W / 2, 36);
  if (waveBanner > 0) {
    ctx.globalAlpha = Math.min(1, waveBanner / 0.5);
    ctx.font = "bold 40px 'Courier New', monospace";
    ctx.fillText(`WAVE ${wave}`, W / 2, 115);
    ctx.font = "bold 16px 'Courier New', monospace";
    ctx.fillText(`${waveTotal} ENEMIES`, W / 2, 140);
    ctx.globalAlpha = 1;
  }

  // Top left, next to the pause button: HEALTH, then MANA, then KILLS
  const bar = (y, frac, color, label) => {
    ctx.fillStyle = colors.inkBack;
    ctx.fillRect(84, y, 190, 14);
    ctx.fillStyle = color;
    ctx.fillRect(84, y, 190 * Math.max(0, Math.min(1, frac)), 14);
    ctx.strokeStyle = colors.ink;
    ctx.lineWidth = 2;
    ctx.strokeRect(84, y, 190, 14);
    // The percentage, in white with a dark edge so it reads on any bar colour
    ctx.font = "bold 11px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#14161c";
    ctx.strokeText(label, 84 + 95, y + 11);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(label, 84 + 95, y + 11);
  };
  bar(22, player.hp / PLAYER_MAX_HP, player.hp > 30 ? "#3fbf5a" : "#e02020", `HEALTH ${Math.round(100 * player.hp / PLAYER_MAX_HP)}%`);
  bar(42, player.mana / MANA_MAX, "#3d8bff", `MANA ${Math.round(100 * player.mana / MANA_MAX)}%`);
  // Ticks show what each skill costs, so he can see how much he can spend
  ctx.fillStyle = colors.ink;
  for (const c of SKILL_MANA) if (c < MANA_MAX) ctx.fillRect(84 + 190 * c / MANA_MAX - 1, 42, 2, 14);
  ctx.font = "bold 12px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillText(`KILLS ${kills}`, 84, 72);
  const boss = foes.find((o) => o.kind === "boss");
  if (boss) {
    ctx.fillStyle = colors.inkBack;
    ctx.fillRect(W / 2 - 110, 44, 220, 9);
    ctx.fillStyle = EYE_RED;
    ctx.fillRect(W / 2 - 110, 44, 220 * Math.max(0, boss.hp) / boss.maxHp, 9);
    ctx.strokeStyle = colors.ink;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(W / 2 - 110, 44, 220, 9);
    ctx.fillStyle = colors.ink;
    ctx.font = "bold 12px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText("THE WARLORD", W / 2, 68);
  }

  if (bossBanner) {
    ctx.globalAlpha = Math.min(1, bossBanner.t / 0.5);
    ctx.fillStyle = colors.ink;
    ctx.textAlign = "center";
    ctx.font = "bold 34px 'Courier New', monospace";
    ctx.fillText(bossBanner.title, W / 2, 175);
    ctx.font = "bold 16px 'Courier New', monospace";
    ctx.fillText(bossBanner.sub, W / 2, 198);
    ctx.globalAlpha = 1;
  }

  // READY - SET - FIGHT!: each word pops in big
  if (state === "countdown") {
    const stage = countdownStage;
    const age = countdown % COUNTDOWN_STEP;
    const pop = 1 + 0.5 * Math.max(0, 1 - age / 0.15);
    ctx.save();
    ctx.translate(W / 2, 135);
    ctx.scale(pop, pop);
    ctx.textAlign = "center";
    ctx.font = "bold 64px 'Courier New', monospace";
    ctx.lineWidth = 6;
    ctx.strokeStyle = colors.sky;
    ctx.strokeText(COUNTDOWN_WORDS[stage], 0, 0);
    ctx.fillStyle = stage === COUNTDOWN_WORDS.length - 1 ? "#ff8a1f" : colors.ink;
    ctx.fillText(COUNTDOWN_WORDS[stage], 0, 0);
    ctx.restore();
  }

  // Score (it turns gold for a moment every 100 points; it never blinks)
  ctx.fillStyle = flashTime > 0 ? GOLD_EDGE : colors.ink;
  ctx.font = "bold 20px 'Courier New', monospace";
  ctx.textAlign = "right";
  ctx.fillText(`HI ${pad5(high(runDiff))}  ${pad5(score)}`, W - 20, 36);

  // The ultimate's flash frames cover the whole screen for a moment
  if (heroFlash && SHEETS[heroFlash.sheet].complete) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(SHEETS[heroFlash.sheet], heroFlash.frame * FRAME_W, 0, FRAME_W, FRAME_H, 0, 0, W, H);
    ctx.restore();
  }
}

// --- Main loop ---
function loop(time) {
  const dt = Math.min(0.033, (time - (lastTime ?? time)) / 1000);
  lastTime = time;
  if (state === "countdown") updateCountdown(dt);
  if (state === "running") {
    update(dt);
  }
  if (state === "dying") {
    dyingT += dt;
    if (dyingT >= DYING_TIME) gameOver();
  }
  for (const c of corpses) {
    c.t += dt;
    c.cx += c.fling * Math.max(0, 150 * (1 - c.t * 3)) * dt;   // slides a little from the blow
  }
  if (bgFade < 1) bgFade = Math.min(1, bgFade + dt / MAP_FADE);
  if (shakeTime > 0) shakeTime -= dt;
  if (flashTime > 0) flashTime -= dt;
  if (waveBanner > 0 && state === "running") waveBanner -= dt;
  if (bossBanner && state === "running") { bossBanner.t -= dt; if (bossBanner.t <= 0) bossBanner = null; }
  musicTick();
  draw();
  requestAnimationFrame(loop);
}

reset();
refreshSettingsLabels();
showMenu("main");
requestAnimationFrame(loop);
</script>
