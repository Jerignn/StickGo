<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StickGo</title>
<style>
  :root { --btn-size: 17vh; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0e0c1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overflow: hidden;
  }
  #game {
    /* Keep the 16:9 shape and fill as much of the screen as possible */
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    background: #1c1a33;
  }

  /* On-screen controls (touch). Hidden on computers with a mouse; the keyboard is used there. */
  .btn {
    position: fixed;
    width: var(--btn-size);
    height: var(--btn-size);
    min-width: 54px;
    min-height: 54px;
    border-radius: 50%;
    border: 3px solid #ff8a1f;
    background: rgba(20, 12, 30, 0.55);
    color: #fff;
    font: bold 13px "Courier New", monospace;
    text-shadow: 0 1px 2px #000;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 0 10px rgba(255, 110, 20, 0.4);
  }
  .btn.pressed { background: rgba(255, 120, 30, 0.5); }
  .btn.cooling { opacity: 0.45; }
  #leftBtn  { left: 3vw; bottom: 6vh; font-size: 22px; }
  #rightBtn { left: calc(5vw + max(var(--btn-size), 54px)); bottom: 6vh; font-size: 22px; }
  #atkBtn   { right: 3vw; bottom: 6vh; width: calc(var(--btn-size) * 1.3); height: calc(var(--btn-size) * 1.3); min-width: 70px; min-height: 70px; font-size: 15px; border-color: #ffd34d; }
  #jumpBtn  { right: calc(5vw + max(var(--btn-size) * 1.3, 70px)); bottom: 6vh; }
  #dashBtn  { right: calc(5vw + max(var(--btn-size) * 1.3, 70px)); bottom: calc(8vh + max(var(--btn-size), 54px)); width: calc(var(--btn-size) * .85); height: calc(var(--btn-size) * .85); min-width: 48px; min-height: 48px; }
  #sk1Btn   { right: 3vw; bottom: calc(8vh + max(var(--btn-size) * 1.3, 70px)); width: calc(var(--btn-size) * .85); height: calc(var(--btn-size) * .85); min-width: 48px; min-height: 48px; border-color: #6ea8ff; }
  #sk2Btn   { right: calc(5vw + max(var(--btn-size) * .85, 48px)); bottom: calc(8vh + max(var(--btn-size) * 1.3, 70px)); width: calc(var(--btn-size) * .85); height: calc(var(--btn-size) * .85); min-width: 48px; min-height: 48px; border-color: #c23bd6; }
  @media (hover: hover) and (pointer: fine) { .btn { display: none; } }
  body:not(.playing) .btn, body:not(.playing) #pauseBtn { display: none; }

  #pauseBtn {
    position: fixed;
    top: 3vh;
    right: 2vw;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: 3px solid #ff8a1f;
    background: rgba(20, 12, 30, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  #pauseBtn span { width: 6px; height: 18px; background: #fff; border-radius: 2px; }

  .menu {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #14161c;
    color: #d6d6d6;
  }
  .menu.open { display: flex; }
  .menu h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: 4px; color: #fff; text-shadow: 0 2px 4px #000; }
  .menu p { margin: 0; font-size: 14px; color: #fff; text-shadow: 0 1px 3px #000; }
  .menu button {
    min-width: 240px;
    padding: 10px 20px;
    font: bold 18px "Courier New", monospace;
    color: #fff;
    background: rgba(20, 12, 30, 0.6);
    border: 3px solid #ff8a1f;
    border-radius: 10px;
    box-shadow: 0 0 12px rgba(255, 110, 20, 0.45);
    text-shadow: 0 1px 2px #000;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .menu button:active { background: rgba(255, 120, 30, 0.55); }
  .menu.art {
    background: linear-gradient(rgba(12, 8, 24, 0.62), rgba(12, 8, 24, 0.62)),
                #1a1430 url("pictures/mainmenu.jpg") center 25% / cover no-repeat;
  }

  /* Main menu: full-screen artwork (it already has the logo) with buttons on the left */
  #mainMenu {
    background: #1a1430 url("pictures/mainmenu.jpg") center 25% / cover no-repeat;
    align-items: flex-start;
    justify-content: flex-end;
    padding: 0 0 9vh 6vw;
    box-sizing: border-box;
  }
  /* Gold and progress sit in the top-right corner of the main menu */
  .menu-stats {
    position: absolute;
    top: 2.5vh;
    right: 2vw;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 96px;
    box-sizing: border-box;
    padding: 4px 12px;
    border: 2px solid #ff8a1f;
    border-radius: 999px;
    background: rgba(20, 12, 30, 0.7);
    box-shadow: 0 0 12px rgba(255, 110, 20, 0.45);
    font: bold 16px "Courier New", monospace;
    color: #fff;
    text-shadow: 0 1px 2px #000;
  }
  .coin {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #f5b921;
    border: 2px solid #a8740a;
    box-shadow: 0 0 8px rgba(255, 211, 77, 0.8);
  }
  .stat-value { margin-left: auto; letter-spacing: 1px; }
  .stat-gold .stat-value { color: #ffd34d; }
  .stat-high { flex-direction: column; align-items: flex-end; gap: 0; border-radius: 16px; padding: 3px 12px 4px; }
  .stat-high .stat-value { margin-left: 0; line-height: 1.1; }
  .stat-label { color: #ff8a1f; font-size: 10px; letter-spacing: 2px; }

  #settingsMenu { gap: 12px; }
  #resultMenu h1.win { color: #ffd34d; }
  #resultMenu h1.lose { color: #ff6a5a; }
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>
<div class="btn" id="leftBtn" data-key="left">&#9664;</div>
<div class="btn" id="rightBtn" data-key="right">&#9654;</div>
<div class="btn" id="jumpBtn" data-key="jump">JUMP</div>
<div class="btn" id="atkBtn" data-key="attack">ATTACK</div>
<div class="btn" id="dashBtn" data-key="dash">DASH</div>
<div class="btn" id="sk1Btn" data-key="skill1">SLAM</div>
<div class="btn" id="sk2Btn" data-key="skill2">SPIN</div>
<div id="pauseBtn" aria-label="Pause"><span></span><span></span></div>

<div class="menu" id="mainMenu">
  <button data-action="play">PLAY</button>
  <button data-action="settings">SETTINGS</button>
  <div class="menu-stats">
    <div class="stat stat-gold"><span class="coin"></span><span class="stat-value" id="goldText"></span></div>
    <div class="stat stat-high">
      <span class="stat-label">STAGE 1</span>
      <span class="stat-value" id="clearText"></span>
    </div>
  </div>
</div>

<div class="menu" id="pauseMenu">
  <h1>PAUSED</h1>
  <button data-action="resume">RESUME</button>
  <button data-action="settings">SETTINGS</button>
  <button data-action="main">MAIN MENU</button>
</div>

<div class="menu" id="settingsMenu">
  <h1>SETTINGS</h1>
  <button data-action="btnSize" id="btnSizeBtn"></button>
  <button data-action="sound" id="soundBtn"></button>
  <button data-action="music" id="musicBtn"></button>
  <button data-action="back">BACK</button>
</div>

<div class="menu art" id="resultMenu">
  <h1 id="resultTitle"></h1>
  <p id="resultText"></p>
  <p id="resultGold"></p>
  <button data-action="play">PLAY AGAIN</button>
  <button data-action="main">MAIN MENU</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// The world is always 800x450 units; the canvas is scaled to the screen's real
// pixel density so lines stay crisp.
const W = 800, H = 450;
const GROUND = 380;       // y of the floor
const STAGE_W = 2000;     // the arena is wider than the screen; the camera follows the hero

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// --- Settings and saved progress ---
const BUTTON_SIZES = { small: { label: "SMALL", size: "13vh" }, medium: { label: "MEDIUM", size: "17vh" }, large: { label: "LARGE", size: "21vh" } };
const settings = Object.assign(
  { btnSize: "medium", sound: true, music: true },
  JSON.parse(localStorage.getItem("stickgo-settings") || "{}")
);
if (!BUTTON_SIZES[settings.btnSize]) settings.btnSize = "medium";
const saveSettings = () => localStorage.setItem("stickgo-settings", JSON.stringify(settings));

let totalGold = Number(localStorage.getItem("stickgo-gold") || 0);
let stageClears = Number(localStorage.getItem("stickgo-stage1-clears") || 0);
const fmt = (n) => Number(n).toLocaleString("en-US");
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
function addGold(n) {
  totalGold += n;
  localStorage.setItem("stickgo-gold", totalGold);
}

// --- The hero: sprite sheets of 128x64 frames, facing right ---
const SHEET_FRAMES = { idle: 4, run: 10, jump: 3, jump_peak: 3, fall: 4, dash: 11,
  attack1: 10, attack3: 10, attack4: 16, skill1: 9, skill2: 19, hit1: 3, hit3: 3 };
const SHEETS = {};
for (const name of Object.keys(SHEET_FRAMES)) {
  const img = new Image();
  img.src = `pictures/hero_${name}.png`;
  SHEETS[name] = img;
}
const FRAME_W = 128, FRAME_H = 64, SC = 1.7;   // drawn 1.7x so he is about 85 units tall

// Attacks. fps sets the speed; each hit fires once when the animation reaches its frame.
// front/back are how far the hit reaches in front of and behind him.
const COMBO = [
  { sheet: "attack1", fps: 26, hits: [{ frame: 3, dmg: 10, front: 85, back: 10, kb: 120 }], lunge: 90 },
  { sheet: "attack3", fps: 26, hits: [{ frame: 3, dmg: 13, front: 90, back: 10, kb: 150 }], lunge: 90 },
  { sheet: "attack4", fps: 30, hits: [{ frame: 8, dmg: 22, front: 100, back: 70, kb: 300 }], lunge: 60 }
];
const SKILLS = {
  skill1: { sheet: "skill1", fps: 13, cd: 4,
    hits: [{ frame: 4, dmg: 38, front: 150, back: 0, kb: 340 }], lunge: 0, label: "SLAM" },
  skill2: { sheet: "skill2", fps: 22, cd: 8, invuln: true,
    hits: [2, 4, 6, 8].map((frame) => ({ frame, dmg: 15, front: 120, back: 120, kb: 160 })), lunge: 0, label: "SPIN" }
};
const HERO_SPEED = 210, JUMP_V = 620, GRAVITY = 1700;
const DASH_TIME = 0.28, DASH_SPEED = 560, DASH_CD = 0.9;

const hero = {};
function resetHero() {
  Object.assign(hero, {
    x: 200, y: GROUND, vx: 0, vy: 0, face: 1, hp: 120, maxhp: 120,
    mode: "free",         // free | attack | skill | dash | hurt | dead
    t: 0, combo: 0, comboTimer: 0, atk: null, fired: [], buffered: 0,
    invuln: 0, dashCd: 0, cd1: 0, cd2: 0, runT: 0
  });
}

// --- Enemies ---
const ENEMY = {
  grunt: { hp: 38, speed: 78, dmg: 8, range: 50, wu: 0.55, rec: 0.7, scale: 1.0, color: "#e8564e", gold: [2, 4], kbRes: 1 },
  ninja: { hp: 26, speed: 160, dmg: 7, range: 46, wu: 0.28, rec: 0.55, scale: 0.95, color: "#9a7bff", gold: [3, 5], kbRes: 1 },
  brute: { hp: 130, speed: 50, dmg: 17, range: 66, wu: 0.8, rec: 1.0, scale: 1.3, color: "#ff8a3d", gold: [9, 13], kbRes: 0.4 },
  boss:  { hp: 560, speed: 62, dmg: 26, range: 120, wu: 0.95, rec: 1.0, scale: 1.9, color: "#c23bd6", gold: [60, 60], kbRes: 0.1 }
};
const WAVES = [
  [["grunt", 3]],
  [["grunt", 3], ["ninja", 2]],
  [["brute", 1], ["ninja", 3], ["grunt", 2]],
  [["boss", 1]]
];

let state = "menu";            // menu | fight | paused | result
let enemies = [], sparks = [], popups = [];
let wave = 0, spawnQueue = [], spawnTimer = 0, bannerT = 0, bannerText = "", waveDone = false;
let runGold = 0, kills = 0, camX = 0, bossSplit = false, endT = 0;

function startFight() {
  resetHero();
  enemies = []; sparks = []; popups = [];
  wave = 0; runGold = 0; kills = 0; bossSplit = false; endT = 0;
  beginWave();
  state = "fight";
  showMenu(null);
}

function beginWave() {
  const list = [];
  for (const [type, n] of WAVES[wave]) for (let i = 0; i < n; i++) list.push(type);
  list.sort(() => Math.random() - 0.5);
  spawnQueue = list;
  spawnTimer = 1.6;
  waveDone = false;
  bannerT = 2.2;
  bannerText = wave === WAVES.length - 1 ? "BOSS" : `WAVE ${wave + 1}`;
}

function spawnEnemy(type, fromX) {
  const d = ENEMY[type];
  const side = fromX !== undefined ? 0 : (Math.random() < 0.5 ? -1 : 1);
  const x = fromX !== undefined ? fromX
    : Math.max(40, Math.min(STAGE_W - 40, side < 0 ? camX - 50 : camX + W + 50));
  enemies.push({ type, x, y: GROUND, hp: d.hp, maxhp: d.hp, face: -1, state: "walk", t: 0,
    phase: Math.random() * 6, kb: 0, stun: 0, hitId: -1, struck: false, ...d, d });
}

// --- Input ---
const held = { left: false, right: false };
let queued = { attack: 0, jump: 0, dash: 0, skill1: 0, skill2: 0 };   // press buffers, in seconds

function press(key) {
  if (key === "left" || key === "right") { held[key] = true; return; }
  queued[key] = 0.18;
}
function release(key) { if (key in held) held[key] = false; }

const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "jump", KeyW: "jump", Space: "jump",
  KeyJ: "attack", KeyX: "attack", KeyK: "dash", ShiftLeft: "dash", KeyZ: "dash",
  KeyU: "skill1", KeyI: "skill2", KeyC: "skill1", KeyV: "skill2"
};
document.addEventListener("keydown", (e) => {
  if (e.code === "Escape" || e.code === "KeyP") { if (state === "fight") pauseGame(); else if (state === "paused") resumeGame(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  if (!e.repeat) press(k);
});
document.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) release(k); });

// Touch buttons: each button tracks its own finger, so several can be held at once
for (const el of document.querySelectorAll(".btn")) {
  const key = el.dataset.key;
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add("pressed"); press(key); });
  const up = () => { el.classList.remove("pressed"); release(key); };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("lostpointercapture", up);
}
document.getElementById("pauseBtn").addEventListener("pointerdown", (e) => { e.preventDefault(); if (state === "fight") pauseGame(); });

// --- Menus ---
const menus = {
  main: document.getElementById("mainMenu"),
  pause: document.getElementById("pauseMenu"),
  settings: document.getElementById("settingsMenu"),
  result: document.getElementById("resultMenu")
};
let settingsReturnTo = "main";

function showMenu(name) {
  for (const [key, el] of Object.entries(menus)) el.classList.toggle("open", key === name);
  document.body.classList.toggle("playing", name === null);
  if (name === "main") {
    document.getElementById("goldText").textContent = fmt(totalGold);
    document.getElementById("clearText").textContent = stageClears ? `CLEARED x${stageClears}` : "NOT CLEARED";
  }
  if (name === "settings") refreshSettingsLabels();
}
function refreshSettingsLabels() {
  document.getElementById("btnSizeBtn").textContent = `BUTTON SIZE: ${BUTTON_SIZES[settings.btnSize].label}`;
  document.getElementById("soundBtn").textContent = `SOUND: ${settings.sound ? "ON" : "OFF"}`;
  document.getElementById("musicBtn").textContent = `MUSIC: ${settings.music ? "ON" : "OFF"}`;
  document.documentElement.style.setProperty("--btn-size", BUTTON_SIZES[settings.btnSize].size);
}
function pauseGame() {
  if (state !== "fight") return;
  state = "paused";
  held.left = held.right = false;
  showMenu("pause");
}
function resumeGame() { state = "fight"; showMenu(null); }
function goToMainMenu() { state = "menu"; showMenu("main"); }
function nextKey(table, key) { const k = Object.keys(table); return k[(k.indexOf(key) + 1) % k.length]; }

const ACTIONS = {
  play: () => startFight(),
  resume: resumeGame,
  main: goToMainMenu,
  settings: () => { settingsReturnTo = state === "paused" ? "pause" : "main"; showMenu("settings"); },
  back: () => showMenu(settingsReturnTo),
  btnSize: () => { settings.btnSize = nextKey(BUTTON_SIZES, settings.btnSize); saveSettings(); refreshSettingsLabels(); },
  sound: () => { settings.sound = !settings.sound; saveSettings(); refreshSettingsLabels(); },
  music: () => { settings.music = !settings.music; saveSettings(); refreshSettingsLabels(); }
};
document.querySelectorAll(".menu button").forEach((b) => {
  b.addEventListener("click", () => { sfx.click(); ACTIONS[b.dataset.action](); });
});

// Called by the Android app when the phone's back button is pressed.
// Returns true if the game handled it, false to let the app close.
window.stickgoBack = function () {
  if (state === "fight") { pauseGame(); return true; }
  if (state === "paused") { resumeGame(); return true; }
  if (menus.settings.classList.contains("open")) { showMenu(settingsReturnTo); return true; }
  if (state === "result") { goToMainMenu(); return true; }
  return false;
};
document.addEventListener("visibilitychange", () => { if (document.hidden) pauseGame(); });

// --- Sound ---
// Small synthesized beeps and a looping tune, so no audio files are needed.
let audio = null;
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!audio && AC) audio = new AC();
  if (audio && audio.state === "suspended") audio.resume();
}
for (const ev of ["pointerdown", "pointerup", "keydown", "click", "touchstart", "touchend"]) {
  document.addEventListener(ev, initAudio, true);
}
initAudio();

function beep(freq, dur, { type = "square", vol = 0.06, slideTo, delay = 0 } = {}) {
  if (!settings.sound || !audio || audio.state !== "running") return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur);
}
const sfx = {
  click: () => beep(660, 0.05, { vol: 0.04 }),
  swing: () => beep(1100, 0.09, { type: "triangle", vol: 0.05, slideTo: 280 }),
  hit: () => beep(220, 0.12, { type: "sawtooth", vol: 0.07, slideTo: 90 }),
  kill: () => beep(180, 0.2, { vol: 0.07, slideTo: 60 }),
  hurt: () => beep(240, 0.3, { type: "sawtooth", vol: 0.08, slideTo: 50 }),
  dash: () => beep(300, 0.16, { type: "sawtooth", vol: 0.05, slideTo: 900 }),
  jump: () => beep(500, 0.12, { slideTo: 900 }),
  skill: () => { beep(160, 0.3, { type: "sawtooth", vol: 0.08, slideTo: 420 }); },
  coin: () => { beep(990, 0.05, { vol: 0.04 }); beep(1480, 0.1, { vol: 0.04, delay: 0.05 }); },
  wave: () => { beep(440, 0.12); beep(554, 0.12, { delay: 0.13 }); beep(659, 0.22, { delay: 0.26 }); },
  slam: () => beep(90, 0.35, { vol: 0.1, slideTo: 40 }),
  win: () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.18, { vol: 0.06, delay: i * 0.12 })); },
  lose: () => { [392, 330, 262, 196].forEach((f, i) => beep(f, 0.25, { type: "triangle", vol: 0.07, delay: i * 0.18 })); }
};

// Music: Am - F - C - G at 150 bpm: bass, arpeggio and drums, scheduled a little ahead of time.
const MUSIC_STEP = 60 / 150 / 2;
const MUSIC_CHORDS = [
  { bass: 45, notes: [69, 72, 76] }, { bass: 41, notes: [65, 69, 72] },
  { bass: 48, notes: [72, 76, 79] }, { bass: 43, notes: [71, 74, 79] }
];
const ARP_ORDER = [0, 1, 2, 1, 0, 1, 2, 1];
let musicNext = 0, musicStep = 0, noiseBuf = null;
const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
function musicTone(freq, t, dur, type, vol, slideTo) {
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur);
}
function musicNoise(t, dur, vol) {
  if (!noiseBuf) {
    noiseBuf = audio.createBuffer(1, Math.floor(audio.sampleRate * 0.1), audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = audio.createBufferSource();
  const gain = audio.createGain();
  src.buffer = noiseBuf;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(gain).connect(audio.destination);
  src.start(t);
}
function scheduleMusicStep(step, t) {
  const chord = MUSIC_CHORDS[Math.floor(step / 8) % MUSIC_CHORDS.length];
  const s = step % 8;
  musicTone(midiHz(chord.notes[ARP_ORDER[s]]), t, MUSIC_STEP * 0.9, "square", 0.05);
  if (s === 0 || s === 3 || s === 4 || s === 6) {
    musicTone(midiHz(chord.bass + 12), t, MUSIC_STEP * 1.6, "triangle", 0.2);
    musicTone(midiHz(chord.bass + 12), t, MUSIC_STEP * 1.2, "square", 0.03);
  }
  if (s === 0 || s === 4) musicTone(180, t, 0.12, "sine", 0.25, 60);
  if (s === 2 || s === 6) musicNoise(t, 0.09, 0.08);
  if (s % 2 === 1) musicNoise(t, 0.03, 0.03);
}
function musicTick() {
  if (!audio || audio.state !== "running" || !settings.sound || !settings.music || (state !== "fight" && state !== "menu")) {
    musicNext = 0;
    return;
  }
  const now = audio.currentTime;
  if (musicNext < now) musicNext = now + 0.05;
  while (musicNext < now + 0.25) {
    scheduleMusicStep(musicStep++, musicNext);
    musicNext += MUSIC_STEP;
  }
}

// --- Effects ---
function burst(x, y, n, color, speed = 200) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(0.3, 1) * speed;
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, t: 0, life: rand(0.25, 0.5), color });
  }
}
function popup(x, y, text, color = "#fff") { popups.push({ x, y, text, color, t: 0 }); }

// --- Hero logic ---
function startAttack(spec) {
  hero.mode = spec.invuln !== undefined || spec.cd !== undefined ? "skill" : "attack";
  hero.atk = spec;
  hero.t = 0;
  hero.fired = spec.hits.map(() => false);
  hero.buffered = 0;
  if (spec.lunge) hero.vx = hero.face * spec.lunge;
  sfx.swing();
}

function heroFrameOf(spec) { return Math.floor(hero.t * spec.fps); }

function dealHit(hit) {
  let landed = 0;
  for (const e of enemies) {
    if (e.hp <= 0) continue;
    const dist = (e.x - hero.x) * hero.face;
    const halfW = 14 * e.scale;
    if (dist < -hit.back - halfW || dist > hit.front + halfW) continue;
    damageEnemy(e, hit.dmg, hit.kb);
    landed++;
  }
  return landed;
}

function damageEnemy(e, dmg, kb) {
  e.hp -= dmg;
  e.kb = hero.face * kb * e.kbRes;
  if (e.type !== "boss" && e.state !== "strike") { e.state = "stun"; e.t = 0; e.stun = 0.28 * (e.type === "brute" ? 0.6 : 1); }
  burst(e.x, e.y - 50 * e.scale, 6, "#ffd34d", 220);
  popup(e.x, e.y - 90 * e.scale, String(dmg), "#fff");
  sfx.hit();
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  e.hp = 0;
  e.dead = true;
  e.deadT = 0;
  kills++;
  const g = randInt(e.gold[0], e.gold[1]);
  runGold += g;
  addGold(g);
  popup(e.x, e.y - 110 * e.scale, `+${g}`, "#ffd34d");
  burst(e.x, e.y - 40 * e.scale, 10, e.color, 260);
  sfx.kill();
  sfx.coin();
}

function hurtHero(dmg, fromX) {
  if (hero.invuln > 0 || hero.mode === "dead" || hero.mode === "dash" || (hero.mode === "skill" && hero.atk.invuln)) return;
  hero.hp -= dmg;
  hero.invuln = 0.8;
  popup(hero.x, hero.y - 100, `-${dmg}`, "#ff6a5a");
  burst(hero.x, hero.y - 45, 8, "#ffe14d", 200);
  sfx.hurt();
  if (hero.hp <= 0) {
    hero.hp = 0;
    hero.mode = "dead";
    hero.t = 0;
    hero.vx = (hero.x < fromX ? -1 : 1) * 160;
    hero.vy = -260;
    endT = 0;
    return;
  }
  hero.mode = "hurt";
  hero.t = 0;
  hero.atk = null;
  hero.vx = (hero.x < fromX ? -1 : 1) * 170;
}

function updateHero(dt) {
  const onGround = hero.y >= GROUND;
  for (const k in queued) queued[k] = Math.max(0, queued[k] - dt);
  hero.invuln = Math.max(0, hero.invuln - dt);
  hero.dashCd = Math.max(0, hero.dashCd - dt);
  hero.cd1 = Math.max(0, hero.cd1 - dt);
  hero.cd2 = Math.max(0, hero.cd2 - dt);
  hero.comboTimer = Math.max(0, hero.comboTimer - dt);
  if (hero.comboTimer === 0 && hero.mode === "free") hero.combo = 0;
  hero.t += dt;

  const dir = (held.right ? 1 : 0) - (held.left ? 1 : 0);

  if (hero.mode === "free") {
    hero.vx = dir * HERO_SPEED;
    if (dir) hero.face = dir;
    if (queued.jump && onGround) { hero.vy = -JUMP_V; queued.jump = 0; sfx.jump(); }
    if (queued.dash && hero.dashCd === 0) {
      queued.dash = 0; hero.mode = "dash"; hero.t = 0; hero.dashCd = DASH_CD; hero.invuln = Math.max(hero.invuln, DASH_TIME); sfx.dash();
    } else if (queued.skill2 && hero.cd2 === 0) {
      queued.skill2 = 0; hero.cd2 = SKILLS.skill2.cd; startAttack(SKILLS.skill2); sfx.skill();
    } else if (queued.skill1 && hero.cd1 === 0) {
      queued.skill1 = 0; hero.cd1 = SKILLS.skill1.cd; startAttack(SKILLS.skill1); sfx.skill();
    } else if (queued.attack) {
      queued.attack = 0; startAttack(COMBO[hero.combo % COMBO.length]);
    }
    hero.runT += dt * Math.abs(hero.vx) / HERO_SPEED;
  } else if (hero.mode === "attack" || hero.mode === "skill") {
    const spec = hero.atk;
    hero.vx *= Math.pow(0.02, dt);        // the lunge fades out quickly
    const f = heroFrameOf(spec);
    spec.hits.forEach((hit, i) => {
      if (!hero.fired[i] && f >= hit.frame) { hero.fired[i] = true; dealHit(hit); }
    });
    if (hero.mode === "attack" && queued.attack) { hero.buffered = 1; queued.attack = 0; }
    if (hero.mode === "skill" && spec.invuln) hero.invuln = Math.max(hero.invuln, 0.1);
    if (f >= SHEET_FRAMES[spec.sheet]) {
      const chain = hero.mode === "attack" && hero.buffered;
      if (hero.mode === "attack") { hero.combo = (hero.combo + 1) % COMBO.length; hero.comboTimer = 0.5; }
      hero.mode = "free"; hero.atk = null; hero.t = 0;
      if (chain) { queued.attack = 0.18; }
    }
  } else if (hero.mode === "dash") {
    hero.vx = hero.face * DASH_SPEED;
    hero.vy = Math.min(hero.vy, 0);        // no falling during a dash
    if (hero.t >= DASH_TIME) { hero.mode = "free"; hero.t = 0; hero.vx = 0; }
  } else if (hero.mode === "hurt") {
    hero.vx *= Math.pow(0.05, dt);
    if (hero.t >= 0.35) { hero.mode = "free"; hero.t = 0; }
  } else if (hero.mode === "dead") {
    hero.vx *= Math.pow(0.1, dt);
    endT += dt;
  }

  hero.x = Math.max(30, Math.min(STAGE_W - 30, hero.x + hero.vx * dt));
  if (hero.mode !== "dash") hero.vy += GRAVITY * dt;
  hero.y += hero.vy * dt;
  if (hero.y >= GROUND) { hero.y = GROUND; hero.vy = 0; }
}

// --- Enemy logic ---
function updateEnemies(dt) {
  let alive = 0;
  for (const e of enemies) {
    if (e.dead) { e.deadT += dt; continue; }
    alive++;
    e.t += dt;
    e.x += e.kb * dt;
    e.kb *= Math.pow(0.004, dt);
    e.x = Math.max(10, Math.min(STAGE_W - 10, e.x));
    const dx = hero.x - e.x;
    const dist = Math.abs(dx);

    if (e.state === "stun") {
      if (e.t >= e.stun) { e.state = "walk"; e.t = 0; }
    } else if (e.state === "walk") {
      if (hero.mode !== "dead") e.face = dx >= 0 ? 1 : -1;
      if (dist > e.range * 0.8) {
        e.x += e.face * e.speed * dt;
        e.phase += dt * e.speed / 14;
      } else if (hero.mode !== "dead") {
        e.state = "wind"; e.t = 0; e.struck = false;
      }
    } else if (e.state === "wind") {
      if (e.t >= e.wu) {
        e.state = "strike"; e.t = 0;
        const reach = e.range + 14 * e.scale;
        const hit = Math.abs(hero.x - e.x) <= reach && hero.y > GROUND - 45;   // jump over it to dodge
        if (e.type === "boss") { sfx.slam(); burst(e.x + e.face * 60, GROUND, 14, "#c23bd6", 300); }
        if (hit) hurtHero(e.dmg, e.x);
      }
    } else if (e.state === "strike") {
      if (e.t >= 0.18) { e.state = "recover"; e.t = 0; }
    } else if (e.state === "recover") {
      if (e.t >= e.rec) { e.state = "walk"; e.t = 0; }
    }

    // At half health the boss calls two grunts
    if (e.type === "boss" && !bossSplit && e.hp < e.maxhp / 2) {
      bossSplit = true;
      spawnEnemy("grunt", Math.max(40, e.x - 300));
      spawnEnemy("grunt", Math.min(STAGE_W - 40, e.x + 300));
      bannerText = "HE CALLS HELP"; bannerT = 1.8;
    }
  }
  // Keep enemies from standing on top of each other
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j];
    if (a.dead || b.dead) continue;
    const min = 20 * (a.scale + b.scale) * 0.7;
    const d = b.x - a.x;
    if (Math.abs(d) < min) {
      const push = (min - Math.abs(d)) / 2 * (d >= 0 ? 1 : -1);
      a.x -= push; b.x += push;
    }
  }
  enemies = enemies.filter((e) => !(e.dead && e.deadT > 0.6));
  return alive;
}

function updateFight(dt) {
  updateHero(dt);
  const alive = updateEnemies(dt);

  if (bannerT > 0) bannerT -= dt;
  if (spawnQueue.length) {
    spawnTimer -= dt;
    const live = enemies.filter((e) => !e.dead).length;
    if (spawnTimer <= 0 && live < 5) {
      spawnEnemy(spawnQueue.pop());
      spawnTimer = 1.0;
    }
  } else if (alive === 0 && !waveDone && hero.mode !== "dead") {
    waveDone = true;
    if (wave < WAVES.length - 1) {
      wave++;
      setTimeout(() => { if (state === "fight") { beginWave(); sfx.wave(); } }, 900);
    } else {
      finishFight(true);
    }
  }
  if (hero.mode === "dead" && endT > 1.4 && state === "fight") finishFight(false);

  for (const p of sparks) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; }
  sparks = sparks.filter((p) => p.t < p.life);
  for (const p of popups) { p.t += dt; p.y -= 30 * dt; }
  popups = popups.filter((p) => p.t < 0.9);

  camX += (Math.max(0, Math.min(STAGE_W - W, hero.x - W / 2)) - camX) * Math.min(1, dt * 6);
}

function finishFight(won) {
  let bonus = 0;
  if (won) {
    bonus = 100;
    addGold(bonus);
    stageClears++;
    localStorage.setItem("stickgo-stage1-clears", stageClears);
    sfx.win();
  } else {
    sfx.lose();
  }
  state = "result";
  held.left = held.right = false;
  const title = document.getElementById("resultTitle");
  title.textContent = won ? "STAGE CLEAR!" : "DEFEATED";
  title.className = won ? "win" : "lose";
  document.getElementById("resultText").textContent = `ENEMIES DEFEATED ${kills}`;
  document.getElementById("resultGold").textContent = won
    ? `GOLD +${runGold} (+${bonus} CLEAR BONUS)   TOTAL ${fmt(totalGold)}`
    : `GOLD +${runGold}   TOTAL ${fmt(totalGold)}`;
  showMenu("result");
  document.body.classList.remove("playing");
}

// --- Drawing ---
// A calm night scene: dark sky, moon, and two layers of city silhouettes that scroll
// slower than the ground.
const CITY_TILE = 1400;
function makeCityLayer(minW, maxW, minH, maxH) {
  const items = [];
  for (let x = 0; x < CITY_TILE;) {
    const w = Math.min(minW + Math.random() * (maxW - minW), CITY_TILE - x);
    const h = minH + Math.random() * (maxH - minH);
    const windows = [];
    for (let wy = 14; wy < h - 10; wy += 18) for (let wx = 8; wx < w - 10; wx += 14) {
      if (Math.random() < 0.22) windows.push([wx, wy]);
    }
    items.push({ x, w, h, windows });
    x += w + 3;
  }
  return items;
}
const CITY = [
  { f: 0.15, fill: "#272344", win: false, items: makeCityLayer(50, 90, 120, 230) },
  { f: 0.35, fill: "#2f2a52", win: true, items: makeCityLayer(60, 110, 70, 170) }
];
const STARS = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: Math.random() * 170, r: Math.random() < 0.2 ? 2 : 1 }));
const SPECKS = Array.from({ length: 70 }, () => ({ x: Math.random() * STAGE_W, y: GROUND + 6 + Math.random() * 60, w: 2 + Math.random() * 7 }));

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, "#161330");
  g.addColorStop(1, "#3a2a55");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#cfd6ef";
  for (const s of STARS) ctx.fillRect(s.x, s.y, s.r, s.r);
  ctx.beginPath(); ctx.arc(640, 70, 26, 0, Math.PI * 2); ctx.fillStyle = "#e6e9f7"; ctx.fill();
  ctx.beginPath(); ctx.arc(650, 62, 22, 0, Math.PI * 2); ctx.fillStyle = "#1d1a3a"; ctx.fill();

  for (const layer of CITY) {
    const shift = (camX * layer.f) % CITY_TILE;
    for (let tile = -1; tile <= 1; tile++) {
      const ox = tile * CITY_TILE - shift;
      for (const b of layer.items) {
        const x = ox + b.x;
        if (x > W || x + b.w < 0) continue;
        ctx.fillStyle = layer.fill;
        ctx.fillRect(x, GROUND - b.h, b.w, b.h);
        if (layer.win) {
          ctx.fillStyle = "rgba(255, 214, 120, 0.55)";
          for (const [wx, wy] of b.windows) ctx.fillRect(x + wx, GROUND - b.h + wy, 5, 8);
        }
      }
    }
  }
  ctx.fillStyle = "#211c38";
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = "#4a3f6b";
  ctx.fillRect(0, GROUND, W, 3);
  ctx.fillStyle = "#3a3158";
  for (const s of SPECKS) {
    const x = s.x - camX;
    if (x > -10 && x < W + 10) ctx.fillRect(x, s.y, s.w, 2);
  }
}

function shadow(x, y, r) {
  ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
  ctx.beginPath(); ctx.ellipse(x, GROUND + 4, r, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();
}

function drawSprite(sheet, frame, x, feetY, face, rotate = 0) {
  const img = SHEETS[sheet];
  if (!img.complete || !img.naturalWidth) return;
  ctx.save();
  ctx.translate(x, feetY + 2 * SC);
  if (rotate) ctx.rotate(rotate * face);
  ctx.scale(face * SC, SC);
  const fr = Math.max(0, Math.min(SHEET_FRAMES[sheet] - 1, frame));
  ctx.drawImage(img, fr * FRAME_W, 0, FRAME_W, FRAME_H, -FRAME_W / 2, -FRAME_H, FRAME_W, FRAME_H);
  ctx.restore();
}

function drawHero() {
  const x = hero.x - camX, y = hero.y;
  shadow(x, y, 26 - Math.min(10, (GROUND - y) / 8));
  let sheet = "idle", frame = Math.floor(performance.now() / 170) % 4, rot = 0;
  if (hero.mode === "attack" || hero.mode === "skill") {
    sheet = hero.atk.sheet; frame = heroFrameOf(hero.atk);
  } else if (hero.mode === "dash") {
    sheet = "dash"; frame = [4, 5, 6, 7, 8][Math.min(4, Math.floor(hero.t / DASH_TIME * 5))];
  } else if (hero.mode === "hurt") {
    sheet = "hit1"; frame = 0;
  } else if (hero.mode === "dead") {
    sheet = "hit3"; frame = 0; rot = Math.min(1.5, hero.t * 3.2);
  } else if (hero.y < GROUND) {
    if (hero.vy < -200) { sheet = "jump"; frame = Math.min(2, Math.floor((hero.vy + 640) / 150)); }
    else if (hero.vy > 200) { sheet = "fall"; frame = Math.floor(performance.now() / 90) % 4; }
    else { sheet = "jump_peak"; frame = Math.floor(performance.now() / 120) % 3; }
  } else if (Math.abs(hero.vx) > 20) {
    sheet = "run"; frame = Math.floor(hero.runT * 2.2) % 10;
  }
  if (hero.invuln > 0 && hero.mode === "hurt") ctx.globalAlpha = 0.85;   // a steady tint, not a blink
  drawSprite(sheet, frame, x, y, hero.face, rot);
  ctx.globalAlpha = 1;
}

function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

function drawEnemy(e) {
  const s = e.scale;
  const x = e.x - camX;
  shadow(x, e.y, 22 * s);
  ctx.save();
  ctx.translate(x, e.y);
  if (e.dead) { ctx.globalAlpha = Math.max(0, 1 - e.deadT / 0.6); ctx.rotate(Math.min(1.4, e.deadT * 4) * -e.face); }
  ctx.scale(e.face, 1);
  ctx.lineCap = "round";
  ctx.strokeStyle = e.color;
  ctx.fillStyle = e.color;
  ctx.lineWidth = 4.5 * s;
  const hip = -36 * s, neck = -64 * s;
  const sw = e.state === "walk" ? Math.sin(e.phase) * 13 * s : 0;
  line(0, hip, sw, 0);
  line(0, hip, -sw, 0);
  line(0, hip, 0, neck);
  ctx.beginPath(); ctx.arc(2 * s, neck - 9 * s, 9 * s, 0, Math.PI * 2); ctx.fill();
  // The weapon arm: held low while walking, raised during the wind-up, swung down on the strike
  let ang = 0.5;
  if (e.state === "wind") ang = -2.5 + 0.4 * Math.sin(e.t * 20) * 0;
  else if (e.state === "strike") ang = 1.1;
  else if (e.state === "recover") ang = 0.9;
  const sx = 0, sy = neck + 6 * s;
  const hx = sx + Math.cos(ang) * 22 * s, hy = sy + Math.sin(ang) * 22 * s;
  line(sx, sy, hx, hy);
  ctx.strokeStyle = e.type === "ninja" ? "#e6e9f7" : "#c9c2d8";
  ctx.lineWidth = 3.5 * s;
  line(hx, hy, hx + Math.cos(ang) * 26 * s, hy + Math.sin(ang) * 26 * s);
  if (e.type === "boss") {   // a crown
    ctx.fillStyle = "#ffd34d";
    const cx = 2 * s, cy = neck - 18 * s;
    ctx.beginPath();
    ctx.moveTo(cx - 8 * s, cy); ctx.lineTo(cx - 8 * s, cy - 10 * s); ctx.lineTo(cx - 3 * s, cy - 4 * s);
    ctx.lineTo(cx, cy - 12 * s); ctx.lineTo(cx + 3 * s, cy - 4 * s); ctx.lineTo(cx + 8 * s, cy - 10 * s);
    ctx.lineTo(cx + 8 * s, cy); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(6 * s, neck - 10 * s, 1.8 * s, 0, Math.PI * 2); ctx.fill();   // eye
  ctx.restore();

  if (!e.dead && e.type !== "boss") {   // a small health bar above his head
    const bw = 38 * s, by = e.y - 100 * s;
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)"; ctx.fillRect(x - bw / 2, by, bw, 5);
    ctx.fillStyle = "#6be06b"; ctx.fillRect(x - bw / 2, by, bw * e.hp / e.maxhp, 5);
  }
}

function drawHud() {
  // Hero health
  ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; ctx.fillRect(14, 14, 204, 20);
  ctx.fillStyle = "#e8564e"; ctx.fillRect(16, 16, 200 * hero.hp / hero.maxhp, 16);
  ctx.fillStyle = "#fff"; ctx.font = "bold 12px 'Courier New', monospace"; ctx.textAlign = "left";
  ctx.fillText(`HP ${Math.ceil(hero.hp)}/${hero.maxhp}`, 20, 28);
  // Gold this fight
  ctx.fillStyle = "#f5b921"; ctx.beginPath(); ctx.arc(24, 52, 6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#a8740a"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#ffd34d"; ctx.font = "bold 15px 'Courier New', monospace";
  ctx.fillText(String(runGold), 36, 57);
  // Boss health
  const boss = enemies.find((e) => e.type === "boss" && !e.dead);
  if (boss) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)"; ctx.fillRect(W / 2 - 150, 16, 300, 16);
    ctx.fillStyle = "#c23bd6"; ctx.fillRect(W / 2 - 148, 18, 296 * boss.hp / boss.maxhp, 12);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold 11px 'Courier New', monospace";
    ctx.fillText("SHADOW KING", W / 2, 46);
  }
  // Wave banner
  if (bannerT > 0) {
    ctx.globalAlpha = Math.min(1, bannerT * 2);
    ctx.fillStyle = "#ffd34d"; ctx.font = "bold 44px 'Courier New', monospace"; ctx.textAlign = "center";
    ctx.fillText(bannerText, W / 2, 130);
    ctx.globalAlpha = 1;
  }
  // Button cooldown labels
  const setBtn = (id, cd, label) => {
    const el = document.getElementById(id);
    el.textContent = cd > 0 ? cd.toFixed(1) : label;
    el.classList.toggle("cooling", cd > 0);
  };
  setBtn("sk1Btn", hero.cd1, SKILLS.skill1.label);
  setBtn("sk2Btn", hero.cd2, SKILLS.skill2.label);
  setBtn("dashBtn", hero.dashCd, "DASH");
}

function draw() {
  drawBackground();
  if (state === "menu") return;
  const live = enemies.filter((e) => !e.dead), dead = enemies.filter((e) => e.dead);
  for (const e of dead) drawEnemy(e);
  for (const e of live) drawEnemy(e);
  drawHero();
  for (const p of sparks) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - camX - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "center";
  ctx.font = "bold 18px 'Courier New', monospace";
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / 0.9);
    ctx.fillStyle = "#000"; ctx.fillText(p.text, p.x - camX + 1, p.y + 1);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x - camX, p.y);
  }
  ctx.globalAlpha = 1;
  drawHud();
}

// --- Main loop ---
let lastTime;
function loop(time) {
  const dt = Math.min(0.033, (time - (lastTime ?? time)) / 1000);
  lastTime = time;
  if (state === "fight") updateFight(dt);
  musicTick();
  draw();
  requestAnimationFrame(loop);
}

resetHero();
refreshSettingsLabels();
showMenu("main");
requestAnimationFrame(loop);
</script>
