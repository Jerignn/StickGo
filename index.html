<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StickGo</title>
<style>
  /* --sky and --ink are updated by the game for the day/night cycle */
  :root { --btn-size: 18vh; --sky: #f7f7f7; --ink: #535353; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--sky);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #game {
    /* Keep the 3:1 shape and fill as much of the screen as possible */
    width: min(100vw, 300vh);
    height: min(100vh, 33.333vw);
    background: var(--sky);
  }
  .btn {
    position: fixed;
    bottom: 5vh;
    width: var(--btn-size);
    height: var(--btn-size);
    min-width: 64px;
    min-height: 64px;
    border-radius: 50%;
    border: 3px solid var(--ink);
    background: rgba(128, 128, 128, 0.15);
    color: var(--ink);
    font: bold 16px "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn.pressed { background: rgba(128, 128, 128, 0.4); }
  /* Left thumb walks, right thumb attacks */
  #leftBtn { left: 4vw; font-size: 28px; }
  #rightBtn { left: calc(7vw + max(var(--btn-size), 64px)); font-size: 28px; }
  /* Right thumb: jump and attack side by side, dash above them */
  #jumpBtn { right: 4vw; font-size: 22px; }
  #attackBtn { right: calc(7vw + max(var(--btn-size), 64px)); font-size: 14px; }
  /* Dash and skills 1-3: a row of smaller buttons above attack and jump */
  #skillRow {
    position: fixed;
    right: 4vw;
    bottom: calc(10vh + max(var(--btn-size), 64px));
    display: flex;
    gap: 1.6vw;
  }
  .btn.small {
    position: relative;
    bottom: auto;
    width: calc(var(--btn-size) * 0.72);
    height: calc(var(--btn-size) * 0.72);
    min-width: 50px;
    min-height: 50px;
    font-size: 24px;
  }
  .btn.cooling { opacity: 0.35; }
  /* A small caption under a button says what it does; it fades out a few seconds into the run */
  .btn[data-cap]::after {
    content: attr(data-cap);
    position: absolute;
    top: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    font: bold 11px "Courier New", monospace;
    letter-spacing: 1px;
    white-space: nowrap;
    color: var(--ink);
    opacity: 0;
    transition: opacity 2s;
    pointer-events: none;
  }
  body.show-hint .btn[data-cap]::after { opacity: 1; transition: opacity 0.2s; }
  /* Computers get the same hint as one line of keys along the bottom */
  #keyHint {
    position: fixed;
    bottom: 1.5vh;
    left: 50%;
    transform: translateX(-50%);
    font: bold 14px "Courier New", monospace;
    letter-spacing: 1px;
    white-space: nowrap;
    color: var(--ink);
    opacity: 0;
    transition: opacity 2s;
    pointer-events: none;
  }
  body.show-hint #keyHint { opacity: 0.9; transition: opacity 0.2s; }
  @media (hover: none), (pointer: coarse) { #keyHint { display: none; } }
  body:not(.playing) #skillRow { display: none; }
  /* Hide the buttons on computers with a mouse; keyboard is used there */
  @media (hover: hover) and (pointer: fine) {
    .btn { display: none; }
  }
  /* Walk / attack / pause only show while playing */
  body:not(.playing) .btn,
  body:not(.playing) #pauseBtn { display: none; }

  #pauseBtn {
    position: fixed;
    top: 4vh;
    left: 3vw;
    width: 52px;
    height: 52px;
    border-radius: 12px;
    border: 3px solid var(--ink);
    background: rgba(128, 128, 128, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  #pauseBtn span { width: 7px; height: 22px; background: var(--ink); border-radius: 2px; }

  .menu {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #14161c;
    color: #d6d6d6;
  }
  .menu.open { display: flex; }
  .menu h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: 4px; }
  .menu p { margin: 0; font-size: 14px; }
  .menu button {
    min-width: 240px;
    padding: 10px 20px;
    font: bold 18px "Courier New", monospace;
    color: #d6d6d6;
    background: #2a2d36;
    border: 3px solid #d6d6d6;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .menu button:active { background: #444855; }
  #settingsMenu {
    flex-direction: row;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    gap: 12px 14px;
    padding: 0 5vw;
    box-sizing: border-box;
  }
  #settingsMenu h1, #settingsMenu p { flex-basis: 100%; text-align: center; margin: 0; }

  /* Main menu: full-screen artwork (it already has the logo) with buttons on the left */
  #mainMenu {
    background: #1a1430 url("pictures/mainmenu.jpg") center 25% / cover no-repeat;
    align-items: flex-start;
    justify-content: flex-end;
    padding: 0 0 9vh 6vw;
    box-sizing: border-box;
  }
  #mainMenu button, .store-menu button {
    color: #fff;
    background: rgba(20, 12, 30, 0.6);
    border-color: #ff8a1f;
    box-shadow: 0 0 12px rgba(255, 110, 20, 0.45);
    text-shadow: 0 1px 2px #000;
  }
  #mainMenu button:active, .store-menu button:active { background: rgba(255, 120, 30, 0.55); }
  #mainMenu p, .store-menu p {
    color: #fff;
    text-shadow: 0 1px 3px #000, 0 0 6px #000;
  }

  /* Gold and high score sit in the top-right corner of the main menu */
  .menu-stats {
    position: absolute;
    top: 2.5vh;
    right: 2vw;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 96px;
    box-sizing: border-box;
    padding: 4px 12px;
    border: 2px solid #ff8a1f;
    border-radius: 999px;
    background: rgba(20, 12, 30, 0.7);
    box-shadow: 0 0 12px rgba(255, 110, 20, 0.45);
    font: bold 16px "Courier New", monospace;
    text-shadow: 0 1px 2px #000;
  }
  .stat .coin { width: 14px; height: 14px; margin: 0; box-shadow: 0 0 8px rgba(255, 211, 77, 0.8); }
  .stat-value { margin-left: auto; letter-spacing: 1px; }
  .stat-gold .stat-value { color: #ffd34d; }
  .stat-high {
    flex-direction: column;
    align-items: flex-end;
    gap: 0;
    border-radius: 16px;
    padding: 3px 12px 4px;
  }
  .stat-high .stat-value { margin-left: 0; color: #fff; line-height: 1.1; }
  .stat-label { color: #ff8a1f; font-size: 10px; letter-spacing: 2px; }
  .stat-label small { color: #cbb7e0; font-size: 10px; letter-spacing: 1px; }

  /* Shop + inventory: same artwork as the main menu, dimmed so the cards stand out */
  .store-menu {
    background: linear-gradient(rgba(12, 8, 24, 0.62), rgba(12, 8, 24, 0.62)),
                #1a1430 url("pictures/mainmenu.jpg") center 25% / cover no-repeat;
    gap: 8px;
  }
  .store-menu h1 { color: #fff; font-size: 28px; margin: 0; text-shadow: 0 2px 4px #000; }
  .shop-head { display: flex; align-items: baseline; gap: 28px; }
  #shopGold { color: #ffd34d; font: bold 20px "Courier New", monospace; text-shadow: 0 1px 3px #000; }
  .coin {
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-right: 6px;
    border-radius: 50%;
    background: #f5b921;
    border: 2px solid #a8740a;
    vertical-align: -1px;
  }
  .rarity-head {
    font: bold 13px "Courier New", monospace;
    letter-spacing: 4px;
    text-shadow: 0 1px 3px #000;
  }
  .shop-row { display: flex; gap: 14px; }
  /* Customize: a live preview of the hero next to the hats / scarves / auras */
  .look-wrap { display: flex; align-items: center; gap: 22px; max-width: 96vw; }
  #lookPreview {
    height: min(62vh, 300px);
    width: auto;
    border: 3px solid #ff8a1f;
    border-radius: 14px;
    background: radial-gradient(circle at 50% 40%, #e9ebf5, #9da2bd);
    box-shadow: 0 0 14px rgba(255, 110, 20, 0.5);
  }
  .look-side { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  #lookItems {
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    width: min(560px, 62vw);
    max-height: calc(100vh - 160px);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 4px;
  }
  .look-side .shop-head h1 { font-size: 22px; }
  #lookItems .card { width: 108px; padding: 5px; gap: 2px; }
  #lookItems .card .name { min-height: 2.3em; font-size: 10px; }
  #lookItems .card canvas { width: 96px; height: 60px; }
  #lookItems .card button { min-width: 0; width: 100%; padding: 5px 4px; font-size: 13px; }
  #lookItems .card button.cant { opacity: 0.55; }
  #lookMsg { min-height: 1.2em; color: #ffd34d; font-size: 13px; }
  #shopSections { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tabs { display: flex; gap: 8px; }
  .store-menu .tab {
    min-width: 0;
    padding: 6px 12px;
    font-size: 12px;
    letter-spacing: 1px;
    border-color: var(--rar);
    box-shadow: none;
  }
  .store-menu .tab.active { background: var(--rar); color: #111; text-shadow: none; }
  /* Inventory: wraps into rows and scrolls when there are more swords than fit */
  #invItems {
    flex-wrap: wrap;
    justify-content: center;
    max-width: 800px;
    max-height: calc(100vh - 150px);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 4px;
  }
  #invMsg { min-height: 1.2em; color: #ffd34d; font-size: 13px; }
  /* Shop and inventory share one row on the main menu */
  .menu-pair { display: flex; gap: 10px; width: 240px; }
  #mainMenu .menu-pair button { min-width: 0; flex: 1; padding: 10px 6px; font-size: 15px; }
  .card {
    box-sizing: border-box;
    width: 178px;
    padding: 10px;
    border: 3px solid var(--rar, #ff8a1f);
    border-radius: 12px;
    background: rgba(20, 12, 30, 0.7);
    box-shadow: 0 0 12px var(--rar-glow, rgba(255, 110, 20, 0.35));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .card.equipped { border-color: #ffd34d; box-shadow: 0 0 18px rgba(255, 211, 77, 0.7); }
  .card canvas { width: 100%; height: auto; }
  .card .name {
    color: #fff;
    font: bold 12px "Courier New", monospace;
    line-height: 1.15;
    min-height: 2.3em;               /* two lines, so every card is the same height */
    display: flex;
    align-items: center;
    text-align: center;
    text-shadow: 0 1px 2px #000;
  }
  .card .tag { font: bold 11px "Courier New", monospace; letter-spacing: 3px; }
  .store-menu .card button { min-width: 0; width: 100%; padding: 6px 8px; font-size: 15px; }
  .store-menu .card button.cant,
  .store-menu .card button.owned { opacity: 0.55; }
  #shopMsg { min-height: 1.2em; color: #ffd34d; font-size: 13px; }
  .shop-foot { display: flex; gap: 12px; }
  .store-menu .shop-foot button { min-width: 0; padding: 8px 18px; font-size: 15px; }
</style>
</head>
<body>
<canvas id="game" width="900" height="300"></canvas>
<div class="btn" id="leftBtn" data-cap="WALK">&#9664;</div>
<div class="btn" id="rightBtn" data-cap="WALK">&#9654;</div>
<div class="btn" id="jumpBtn" data-cap="JUMP">&#9650;</div>
<div class="btn" id="attackBtn" data-cap="COMBO">ATTACK</div>
<div id="skillRow">
  <div class="btn small" id="dashBtn" data-cap="DASH">&raquo;</div>
  <div class="btn small" id="sk1Btn" data-cap="SLAM">1</div>
  <div class="btn small" id="sk2Btn" data-cap="SPIN">2</div>
  <div class="btn small" id="sk3Btn" data-cap="ULTIMATE">3</div>
</div>
<div id="keyHint">A / D  WALK &nbsp;&middot;&nbsp; W  JUMP &nbsp;&middot;&nbsp; SPACE  ATTACK x3 &nbsp;&middot;&nbsp; SHIFT  DASH &nbsp;&middot;&nbsp; 1 2 3  SKILLS</div>
<div id="pauseBtn" aria-label="Pause"><span></span><span></span></div>

<div class="menu" id="mainMenu">
  <button data-action="play">PLAY</button>
  <div class="menu-pair">
    <button data-action="shop">SHOP</button>
    <button data-action="inventory">INVENTORY</button>
  </div>
  <button data-action="look">CUSTOMIZE</button>
  <button data-action="settings">SETTINGS</button>
  <div class="menu-stats">
    <div class="stat stat-gold"><span class="coin"></span><span class="stat-value" id="goldText"></span></div>
    <div class="stat stat-high">
      <span class="stat-label">BEST <small id="highDiff"></small></span>
      <span class="stat-value" id="highText"></span>
    </div>
  </div>
</div>

<div class="menu store-menu" id="shopMenu">
  <div class="shop-head"><h1>SHOP</h1><span id="shopGold"></span></div>
  <div id="shopSections"></div>
  <p id="shopMsg"></p>
  <div class="shop-foot">
    <button data-action="shopBack">BACK</button>
  </div>
</div>

<div class="menu store-menu" id="invMenu">
  <div class="shop-head"><h1>INVENTORY</h1></div>
  <div class="shop-row" id="invItems"></div>
  <p id="invMsg"></p>
  <div class="shop-foot">
    <button data-action="invBack">BACK</button>
  </div>
</div>

<div class="menu store-menu" id="lookMenu">
  <div class="look-wrap">
    <canvas id="lookPreview" width="240" height="300"></canvas>
    <div class="look-side">
      <div class="shop-head"><h1>CUSTOMIZE</h1><span id="lookGold"></span></div>
      <div class="tabs" id="lookTabs"></div>
      <div class="shop-row" id="lookItems"></div>
      <p id="lookMsg"></p>
    </div>
  </div>
  <div class="shop-foot">
    <button data-action="lookBack">BACK</button>
  </div>
</div>

<div class="menu" id="pauseMenu">
  <h1>PAUSED</h1>
  <button data-action="resume">RESUME</button>
  <button data-action="settings">SETTINGS</button>
  <button data-action="main">MAIN MENU</button>
</div>

<div class="menu" id="settingsMenu">
  <h1>SETTINGS</h1>
  <button data-action="difficulty" id="difficultyBtn"></button>
  <button data-action="btnSize" id="btnSizeBtn"></button>
  <button data-action="sound" id="soundBtn"></button>
  <button data-action="music" id="musicBtn"></button>
  <button data-action="comfort" id="comfortBtn"></button>
  <button data-action="resetHigh" id="resetHighBtn">RESET HIGH SCORES</button>
  <button data-action="back">BACK</button>
  <p id="comfortHint">COMFORT MODE: slower top speed, no screen shake, dark screen. Good if fast games make you dizzy.</p>
</div>

<div class="menu" id="overMenu">
  <h1>GAME OVER</h1>
  <p id="overText"></p>
  <p id="overGold"></p>
  <button data-action="play">PLAY AGAIN</button>
  <button data-action="main">MAIN MENU</button>
</div>

<script src="animations.js"></script>
<script>
const canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");   // swapped briefly to draw the hero into the customize preview

// Game world is always 900x300 units; the canvas is scaled to the screen's
// real pixel density so lines stay crisp instead of being stretched.
const W = 900;
const H = 300;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();
const GROUND_Y = 250;

// --- Tunable settings ---
// Comfort Mode: a lower top speed, no screen shake, a dark screen and a quieter ground
const GRAVITY = 2400;        // px/s^2
const JUMP_VELOCITY = -780;  // px/s
const JUMP_BUFFER = 0.1;     // s a jump press is remembered while still in the air
const DASH_DIST = 150;       // px a dash covers
const DASH_TIME = 0.16;      // s a dash lasts (he can't be hurt during it)
const DASH_COOLDOWN = 2;     // s before he can dash again
const HINT_TIME = 8;         // s the control labels stay on screen before they've faded
const ATTACK_DURATION = 0.25;  // s a sword swing lasts (and can hit for)
const ATTACK_COOLDOWN = 0.1;   // s after a swing before the next one

// Speeds in px/s; gain is px/s added per second
const DIFFICULTIES = {
  easy:   { label: "EASY",   start: 320, max: 800,  gain: 5 },
  normal: { label: "NORMAL", start: 380, max: 1000, gain: 8 },
  hard:   { label: "HARD",   start: 460, max: 1200, gain: 12 }
};
const BUTTON_SIZES = {
  small:  { label: "SMALL",  size: "14vh" },
  medium: { label: "MEDIUM", size: "18vh" },
  large:  { label: "LARGE",  size: "24vh" }
};

const settings = Object.assign(
  { difficulty: "normal", btnSize: "medium", sound: true, music: true, comfort: false },
  JSON.parse(localStorage.getItem("stickgo-settings") || "{}")
);

function saveSettings() {
  localStorage.setItem("stickgo-settings", JSON.stringify(settings));
}

// High scores are kept per difficulty, since harder modes score faster
const highScores = JSON.parse(localStorage.getItem("stickgo-highs") || "{}");
// Older versions kept a single high score; carry it over to the current difficulty
const oldHigh = Number(localStorage.getItem("stickgo-high") || 0);
if (oldHigh) {
  highScores[settings.difficulty] = Math.max(oldHigh, highScores[settings.difficulty] || 0);
  localStorage.setItem("stickgo-highs", JSON.stringify(highScores));
  localStorage.removeItem("stickgo-high");
}
function high(diff) { return highScores[diff] || 0; }

// Gold dropped by enemies; the total is kept across runs
let totalGold = Number(localStorage.getItem("stickgo-gold") || 0);
// Dev testing gold: the browser version (not the phone app) gets this once, so the shop can be
// tried out. Bump the number in DEV_GRANT_ID to grant it again. Also ?gold=N sets any amount.
const DEV_GOLD = 99999999, DEV_GRANT_ID = "1";
const onPhone = location.pathname.includes("android_asset");
const devGold = Number(new URLSearchParams(location.search).get("gold"));
if (devGold > 0) {
  totalGold = devGold;
  localStorage.setItem("stickgo-gold", totalGold);
} else if (!onPhone && localStorage.getItem("stickgo-dev-grant") !== DEV_GRANT_ID) {
  totalGold = DEV_GOLD;
  localStorage.setItem("stickgo-gold", totalGold);
  localStorage.setItem("stickgo-dev-grant", DEV_GRANT_ID);
}

// --- Sword skins (cosmetic only: every sword has the same reach) ---
// The shop groups skins by rarity. How a skin is drawn (see drawBlade):
//   blade = fill colour (null = day/night palette), tip = colour the blade fades to,
//   edge = outline, hi = highlight ridge, guard = crossguard and grip, gem = jewel on the guard,
//   shape = blade outline from PROFILES, curve = sabre-like bend, glow = soft halo,
//   fx = animated effect (see swordFx) in fxColor, hilt = visible handle, wing = winged guard.
// legacy skins stay in the inventory of people who bought them but are no longer sold.
const RARITIES = {
  common:    { label: "COMMON",    color: "#7ed957", glow: "rgba(126, 217, 87, 0.40)" },
  uncommon:  { label: "UNCOMMON",  color: "#4aa8ff", glow: "rgba(74, 168, 255, 0.45)" },
  rare:      { label: "RARE",      color: "#b266ff", glow: "rgba(178, 102, 255, 0.50)" },
  legendary: { label: "LEGENDARY", color: "#ffa930", glow: "rgba(255, 169, 48, 0.60)" }
};
const SWORD_SKINS = {
  starter: { name: "STARTER SWORD", rarity: null, price: 0, blade: null, guard: null, len: 26, width: 3 },

  // Common
  wooden:  { name: "TRAINING WOODEN BOKKEN", rarity: "common", price: 25,
             blade: "#a8743d", edge: "#4a2e14", hi: "#c99358", guard: "#5a3a1a",
             len: 30, width: 4.4, shape: "bokken" },
  sabre:   { name: "RUSTY CUTLASS", rarity: "common", price: 60,
             blade: "#a5a8a6", edge: "#4a4d4f", hi: "#d6d9d8", guard: "#5b3a22",
             len: 30, width: 4.4, shape: "saber", curve: 0.16, fx: "rust", fxColor: "#a8522a" },
  cleaver: { name: "SCRAP METAL CLEAVER", rarity: "common", price: 90,
             blade: "#9aa0a3", edge: "#3f4446", hi: "#cfd4d6", guard: "#cdbb8a",
             len: 27, width: 9, shape: "cleaver", fx: "rust", fxColor: "#8a6a3a" },
  oldguard: { name: "OLD GUARD'S SABER", rarity: "common", price: 120,
             blade: "#cfd4d8", edge: "#5d646a", hi: "#ffffff", guard: "#b7842b",
             len: 32, width: 4, shape: "saber", curve: 0.12 },
  bronze:  { name: "BRONZE SWORD", rarity: "common", price: 40, legacy: true,
             blade: "#e3ac3f", edge: "#6a4a12", guard: "#5a3a12", len: 27, width: 3.5 },

  // Uncommon
  spiketooth: { name: "SPIKE-TOOTH BLADE", rarity: "uncommon", price: 500,
             blade: "#454c56", edge: "#111418", hi: "#8892a0", guard: "#2a2f36",
             len: 32, width: 6.4, shape: "serrated" },
  electro: { name: "ELECTRO-BATON SWORD", rarity: "uncommon", price: 750,
             blade: "#a9c4d6", edge: "#2f5878", hi: "#f2fbff", guard: "#2d4a63",
             len: 31, width: 4, shape: "blade", fx: "electric", fxColor: "#8fe9ff", glow: "#4fc3f7" },
  obsidian: { name: "OBSIDIAN SHARD", rarity: "uncommon", price: 1000,
             blade: "#372a58", edge: "#6a50b4", hi: "#a583f0", guard: "#2a2048",
             len: 30, width: 7.4, shape: "shard" },

function showMenu(name) {
  for (const [key, el] of Object.entries(menus)) el.classList.toggle("open", key === name);
  document.body.classList.toggle("playing", name === null);
  if (name === "main") {
    document.getElementById("highText").textContent = pad5(high(settings.difficulty));
    document.getElementById("highDiff").textContent = DIFFICULTIES[settings.difficulty].label;
    document.getElementById("goldText").textContent = fmt(totalGold);
  }
  if (name === "settings") refreshSettingsLabels();
  if (name === "shop") { shopMessage(""); refreshShop(); }
  if (name === "inventory") { invMessage(""); refreshInventory(); }
  if (name === "look") { lookMessage(""); refreshLook(); }
  animatePreviews();
  animateLook();
}

function refreshSettingsLabels() {
  const nextRun = state === "paused" && settings.difficulty !== runDiff ? " (NEXT RUN)" : "";
  document.getElementById("difficultyBtn").textContent =
    `DIFFICULTY: ${DIFFICULTIES[settings.difficulty].label}${nextRun}`;
  document.getElementById("btnSizeBtn").textContent =

  document.getElementById("musicBtn").textContent = `MUSIC: ${settings.music ? "ON" : "OFF"}`;
  document.getElementById("comfortBtn").textContent = `COMFORT MODE: ${settings.comfort ? "ON" : "OFF"}`;

    resetArmed ? "TAP AGAIN TO CONFIRM" : "RESET HIGH SCORES";
  document.documentElement.style.setProperty("--btn-size", BUTTON_SIZES[settings.btnSize].size);
}

function nextKey(obj, current) {
  const keys = Object.keys(obj);
  return keys[(keys.indexOf(current) + 1) % keys.length];
}

// PLAY starts a short READY - SET - RUN! countdown; the run itself begins on "RUN!"
function startGame() {
  reset();
  state = "countdown";
  countdown = 0;
  countdownStage = -1;
  showMenu(null);
}

function updateCountdown(dt) {
  countdown += dt;
  player.runPhase += dt * 5.5;   // walking in place while the words count down
  const stage = Math.min(COUNTDOWN_WORDS.length - 1, Math.floor(countdown / COUNTDOWN_STEP));
  if (stage !== countdownStage) {
    countdownStage = stage;
    [sfx.ready, sfx.ready, sfx.go][stage]();
  }
  if (countdown >= COUNTDOWN_STEP * COUNTDOWN_WORDS.length) {
    state = "running";
    startWave(1);
    hintTimer = HINT_TIME;
    document.body.classList.add("show-hint");
  }
}

function pauseGame() {
  if (state !== "running") return;
  state = "paused";
  releaseInput();
  showMenu("pause");
}

function resumeGame() {
  state = "running";
  showMenu(null);
}

function goToMainMenu() {
  reset();
  state = "ready";
  showMenu("main");
}

function openSettings(from) {
  settingsReturnTo = from;
  resetArmed = false;
  showMenu("settings");
}

const menuActions = {
  play: startGame,

  settings: () => openSettings(state === "paused" ? "pause" : "main"),
  back: () => showMenu(settingsReturnTo),

    settings.difficulty = nextKey(DIFFICULTIES, settings.difficulty);

let shopTab = "common";   // which rarity tab is showing

// A card with the sword picture, name and rarity. The caller adds the button's text and action.
function swordCard(id) {
  const skin = SWORD_SKINS[id];
  const info = RARITIES[skin.rarity] || { label: "STARTER", color: "#ffffff" };
  const card = document.createElement("div");
  card.className = "card";
  if (RARITIES[skin.rarity]) {
    card.style.setProperty("--rar", info.color);
    card.style.setProperty("--rar-glow", info.glow);
  }
  card.innerHTML = `<canvas width="320" height="128"></canvas>
    <div class="name">${skin.name}</div>
    <div class="tag" style="color:${info.color}">${info.label}</div>
    <button></button>`;
  const canvas = card.querySelector("canvas");
  if (skin.fx || skin.glow) canvas.dataset.anim = id;   // animated while the menu is open
  drawSwordPreview(canvas, skin);
  return card;
}

// Keeps the glowing, sparking swords moving while the shop or inventory is open
function animatePreviews() {
  const open = menus.shop.classList.contains("open") || menus.inventory.classList.contains("open");
  if (!open) { clearInterval(previewTimer); previewTimer = null; return; }
  if (previewTimer) return;
  previewTimer = setInterval(() => {
    for (const c of document.querySelectorAll("canvas[data-anim]")) {
      drawSwordPreview(c, SWORD_SKINS[c.dataset.anim]);
    }
  }, 70);
}

// One tab per rarity, and below it that rarity's swords
function refreshShop() {
  document.getElementById("shopGold").innerHTML = `<span class="coin"></span>${fmt(totalGold)}`;
  const sections = document.getElementById("shopSections");
  sections.innerHTML = "";

  const tabs = document.createElement("div");
  tabs.className = "tabs";
  for (const [rarity, info] of Object.entries(RARITIES)) {
    const tab = document.createElement("button");
    tab.className = "tab" + (rarity === shopTab ? " active" : "");
    tab.style.setProperty("--rar", info.color);
    tab.textContent = info.label;
    tab.addEventListener("click", () => { shopTab = rarity; refreshShop(); });
    tabs.appendChild(tab);
  }

  const row = document.createElement("div");
  row.className = "shop-row";
  for (const [id, skin] of Object.entries(SWORD_SKINS)) {
    if (skin.rarity !== shopTab || skin.legacy) continue;
    const owned = skinState.owned.includes(id);
    const card = swordCard(id);
    const btn = card.querySelector("button");
    btn.innerHTML = owned ? "OWNED" : `<span class="coin"></span>${fmt(skin.price)}`;
    btn.classList.toggle("owned", owned);
    btn.classList.toggle("cant", !owned && totalGold < skin.price);
    btn.addEventListener("click", () => shopTap(id));
    row.appendChild(card);
  }
  sections.append(tabs, row);
}

function shopMessage(text) { document.getElementById("shopMsg").textContent = text; }

// Tapping a card buys it if there's enough gold. Equipping is done in the inventory.
function shopTap(id) {
  const skin = SWORD_SKINS[id];
  if (skinState.owned.includes(id)) {
    shopMessage("YOU OWN THIS — EQUIP IT FROM YOUR INVENTORY");
    return;
  } else if (totalGold >= skin.price) {
    totalGold -= skin.price;
    localStorage.setItem("stickgo-gold", totalGold);
    skinState.owned.push(id);
    shopMessage(`BOUGHT ${skin.name}! EQUIP IT FROM YOUR INVENTORY`);
    sfx.coin();
  } else {
    shopMessage(`NOT ENOUGH GOLD — NEED ${fmt(skin.price - totalGold)} MORE`);
    return;
  }
  saveSkins();
  refreshShop();
}

// --- Inventory ---
// Every owned sword (starter first, then by rarity) with an EQUIP button.
function refreshInventory() {
  const row = document.getElementById("invItems");
  row.innerHTML = "";
  for (const rarity of [null, ...Object.keys(RARITIES)]) {
    for (const [id, skin] of Object.entries(SWORD_SKINS)) {
      if (skin.rarity !== rarity || !skinState.owned.includes(id)) continue;
      const equipped = skinState.equipped === id;
      const card = swordCard(id);
      card.classList.toggle("equipped", equipped);
      const btn = card.querySelector("button");
      btn.textContent = !equipped ? "EQUIP" : id === "starter" ? "EQUIPPED" : "UNEQUIP";
      btn.addEventListener("click", () => equipSkin(id));
      row.appendChild(card);
    }
  }
  if (skinState.owned.length < 2) invMessage("BUY MORE SWORDS IN THE SHOP");
}

function equipSkin(id) {
  if (skinState.equipped === id) {
    // Unequipping puts the starter sword back (he always carries one)
    if (id === "starter") return;
    skinState.equipped = "starter";
    saveSkins();
    refreshInventory();
    invMessage(`${SWORD_SKINS[id].name} UNEQUIPPED`);
    return;
  }
  skinState.equipped = id;
  saveSkins();
  refreshInventory();
  invMessage(`${SWORD_SKINS[id].name} EQUIPPED`);
}

function invMessage(text) { document.getElementById("invMsg").textContent = text; }

// Rainbow items drift slowly through the colours (a gentle fade, not a flash)
function rainbowHue() { return (performance.now() / 1000 * 50) % 360; }
function scarfColors() {
  const s = SCARVES[look.equipped.scarf] || SCARVES.red;
  if (!s.rainbow) return s;
  const h = rainbowHue();
  return { a: `hsl(${h}, 85%, 58%)`, b: `hsl(${(h + 25) % 360}, 85%, 40%)` };
}
function auraColors() {
  const a = AURAS[look.equipped.aura] || AURAS.blue;
  if (a.rainbow) { const h = rainbowHue(); return { front: `hsla(${h}, 100%, 60%, 0.30)`, back: `hsla(${h}, 100%, 60%, 0.16)` }; }
  return { front: `rgba(${a.rgb}, 0.30)`, back: `rgba(${a.rgb}, 0.16)` };
}

// Each hat is drawn upright around the head's centre (the head is a circle of radius 8, he
// faces right); drawHat tilts it with his head.
function drawHatShape(id, t) {
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  const poly = (color, pts) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]);
    ctx.closePath();
    ctx.fill();
  };
  const dome = (color, r, cy) => {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(0, cy, r, Math.PI, 0); ctx.closePath(); ctx.fill();
  };
  switch (id) {
    case "cap":
      dome("#d62c2c", 8.7, -3.6);
      ctx.fillStyle = "#a31d1d";
      ctx.beginPath(); ctx.moveTo(2, -4.4); ctx.quadraticCurveTo(12, -6.5, 15, -2.4); ctx.lineTo(2, -2.8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, -12.3, 1.3, 0, Math.PI * 2); ctx.fill();
      break;
    case "headband": {
      const w = Math.sin(t * 8) * 2;
      ctx.strokeStyle = "#e53030";
      ctx.lineWidth = 3.2;
      ctx.beginPath(); ctx.moveTo(-7.4, -5.2); ctx.lineTo(7.4, -5.2); ctx.stroke();
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(-7, -5); ctx.quadraticCurveTo(-13, -4 + w, -19, -1 + w * 1.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-7, -4.2); ctx.quadraticCurveTo(-12, -1 - w, -17, 2 - w); ctx.stroke();
      break;
    }
    case "party":
      poly("#ff5fa8", [[-6, -6.4], [6, -6.4], [0.5, -21]]);
      ctx.strokeStyle = "#ffe14d"; ctx.lineWidth = 1.6;
      for (const [y, hw] of [[-9.5, 4.8], [-13.5, 3.4], [-17, 2]]) { ctx.beginPath(); ctx.moveTo(0.3 - hw, y); ctx.lineTo(0.3 + hw, y); ctx.stroke(); }
      ctx.fillStyle = "#ffe14d"; ctx.beginPath(); ctx.arc(0.5, -21.5, 2.2, 0, Math.PI * 2); ctx.fill();
      break;
    case "cowboy":
      ctx.fillStyle = "#8b5a2b";
      ctx.beginPath(); ctx.ellipse(0, -6.8, 15, 3.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#a06a35";
      ctx.beginPath(); ctx.moveTo(-6.6, -7); ctx.lineTo(-5.6, -16); ctx.quadraticCurveTo(0, -13.2, 5.6, -16); ctx.lineTo(6.6, -7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#5a3a1a"; ctx.fillRect(-6.6, -9.8, 13.2, 2.2);
      break;
    case "tophat":
      ctx.fillStyle = "#16161d";
      ctx.fillRect(-10.5, -8.8, 21, 2.6);
      ctx.fillRect(-6.6, -22, 13.2, 13.6);
      ctx.fillStyle = "#b33"; ctx.fillRect(-6.6, -11.8, 13.2, 3);
      break;
    case "viking":
      dome("#9aa3ad", 8.8, -4);
      ctx.fillStyle = "#6a5030"; ctx.fillRect(-8.8, -6.4, 17.6, 2.4);
      ctx.strokeStyle = "#f1e9d0"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-7.8, -6); ctx.quadraticCurveTo(-14, -8, -11.5, -17); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(7.8, -6); ctx.quadraticCurveTo(14, -8, 11.5, -17); ctx.stroke();
      break;
    case "wizard":
      ctx.fillStyle = "#4b2a8c";
      ctx.beginPath(); ctx.ellipse(0, -6.6, 12.5, 2.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#6a3cc4";
      ctx.beginPath(); ctx.moveTo(-8, -6.8); ctx.quadraticCurveTo(-4, -22, 8, -30); ctx.quadraticCurveTo(5, -16, 8, -6.8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffe14d";
      for (const [x, y, r] of [[0.5, -13, 1.5], [3.4, -21, 1.2]]) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
      break;
    case "crown":
      poly("#ffd34d", [[-7, -6.6], [-8, -16.5], [-3.7, -11.8], [0, -18.5], [3.7, -11.8], [8, -16.5], [7, -6.6]]);
      ctx.strokeStyle = "#a8740a"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-7, -6.6); ctx.lineTo(-8, -16.5); ctx.lineTo(-3.7, -11.8); ctx.lineTo(0, -18.5); ctx.lineTo(3.7, -11.8); ctx.lineTo(8, -16.5); ctx.lineTo(7, -6.6); ctx.closePath(); ctx.stroke();
      for (const [x, c] of [[-4.2, "#3a7bff"], [0, "#e03030"], [4.2, "#3fcf5a"]]) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, -9.3, 1.3, 0, Math.PI * 2); ctx.fill(); }
      break;
    case "halo":
      ctx.strokeStyle = "#ffe27a"; ctx.lineWidth = 2.2;
      ctx.shadowColor = "#ffd34d"; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.ellipse(0, -15 + Math.sin(t * 3) * 0.8, 8.5, 2.6, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.shadowBlur = 0;
      break;
  }
}

function drawHat(id, head, neck) {
  if (!id || id === "none") return;
  ctx.save();
  ctx.translate(head.x, head.y);
  ctx.rotate(Math.atan2(head.x - neck.x, -(head.y - neck.y)));   // follow the tilt of his head
  drawHatShape(id, performance.now() / 1000);
  ctx.restore();
}

// Draws into another canvas by pointing ctx at it for a moment
function withContext(g, fn) {
  const savedCtx = ctx, savedColors = colors;
  ctx = g;
  colors = paletteAt(0);          // the day colours, so the dark hero shows on the light preview
  try { fn(); } finally { ctx = savedCtx; colors = savedColors; }
}

let lookPhase = 0;
function drawLookPreview() {
  const cv = document.getElementById("lookPreview");
  const g = cv.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
  const S = cv.height / 92;
  g.setTransform(S, 0, 0, S, cv.width / 2 - 11 * S, 30 * S);
  withContext(g, () => {
    const pose = getPose({ runPhase: lookPhase, onGround: true, ducking: false, vy: 0, attack: 0, x: 0, y: 0, w: 26, h: 60 });
    drawHero(pose, false);
    drawSword(pose, false);

function drawLookIcon(cv, group, id) {
  const g = cv.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
  const item = LOOK_GROUPS[group].items[id];
  const hue = rainbowHue();
  if (group === "hat") {
    const S = cv.height / 42;
    g.setTransform(S, 0, 0, S, cv.width / 2, cv.height * 0.78);
    withContext(g, () => {
      g.fillStyle = "#2a2a36";
      g.beginPath(); g.arc(0, 0, 8, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#cfe7ff";
      g.beginPath(); g.ellipse(2.6, -0.8, 1.5, 2.2, 0.18, 0, Math.PI * 2); g.fill();
      drawHatShape(id, performance.now() / 1000);
    });
  } else if (group === "scarf") {
    const a = item.rainbow ? `hsl(${hue}, 85%, 58%)` : item.a, b = item.rainbow ? `hsl(${(hue + 25) % 360}, 85%, 40%)` : item.b;
    g.lineCap = "round";
    g.lineWidth = 11;
    g.strokeStyle = b;
    g.beginPath(); g.moveTo(cv.width * 0.72, cv.height * 0.44); g.quadraticCurveTo(cv.width * 0.45, cv.height * 0.62, cv.width * 0.12, cv.height * 0.8); g.stroke();
    g.strokeStyle = a;
    g.beginPath(); g.moveTo(cv.width * 0.72, cv.height * 0.4); g.quadraticCurveTo(cv.width * 0.45, cv.height * 0.3, cv.width * 0.1, cv.height * 0.42); g.stroke();
    g.fillStyle = a;
    g.beginPath(); g.arc(cv.width * 0.74, cv.height * 0.42, 11, 0, Math.PI * 2); g.fill();
  } else {
    const c = item.rainbow ? `${hue}, 100%, 60%` : null;
    const cx = cv.width / 2, cy = cv.height / 2;
    const grad = g.createRadialGradient(cx, cy, 8, cx, cy, 58);
    grad.addColorStop(0, item.rainbow ? `hsla(${c}, 0.85)` : `rgba(${item.rgb}, 0.85)`);
    grad.addColorStop(1, item.rainbow ? `hsla(${c}, 0)` : `rgba(${item.rgb}, 0)`);
    g.fillStyle = grad;
    g.beginPath(); g.arc(cx, cy, 58, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#1a1a22";
    g.beginPath(); g.arc(cx, cy, 18, 0, Math.PI * 2); g.fill();
  }
}

let lookTab = "hat";
let lookTimer = null;

function refreshLook() {
  document.getElementById("lookGold").innerHTML = `<span class="coin"></span>${fmt(totalGold)}`;
  const tabs = document.getElementById("lookTabs");
  const row = document.getElementById("lookItems");
  tabs.innerHTML = "";
  row.innerHTML = "";
  for (const [group, info] of Object.entries(LOOK_GROUPS)) {
    const tab = document.createElement("button");
    tab.className = "tab" + (group === lookTab ? " active" : "");
    tab.style.setProperty("--rar", "#ff8a1f");
    tab.textContent = info.label;
    tab.addEventListener("click", () => { lookTab = group; lookMessage(""); refreshLook(); });
    tabs.appendChild(tab);
  }
  for (const [id, item] of Object.entries(LOOK_GROUPS[lookTab].items)) {
    if (id === "none") continue;   // "none" is just the unequipped state, tapped off via UNEQUIP
    const owned = look.owned[lookTab].includes(id);
    const equipped = look.equipped[lookTab] === id;
    const card = document.createElement("div");
    card.className = "card" + (equipped ? " equipped" : "");
    card.style.setProperty("--rar", "#ff8a1f");
    card.innerHTML = `<canvas width="192" height="120"></canvas><div class="name">${item.name}</div><button></button>`;
    const cv = card.querySelector("canvas");
    if (item.rainbow || id === "headband" || id === "halo") cv.dataset.anim = id;
    cv.dataset.group = lookTab;
    cv.dataset.id = id;
    drawLookIcon(cv, lookTab, id);
    const btn = card.querySelector("button");
    if (equipped) btn.textContent = LOOK_GROUPS[lookTab].items.none && id !== "none" ? "UNEQUIP" : "EQUIPPED";
    else if (owned) btn.textContent = "EQUIP";
    else { btn.innerHTML = `<span class="coin"></span>${fmt(item.price)}`; btn.classList.toggle("cant", totalGold < item.price); }
    btn.addEventListener("click", () => lookTap(lookTab, id));
    row.appendChild(card);
  }
  drawLookPreview();
}

// Tapping an item equips it; if you don't own it yet it is bought first
function lookTap(group, id) {
  const item = LOOK_GROUPS[group].items[id];
  if (!look.owned[group].includes(id)) {
    if (totalGold < item.price) { lookMessage(`NOT ENOUGH GOLD — NEED ${fmt(item.price - totalGold)} MORE`); return; }
    totalGold -= item.price;
    localStorage.setItem("stickgo-gold", totalGold);
    look.owned[group].push(id);
    sfx.coin();
  }
  // Tapping the worn hat takes it off
  if (id !== "none" && LOOK_GROUPS[group].items.none && look.equipped[group] === id) id = "none";
  look.equipped[group] = id;
  saveLook();
  lookMessage(id === "none" ? `${LOOK_GROUPS[group].label} REMOVED` : `${item.name} EQUIPPED`);
  refreshLook();
}

function lookMessage(text) { document.getElementById("lookMsg").textContent = text; }

// Keeps the preview running and the animated items (rainbow, headband, halo) moving
function animateLook() {
  if (!menus.look.classList.contains("open")) { clearInterval(lookTimer); lookTimer = null; return; }
  if (lookTimer) return;
  lookTimer = setInterval(() => {
    lookPhase += 0.45;
    drawLookPreview();
    for (const cv of document.querySelectorAll("#lookItems canvas[data-anim]")) drawLookIcon(cv, cv.dataset.group, cv.dataset.id);
  }, 70);
}

// Called by the Android app when the phone's back button is pressed.
// Returns true if the game handled it, false to let the app close.
window.stickgoBack = function () {
  if (state === "dying") return true;
  if (state === "countdown") { goToMainMenu(); return true; }
  if (state === "running") { pauseGame(); return true; }
  if (menus.shop.classList.contains("open")) { showMenu("main"); return true; }
  if (menus.inventory.classList.contains("open")) { showMenu("main"); return true; }
  if (menus.look.classList.contains("open")) { showMenu("main"); return true; }
  if (menus.settings.classList.contains("open")) { showMenu(settingsReturnTo); return true; }
  if (state === "paused") { resumeGame(); return true; }
  if (state === "over") { goToMainMenu(); return true; }
  return false;
};

// --- Sound ---
// Small synthesized beeps, so no audio files are needed. Browsers only allow
// audio after the player has touched or pressed something, so it starts then.
let audio = null;

function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!audio && AC) audio = new AC();
  if (audio && audio.state === "suspended") audio.resume();
}
for (const ev of ["pointerdown", "pointerup", "keydown", "click", "touchstart", "touchend"]) {
  document.addEventListener(ev, initAudio, true);
}
initAudio();   // the app allows autoplay, so the menu music can start right away

function beep(freq, dur, { type = "square", vol = 0.06, slideTo, delay = 0 } = {}) {
  if (!settings.sound || !audio || audio.state !== "running") return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur);
}

// --- Music ---
// A looping synthesized tune (Am - F - C - G): bass, arpeggio and drums, scheduled a
// little ahead of time from the main loop. It plays only while a run is going.
const MUSIC_STEP = 60 / 150 / 2;   // one eighth note at 150 bpm
const MUSIC_CHORDS = [
  { bass: 45, notes: [69, 72, 76] },   // Am
  { bass: 41, notes: [65, 69, 72] },   // F
  { bass: 48, notes: [72, 76, 79] },   // C
  { bass: 43, notes: [71, 74, 79] }    // G
];
const ARP_ORDER = [0, 1, 2, 1, 0, 1, 2, 1];
let musicNext = 0, musicStep = 0, noiseBuf = null;

const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

function musicTone(freq, t, dur, type, vol, slideTo) {
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur);
}

function musicNoise(t, dur, vol) {
  if (!noiseBuf) {
    noiseBuf = audio.createBuffer(1, audio.sampleRate * 0.1, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = audio.createBufferSource();
  const gain = audio.createGain();
  src.buffer = noiseBuf;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(gain).connect(audio.destination);
  src.start(t);
}

function scheduleMusicStep(step, t) {
  const bar = Math.floor(step / 8) % MUSIC_CHORDS.length;
  const s = step % 8;
  const chord = MUSIC_CHORDS[bar];
  // Phone speakers are weak on low notes, so the bass is an octave up and doubled with a square
  musicTone(midiHz(chord.notes[ARP_ORDER[s]]), t, MUSIC_STEP * 0.9, "square", 0.05);
  if (s === 0 || s === 3 || s === 4 || s === 6) {
    musicTone(midiHz(chord.bass + 12), t, MUSIC_STEP * 1.6, "triangle", 0.2);
    musicTone(midiHz(chord.bass + 12), t, MUSIC_STEP * 1.2, "square", 0.03);
  }
  if (s === 0 || s === 4) musicTone(180, t, 0.12, "sine", 0.25, 60);
  if (s === 2 || s === 6) musicNoise(t, 0.09, 0.08);
  if (s % 2 === 1) musicNoise(t, 0.03, 0.03);
}

function musicTick() {
  if (!audio || audio.state !== "running" || !settings.music || (state !== "running" && state !== "ready" && state !== "countdown")) {
    musicNext = 0;   // restart cleanly from the next beat once it can play again
    return;
  }
  const now = audio.currentTime;
  if (musicNext < now) musicNext = now + 0.05;
  while (musicNext < now + 0.25) {
    scheduleMusicStep(musicStep++, musicNext);
    musicNext += MUSIC_STEP;
  }
}

// --- Input ---
// Computer: A / D (or the arrow keys) walk, W jumps, SPACE / X / F / J attack (press again to chain
// the 3-hit combo), SHIFT or K dashes, 1 / 2 / 3 (or U / I / O) use skills 1, 2 and 3.
// Phone: the left and right arrow buttons walk, and the buttons on the right do the rest.
const held = { left: false, right: false };        // keyboard
const touchHeld = { left: false, right: false };   // on-screen buttons
const MOVE_KEYS = { KeyA: "left", ArrowLeft: "left", KeyD: "right", ArrowRight: "right" };
const ATTACK_KEYS = ["Space", "KeyX", "KeyF", "KeyJ"];
const JUMP_KEYS = ["KeyW", "ArrowUp"];
const DASH_KEYS = ["ShiftLeft", "ShiftRight", "KeyK", "KeyL"];
const SKILL_KEYS = { Digit1: "s1", Numpad1: "s1", KeyU: "s1", Digit2: "s2", Numpad2: "s2", KeyI: "s2",
                     Digit3: "s3", Numpad3: "s3", KeyO: "s3" };

const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

function releaseInput() {
  held.left = held.right = touchHeld.left = touchHeld.right = false;
  for (const b of [leftBtn, rightBtn, attackBtn, jumpBtn, dashBtn, sk1Btn, sk2Btn, sk3Btn]) b.classList.remove("pressed");
}

// Presses are remembered for a moment (see update), so tapping just early still counts
function press(name) {
  if (state === "running") queued[name] = 0.22;
}

// Dash: a quick burst the way he's walking (or facing). He can't be hurt while it lasts.
function dash() {
  if (state !== "running" || player.dash > 0 || player.dashCooldown > 0 || player.stun > 0) return;
  if (player.act && player.act.skill) return;   // skills can't be cut short
  player.act = null;
  player.dash = DASH_TIME;
  player.inv = DASH_TIME + 0.05;
  player.dashCooldown = DASH_COOLDOWN;
  player.dashDir = inputDir() || player.facing;
  player.facing = player.dashDir;
  sfx.dash();
}

document.addEventListener("keydown", (e) => {
  if (["Escape", "KeyP"].includes(e.code)) {
    e.preventDefault();
    window.stickgoBack();
    return;
  }
  if (MOVE_KEYS[e.code]) {
    e.preventDefault();
    held[MOVE_KEYS[e.code]] = true;
  }
  if (JUMP_KEYS.includes(e.code)) {
    e.preventDefault();
    press("jump");
  }
  if (DASH_KEYS.includes(e.code) && !e.repeat) {
    e.preventDefault();
    dash();
  }
  if (SKILL_KEYS[e.code] && !e.repeat) {
    e.preventDefault();
    press(SKILL_KEYS[e.code]);
  }
  if (ATTACK_KEYS.includes(e.code)) {
    e.preventDefault();
    if (state === "ready" && menus.main.classList.contains("open")) startGame();
    else if (state === "over") startGame();
    else if (!e.repeat) press("attack");
  }
});

document.addEventListener("keyup", (e) => {
  if (MOVE_KEYS[e.code]) held[MOVE_KEYS[e.code]] = false;
});
window.addEventListener("blur", releaseInput);

pauseBtn.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  pauseGame();
});

// A walk button stays "held" until the finger lifts, even if it slides off the button
function holdButton(btn, dir) {
  btn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    btn.setPointerCapture(e.pointerId);
    btn.classList.add("pressed");
    touchHeld[dir] = true;
  });
  for (const ev of ["pointerup", "pointercancel"]) {
    btn.addEventListener(ev, () => {
      btn.classList.remove("pressed");
      touchHeld[dir] = false;
    });
  }
}
holdButton(leftBtn, "left");
holdButton(rightBtn, "right");

for (const [btn, action] of [[attackBtn, () => press("attack")], [jumpBtn, () => press("jump")], [dashBtn, dash],
    [sk1Btn, () => press("s1")], [sk2Btn, () => press("s2")], [sk3Btn, () => press("s3")]]) {
  btn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    btn.classList.add("pressed");
    action();
  });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) {
    btn.addEventListener(ev, () => btn.classList.remove("pressed"));
  }
}

// Fields getPose() reads, so anything with these can be drawn as a stickman
function person(fields) {

function burst(x, y, n, color, power = 220) {

                  life: 0.4 + Math.random() * 0.4, color, r: 1.5 + Math.random() * 1.5 });

}

}
const FRAME_W = 128, FRAME_H = 64, SC = 1.5;   // drawn 1.5x so he stands about 60 units tall

// The animation data (animations.js, edited with anim-editor.html)
const ANIM = window.STICKGO_ANIMS;
const HS = ANIM.hero.states;

// An action is a list of sheets played one after the other (parts) and hits that land when
// the animation reaches a frame. front/back = how far the hit reaches ahead of and behind him,
// kb = how far it shoves what it hits. prep() works out the timings.
function prep(def) {
  const spec = { ...def, hits: def.hits.map((h) => ({ ...h, part: h.part || 0 })) };
  let t = 0;
  spec.partStart = spec.parts.map((p) => { const s = t; t += p.frames.length / p.fps; return s; });
  spec.total = t;
  spec.hitT = spec.hits.map((h) => spec.partStart[h.part] + h.at / spec.parts[h.part].fps);
  return spec;
}
// The sheet frame showing t seconds into an action
function actFrame(spec, t) {
  let i = spec.parts.length - 1;
  while (i > 0 && t < spec.partStart[i]) i--;
  const p = spec.parts[i];
  const frame = p.frames[Math.min(p.frames.length - 1, Math.floor((t - spec.partStart[i]) * p.fps))];
  return { sheet: p.sheet, frame, flash: !!(p.flash && p.flash.includes(frame)) };
}
// One frame of a hero state (idle, run...), chosen by position in its frame list
function stateFrame(st, i) {
  return { sheet: st.sheet, frame: st.frames[Math.max(0, Math.min(st.frames.length - 1, Math.floor(i)))] };
}

// Basic attack 1 - 2 - 3: press again during a swing to chain into the next one
const COMBO = ANIM.hero.combo.map((id) => prep(ANIM.hero.actions[id]));
// Skills 1 - 2 - 3, each with its own cooldown (s)
const SKILLS = ANIM.hero.skills.map((id) => prep(ANIM.hero.actions[id]));

// --- Arena ---
// The hero walks left and right across a fixed stage while waves of enemies step out of portals
// at both edges. Enemies each have a trick of their own; every wave 5 a boss shows up.
const PLAYER_SPEED = 230;      // px/s
const PLAYER_MAX_HP = 100;
const HURT_TIME = 0.9;         // s he can't be hurt again after a hit
const DIFF_MUL = { easy: 0.8, normal: 1, hard: 1.25 };   // enemy speed and spawn rate
// stand = how close it gets before it acts; dmg = damage to the hero; pts = score for a kill
const FOES = {
  grunt:  { look: null,      scale: 0,   w: 26, h: 60,  hp: 30,  speed: 110, dmg: 10, stand: 40,  windup: 0.5,  rec: 0.5, gold: [1, 3],   pts: 10 },
  ninja:  { look: "ninja",   scale: 0,   w: 26, h: 60,  hp: 22,  speed: 150, dmg: 14, stand: 260, windup: 0.55, rec: 0.9, gold: [2, 4],   pts: 15 },
  guard:  { look: null,      scale: 0,   w: 26, h: 60,  hp: 50,  speed: 75,  dmg: 14, stand: 40,  windup: 0.55, rec: 0.6, gold: [4, 6],   pts: 25, shield: true },
  brute:  { look: "brute",   scale: 1.6, w: 42, h: 96,  hp: 90,  speed: 65,  dmg: 22, stand: 150, windup: 0.85, rec: 0.9, gold: [8, 10],  pts: 40 },
  archer: { look: "archer",  scale: 0,   w: 26, h: 60,  hp: 20,  speed: 90,  dmg: 12, stand: 330, windup: 0.7,  rec: 1.2, gold: [3, 5],   pts: 20 },
  bomber: { look: "bomber",  scale: 0,   w: 26, h: 60,  hp: 20,  speed: 80,  dmg: 20, stand: 280, windup: 0.8,  rec: 1.6, gold: [3, 5],   pts: 20 },
  ghost:  { look: "phantom", scale: 0,   w: 26, h: 60,  hp: 26,  speed: 100, dmg: 14, stand: 40,  windup: 0.5,  rec: 0.5, gold: [4, 6],   pts: 25 },
  boss:   { look: "brute",   scale: 2.1, w: 52, h: 126, hp: 320, speed: 60,  dmg: 28, stand: 190, windup: 0.9,  rec: 1.0, gold: [60, 60], pts: 200 }
};
for (const [kind, data] of Object.entries(ANIM.foes)) Object.assign(FOES[kind], data.stats);   // stats come from animations.js
const SHOOTERS = new Set(["archer", "bomber"]);   // never more than two at a time
let foes = [];                 // enemies on the field
let portals = [];              // purple gates the enemies step out of
let arrows = [], bombs = [], blasts = [], shocks = [];   // enemy attacks in flight
let ghosts = [];               // fading afterimages left by a dash
let kills = 0;
let waveToSpawn = 0, waveTotal = 0, waveClearTimer = -1, bossDue = false;
let ghostTimer = 0, hintTimer = 0, dyingT = 0, heroFlash = null;
const queued = { attack: 0, s1: 0, s2: 0, s3: 0, jump: 0 };   // presses are remembered briefly (seconds left)

function inputDir() {
  return (held.right || touchHeld.right ? 1 : 0) - (held.left || touchHeld.left ? 1 : 0);
}

function startWave(n) {
  wave = n;
  waveBanner = 2.2;
  bossDue = n % 5 === 0;
  waveToSpawn = waveTotal = Math.min(30, 4 + n * 2) + (bossDue ? 1 : 0);
  spawnTimer = 1.2;
  waveClearTimer = -1;
  sfx.wave();
}

function pickKind() {
  if (bossDue) { bossDue = false; return "boss"; }
  const shooters = foes.filter((o) => SHOOTERS.has(o.kind)).length + portals.filter((p) => SHOOTERS.has(p.kind)).length;
  const table = [
    ["grunt", 10],
    ["ninja", wave >= 2 ? 3 + wave * 0.5 : 0],
    ["guard", wave >= 3 ? 2 + wave * 0.4 : 0],
    ["brute", wave >= 3 ? 1.5 + wave * 0.3 : 0],
    ["archer", wave >= 3 && shooters < 2 ? 2 + wave * 0.3 : 0],
    ["bomber", wave >= 4 && shooters < 2 ? 1.5 + wave * 0.3 : 0],
    ["ghost", wave >= 5 ? 1.5 + wave * 0.25 : 0]
  ];
  let r = Math.random() * table.reduce((sum, e) => sum + e[1], 0);
  for (const [kind, weight] of table) { if ((r -= weight) < 0) return kind; }
  return "grunt";
}

// A portal opens at one of the two edges; half a second later an enemy steps out of it
function openPortal() {
  const fromLeft = Math.random() < 0.5;
  portals.push({ x: fromLeft ? 52 : W - 52, fromLeft, kind: pickKind(), t: 0, spawned: false });
  sfx.warn();
}

function spawnFoe(portal) {
  const kind = portal.kind, fromLeft = portal.fromLeft;
  const d = FOES[kind];
  burst(portal.x, GROUND_Y - 40, 10, "#b27bff", 200);
  foes.push(person({
    type: kind, kind, look: d.look, scale: d.scale || undefined, age: 0,
    x: portal.x - d.w / 2, y: GROUND_Y - d.h, w: d.w, h: d.h, shield: !!d.shield,
    hp: d.hp, maxHp: d.hp, stand: d.stand, speed: d.speed * DIFF_MUL[runDiff] * (0.9 + Math.random() * 0.2),
    dir: fromLeft ? 1 : -1, ai: "walk", timer: 0, stagger: 0, flash: 0, turn: 0, phaseT: Math.random() * 2, solid: true
  }));
  if (kind === "boss") {
    bossBanner = { title: "THE WARLORD", sub: "HE CHARGES AND SLAMS", t: 2.4 };
    sfx.boss();
  }
}

// --- Enemy behaviour ---
function updateFoes(dt) {
  const pcx = player.x + player.w / 2;
  for (const o of foes) {
    const d = FOES[o.kind];
    const ocx = o.x + o.w / 2, dx = pcx - ocx, dist = Math.abs(dx), toward = dx >= 0 ? 1 : -1;
    o.stagger = Math.max(0, o.stagger - dt);
    o.flash = Math.max(0, o.flash - dt);
    o.age += dt;
    o.timer += dt;
    if (o.kind === "ghost") { o.phaseT += dt; o.solid = o.phaseT % 1.9 < 1.1; }   // flickers in and out
    o.windup = o.ai === "throw" ? 1 : 0;           // read by the bomber's pose
    o.holding = o.kind === "bomber" && (o.ai === "throw" || o.ai === "walk");

    switch (o.ai) {
      case "walk": {
        if (o.stagger > 0) break;
        if (o.shield) {   // a guard turns slowly: that's the moment to hit him from behind
          if (toward !== o.dir) { o.turn += dt; if (o.turn >= 0.7) { o.dir = toward; o.turn = 0; } } else o.turn = 0;
        } else o.dir = toward;
        if (dist > o.stand) {
          // Don't walk through a mate who is already closer to the hero on the same side
          const blocked = foes.some((p) => p !== o && (p.x + p.w / 2 - pcx) * (ocx - pcx) > 0 &&
            Math.abs(p.x + p.w / 2 - pcx) < dist && Math.abs(p.x - o.x) < o.w);
          if (!blocked) {
            o.x += o.dir * o.speed * dt;
            o.runPhase += dt * (o.speed + 120) / 24;
          }
        } else {
          o.timer = 0;
          if (o.kind === "ninja" || (o.kind === "boss" && Math.random() < 0.5)) o.ai = "warn";
          else if (o.kind === "archer") o.ai = "aim";
          else if (o.kind === "bomber") o.ai = "throw";
          else { o.ai = "windup"; o.attack = ATTACK_DURATION; }   // arm held up, ready to swing / slam
        }
        break;
      }
      case "windup":
        if (o.timer >= d.windup) {
          o.timer = 0;
          o.ai = "strike";
          if (o.kind === "brute" || o.kind === "boss") {
            // Slam: a shockwave runs along the ground both ways. Jump it.
            sfx.slam();
            shakeTime = Math.max(shakeTime, 0.25);
            burst(ocx, GROUND_Y - 4, 12, "#ffb04a", 260);
            shocks.push({ x: ocx, dir: -1, dist: 0, dmg: d.dmg }, { x: ocx, dir: 1, dist: 0, dmg: d.dmg });
          } else if (o.solid && dist < 54 && player.y + player.h > GROUND_Y - 30) {
            hurtPlayer(d.dmg, ocx);   // a jump clears the swing; so does being somewhere else
          }
        }
        break;
      case "strike":
        o.attack = Math.max(0, ATTACK_DURATION - o.timer);
        if (o.timer >= ATTACK_DURATION) { o.ai = "recover"; o.timer = 0; o.attack = 0; }
        break;
      case "warn":   // flashes red, then charges through where he was standing
        o.dir = toward;
        o.flash = 0.1;
        if (o.timer >= d.windup) { o.ai = "charge"; o.timer = 0; o.chargeDir = toward; o.chargeHit = false; sfx.dash(); }
        break;
      case "charge":
        o.x += o.chargeDir * 560 * dt;
        o.runPhase += dt * 40;
        if (!o.chargeHit && dist < 28 && player.y + player.h > GROUND_Y - 30) { o.chargeHit = true; hurtPlayer(d.dmg, ocx); }
        if (o.timer >= 0.5 || o.x < -10 || o.x + o.w > W + 10) { o.ai = "recover"; o.timer = 0; o.x = Math.max(-10, Math.min(W + 10 - o.w, o.x)); }
        break;
      case "aim":   // draws the bow, then an arrow flies along the ground at chest height
        o.dir = toward;
        o.draw = Math.min(1, o.timer / d.windup);
        if (o.timer >= d.windup) {
          arrows.push({ x: ocx + o.dir * 20, y: GROUND_Y - 46, vx: o.dir * 430, dmg: d.dmg });
          sfx.arrow();
          o.draw = 0; o.ai = "recover"; o.timer = 0;
        }
        break;
      case "throw":  // lobs a bomb at where the hero is standing
        o.dir = toward;
        if (o.timer >= d.windup) {
          bombs.push({ x: ocx, y: o.y + 14, x0: ocx, y0: o.y + 14, tx: pcx, t: 0, dmg: d.dmg });
          o.ai = "recover"; o.timer = 0;
        }
        break;
      default:   // recover
        if (o.timer >= d.rec) { o.ai = "walk"; o.timer = 0; }
    }
  }
}

function updateProjectiles(dt) {
  const pcx = player.x + player.w / 2;
  for (const a of arrows) {
    a.x += a.vx * dt;
    if (Math.abs(a.x - pcx) < 22 && a.y > player.y + 6 && a.y < player.y + player.h) {
      hurtPlayer(a.dmg, a.x - Math.sign(a.vx) * 20);
      if (player.hurt > 0) a.gone = true;
    }
    if (a.x < -30 || a.x > W + 30) a.gone = true;
  }
  arrows = arrows.filter((a) => !a.gone);

  for (const b of bombs) {
    b.t += dt;
    const flight = 0.9, u = Math.min(1, b.t / flight);
    b.x = b.x0 + (b.tx - b.x0) * u;
    b.y = b.y0 + (GROUND_Y - 8 - b.y0) * u - 90 * 4 * u * (1 - u);
    if (b.t >= flight + 0.5) {   // lands, sizzles, then goes off
      b.gone = true;
      blasts.push({ x: b.x, t: 0, r: 52, dmg: b.dmg, hit: false });
      sfx.boom();
      shakeTime = Math.max(shakeTime, 0.2);
    }
  }
  bombs = bombs.filter((b) => !b.gone);

  for (const b of blasts) {
    b.t += dt;
    if (!b.hit && Math.abs(pcx - b.x) < b.r + 8 && player.y + player.h > GROUND_Y - 50) { b.hit = true; hurtPlayer(b.dmg, b.x); }
  }
  blasts = blasts.filter((b) => b.t < 0.35);

  for (const s of shocks) {
    s.x += s.dir * 300 * dt;
    s.dist += 300 * dt;
    if (!s.hit && Math.abs(s.x - pcx) < 20 && player.y + player.h > GROUND_Y - 22) { s.hit = true; hurtPlayer(s.dmg, s.x - s.dir * 20); }
  }
  shocks = shocks.filter((s) => s.dist < 360);
}

// --- Hero ---
function hurtPlayer(dmg, fromX) {
  if (state !== "running" || player.hurt > 0 || player.inv > 0 || player.dash > 0) return;
  player.hp -= dmg;
  player.hurt = HURT_TIME;
  player.stun = 0.3;
  player.act = null;
  shakeTime = Math.max(shakeTime, 0.2);
  sfx.hit();
  const away = player.x + player.w / 2 >= fromX ? 1 : -1;
  player.x = Math.max(8, Math.min(W - 8 - player.w, player.x + away * 22));   // shoved away
  burst(player.x + player.w / 2, player.y + 24, 8, "#ffe14d", 220);
  if (player.hp <= 0) { player.hp = 0; die(); }
}

function die() {
  state = "dying";
  dyingT = 0;
  releaseInput();
  document.body.classList.remove("playing");
  shakeTime = 0.3;
}

function startAction(spec) {
  player.act = spec;
  player.actT = 0;
  player.fired = spec.hits.map(() => false);
  player.buffered = false;
  player.lungeV = spec.lunge || 0;
  if (spec.skill) sfx.skill(); else sfx.slash();
}

// Lands one hit of the current action on every enemy in its reach
function dealHit(hit) {
  const f = player.facing, pcx = player.x + player.w / 2;
  for (const o of foes) {
    if (o.dead || (!o.solid && !hit.screen)) continue;   // a ghost between flickers can't be touched
    const ocx = o.x + o.w / 2;
    const ahead = (ocx - pcx) * f;   // how far in front of him it stands
    if (!hit.screen && (ahead < -hit.back - o.w / 2 || ahead > hit.front + o.w / 2)) continue;
    if (!hit.screen && player.y + player.h < GROUND_Y - 70) continue;   // too high above them to reach
    // A guard's shield stops anything from the side he's facing; only the ultimate gets past
    if (o.shield && !hit.screen && o.dir === (pcx >= ocx ? 1 : -1)) {
      sfx.clang();
      burst(o.x + o.w / 2 + o.dir * 12, o.y + 30, 6, "#d6e4f0", 200);
      popups.push({ x: ocx, y: o.y - 10, t: 0, text: "BLOCK" });
      continue;
    }
    hurtFoe(o, hit.dmg, f * hit.kb);
  }
  foes = foes.filter((o) => !o.dead);
}

function hurtFoe(o, dmg, push) {
  o.hp -= dmg;
  if (o.hp <= 0) {
    const d = FOES[o.kind];
    o.fling = Math.sign(push) || player.facing;
    killEnemy(o, randInt(d.gold[0], d.gold[1]));
    kills++;
    score += d.pts;
    return;
  }
  const heavy = o.kind === "brute" || o.kind === "boss";
  o.x = Math.max(-10, Math.min(W + 10 - o.w, o.x + push * (heavy ? 0.3 : 1)));
  if (o.kind !== "boss" && o.ai !== "charge") { o.stagger = heavy ? 0.2 : 0.4; o.ai = "walk"; o.timer = 0; o.attack = 0; o.draw = 0; }
  o.flash = 0.12;
  shakeTime = Math.max(shakeTime, 0.08);
  burst(o.x + o.w / 2, o.y + 40, 8, "#ffe14d", 240);
  popups.push({ x: o.x + o.w / 2, y: o.y - 10, t: 0, text: String(dmg) });
  sfx.clang();
}

function actionTick(dt) {
  const spec = player.act;
  player.actT += dt;
  spec.hits.forEach((h, i) => {
    if (!player.fired[i] && player.actT >= spec.hitT[i]) { player.fired[i] = true; dealHit(h); }
  });
  if (spec.invuln) player.inv = Math.max(player.inv, 0.1);
  if (player.lungeV) {   // a short step into the swing that fades quickly
    player.x = Math.max(8, Math.min(W - 8 - player.w, player.x + player.facing * player.lungeV * dt));
    player.lungeV *= Math.pow(0.02, dt);
    if (player.lungeV < 5) player.lungeV = 0;
  }
  if (spec.basic && queued.attack > 0) { player.buffered = true; queued.attack = 0; }
  if (player.actT >= spec.total) {
    player.act = null;
    if (spec.basic) {
      player.combo = (player.combo + 1) % COMBO.length;
      player.comboTimer = 0.5;
      if (player.buffered) queued.attack = 0.2;   // chain straight into the next swing
    }
  }
}

// --- Update ---
function update(dt) {
  for (const k of Object.keys(queued)) queued[k] = Math.max(0, queued[k] - dt);
  player.hurt = Math.max(0, player.hurt - dt);
  player.inv = Math.max(0, player.inv - dt);
  player.stun = Math.max(0, player.stun - dt);
  player.dashCooldown = Math.max(0, player.dashCooldown - dt);
  player.cd = player.cd.map((c) => Math.max(0, c - dt));
  if (!player.act) {
    player.comboTimer = Math.max(0, player.comboTimer - dt);
    if (player.comboTimer === 0) player.combo = 0;
  }

  if (player.act) actionTick(dt);
  const free = !player.act && player.stun <= 0 && player.dash <= 0;
  if (free) {   // skills first (3, then 2, then 1), then the basic attack
    for (const i of [2, 1, 0]) {
      if (queued["s" + (i + 1)] > 0 && player.cd[i] <= 0) {
        queued["s" + (i + 1)] = 0;
        player.cd[i] = SKILLS[i].cd;
        startAction(SKILLS[i]);
        break;
      }
    }
    if (!player.act && queued.attack > 0) { queued.attack = 0; startAction(COMBO[player.combo]); }
  }

  // Walking, or the dash
  const dir = inputDir();
  const walking = !player.act && player.stun <= 0 && player.dash <= 0;
  player.moving = walking && dir !== 0;
  if (player.dash > 0) {
    player.x = Math.max(8, Math.min(W - 8 - player.w, player.x + player.dashDir * (DASH_DIST / DASH_TIME) * dt));
    player.dash = Math.max(0, player.dash - dt);
    ghostTimer -= dt;
    if (ghostTimer <= 0) {   // afterimages trail behind him
      const fr = heroSprite();
      ghosts.push({ sheet: fr.sheet, frame: fr.frame, cx: player.x + player.w / 2, feet: player.y + player.h, facing: player.facing, t: 0 });
      ghostTimer = 0.03;
    }
  } else if (player.moving) {
    player.facing = dir;
    player.x = Math.max(8, Math.min(W - 8 - player.w, player.x + dir * PLAYER_SPEED * dt));
    player.runT += dt;
  }
  for (const g of ghosts) g.t += dt;
  ghosts = ghosts.filter((g) => g.t < 0.25);

  // Jump (a press just before landing still counts), gravity, landing
  if (queued.jump > 0 && player.onGround && walking) {
    player.vy = JUMP_VELOCITY;
    player.onGround = false;
    queued.jump = 0;
    sfx.jump();
  }
  if (player.dash <= 0) {
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;
  }
  if (player.y + player.h >= GROUND_Y) {
    if (!player.onGround) burst(player.x + player.w / 2, GROUND_Y - 2, 6, "#ffb43a", 140);   // touchdown
    player.vy = 0;
    player.onGround = true;
  }
  if (player.onGround) player.y = GROUND_Y - player.h;

  dashBtn.classList.toggle("cooling", player.dashCooldown > 0);
  [sk1Btn, sk2Btn, sk3Btn].forEach((b, i) => b.classList.toggle("cooling", player.cd[i] > 0));
  if (hintTimer > 0) {
    hintTimer -= dt;
    if (hintTimer <= 2) document.body.classList.remove("show-hint");   // then it fades over those last 2 s
  }

  // Waves: enemies come through portals until the wave is used up, then a rest, then the next wave
  if (waveToSpawn > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0 && foes.length + portals.length < Math.min(8, 3 + Math.floor(wave / 2))) {
      openPortal();
      waveToSpawn--;
      spawnTimer = Math.max(0.6, 2.2 - 0.12 * wave) / DIFF_MUL[runDiff];
    }
  } else if (foes.length === 0 && portals.every((p) => p.spawned)) {
    if (waveClearTimer < 0) {
      waveClearTimer = 2.5;
      score += 50;
      player.hp = Math.min(PLAYER_MAX_HP, player.hp + 20);
      bossBanner = { title: `WAVE ${wave} CLEARED`, sub: "+50 SCORE   +20 HP", t: 2.2 };
      sfx.point();
    } else {
      waveClearTimer -= dt;
      if (waveClearTimer <= 0) startWave(wave + 1);
    }
  }
  for (const p of portals) {
    p.t += dt;
    if (!p.spawned && p.t >= 0.5) { p.spawned = true; spawnFoe(p); }
  }
  portals = portals.filter((p) => p.t < 1.4);
  updateFoes(dt);
  updateProjectiles(dt);

  for (const p of popups) { p.t += dt; p.y -= 40 * dt; }
  popups = popups.filter((p) => p.t < (p.life || 0.8));
  for (const p of sparks) {
    p.t += dt;
    p.vy += 900 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  sparks = sparks.filter((p) => p.t < p.life);
  updateCoins(dt);
  corpses = corpses.filter((c) => c.t < 3.5);   // bodies fade away after a few seconds
}

// --- Enemies & gold ---
// "+N" with a coin, in gold, popping slightly bigger as it appears
function drawGoldPopup(p) {
  const pop = 1 + 0.35 * Math.max(0, 1 - p.t / 0.15);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(pop, pop);
  ctx.font = "bold 20px 'Courier New', monospace";
  ctx.textAlign = "left";
  const textW = ctx.measureText(p.text).width;
  const left = -(textW + 18) / 2;
  drawCoin({ x: left + 7, y: -6, spin: 0 });
  ctx.lineWidth = 4;
  ctx.lineJoin = "round";
  ctx.strokeStyle = GOLD_EDGE;
  ctx.fillStyle = GOLD;
  ctx.strokeText(p.text, left + 18, 0);
  ctx.fillText(p.text, left + 18, 0);
  ctx.restore();
}

function killEnemy(o, gold = 1 + Math.floor(Math.random() * 3)) {
  o.dead = true;
  shakeTime = Math.max(shakeTime, o.scale ? 0.25 : 0.1);
  sfx.kill();
  // He topples away from the blow and plays his death animation
  corpses.push({ kind: o.kind, cx: o.x + o.w / 2, feet: o.y + o.h, dir: o.dir, fling: o.fling || 1, t: 0 });
  // Show how much gold he dropped, floating up from where he fell
  dropGold(o.x + o.w / 2, o.y + 20, gold, o.y - 6);
}

function updateCoins(dt) {
  const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
  for (const c of coins) {
    c.spin += dt * 8;
    const dx = cx - c.x, dy = cy - c.y, d = Math.hypot(dx, dy) || 1;
    if (d < 260) {
      // Close coins are pulled in, so jumping over them doesn't miss them
      c.x += (dx / d) * 700 * dt;
      c.y += (dy / d) * 700 * dt;
    } else {
      c.vy += GRAVITY * 0.6 * dt;
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      if (c.y > GROUND_Y - 7) { c.y = GROUND_Y - 7; c.vy *= -0.45; c.vx *= 0.6; }
    }
    if (Math.abs(c.x - cx) < player.w / 2 + 14 && Math.abs(c.y - cy) < player.h / 2 + 14) {
      c.taken = true;
      runGold++;
      totalGold++;
      localStorage.setItem("stickgo-gold", totalGold);
      sfx.coin();
    }
  }
  coins = coins.filter((c) => !c.taken && c.x > -20);
}

function gameOver() {
  state = "over";
  if (score > high(runDiff)) {
    highScores[runDiff] = score;
    localStorage.setItem("stickgo-highs", JSON.stringify(highScores));
  }
  releaseInput();
  document.getElementById("overText").textContent =
    `SCORE ${pad5(score)}   HIGH ${pad5(high(runDiff))} (${DIFFICULTIES[runDiff].label})`;
  document.getElementById("overGold").textContent =
    `WAVE ${wave}   KILLS ${kills}   GOLD +${runGold}   TOTAL ${fmt(totalGold)}`;
  showMenu("over");
}

  cityFar: [38, 42, 52], cityNear: [46, 51, 63], windowLit: [96, 88, 60],

  hero: [236, 236, 244], heroBack: [138, 140, 154]
};

const GOLD = "#f5b921", GOLD_EDGE = "#a8740a";
