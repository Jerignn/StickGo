// --- Helpers for enemies, sparks and gold ---
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

let sparks = [];                // little particles: sparks and blood-red flecks
let bossBanner = null;          // { title, sub, t } shown big for a moment

// Fields getPose() reads, so anything with these can be drawn as a stickman
function person(fields) {
  return { onGround: true, ducking: false, vy: 0, attack: 0, runPhase: Math.random() * 6, ...fields };
}

function burst(x, y, n, color, power = 220) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = power * (0.3 + Math.random() * 0.7);
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, t: 0,
                  life: 0.4 + Math.random() * 0.4, color, r: 1.5 + Math.random() * 1.5 });
  }
}

// Coins burst out and a gold "+N" floats up
function dropGold(x, y, count, popupY = y - 26) {
  popups.push({ x, y: popupY, t: 0, text: "+" + count, gold: true, life: 1.1 });
  for (let i = 0; i < count; i++) {
    coins.push({ x, y, vx: (Math.random() - 0.5) * 340, vy: -300 - Math.random() * 240, spin: Math.random() * 6 });
  }
}

// --- Arena ---
// The hero walks left and right across a fixed stage while waves of enemies walk in from both
// edges. His sword hits whatever is in front of him; enemies wind up (you can see the arm go up)
// and then strike if he's still close, so stepping away dodges.
const PLAYER_SPEED = 230;      // px/s
const PLAYER_MAX_HP = 100;
const HURT_TIME = 0.9;         // s he can't be hurt again after a hit
const REACH = 64;              // how far in front of him the sword reaches
const DIFF_MUL = { easy: 0.8, normal: 1, hard: 1.25 };   // enemy speed and spawn rate
// reach = how close an enemy gets before it swings; pts = score for a kill
const FOES = {
  grunt: { look: null,    scale: 0, w: 26, h: 60, hp: 1, speed: 110, dmg: 10, windup: 0.5,  gold: [1, 3],  pts: 10, reach: 40 },
  ninja: { look: "ninja", scale: 0, w: 26, h: 60, hp: 1, speed: 190, dmg: 12, windup: 0.3,  gold: [2, 4],  pts: 15, reach: 40 },
  brute: { look: "brute", scale: 1.6, w: 42, h: 96, hp: 3, speed: 65, dmg: 25, windup: 0.75, gold: [8, 10], pts: 40, reach: 56 }
};
let foes = [];                 // enemies on the field
let kills = 0;
let waveToSpawn = 0, waveTotal = 0, waveClearTimer = -1;

function inputDir() {
  return (held.right || touchHeld.right ? 1 : 0) - (held.left || touchHeld.left ? 1 : 0);
}

function startWave(n) {
  wave = n;
  waveBanner = 2.2;
  waveToSpawn = waveTotal = Math.min(30, 4 + n * 2);
  spawnTimer = 1.2;
  waveClearTimer = -1;
  sfx.wave();
}

function spawnFoe() {
  const pBrute = wave >= 3 ? Math.min(0.22, 0.05 + 0.03 * wave) : 0;
  const pNinja = wave >= 2 ? Math.min(0.4, 0.1 + 0.05 * wave) : 0;
  const r = Math.random();
  const kind = r < pBrute ? "brute" : r < pBrute + pNinja ? "ninja" : "grunt";
  const d = FOES[kind], fromLeft = Math.random() < 0.5;
  foes.push(person({
    type: kind, kind, look: d.look, scale: d.scale || undefined,
    x: fromLeft ? -d.w - 20 : W + 20, y: GROUND_Y - d.h, w: d.w, h: d.h,
    hp: d.hp, maxHp: d.hp, reach: d.reach, speed: d.speed * DIFF_MUL[runDiff] * (0.9 + Math.random() * 0.2),
    dir: fromLeft ? 1 : -1, ai: "walk", timer: 0, stagger: 0, flash: 0
  }));
}

function updateFoes(dt) {
  const pcx = player.x + player.w / 2;
  for (const o of foes) {
    const ocx = o.x + o.w / 2, dx = pcx - ocx;
    o.stagger = Math.max(0, o.stagger - dt);
    o.flash = Math.max(0, o.flash - dt);
    o.timer += dt;
    if (o.ai === "walk") {
      o.dir = dx >= 0 ? 1 : -1;
      if (o.stagger > 0) continue;
      if (Math.abs(dx) > o.reach) {
        // Don't walk through a mate who is already closer to the hero on the same side
        const blocked = foes.some((p) => p !== o && (p.x + p.w / 2 - pcx) * (ocx - pcx) > 0 &&
          Math.abs(p.x + p.w / 2 - pcx) < Math.abs(dx) && Math.abs(p.x - o.x) < o.w);
        if (!blocked) {
          o.x += o.dir * o.speed * dt;
          o.runPhase += dt * (o.speed + 120) / 24;
        }
      } else {
        o.ai = "windup"; o.timer = 0;
        o.attack = ATTACK_DURATION;   // arm held up, ready to swing
      }
    } else if (o.ai === "windup") {
      if (o.timer >= FOES[o.kind].windup) {
        o.ai = "strike"; o.timer = 0;
        if (Math.abs(dx) < o.reach + 14) hurtPlayer(o);
      }
    } else if (o.ai === "strike") {
      o.attack = Math.max(0, ATTACK_DURATION - o.timer);
      if (o.timer >= ATTACK_DURATION) { o.ai = "recover"; o.timer = 0; o.attack = 0; }
    } else if (o.timer >= 0.5) {
      o.ai = "walk"; o.timer = 0;
    }
  }
}

function hurtPlayer(o) {
  if (player.hurt > 0 || state !== "running") return;
  player.hp -= FOES[o.kind].dmg;
  player.hurt = HURT_TIME;
  shakeTime = Math.max(shakeTime, 0.2);
  sfx.hit();
  player.x = Math.max(8, Math.min(W - 8 - player.w, player.x + o.dir * 26));   // shoved away
  burst(player.x + player.w / 2, player.y + 24, 8, "#ff4a3a", 220);
  if (player.hp <= 0) { player.hp = 0; die(o); }
}

function die(o) {
  state = "dying";
  releaseInput();
  document.body.classList.remove("playing");
  shakeTime = 0.3;
  ragdoll = makeRagdoll(getPose(), (name) => {
    const upper = UPPER_BODY.has(name);
    return [o.dir * (upper ? 260 : 150) + (Math.random() - 0.5) * 60, upper ? -380 : -160];
  });
  ragdoll.clamp = true;  // the player's body stays on screen
}

// The blade lands partway through the swing, on every enemy in front of him (once each)
function swordHits() {
  const pcx = player.x + player.w / 2, f = player.facing;
  for (const o of foes) {
    if (o.dead || o.hitSwing === player.swingId) continue;
    const ahead = (o.x + o.w / 2 - pcx) * f;   // how far in front of him it stands
    if (ahead < -10 || ahead > REACH + o.w / 2) continue;
    o.hitSwing = player.swingId;
    o.hp--;
    if (o.hp <= 0) {
      const d = FOES[o.kind];
      o.fling = f;
      killEnemy(o, randInt(d.gold[0], d.gold[1]));
      kills++;
      score += d.pts;
    } else {
      o.x += f * 34;                 // shoved back, and the strike is interrupted
      o.stagger = 0.45; o.flash = 0.12; o.ai = "walk"; o.timer = 0; o.attack = 0;
      shakeTime = Math.max(shakeTime, 0.1);
      burst(o.x + o.w / 2, o.y + 40, 8, "#ffb04a", 240);
      popups.push({ x: o.x + o.w / 2, y: o.y - 10, t: 0, text: "HIT" });
      sfx.clang();
    }
  }
  foes = foes.filter((o) => !o.dead);
}

// --- Update ---
function update(dt) {
  // Walking: slower while swinging; he turns to face the way he walks
  const dir = inputDir();
  player.moving = dir !== 0;
  if (dir) {
    if (player.attack <= 0) player.facing = dir;
    const sp = PLAYER_SPEED * (player.attack > 0 ? 0.45 : 1);
    player.x = Math.max(8, Math.min(W - 8 - player.w, player.x + dir * sp * dt));
    player.runPhase += dt * 11;
  }
  player.hurt = Math.max(0, player.hurt - dt);
  player.attack = Math.max(0, player.attack - dt);
  player.attackCooldown = Math.max(0, player.attackCooldown - dt);
  if (player.attack > 0 && player.attack < ATTACK_DURATION * 0.7) swordHits();

  // Waves: enemies trickle in until the wave is used up, then a short rest, then the next wave
  if (waveToSpawn > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0 && foes.length < Math.min(8, 3 + Math.floor(wave / 2))) {
      spawnFoe();
      waveToSpawn--;
      spawnTimer = Math.max(0.6, 2.2 - 0.12 * wave) / DIFF_MUL[runDiff];
    }
  } else if (foes.length === 0) {
    if (waveClearTimer < 0) {
      waveClearTimer = 2.5;
      score += 50;
      player.hp = Math.min(PLAYER_MAX_HP, player.hp + 20);
      bossBanner = { title: `WAVE ${wave} CLEARED`, sub: "+50 SCORE   +20 HP", t: 2.2 };
      sfx.point();
    } else {
      waveClearTimer -= dt;
      if (waveClearTimer <= 0) startWave(wave + 1);
    }
  }
  updateFoes(dt);

  for (const p of popups) { p.t += dt; p.y -= 40 * dt; }
  popups = popups.filter((p) => p.t < (p.life || 0.8));
  for (const p of sparks) {
    p.t += dt;
    p.vy += 900 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  sparks = sparks.filter((p) => p.t < p.life);
  updateCoins(dt);
  corpses = corpses.filter((c) => c.time < 4);   // bodies fade away after a few seconds
}

// --- Enemies & gold ---
// "+N" with a coin, in gold, popping slightly bigger as it appears
function drawGoldPopup(p) {
  const pop = 1 + 0.35 * Math.max(0, 1 - p.t / 0.15);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(pop, pop);
  ctx.font = "bold 20px 'Courier New', monospace";
  ctx.textAlign = "left";
  const textW = ctx.measureText(p.text).width;
  const left = -(textW + 18) / 2;
  drawCoin({ x: left + 7, y: -6, spin: 0 });
  ctx.lineWidth = 4;
  ctx.lineJoin = "round";
  ctx.strokeStyle = GOLD_EDGE;
  ctx.fillStyle = GOLD;
  ctx.strokeText(p.text, left + 18, 0);
  ctx.fillText(p.text, left + 18, 0);
  ctx.restore();
}

function killEnemy(o, gold = 1 + Math.floor(Math.random() * 3)) {
  o.dead = true;
  const heavy = o.scale ? 0.6 : 1;   // big ones don't fly as far
  shakeTime = Math.max(shakeTime, o.scale ? 0.25 : 0.1);
  sfx.kill();
  // He's flung away from the sword, upper body first
  const corpse = makeRagdoll(enemyPose(o), (name) => {
    const upper = UPPER_BODY.has(name);
    return [((upper ? 300 : 170) + Math.random() * 80) * heavy * (o.fling || 1), (upper ? -380 : -180) * heavy];
  });
  corpse.look = o.look;     // so a ninja or brute still looks like one when he's down
  corpse.type = o.type;
  corpse.scale = o.scale;
  corpses.push(corpse);
  // Show how much gold he dropped, floating up from where he fell
  dropGold(o.x + o.w / 2, o.y + 20, gold, o.y - 6);
}

function updateCoins(dt) {
  const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
  for (const c of coins) {
    c.spin += dt * 8;
    const dx = cx - c.x, dy = cy - c.y, d = Math.hypot(dx, dy) || 1;
    if (d < 260) {
      // Close coins are pulled in, so jumping over them doesn't miss them
      c.x += (dx / d) * 700 * dt;
      c.y += (dy / d) * 700 * dt;
    } else {
      c.vy += GRAVITY * 0.6 * dt;
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      if (c.y > GROUND_Y - 7) { c.y = GROUND_Y - 7; c.vy *= -0.45; c.vx *= 0.6; }
    }
    if (Math.abs(c.x - cx) < player.w / 2 + 14 && Math.abs(c.y - cy) < player.h / 2 + 14) {
      c.taken = true;
      runGold++;
      totalGold++;
      localStorage.setItem("stickgo-gold", totalGold);
      sfx.coin();
    }
  }
  coins = coins.filter((c) => !c.taken && c.x > -20);
}

function gameOver() {
  state = "over";
  if (score > high(runDiff)) {
    highScores[runDiff] = score;
    localStorage.setItem("stickgo-highs", JSON.stringify(highScores));
  }
  releaseInput();
  document.getElementById("overText").textContent =
    `SCORE ${pad5(score)}   HIGH ${pad5(high(runDiff))} (${DIFFICULTIES[runDiff].label})`;
  document.getElementById("overGold").textContent =
    `WAVE ${wave}   KILLS ${kills}   GOLD +${runGold}   TOTAL ${fmt(totalGold)}`;
  showMenu("over");
}

// --- Ragdoll ---
// On a hit the world freezes and the stickman's joints become free points
// held together by bone-length constraints (Verlet integration).
const RAGDOLL_STEP = 1 / 120;
const RAGDOLL_DURATION = 1.3;  // seconds before the game-over menu appears
const BONES = [
  ["head", "neck"], ["neck", "shoulder"], ["shoulder", "hip"],
  ["shoulder", "elbowF"], ["elbowF", "handF"], ["shoulder", "elbowB"], ["elbowB", "handB"],
  ["hip", "kneeF"], ["kneeF", "footF"], ["hip", "kneeB"], ["kneeB", "footB"]
];
// Extra links that keep the head and torso from folding up unnaturally
const BRACES = [["head", "shoulder"]];
const UPPER_BODY = new Set(["head", "neck", "shoulder", "elbowF", "handF", "elbowB", "handB"]);

let ragdoll = null;
let shakeTime = 0;

// Turns a pose into free points; velocity(name) gives each joint's [vx, vy]
function makeRagdoll(pose, velocity) {
  const points = {};
  for (const [name, pt] of Object.entries(pose)) {
    const [vx, vy] = velocity(name);
    points[name] = {
      x: pt.x, y: pt.y,
      px: pt.x - vx * RAGDOLL_STEP, py: pt.y - vy * RAGDOLL_STEP,
      r: name === "head" ? BODY.headR : 2
    };
  }
  const links = [...BONES, ...BRACES].map(([a, b]) =>
    [points[a], points[b], Math.hypot(points[a].x - points[b].x, points[a].y - points[b].y)]);
  return { points, links, time: 0, acc: 0, clamp: false };
}

function updateRagdoll(rd, dt) {
  rd.time += dt;
  rd.acc += dt;
  while (rd.acc >= RAGDOLL_STEP) {
    ragdollStep(rd);
    rd.acc -= RAGDOLL_STEP;
  }
}

function ragdollStep(rd) {
  const pts = Object.values(rd.points);
  const g = GRAVITY * RAGDOLL_STEP * RAGDOLL_STEP;

  for (const p of pts) {
    const vx = (p.x - p.px) * 0.998;
    const vy = (p.y - p.py) * 0.998;
    p.px = p.x;
    p.py = p.y;
    p.x += vx;
    p.y += vy + g;
  }

  for (let i = 0; i < 8; i++) {
    for (const [a, b, len] of rd.links) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const k = (d - len) / d / 2;
      a.x += dx * k; a.y += dy * k;
      b.x -= dx * k; b.y -= dy * k;
    }
    for (const p of pts) collidePoint(p, rd.clamp);
  }

  // Ground friction so he skids to a stop instead of sliding forever
  for (const p of pts) {
    if (p.y >= GROUND_Y - p.r - 0.5) p.px = p.x - (p.x - p.px) * 0.8;
  }
}

function collidePoint(p, clampToScreen) {
  if (p.y > GROUND_Y - p.r) p.y = GROUND_Y - p.r;
  if (clampToScreen) p.x = Math.max(p.r, Math.min(W - p.r, p.x));
}

// --- Drawing ---
// Day/night cycle: every 1000 points it fades to night around 700 and back by 1000
const DAY = {
  sky: [247, 247, 247], ink: [83, 83, 83], inkBack: [163, 163, 163], cloud: [224, 224, 224],
  cityFar: [233, 234, 238], cityNear: [219, 221, 227], windowLit: [219, 221, 227],
  enemy: [45, 28, 28], enemyBack: [150, 112, 112], blade: [120, 136, 152],
  ninja: [28, 36, 64], ninjaBack: [112, 122, 150], ghost: [120, 150, 205], ghostBack: [170, 190, 225],
  hero: [26, 26, 34], heroBack: [118, 120, 134]
};
const NIGHT = {
  sky: [32, 35, 42], ink: [214, 214, 214], inkBack: [118, 118, 118], cloud: [58, 62, 72],
  cityFar: [38, 42, 52], cityNear: [46, 51, 63], windowLit: [96, 88, 60],
  enemy: [232, 190, 190], enemyBack: [128, 96, 96], blade: [196, 212, 228],
  ninja: [160, 180, 235], ninjaBack: [100, 115, 155], ghost: [190, 220, 255], ghostBack: [120, 150, 190],
  hero: [236, 236, 244], heroBack: [138, 140, 154]
};
const EYE_RED = "#ff2020";
const SHIELD_METAL = "#8b97a3";
const GOLD = "#f5b921", GOLD_EDGE = "#a8740a";
const STARS = Array.from({ length: 24 }, () => ({ x: Math.random() * W, y: 10 + Math.random() * 130 }));
let colors;
let night = 0;

function nightLevel(s) {
  if (settings.comfort) return 1;   // Comfort Mode keeps the screen dark instead of bright white
  const p = s % 1000;
  return Math.max(0, Math.min(1, (p - 650) / 50, (1000 - p) / 50));
}

function paletteAt(t) {
  const out = {};
  for (const key of Object.keys(DAY)) {
    out[key] = `rgb(${DAY[key].map((v, i) => Math.round(v + (NIGHT[key][i] - v) * t)).join(",")})`;
  }
  return out;
}

function updateColors() {
  const t = nightLevel(score);
  if (colors && t === night) return;
  night = t;
  colors = paletteAt(t);
  // The page around the canvas and the on-screen buttons follow along
  document.documentElement.style.setProperty("--sky", colors.sky);
  document.documentElement.style.setProperty("--ink", colors.ink);
}

function line(x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

// --- Stickman pose ---
// Body proportions (game units)
const BODY = { headR: 8, torso: 18, thigh: 12, shin: 12, upperArm: 10, foreArm: 9 };

// Point at the end of a limb. Angle 0 = straight down, positive = forwards (+x).
function limb(from, angle, len) {
  return { x: from.x + Math.sin(angle) * len, y: from.y + Math.cos(angle) * len };
}

// Builds the joint positions for the current frame of a stickman facing right
// (the player by default; enemies pass themselves and get mirrored).
// legs: [thighAngle, kneeBend], arms: [upperArmAngle, elbowBend]; index 0 = front, 1 = back
function getPose(p = player) {
  const ph = p.runPhase;
  let lean, legs, arms, lift = 0;

  if (!p.onGround) {
    // Jump: rising = front knee tucked up, one fist punched skyward, back leg folded;
    // falling = legs stretch down and apart, arms flung out for balance
    const k = (Math.max(-1, Math.min(1, p.vy / 800)) + 1) / 2;  // 0 rising .. 1 falling
    const mix = (a, b) => a + (b - a) * k;
    lean = mix(0.1, 0.2);
    legs = [[mix(1.1, 0.45), mix(1.8, 0.9)], [mix(-0.5, -0.55), mix(1.5, 0.7)]];
    arms = [[mix(2.7, 2.0), mix(0.3, 0.4)], [mix(-1.0, -1.4), mix(1.0, 0.6)]];
  } else if (p.ducking) {
    // Slide: body low and leaning back, front leg stretched out along the ground,
    // back leg folded under, arms thrown out for balance
    const s = Math.sin(ph * 0.5);
    lean = -0.85;
    legs = [[1.4 + 0.05 * s, 0.15], [-0.5, 1.7]];
    arms = [[1.9 + 0.1 * s, 0.4], [-1.6 - 0.1 * s, 0.5]];
  } else if (p === player && state === "countdown") {
    // Walk (READY / SET): upright, short relaxed steps, a gentle bob, arms swinging softly
    lean = 0.08;
    legs = [0, Math.PI].map((off) => {
      const a = ph + off;
      return [0.45 * Math.sin(a), 0.1 + 0.8 * Math.max(0, Math.cos(a - 0.5))];
    });
    arms = [0, Math.PI].map((off) => [-0.45 * Math.sin(ph + off), 0.35]);
    lift = 1.5 * Math.max(0, -Math.cos(ph * 2));
  } else if (p.landT > 0) {
    // Landing: knees and hips absorb the drop
    lean = 0.6;
    legs = [[1.0, 2.0], [0.2, 1.9]];
    arms = [[1.3, 0.8], [-0.6, 0.8]];
  } else if (p.attack > 0) {
    // Lunge: deep front knee, back leg driving, body leaning into the cut
    lean = 0.5;
    legs = [[1.0, 0.9], [-0.7, 0.2]];
    arms = [[0, 0], [0.8, 1.0]];
  } else if (p === player && !p.moving) {
    // Standing: relaxed, knees slightly bent, a slow breath
    lean = 0.1;
    legs = [[0.14, 0.12], [-0.14, 0.12]];
    arms = [[0.3, 0.5], [-0.25, 0.5]];
    lift = 0.8 + 0.8 * Math.sin(performance.now() / 330);
  } else {
    // Run cycle: thighs swing in opposite phase, the knee folds most while
    // the leg is swinging forward, arms swing opposite to the legs
    // (push off -> airborne -> land -> compression, like the reference sheet: a forward
    // lean, a long stride, and the body springing up between footfalls)
    lean = 0.42 + 0.06 * Math.cos(ph * 2);
    legs = [0, Math.PI].map((off) => {
      const a = ph + off;
      return [0.95 * Math.sin(a), 0.25 + 1.5 * Math.max(0, Math.cos(a - 0.6))];
    });
    arms = [0, Math.PI].map((off) => [-1.0 * Math.sin(ph + off) + 0.15, 1.5]);
    lift = 3.5 * Math.max(0, Math.cos(ph * 2 - 0.4));   // airborne moment of each stride
  }
  if (p.attack > 0) {
    // Sword swing: the front arm sweeps from over the head down to the front
    const t = 1 - p.attack / ATTACK_DURATION;
    arms[0] = [SWING_FROM - SWING_ARC * (1 - (1 - t) * (1 - t)), 0.15];
  }

  // Place hips so the lowest foot rests on the bottom of the player box.
  // This makes the body bob naturally as the legs move.
  const legDrop = ([t, bend]) => BODY.thigh * Math.cos(t) + BODY.shin * Math.cos(t - bend);
  const hip = {
    x: p.x + p.w / 2 - 2,
    y: p.y + p.h - Math.max(legDrop(legs[0]), legDrop(legs[1])) - lift
  };
  const neck = limb(hip, Math.PI - lean, BODY.torso);
  const head = limb(neck, Math.PI - lean, BODY.headR + 2);
  const shoulder = limb(neck, -lean, 3);

  const pose = { head, neck, shoulder, hip };
  ["F", "B"].forEach((side, i) => {
    const [thigh, bend] = legs[i];
    pose["knee" + side] = limb(hip, thigh, BODY.thigh);
    pose["foot" + side] = limb(pose["knee" + side], thigh - bend, BODY.shin);
    const [upper, elbow] = arms[i];
    pose["elbow" + side] = limb(shoulder, upper, BODY.upperArm);
    pose["hand" + side] = limb(pose["elbow" + side], upper + elbow, BODY.foreArm);
  });
  return pose;
}

// Archers and bombers hold their arms differently from a runner (drawn facing right here;
// enemyPose mirrors the result)
function shooterArms(pose, o) {
  const s = pose.shoulder;
  if (o.type === "archer") {
    const pull = o.draw || 0;   // 0 = string at rest, 1 = fully drawn
    pose.elbowF = { x: s.x + 9, y: s.y + 2 };
    pose.handF = { x: s.x + 19, y: s.y + 2 };
    pose.elbowB = { x: s.x + 8 - 5 * pull, y: s.y + 5 };
    pose.handB = { x: s.x + 16 - 15 * pull, y: s.y + 2 };
  } else if (o.windup > 0) {
    pose.elbowF = { x: s.x + 2, y: s.y - 10 };
    pose.handF = { x: s.x + 5, y: s.y - 22 };
  } else {
    pose.elbowF = { x: s.x + 6, y: s.y + 8 };
    pose.handF = { x: s.x + 12, y: s.y + 6 };
  }
}

// Enemies run towards the player, so their pose is mirrored to face left.
// Big ones (o.scale) are scaled up from their feet.
function enemyPose(o) {
  const pose = getPose(o);
  if (o.type === "archer" || o.type === "bomber") shooterArms(pose, o);
  const cx = o.x + o.w / 2;
  for (const pt of Object.values(pose)) pt.x = 2 * cx - pt.x;
  if (o.scale) {
    const base = o.y + o.h;
    for (const pt of Object.values(pose)) {
      pt.x = cx + (pt.x - cx) * o.scale;
      pt.y = base + (pt.y - base) * o.scale;
    }
  }
  return pose;
}

function drawFigure(pts, ink = colors.ink, inkBack = colors.inkBack, width = 4, headR = BODY.headR) {
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  const chain = (color, ...names) => {
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[names[0]].x, pts[names[0]].y);
    for (const n of names.slice(1)) ctx.lineTo(pts[n].x, pts[n].y);
    ctx.stroke();
  };

  // Far side first (lighter, for depth) so the near side draws over it
  chain(inkBack, "hip", "kneeB", "footB");
  chain(inkBack, "shoulder", "elbowB", "handB");
  chain(ink, "neck", "shoulder", "hip");
  chain(ink, "hip", "kneeF", "footF");
  chain(ink, "shoulder", "elbowF", "handF");

  ctx.fillStyle = ink;
  ctx.beginPath();
  ctx.arc(pts.head.x, pts.head.y, headR, 0, Math.PI * 2);
  ctx.fill();
}

// Sword angles use the same convention as limb(): 0 = down, PI = straight up
const SWING_FROM = 3.6;   // upper arm angle at the start of a swing (raised behind the head)
const SWING_ARC = 2.9;    // how far it sweeps forwards

function drawSword(pts, swinging) {
  const hand = pts.handF, elbow = pts.elbowF;
  const forearm = Math.atan2(hand.x - elbow.x, hand.y - elbow.y);
  // Held pointing up and forwards while running; in line with the arm mid-swing
  const angle = forearm + (swinging ? 0 : 0.9);
  const skin = equippedSkin();
  const tip = limb(hand, angle, skin.len);

  if (swinging) {
    // Faint arc showing the path of the blade
    const sh = pts.shoulder;
    const r = Math.hypot(tip.x - sh.x, tip.y - sh.y);
    let tipAngle = Math.atan2(tip.x - sh.x, tip.y - sh.y);
    if (tipAngle < 0) tipAngle += Math.PI * 2;  // the swing starts past straight up
    const now = Math.PI / 2 - tipAngle;         // limb() angle -> canvas arc angle
    const from = Math.max(Math.PI / 2 - (SWING_FROM + 0.15), now - 2.1);
    const fx = SLASH_FX[skinState.equipped];
    if (fx) {
      // Rare and legendary swords leave their own slash instead of the plain arc
      ctx.save();
      ctx.globalAlpha = Math.min(1, 4 * player.attack / ATTACK_DURATION);
      fx({ sh, r, from, now, pts, seed: Math.floor(performance.now() / 60), clock: performance.now() / 1000 });
      ctx.restore();
      drawBlade(ctx, hand, angle, skin);
      return;
    }
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = skin.glow || "#7fd4ff";
    ctx.shadowColor = skin.glow || "#7fd4ff";
    ctx.shadowBlur = 10;
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(sh.x, sh.y, r, from, now); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  drawBlade(ctx, hand, angle, skin);
}

// --- Slash effects (rare and legendary swords) ---
// Each one is drawn along the blade's swing: the arc runs from `from` to `now` (canvas angles)
// at radius r around the shoulder `sh`.
function arcPt(s, r, u) { return { x: s.sh.x + Math.cos(u) * r, y: s.sh.y + Math.sin(u) * r }; }

// A crescent along the swing: thin where it began, widest at the blade
function crescent(s, w, color, grow = 1.2, shift = 0) {
  const n = 18, out = [], inn = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n, u = s.from + (s.now - s.from) * f, th = w * Math.pow(f, grow);
    out.push(arcPt(s, s.r + shift + th / 2, u));
    inn.push(arcPt(s, s.r + shift - th / 2, u));
  }
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(out[0].x, out[0].y);
  for (const p of out) ctx.lineTo(p.x, p.y);
  for (let i = n; i >= 0; i--) ctx.lineTo(inn[i].x, inn[i].y);
  ctx.closePath();
  ctx.fill();
}

// Flickering dots scattered along the swing
function specks(s, n, spread, size, color, round = true) {
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const f = rnd(i * 3.1 + s.seed), u = s.from + (s.now - s.from) * f;
    const p = arcPt(s, s.r + (rnd(i * 7.7 + s.seed) - 0.5) * spread * (0.4 + f), u);
    const d = size * (0.4 + rnd(i * 1.9 + s.seed));
    ctx.beginPath();
    if (round) ctx.arc(p.x, p.y, d, 0, Math.PI * 2); else ctx.rect(p.x - d, p.y - d, d * 2, d * 2);
    ctx.fill();
  }
}

function sparkle4(x, y, k, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - k);
  ctx.quadraticCurveTo(x, y, x + k, y); ctx.quadraticCurveTo(x, y, x, y + k);
  ctx.quadraticCurveTo(x, y, x - k, y); ctx.quadraticCurveTo(x, y, x, y - k);
  ctx.fill();
}

// Spikes sticking out of the outer edge of the swing (ice, flames)
function spikes(s, n, len, color, jag = 0.5) {
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const f = 0.25 + 0.75 * i / n, u = s.from + (s.now - s.from) * f;
    const base = arcPt(s, s.r + 5 * f, u), tipP = arcPt(s, s.r + 6 + len * (0.6 + jag * rnd(i * 5.3 + s.seed * 0.3)) * f, u + 0.06);
    const side = arcPt(s, s.r + 5 * f, u + 0.12);
    ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(tipP.x, tipP.y); ctx.lineTo(side.x, side.y); ctx.fill();
  }
}

const SLASH_FX = {
  // --- Rare ---
  crimson(s) {
    crescent(s, 22, "rgba(255, 42, 42, 0.5)");
    crescent(s, 14, "rgba(255, 138, 31, 0.85)");
    crescent(s, 6, "#ffe27a", 1.1);
    spikes(s, 7, 16, "rgba(255, 90, 30, 0.8)", 0.9);
    specks(s, 16, 36, 1.6, "#ffb03a");
  },
  shadow(s) {
    crescent(s, 28, "rgba(20, 10, 38, 0.65)");
    specks(s, 10, 40, 4.5, "rgba(50, 24, 90, 0.55)");
    crescent(s, 12, "rgba(70, 36, 130, 0.8)");
    crescent(s, 3, "#9a6cff", 1.1, 4);
    specks(s, 14, 34, 1.4, "#b48cff");
  },
  aero(s) {
    crescent(s, 10, "rgba(223, 246, 251, 0.75)");
    crescent(s, 4, "#ffffff", 1.1);
    ctx.strokeStyle = "rgba(170, 238, 255, 0.85)";
    ctx.lineWidth = 2;
    for (const [k, a, b] of [[12, 0.3, 0.95], [-9, 0.15, 0.8]]) {   // wind streaks around the cut
      ctx.beginPath();
      ctx.arc(s.sh.x, s.sh.y, s.r + k, s.from + (s.now - s.from) * a, s.from + (s.now - s.from) * b);
      ctx.stroke();
    }
    const c = arcPt(s, s.r + 6, s.from + (s.now - s.from) * 0.25);   // a little whirl at the tail
    ctx.beginPath(); ctx.arc(c.x, c.y, 5 + 2 * Math.sin(s.clock * 20), 0, Math.PI * 1.6); ctx.stroke();
  },
  frostbite(s) {
    crescent(s, 18, "rgba(150, 215, 255, 0.55)");
    crescent(s, 7, "rgba(245, 253, 255, 0.95)", 1.1);
    spikes(s, 8, 20, "rgba(210, 240, 255, 0.9)");
    specks(s, 12, 36, 1.3, "#ffffff");
    const p = arcPt(s, s.r + 8, s.now - 0.1);
    sparkle4(p.x, p.y, 5, "#ffffff");
  },
  // --- Legendary ---
  dragon(s) {
    crescent(s, 26, "rgba(255, 100, 0, 0.5)");
    crescent(s, 17, "rgba(255, 168, 30, 0.85)");
    crescent(s, 7, "#fff0a0", 1.1);
    spikes(s, 9, 22, "rgba(255, 130, 20, 0.85)", 1);
    specks(s, 18, 40, 1.8, "#ffd36a");
    // The dragon's head leading the cut
    const p = arcPt(s, s.r + 2, s.now), dir = s.now + Math.PI / 2;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(dir);
    ctx.fillStyle = "#ffb02e";
    ctx.beginPath(); ctx.moveTo(-4, -6); ctx.lineTo(10, -3); ctx.lineTo(16, 1); ctx.lineTo(10, 4); ctx.lineTo(-4, 6); ctx.fill();
    ctx.fillStyle = "#ff5a1f";
    ctx.beginPath(); ctx.moveTo(-2, -5); ctx.lineTo(-10, -12); ctx.lineTo(4, -6); ctx.fill();
    ctx.fillStyle = "#2a0803";
    ctx.beginPath(); ctx.arc(5, -1, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  },
  laser(s) {
    crescent(s, 16, "rgba(39, 215, 255, 0.4)");
    crescent(s, 7, "rgba(127, 244, 255, 0.85)", 1.1);
    crescent(s, 2.5, "#ffffff", 1.1);
    specks(s, 18, 40, 1.5, "#27d7ff", false);   // pixel debris
    specks(s, 8, 44, 1.5, "#ff4fd8", false);
    ctx.fillStyle = "rgba(127, 244, 255, 0.7)";   // glitch bars
    for (let i = 0; i < 3; i++) {
      const p = arcPt(s, s.r + 6 + rnd(i + s.seed) * 14, s.from + (s.now - s.from) * (0.4 + 0.2 * i));
      ctx.fillRect(p.x - 7, p.y, 14, 1.5);
    }
  },
  voidbringer(s) {
    crescent(s, 28, "rgba(25, 6, 50, 0.75)");
    crescent(s, 18, "rgba(106, 47, 214, 0.6)");
    crescent(s, 5, "rgba(210, 160, 255, 0.9)", 1.1);
    specks(s, 14, 40, 1.8, "#ff7ad9");   // nebula
    specks(s, 20, 44, 0.9, "#ffffff");   // stars
  },
  sun(s) {
    // Wings behind the hero
    const n = s.pts.neck, flap = Math.sin(s.clock * 18) * 0.12;
    ctx.fillStyle = "rgba(255, 249, 220, 0.9)";
    ctx.strokeStyle = "rgba(224, 168, 42, 0.9)";
    ctx.lineWidth = 1;
    for (let k = 0; k < 6; k++) {
      const a = -2.55 + k * 0.2 + flap, len = 40 - k * 3;
      ctx.beginPath();
      ctx.ellipse(n.x + Math.cos(a) * len / 2, n.y + Math.sin(a) * len / 2 - 4, len / 2, 4.5, a, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
    crescent(s, 20, "rgba(255, 211, 77, 0.55)");
    crescent(s, 9, "rgba(255, 244, 170, 0.95)", 1.1);
    crescent(s, 3, "#ffffff", 1.1);
    for (let i = 0; i < 4; i++) {
      const p = arcPt(s, s.r + 6 + rnd(i * 2 + s.seed) * 18, s.from + (s.now - s.from) * (0.3 + 0.2 * i));
      sparkle4(p.x, p.y, 3 + rnd(i + s.seed) * 3, "#fffbe0");
    }
  }
};

// --- Sword drawing ---
// Blade outlines. Each returns how far the top and bottom edges stick out (1 = half the
// skin's width) at t along the blade: 0 at the guard, 1 at the tip.
const table = (pts) => (t) => {
  for (let i = 1; i < pts.length; i++) {
    if (t <= pts[i][0]) {
      const [t0, a0, b0] = pts[i - 1], [t1, a1, b1] = pts[i];
      const f = (t - t0) / (t1 - t0 || 1);
      return [a0 + (a1 - a0) * f, b0 + (b1 - b0) * f];
    }
  }
  const last = pts[pts.length - 1];
  return [last[1], last[2]];
};
const PROFILES = {
  blade:    table([[0, 1, 1], [0.8, 1, 1], [1, 0, 0]]),
  bokken:   table([[0, 0.9, 0.9], [0.94, 1, 1], [1, 0, 0]]),
  saber:    table([[0, 1, 1], [0.7, 1, 1], [1, 0, 0]]),
  cleaver:  table([[0, 0.55, 0.55], [0.1, 1, 1], [0.94, 1, 0.92], [1, 0.9, 0.15]]),
  machete:  table([[0, 0.5, 0.5], [0.25, 0.6, 0.6], [0.8, 1, 1], [0.93, 1, 0.9], [1, 0, 0]]),
  broad:    table([[0, 0.6, 0.6], [0.1, 1, 1], [0.85, 1, 1], [1, 0, 0]]),
  shard:    table([[0, 0.5, 0.5], [0.12, 1, 0.7], [0.3, 0.75, 1], [0.5, 1, 0.8],
                   [0.7, 0.7, 0.95], [0.88, 0.55, 0.4], [1, 0, 0]]),
  ice:      table([[0, 0.6, 0.6], [0.1, 1, 0.9], [0.28, 0.7, 1], [0.45, 1, 0.75],
                   [0.62, 0.7, 0.95], [0.8, 0.8, 0.5], [1, 0, 0]]),
  laser:    table([[0, 1, 1], [0.96, 1, 1], [1, 0.3, 0.3]]),
  // Saw teeth along the top edge
  serrated: (t) => {
    const k = Math.min(1, (1 - t) / 0.12), f = (t * 6) % 1;
    return [k * (0.8 + 0.5 * f), k * 0.8];
  },
  // Wavy, like a flame
  flame: (t) => {
    const k = Math.min(1, (1 - t) / 0.15);
    return [k * (0.8 + 0.25 * Math.sin(t * 14)), k * (0.8 + 0.25 * Math.sin(t * 14 + 2))];
  }
};
const SWORD_START = 4;  // the blade starts this far from the hand, where the guard sits

function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// Animated effects around the blade. at(t, v) = a point t along the blade, v to the side.
function swordFx(g, skin, clock, at, w) {
  g.save();
  g.strokeStyle = g.fillStyle = skin.fxColor || "#ffffff";
  switch (skin.fx) {
    case "electric": {
      const seed = Math.floor(clock * 8);
      g.lineWidth = 0.5;
      for (let k = 0; k < 2; k++) {
        g.beginPath();
        for (let i = 0; i <= 10; i++) {
          const p = at(0.06 + 0.9 * i / 10, (rnd(seed * 7 + i + k * 31) - 0.5) * w * 1.7);
          i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y);
        }
        g.stroke();
      }
      break;
    }
    case "flame":
      for (let i = 0; i < 7; i++) {
        const t = 0.1 + 0.8 * i / 6;
        const h = 0.5 + 0.5 * Math.sin(clock * 9 + i * 2.1);
        const l = at(t - 0.03, w * 0.3), r = at(t + 0.05, w * 0.3);
        const apex = at(t + 0.035, w * 0.5 + 1.4 + 2.4 * h);
        g.globalAlpha = 0.85;
        g.beginPath(); g.moveTo(l.x, l.y); g.lineTo(apex.x, apex.y); g.lineTo(r.x, r.y); g.fill();
      }
      for (let i = 0; i < 4; i++) {   // embers drifting up
        const f = (clock * 0.9 + i * 0.27) % 1;
        const p = at(0.2 + 0.2 * i, w * 0.5 + 3 + 6 * f);
        g.globalAlpha = 1 - f;
        g.beginPath(); g.arc(p.x, p.y, 0.5, 0, Math.PI * 2); g.fill();
      }
      break;
    case "slime":
      g.lineWidth = 0.9;
      for (let i = 0; i < 3; i++) {
        const drop = 1.2 + 0.8 * (0.5 + 0.5 * Math.sin(clock * 2 + i * 2));
        const a = at(0.3 + 0.25 * i, -w * 0.45), b = at(0.3 + 0.25 * i, -w * 0.45 - drop);
        g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
        g.beginPath(); g.arc(b.x, b.y, 0.9, 0, Math.PI * 2); g.fill();
      }
      break;
    case "wisps":
      g.lineWidth = 0.45;
      g.globalAlpha = 0.6;
      for (let k = 0; k < 3; k++) {
        g.beginPath();
        for (let i = 0; i <= 14; i++) {
          const t = 0.05 + 0.95 * i / 14;
          const p = at(t, (k - 1) * w * 0.9 + 1.3 * Math.sin(t * 9 - clock * 7 + k * 2.1));
          i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y);
        }
        g.stroke();
      }
      break;
    case "sparkle":
      g.lineWidth = 0.4;
      for (let i = 0; i < 5; i++) {
        const s = Math.max(0, Math.sin(clock * 4 + i * 1.9)) * 1.5;
        if (s < 0.1) continue;
        const side = rnd(i + 9) > 0.5 ? 1 : -1;
        const p = at(0.15 + 0.8 * rnd(i + 3), side * (w * 0.4 + 1.2));
        g.beginPath();
        g.moveTo(p.x - s, p.y); g.lineTo(p.x + s, p.y);
        g.moveTo(p.x, p.y - s); g.lineTo(p.x, p.y + s);
        g.stroke();
      }
      break;
    case "void":
      for (let i = 0; i < 6; i++) {
        const p = at(((i / 6) + clock * 0.2) % 1, Math.sin(clock * 3 + i * 1.3) * w * 0.7);
        g.globalAlpha = 0.5 + 0.5 * Math.sin(clock * 4 + i);
        g.beginPath(); g.arc(p.x, p.y, 0.6, 0, Math.PI * 2); g.fill();
      }
      break;
    case "rust":
      g.globalAlpha = 0.8;
      for (const [t, v, r] of [[0.3, 0.2, 0.9], [0.55, -0.4, 0.7], [0.75, 0.3, 0.6]]) {
        const p = at(t, v);
        g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.fill();
      }
      break;
    case "laser": {
      g.globalAlpha = 0.9 + 0.1 * Math.sin(clock * 6);
      g.strokeStyle = "#ffffff";
      g.lineWidth = skin.width * 0.38;
      const a = at(0.02, 0), b = at(0.97, 0);
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
      break;
    }
  }
  g.restore();
}

// Draws a sword skin held at `hand`, pointing along `angle` (limb() convention).
// Also used by the shop previews, which pass their own canvas context.
function drawBlade(g, hand, angle, skin, clock = performance.now() / 1000) {
  const S = SWORD_START, L = skin.len - S, w = skin.width;
  const profile = PROFILES[skin.shape || "blade"];
  const bend = (skin.curve || 0) * skin.len;
  // Point on the blade: t runs from the guard (0) to the tip (1), v is the offset to the side
  const at = (t, v = 0) => ({ x: S + L * t, y: 2 * t * (1 - t) * bend + v });

  const N = 28, top = [], bot = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, [a, b] = profile(t);
    top.push(at(t, a * w / 2));
    bot.push(at(t, -b * w / 2));
  }
  const outline = () => {
    g.beginPath();
    top.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)));
    for (let i = N; i >= 0; i--) g.lineTo(bot[i].x, bot[i].y);
    g.closePath();
  };

  g.save();
  g.translate(hand.x, hand.y);
  // From here x runs along the blade and y across it
  g.transform(Math.sin(angle), Math.cos(angle), Math.cos(angle), -Math.sin(angle), 0, 0);
  g.lineCap = "round";
  g.lineJoin = "round";

  if (skin.glow) {
    const pulse = 0.8 + 0.2 * Math.sin(clock * 5);
    g.strokeStyle = skin.glow;
    outline();
    g.globalAlpha = 0.18 * pulse; g.lineWidth = 4.5; g.stroke();
    g.globalAlpha = 0.3 * pulse; g.lineWidth = 2.2; g.stroke();
    g.globalAlpha = 1;
  }

  let fill = skin.blade || colors.blade;
  if (skin.tip) {
    const grad = g.createLinearGradient(S, 0, S + L, 0);
    grad.addColorStop(0, fill);
    grad.addColorStop(1, skin.tip);
    fill = grad;
  }
  g.fillStyle = fill;
  outline();
  g.fill();
  if (skin.edge) { g.strokeStyle = skin.edge; g.lineWidth = 0.7; g.stroke(); }

  if (skin.hi) {   // light ridge down the middle
    g.strokeStyle = skin.hi;
    g.globalAlpha = 0.75;
    g.lineWidth = Math.max(0.5, w * 0.16);
    g.beginPath();
    for (let i = 0; i <= 8; i++) {
      const p = at(0.1 + 0.72 * i / 8);
      i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y);
    }
    g.stroke();
    g.globalAlpha = 1;
  }

  if (skin.fx) swordFx(g, skin, clock, at, w);

  g.strokeStyle = skin.guard || colors.ink;
  if (skin.hilt) {
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(-3, 0); g.lineTo(S + 1, 0); g.stroke();
  }
  g.beginPath();
  if (skin.wing) {
    g.lineWidth = 1.8;
    for (const s of [1, -1]) { g.moveTo(S, 0); g.quadraticCurveTo(S - 1, s * 4, S + 3, s * 7.5); }
  } else {
    g.lineWidth = 3;
    g.moveTo(S, -5); g.lineTo(S, 5);
  }
  g.stroke();
  if (skin.gem) {
    g.fillStyle = skin.gem;
    g.beginPath(); g.arc(S, 0, 1.2, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}

// Shop card picture: the sword lying almost flat, with a short handle
function drawSwordPreview(canvas, skin) {
  const g = canvas.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, canvas.width, canvas.height);
  const scale = canvas.width / 44;  // 44 game units across, ~17 down
  g.setTransform(scale, 0, 0, scale, 0, 0);
  const angle = 1.64;  // pointing right, a touch upwards
  const hand = { x: 7, y: 9 };
  g.lineCap = "round";
  g.strokeStyle = skin.guard || "#8a8a8a";
  g.lineWidth = 3;
  const butt = limb(hand, angle, -3);
  g.beginPath(); g.moveTo(butt.x, butt.y); g.lineTo(hand.x, hand.y); g.stroke();
  drawBlade(g, hand, angle, skin.blade ? skin : { ...skin, blade: "#9fb0c2", guard: "#cfcfcf" });
}

// The hero: a dark body with a blue rim light, shoes, hands, a red scarf streaming behind
// him and glowing eyes. When he's down the scarf goes limp and his eyes turn to Xs.
const HERO_HEAD = 9.5;   // the hero's head is bigger than the others', like the art
function drawHero(pts, down = !!ragdoll) {
  const t = performance.now() / 1000;
  const h = pts.head;

  // Rim light (the aura): the same figure, wider and faint, drawn underneath
  if (look.equipped.aura !== "none") {
    const aura = auraColors();
    drawFigure(pts, aura.front, aura.back, 8.2, HERO_HEAD + 2.2);
  }
  drawFigure(pts, colors.hero, colors.heroBack, 4.6, HERO_HEAD);

  // Shoes and hands
  ctx.lineCap = "round";
  // No shoes: the legs just end in a rounded tip
  for (const [hand, color] of [[pts.handB, colors.heroBack], [pts.handF, colors.hero]]) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(hand.x, hand.y, 2.7, 0, Math.PI * 2); ctx.fill();
  }

  // Scarf: two tails that flutter harder (and longer) the faster the game goes
  const knot = { x: pts.neck.x - 1, y: pts.neck.y + 1 };
  const len = 18 + (speed || 400) * 0.014;
  const scarf = scarfColors();
  for (const [l, dy, color, ph] of look.equipped.scarf === "none" ? [] : [[len * 1.3, 3, scarf.b, 1.3], [len, 0, scarf.a, 0]]) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(knot.x, knot.y);
    if (down) {
      ctx.quadraticCurveTo(knot.x - 4, knot.y + 5, knot.x - 5 + dy, knot.y + 14);
    } else {
      const w = Math.sin(t * 13 + ph) * 3;
      ctx.quadraticCurveTo(knot.x - l * 0.55, knot.y + dy + w, knot.x - l, knot.y + dy + 2 + Math.sin(t * 13 + ph + 1.5) * 3.5);
    }
    ctx.stroke();
  }
  if (look.equipped.scarf !== "none") {
    ctx.fillStyle = scarf.a;
    ctx.beginPath(); ctx.arc(knot.x, knot.y, 3, 0, Math.PI * 2); ctx.fill();
  }

  // Face: narrowed glowing eyes under a determined brow (he faces right)
  ctx.strokeStyle = colors.sky;
  ctx.fillStyle = colors.sky;
  if (down) {
    ctx.lineWidth = 1.2;
    for (const ex of [0.6, 4.2]) {
      line(h.x + ex - 1.5, h.y - 2.4, h.x + ex + 1.5, h.y + 0.6);
      line(h.x + ex + 1.5, h.y - 2.4, h.x + ex - 1.5, h.y + 0.6);
    }
  } else {
    ctx.shadowColor = "#9fd4ff";
    ctx.shadowBlur = 7;
    ctx.fillStyle = "#ffffff";   // big glowing white eyes, slanted into an angry brow
    for (const [ex, tilt] of [[0.9, -0.5], [5.2, 0.5]]) {
      ctx.beginPath(); ctx.ellipse(h.x + ex, h.y - 0.8, 2.1, 2.9, tilt, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  drawHat(look.equipped.hat, h, pts.neck);
}

function drawStickman() {
  const pts = ragdoll ? ragdoll.points : getPose();
  ctx.save();
  if (!ragdoll) {
    // He's drawn facing right; turn him around when he faces left
    if (player.facing < 0) {
      ctx.translate(pts.hip.x, 0);
      ctx.scale(-1, 1);
      ctx.translate(-pts.hip.x, 0);
    }
    if (player.hurt > 0 && Math.floor(player.hurt * 16) % 2) ctx.globalAlpha = 0.4;   // blinks after a hit
  }
  drawHero(pts);
  drawSword(pts, !ragdoll && player.attack > 0);
  ctx.restore();
}


// The bow an archer holds out in front of him (he faces left); the string pulls back as he aims
function drawBow(pts, o) {
  const hand = pts.handF, pull = o.draw || 0;
  const cx = hand.x + 17, r = 17, a = Math.PI - 1.0;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#8a5a24";
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(cx, hand.y, r, a, Math.PI + 1.0); ctx.stroke();
  const ends = [{ x: cx + r * Math.cos(a), y: hand.y + r * Math.sin(a) },
                { x: cx + r * Math.cos(a), y: hand.y - r * Math.sin(a) }];
  ctx.strokeStyle = colors.ink;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ends[0].x, ends[0].y);
  if (pull > 0.05) ctx.lineTo(pts.handB.x, pts.handB.y);
  ctx.lineTo(ends[1].x, ends[1].y);
  ctx.stroke();
  if (pull > 0.05) {   // the arrow, nocked and ready
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(pts.handB.x, pts.handB.y); ctx.lineTo(hand.x - 14, hand.y); ctx.stroke();
    ctx.fillStyle = colors.ink;
    ctx.beginPath();
    ctx.moveTo(hand.x - 19, hand.y); ctx.lineTo(hand.x - 12, hand.y - 3); ctx.lineTo(hand.x - 12, hand.y + 3);
    ctx.fill();
  }
}

function drawEnemy(pts, alive, shield, o = {}) {
  const look = o.look, k = o.scale || 1;
  const t = performance.now() / 1000;
  let ink = colors.enemy, inkBack = colors.enemyBack;
  if (look === "ninja") { ink = colors.ninja; inkBack = colors.ninjaBack; }
  else if (look === "phantom") { ink = colors.ghost; inkBack = colors.ghostBack; }
  if (o.flash > 0) ink = "#ff6a6a";   // a boss that's just been hit
  drawFigure(pts, ink, inkBack, 4 * (1 + (k - 1) * 0.6), BODY.headR * k);

  if (shield) {
    // Round shield held out in front (he faces left), seen side-on
    const sx = pts.hip.x - 11, sy = pts.shoulder.y + 13;
    ctx.fillStyle = SHIELD_METAL;
    ctx.strokeStyle = colors.enemy;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(sx, sy, 5, 15, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = colors.enemy;
    ctx.beginPath(); ctx.arc(sx - 1, sy, 2, 0, Math.PI * 2); ctx.fill();
  }

  const h = pts.head, f = (v) => v * k;
  if (look === "brute") {   // a spiked club in his fist
    const hd = pts.handF;
    ctx.strokeStyle = "#6a4a28";
    ctx.lineWidth = 3.5 * k * 0.7;
    line(hd.x, hd.y, hd.x - f(7), hd.y - f(19));
    ctx.fillStyle = "#6a4a28";
    ctx.beginPath(); ctx.arc(hd.x - f(8), hd.y - f(21), f(4.2), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = SHIELD_METAL;
    for (const [dx, dy] of [[-4, -5], [4, -5], [0, -8]]) {
      ctx.beginPath(); ctx.arc(hd.x - f(8) + f(dx), hd.y - f(21) + f(dy), f(1.3), 0, Math.PI * 2); ctx.fill();
    }
  }
  if (o.type === "boss") {   // horns
    ctx.fillStyle = "#e8e0c8";
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(h.x + s * f(4), h.y - f(6));
      ctx.lineTo(h.x + s * f(11), h.y - f(15));
      ctx.lineTo(h.x + s * f(9), h.y - f(3));
      ctx.fill();
    }
  }
  if (look === "archer") {
    drawBow(pts, o);
    ctx.fillStyle = "#3f7d3a";   // a feathered cap
    ctx.beginPath(); ctx.moveTo(h.x - 8, h.y - 4); ctx.lineTo(h.x + 4, h.y - 17); ctx.lineTo(h.x + 8, h.y - 3); ctx.fill();
  }
  if (look === "bomber") {
    ctx.strokeStyle = "#b8862b";   // bandolier
    ctx.lineWidth = 2;
    line(pts.shoulder.x - 4, pts.shoulder.y + 1, pts.hip.x + 4, pts.hip.y - 3);
    if (o.holding) {
      const b = { x: pts.handF.x - 2, y: pts.handF.y - 7 };
      ctx.fillStyle = "#222";
      ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#888"; ctx.lineWidth = 1.2;
      line(b.x + 2, b.y - 5, b.x + 5, b.y - 10);
      ctx.fillStyle = "#ffb02e"; ctx.beginPath(); ctx.arc(b.x + 5, b.y - 10, 1.8, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (look === "ninja") {   // red headband with fluttering tails
    ctx.strokeStyle = "#e02020";
    ctx.lineWidth = 2.4;
    line(h.x - 8, h.y - 2.5, h.x + 8, h.y - 2.5);
    ctx.lineWidth = 1.8;
    for (const s of [0, 1]) {
      ctx.beginPath();
      ctx.moveTo(h.x + 7, h.y - 2.5);
      ctx.quadraticCurveTo(h.x + 15, h.y - 5 + s * 5 + Math.sin(t * 14 + s * 2) * 3, h.x + 24, h.y - 2 + s * 7 + Math.sin(t * 14 + s) * 4);
      ctx.stroke();
    }
  }

  const eye = look === "phantom" ? "#7fe9ff" : EYE_RED;
  const face = look === "phantom" ? "#1a2440" : colors.sky;
  // Angry brows slanting down towards the middle, over glowing eyes
  // (he faces left, so the face is on the left of the head)
  ctx.strokeStyle = face;
  ctx.lineWidth = 1.6 + (k - 1);
  line(h.x - f(7.5), h.y - f(5.5), h.x - f(3.5), h.y - f(2.8));
  line(h.x + f(2), h.y - f(5.5), h.x - f(1.5), h.y - f(2.8));
  ctx.fillStyle = eye;
  if (alive) { ctx.shadowColor = eye; ctx.shadowBlur = 6; }
  ctx.beginPath(); ctx.arc(h.x - f(4.8), h.y - f(0.8), f(1.8), 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(h.x - f(0.2), h.y - f(0.8), f(1.8), 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // Snarl
  ctx.strokeStyle = face;
  ctx.lineWidth = 1.2 + (k - 1) * 0.6;
  line(h.x - f(5), h.y + f(4), h.x - f(1.5), h.y + f(3.2));
}

// Enemies are drawn facing left; the ones on his left are flipped to face right
function drawFoe(o) {
  const pts = enemyPose(o);
  ctx.save();
  if (o.dir === 1) {
    const cx = o.x + o.w / 2;
    ctx.translate(cx, 0);
    ctx.scale(-1, 1);
    ctx.translate(-cx, 0);
  }
  drawEnemy(pts, true, false, o);
  ctx.restore();
  if (o.maxHp > 1 && o.hp < o.maxHp) {   // brutes show how much they have left
    const cx = o.x + o.w / 2;
    ctx.fillStyle = colors.inkBack;
    ctx.fillRect(cx - 18, o.y - 10, 36, 4);
    ctx.fillStyle = EYE_RED;
    ctx.fillRect(cx - 18, o.y - 10, 36 * o.hp / o.maxHp, 4);
  }
}

function drawCoin(c) {
  // Spinning: the coin's width follows the spin
  const w = Math.max(1.2, Math.abs(Math.cos(c.spin)) * 6);
  ctx.fillStyle = GOLD;
  ctx.strokeStyle = GOLD_EDGE;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(c.x, c.y, w, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}

// Distant skyline: two layers of building silhouettes scrolling slower than the ground.
// Each layer is a repeating strip of buildings; windows light up as night falls.
const CITY_TILE = 1100;
function makeCityLayer(minW, maxW, minH, maxH) {
  const buildings = [];
  for (let x = 0; x < CITY_TILE;) {
    const w = Math.min(minW + Math.random() * (maxW - minW), CITY_TILE - x);
    buildings.push({ x, w, h: minH + Math.random() * (maxH - minH), seed: Math.random() });
    x += w + 2;
  }
  return buildings;
}
const CITY_FAR = { speed: 0.04, items: makeCityLayer(30, 60, 50, 110), fill: "cityFar", windows: false };
const CITY_NEAR = { speed: 0.1, items: makeCityLayer(40, 80, 40, 95), fill: "cityNear", windows: true };

function drawCityLayer(layer) {
  const shift = ((distance || 0) * layer.speed) % CITY_TILE;
  ctx.fillStyle = colors[layer.fill];
  for (let tile = -1; tile <= Math.ceil(W / CITY_TILE); tile++) {
    const ox = tile * CITY_TILE - shift;
    for (const b of layer.items) {
      const x = ox + b.x;
      if (x > W || x + b.w < 0) continue;
      ctx.fillRect(x, GROUND_Y - b.h, b.w, b.h);
    }
  }
  if (!layer.windows || night <= 0) return;
  ctx.globalAlpha = night;
  ctx.fillStyle = colors.windowLit;
  for (let tile = -1; tile <= Math.ceil(W / CITY_TILE); tile++) {
    const ox = tile * CITY_TILE - shift;
    for (const b of layer.items) {
      const x = ox + b.x;
      if (x > W || x + b.w < 0) continue;
      let n = 0;
      for (let wy = GROUND_Y - b.h + 8; wy < GROUND_Y - 10; wy += 14) {
        for (let wx = x + 6; wx < x + b.w - 8; wx += 12, n++) {
          if (((b.seed * 997 + n * 7919) % 5) < 2) ctx.fillRect(wx, wy, 4, 6);
        }
      }
    }
  }
  ctx.globalAlpha = 1;
}

function drawCloud(c) {
  ctx.fillStyle = colors.cloud;
  ctx.beginPath();
  ctx.arc(c.x, c.y, 12, 0, Math.PI * 2);
  ctx.arc(c.x + 16, c.y - 6, 16, 0, Math.PI * 2);
  ctx.arc(c.x + 34, c.y, 12, 0, Math.PI * 2);
  ctx.fill();
}

function pad5(n) { return String(n).padStart(5, "0"); }

function draw() {
  updateColors();
  ctx.fillStyle = colors.sky;
  ctx.fillRect(0, 0, W, H);

  // Moon and stars fade in at night
  if (night > 0) {
    ctx.globalAlpha = night;
    ctx.fillStyle = colors.ink;
    for (const s of STARS) ctx.fillRect(s.x, s.y, 2, 2);
    ctx.beginPath(); ctx.arc(W * 0.72, 55, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = colors.sky;
    ctx.beginPath(); ctx.arc(W * 0.72 + 7, 50, 12, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.save();
  if (shakeTime > 0) {
    const m = shakeTime * 16 * (settings.comfort ? 0 : 0.6);
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  drawCityLayer(CITY_FAR);
  drawCityLayer(CITY_NEAR);
  clouds.forEach(drawCloud);

  // Ground
  ctx.strokeStyle = colors.ink;
  ctx.lineWidth = 2;
  line(0, GROUND_Y, W, GROUND_Y);
  ctx.fillStyle = colors.ink;
  // Comfort Mode draws fewer, fainter ground specks: they're a busy pattern at high speed
  if (settings.comfort) ctx.fillStyle = colors.inkBack;
  const specks = settings.comfort ? 14 : groundBits.length;
  for (let i = 0; i < specks; i++) ctx.fillRect(groundBits[i].x, groundBits[i].y, groundBits[i].w, 2);

  for (const c of corpses) drawEnemy(c.points, false, false, c);
  for (const o of foes) drawFoe(o);
  coins.forEach(drawCoin);
  for (const p of sparks) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;
  drawStickman();
  ctx.fillStyle = colors.ink;
  ctx.font = "bold 16px 'Courier New', monospace";
  ctx.textAlign = "center";
  for (const p of popups) {
    const life = p.life || 0.8;
    ctx.globalAlpha = Math.min(1, (life - p.t) / 0.3);
    if (p.gold) drawGoldPopup(p);
    else {
      ctx.fillStyle = colors.ink;
      ctx.font = "bold 16px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText(p.text, p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Gold collected this run, under the score
  drawCoin({ x: W - 100, y: 56, spin: 0 });
  ctx.fillStyle = colors.ink;
  ctx.font = "bold 18px 'Courier New', monospace";
  ctx.textAlign = "right";
  ctx.fillText(`x ${String(runGold).padStart(3, "0")}`, W - 20, 62);

  // Current wave, plus a big banner for a moment when a new one starts
  ctx.textAlign = "center";
  ctx.font = "bold 18px 'Courier New', monospace";
  ctx.fillText(`WAVE ${wave}`, W / 2, 36);
  if (waveBanner > 0) {
    ctx.globalAlpha = Math.min(1, waveBanner / 0.5);
    ctx.font = "bold 40px 'Courier New', monospace";
    ctx.fillText(`WAVE ${wave}`, W / 2, 115);
    ctx.font = "bold 16px 'Courier New', monospace";
    ctx.fillText(`${waveTotal} ENEMIES`, W / 2, 140);
    ctx.globalAlpha = 1;
  }

  // His health, top left (next to the pause button)
  ctx.fillStyle = colors.inkBack;
  ctx.fillRect(84, 22, 190, 14);
  ctx.fillStyle = player.hp > 30 ? "#3fbf5a" : "#e02020";
  ctx.fillRect(84, 22, 190 * player.hp / PLAYER_MAX_HP, 14);
  ctx.strokeStyle = colors.ink;
  ctx.lineWidth = 2;
  ctx.strokeRect(84, 22, 190, 14);
  ctx.fillStyle = colors.ink;
  ctx.font = "bold 12px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.fillText(`KILLS ${kills}`, 84, 52);

  if (bossBanner) {
    ctx.globalAlpha = Math.min(1, bossBanner.t / 0.5);
    ctx.fillStyle = colors.ink;
    ctx.textAlign = "center";
    ctx.font = "bold 34px 'Courier New', monospace";
    ctx.fillText(bossBanner.title, W / 2, 175);
    ctx.font = "bold 16px 'Courier New', monospace";
    ctx.fillText(bossBanner.sub, W / 2, 198);
    ctx.globalAlpha = 1;
  }

  // READY - SET - FIGHT!: each word pops in big
  if (state === "countdown") {
    const stage = countdownStage;
    const age = countdown % COUNTDOWN_STEP;
    const pop = 1 + 0.5 * Math.max(0, 1 - age / 0.15);
    ctx.save();
    ctx.translate(W / 2, 135);
    ctx.scale(pop, pop);
    ctx.textAlign = "center";
    ctx.font = "bold 64px 'Courier New', monospace";
    ctx.lineWidth = 6;
    ctx.strokeStyle = colors.sky;
    ctx.strokeText(COUNTDOWN_WORDS[stage], 0, 0);
    ctx.fillStyle = stage === COUNTDOWN_WORDS.length - 1 ? "#ff8a1f" : colors.ink;
    ctx.fillText(COUNTDOWN_WORDS[stage], 0, 0);
    ctx.restore();
  }

  // Score (it turns gold for a moment every 100 points; it never blinks)
  ctx.fillStyle = flashTime > 0 ? GOLD_EDGE : colors.ink;
  ctx.font = "bold 20px 'Courier New', monospace";
  ctx.textAlign = "right";
  ctx.fillText(`HI ${pad5(high(runDiff))}  ${pad5(score)}`, W - 20, 36);
}

// --- Main loop ---
function loop(time) {
  const dt = Math.min(0.033, (time - (lastTime ?? time)) / 1000);
  lastTime = time;
  if (state === "countdown") updateCountdown(dt);
  if (state === "running") {
    update(dt);
  }
  if (ragdoll) {
    updateRagdoll(ragdoll, dt);
    if (state === "dying" && ragdoll.time >= RAGDOLL_DURATION) gameOver();
  }
  for (const c of corpses) updateRagdoll(c, dt);
  if (shakeTime > 0) shakeTime -= dt;
  if (flashTime > 0) flashTime -= dt;
  if (waveBanner > 0 && state === "running") waveBanner -= dt;
  if (bossBanner && state === "running") { bossBanner.t -= dt; if (bossBanner.t <= 0) bossBanner = null; }
  musicTick();
  draw();
  requestAnimationFrame(loop);
}

reset();
refreshSettingsLabels();
showMenu("main");
requestAnimationFrame(loop);
</script>
</body>
