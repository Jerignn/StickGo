<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StickGo</title>
<style>
  /* --sky and --ink are updated by the game for the day/night cycle */
  :root { --btn-size: 18vh; --sky: #f7f7f7; --ink: #535353; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--sky);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #game {
    /* Keep the 3:1 shape and fill as much of the screen as possible */
    width: min(100vw, 300vh);
    height: min(100vh, 33.333vw);
    background: var(--sky);
  }
  .btn {
    position: fixed;
    bottom: 5vh;
    width: var(--btn-size);
    height: var(--btn-size);
    min-width: 64px;
    min-height: 64px;
    border-radius: 50%;
    border: 3px solid var(--ink);
    background: rgba(128, 128, 128, 0.15);
    color: var(--ink);
    font: bold 16px "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn.pressed { background: rgba(128, 128, 128, 0.4); }
  #duckBtn { left: 4vw; }
  #jumpBtn { right: 4vw; }
  /* Attack sits next to jump so the right thumb can reach both */
  #attackBtn { right: calc(7vw + max(var(--btn-size), 64px)); font-size: 14px; }
  /* Hide the buttons on computers with a mouse; keyboard is used there */
  @media (hover: hover) and (pointer: fine) {
    .btn { display: none; }
  }
  /* Jump/duck/pause only show while playing */
  body:not(.playing) .btn,
  body:not(.playing) #pauseBtn { display: none; }

  #pauseBtn {
    position: fixed;
    top: 4vh;
    left: 3vw;
    width: 52px;
    height: 52px;
    border-radius: 12px;
    border: 3px solid var(--ink);
    background: rgba(128, 128, 128, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  #pauseBtn span { width: 7px; height: 22px; background: var(--ink); border-radius: 2px; }

  .menu {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(247, 247, 247, 0.88);
    color: #535353;
  }
  .menu.open { display: flex; }
  .menu h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: 4px; }
  .menu p { margin: 0; font-size: 14px; }
  .menu button {
    min-width: 240px;
    padding: 10px 20px;
    font: bold 18px "Courier New", monospace;
    color: #535353;
    background: #f7f7f7;
    border: 3px solid #535353;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .menu button:active { background: #dcdcdc; }

  /* Main menu: full-screen artwork (it already has the logo) with buttons on the left */
  #mainMenu {
    background: #1a1430 url("pictures/mainmenu.jpg") center 25% / cover no-repeat;
    align-items: flex-start;
    justify-content: flex-end;
    padding: 0 0 9vh 6vw;
    box-sizing: border-box;
  }
  #mainMenu button, .store-menu button {
    color: #fff;
    background: rgba(20, 12, 30, 0.6);
    border-color: #ff8a1f;
    box-shadow: 0 0 12px rgba(255, 110, 20, 0.45);
    text-shadow: 0 1px 2px #000;
  }
  #mainMenu button:active, .store-menu button:active { background: rgba(255, 120, 30, 0.55); }
  #mainMenu p, .store-menu p {
    color: #fff;
    text-shadow: 0 1px 3px #000, 0 0 6px #000;
  }

  /* Shop + inventory: same artwork as the main menu, dimmed so the cards stand out */
  .store-menu {
    background: linear-gradient(rgba(12, 8, 24, 0.62), rgba(12, 8, 24, 0.62)),
                #1a1430 url("pictures/mainmenu.jpg") center 25% / cover no-repeat;
    gap: 8px;
  }
  .store-menu h1 { color: #fff; font-size: 28px; margin: 0; text-shadow: 0 2px 4px #000; }
  .shop-head { display: flex; align-items: baseline; gap: 28px; }
  #shopGold { color: #ffd34d; font: bold 20px "Courier New", monospace; text-shadow: 0 1px 3px #000; }
  .coin {
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-right: 6px;
    border-radius: 50%;
    background: #f5b921;
    border: 2px solid #a8740a;
    vertical-align: -1px;
  }
  .rarity-head {
    font: bold 13px "Courier New", monospace;
    letter-spacing: 4px;
    text-shadow: 0 1px 3px #000;
  }
  .shop-row { display: flex; gap: 14px; }
  #shopSections { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tabs { display: flex; gap: 8px; }
  .store-menu .tab {
    min-width: 0;
    padding: 6px 12px;
    font-size: 12px;
    letter-spacing: 1px;
    border-color: var(--rar);
    box-shadow: none;
  }
  .store-menu .tab.active { background: var(--rar); color: #111; text-shadow: none; }
  /* Inventory: wraps into rows and scrolls when there are more swords than fit */
  #invItems {
    flex-wrap: wrap;
    justify-content: center;
    max-width: 800px;
    max-height: calc(100vh - 150px);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 4px;
  }
  #invMsg { min-height: 1.2em; color: #ffd34d; font-size: 13px; }
  /* Shop and inventory share one row on the main menu */
  .menu-pair { display: flex; gap: 10px; width: 240px; }
  #mainMenu .menu-pair button { min-width: 0; flex: 1; padding: 10px 6px; font-size: 15px; }
  .card {
    box-sizing: border-box;
    width: 178px;
    padding: 10px;
    border: 3px solid var(--rar, #ff8a1f);
    border-radius: 12px;
    background: rgba(20, 12, 30, 0.7);
    box-shadow: 0 0 12px var(--rar-glow, rgba(255, 110, 20, 0.35));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .card.equipped { border-color: #ffd34d; box-shadow: 0 0 18px rgba(255, 211, 77, 0.7); }
  .card canvas { width: 100%; height: auto; }
  .card .name {
    color: #fff;
    font: bold 12px "Courier New", monospace;
    line-height: 1.15;
    min-height: 2.3em;               /* two lines, so every card is the same height */
    display: flex;
    align-items: center;
    text-align: center;
    text-shadow: 0 1px 2px #000;
  }
  .card .tag { font: bold 11px "Courier New", monospace; letter-spacing: 3px; }
  .store-menu .card button { min-width: 0; width: 100%; padding: 6px 8px; font-size: 15px; }
  .store-menu .card button.cant,
  .store-menu .card button.owned { opacity: 0.55; }
  #shopMsg { min-height: 1.2em; color: #ffd34d; font-size: 13px; }
  .shop-foot { display: flex; gap: 12px; }
  .store-menu .shop-foot button { min-width: 0; padding: 8px 18px; font-size: 15px; }
</style>
</head>
<body>
<canvas id="game" width="900" height="300"></canvas>
<div class="btn" id="duckBtn">DUCK</div>
<div class="btn" id="jumpBtn">JUMP</div>
<div class="btn" id="attackBtn">ATTACK</div>
<div id="pauseBtn" aria-label="Pause"><span></span><span></span></div>

<div class="menu" id="mainMenu">
  <button data-action="play">PLAY</button>
  <div class="menu-pair">
    <button data-action="shop">SHOP</button>
    <button data-action="inventory">INVENTORY</button>
  </div>
  <button data-action="settings">SETTINGS</button>
  <p id="highText"></p>
  <p id="goldText"></p>
  <p>Jump: JUMP / SPACE &nbsp; Duck: hold DUCK / DOWN &nbsp; Attack: ATTACK / X</p>
</div>

<div class="menu store-menu" id="shopMenu">
  <div class="shop-head"><h1>SHOP</h1><span id="shopGold"></span></div>
  <div id="shopSections"></div>
  <p id="shopMsg"></p>
  <div class="shop-foot">
    <button data-action="shopBack">BACK</button>
  </div>
</div>

<div class="menu store-menu" id="invMenu">
  <div class="shop-head"><h1>INVENTORY</h1></div>
  <div class="shop-row" id="invItems"></div>
  <p id="invMsg"></p>
  <div class="shop-foot">
    <button data-action="invBack">BACK</button>
  </div>
</div>

<div class="menu" id="pauseMenu">
  <h1>PAUSED</h1>
  <button data-action="resume">RESUME</button>
  <button data-action="settings">SETTINGS</button>
  <button data-action="main">MAIN MENU</button>
</div>

<div class="menu" id="settingsMenu">
  <h1>SETTINGS</h1>
  <button data-action="difficulty" id="difficultyBtn"></button>
  <button data-action="btnSize" id="btnSizeBtn"></button>
  <button data-action="sound" id="soundBtn"></button>
  <button data-action="resetHigh" id="resetHighBtn">RESET HIGH SCORES</button>
  <button data-action="back">BACK</button>
</div>

<div class="menu" id="overMenu">
  <h1>GAME OVER</h1>
  <p id="overText"></p>
  <p id="overGold"></p>
  <button data-action="play">PLAY AGAIN</button>
  <button data-action="main">MAIN MENU</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Game world is always 900x300 units; the canvas is scaled to the screen's
// real pixel density so lines stay crisp instead of being stretched.
const W = 900;
const H = 300;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();
const GROUND_Y = 250;

// --- Tunable settings ---
const GRAVITY = 2400;        // px/s^2
const JUMP_VELOCITY = -820;  // px/s
const JUMP_BUFFER = 0.1;     // s a jump press is remembered while still in the air
// Movement is split into steps no longer than this, so at top speed the world
// moves ~10px per step and small rocks can't skip past the player on slow phones.
const PHYSICS_STEP = 1 / 120;
const ATTACK_DURATION = 0.25;  // s a sword swing lasts (and can hit for)
const ATTACK_COOLDOWN = 0.1;   // s after a swing before the next one

// Speeds in px/s; gain is px/s added per second
const DIFFICULTIES = {
  easy:   { label: "EASY",   start: 320, max: 800,  gain: 5 },
  normal: { label: "NORMAL", start: 380, max: 1000, gain: 8 },
  hard:   { label: "HARD",   start: 460, max: 1200, gain: 12 }
};
const BUTTON_SIZES = {
  small:  { label: "SMALL",  size: "14vh" },
  medium: { label: "MEDIUM", size: "18vh" },
  large:  { label: "LARGE",  size: "24vh" }
};

const settings = Object.assign(
  { difficulty: "normal", btnSize: "medium", sound: true },
  JSON.parse(localStorage.getItem("stickgo-settings") || "{}")
);

function saveSettings() {
  localStorage.setItem("stickgo-settings", JSON.stringify(settings));
}

// High scores are kept per difficulty, since harder modes score faster
const highScores = JSON.parse(localStorage.getItem("stickgo-highs") || "{}");
// Older versions kept a single high score; carry it over to the current difficulty
const oldHigh = Number(localStorage.getItem("stickgo-high") || 0);
if (oldHigh) {
  highScores[settings.difficulty] = Math.max(oldHigh, highScores[settings.difficulty] || 0);
  localStorage.setItem("stickgo-highs", JSON.stringify(highScores));
  localStorage.removeItem("stickgo-high");
}
function high(diff) { return highScores[diff] || 0; }

// Gold dropped by enemies; the total is kept across runs
let totalGold = Number(localStorage.getItem("stickgo-gold") || 0);

// --- Sword skins (cosmetic only: every sword has the same reach) ---
// The shop groups skins by rarity. How a skin is drawn (see drawBlade):
//   blade = fill colour (null = day/night palette), tip = colour the blade fades to,
//   edge = outline, hi = highlight ridge, guard = crossguard and grip, gem = jewel on the guard,
//   shape = blade outline from PROFILES, curve = sabre-like bend, glow = soft halo,
//   fx = animated effect (see swordFx) in fxColor, hilt = visible handle, wing = winged guard.
// legacy skins stay in the inventory of people who bought them but are no longer sold.
const RARITIES = {
  common:    { label: "COMMON",    color: "#7ed957", glow: "rgba(126, 217, 87, 0.40)" },
  uncommon:  { label: "UNCOMMON",  color: "#4aa8ff", glow: "rgba(74, 168, 255, 0.45)" },
  rare:      { label: "RARE",      color: "#b266ff", glow: "rgba(178, 102, 255, 0.50)" },
  legendary: { label: "LEGENDARY", color: "#ffa930", glow: "rgba(255, 169, 48, 0.60)" }
};
const SWORD_SKINS = {
  starter: { name: "STARTER SWORD", rarity: null, price: 0, blade: null, guard: null, len: 26, width: 3 },

  // Common
  wooden:  { name: "TRAINING WOODEN BOKKEN", rarity: "common", price: 25,
             blade: "#a8743d", edge: "#4a2e14", hi: "#c99358", guard: "#5a3a1a",
             len: 30, width: 4.4, shape: "bokken" },
  sabre:   { name: "RUSTY CUTLASS", rarity: "common", price: 60,
             blade: "#a5a8a6", edge: "#4a4d4f", hi: "#d6d9d8", guard: "#5b3a22",
             len: 30, width: 4.4, shape: "saber", curve: 0.16, fx: "rust", fxColor: "#a8522a" },
  cleaver: { name: "SCRAP METAL CLEAVER", rarity: "common", price: 90,
             blade: "#9aa0a3", edge: "#3f4446", hi: "#cfd4d6", guard: "#cdbb8a",
             len: 27, width: 9, shape: "cleaver", fx: "rust", fxColor: "#8a6a3a" },
  oldguard: { name: "OLD GUARD'S SABER", rarity: "common", price: 120,
             blade: "#cfd4d8", edge: "#5d646a", hi: "#ffffff", guard: "#b7842b",
             len: 32, width: 4, shape: "saber", curve: 0.12 },
  bronze:  { name: "BRONZE SWORD", rarity: "common", price: 40, legacy: true,
             blade: "#e3ac3f", edge: "#6a4a12", guard: "#5a3a12", len: 27, width: 3.5 },

  // Uncommon
  spiketooth: { name: "SPIKE-TOOTH BLADE", rarity: "uncommon", price: 500,
             blade: "#454c56", edge: "#111418", hi: "#8892a0", guard: "#2a2f36",
             len: 32, width: 6.4, shape: "serrated" },
  electro: { name: "ELECTRO-BATON SWORD", rarity: "uncommon", price: 750,
             blade: "#a9c4d6", edge: "#2f5878", hi: "#f2fbff", guard: "#2d4a63",
             len: 31, width: 4, shape: "blade", fx: "electric", fxColor: "#8fe9ff", glow: "#4fc3f7" },
  obsidian: { name: "OBSIDIAN SHARD", rarity: "uncommon", price: 1000,
             blade: "#372a58", edge: "#6a50b4", hi: "#a583f0", guard: "#2a2048",
             len: 30, width: 7.4, shape: "shard" },
  jungle:  { name: "JUNGLE MACHETE", rarity: "uncommon", price: 1250,
             blade: "#566b34", edge: "#1f2a10", hi: "#9fc45a", guard: "#4a3418",
             len: 30, width: 7, shape: "machete", fx: "slime", fxColor: "#7ee04a" },

  // Rare
  crimson: { name: "CRIMSON FURY", rarity: "rare", price: 15000,
             blade: "#c4162d", edge: "#3d050d", hi: "#ff7a66", guard: "#3a0a10",
             len: 33, width: 6.4, shape: "flame", fx: "flame", fxColor: "#ff5a2a", glow: "#ff2a2a" },
  shadow:  { name: "SHADOW EDGE", rarity: "rare", price: 18000,
             blade: "#1c1430", edge: "#05030a", hi: "#7a4fd0", guard: "#120b20",
             len: 33, width: 6.4, shape: "flame", fx: "wisps", fxColor: "#8a5cf0", glow: "#7a3fe0" },
  aero:    { name: "AERO-SABER", rarity: "rare", price: 22000,
             blade: "#dff6fb", edge: "#6fb4c8", hi: "#ffffff", guard: "#5d8fa0",
             len: 33, width: 5, shape: "saber", curve: 0.2, fx: "wisps", fxColor: "#d8fbff", glow: "#8fe3ff" },
  frostbite: { name: "FROSTBITE", rarity: "rare", price: 25000,
             blade: "#a8e0ff", edge: "#3a82b4", hi: "#f2fcff", guard: "#2c5f8a",
             len: 32, width: 7.4, shape: "ice", fx: "sparkle", fxColor: "#ffffff", glow: "#6fd0ff" },

  // Legendary
  dragon:  { name: "DRAGON'S BREATH", rarity: "legendary", price: 100000,
             blade: "#7a1a0a", tip: "#ffb02e", edge: "#2a0803", hi: "#ffd36a", guard: "#3a2a1c",
             len: 34, width: 8.4, shape: "broad", fx: "flame", fxColor: "#ff8a1f", glow: "#ff6a00", gem: "#ff3b1f" },
  laser:   { name: "CYBERNETIC LASER BLADE", rarity: "legendary", price: 100000,
             blade: "#7ff4ff", guard: "#46505e", len: 34, width: 3.6, shape: "laser",
             fx: "laser", fxColor: "#27d7ff", glow: "#27d7ff", gem: "#27d7ff", hilt: true },
  voidbringer: { name: "VOID BRINGER", rarity: "legendary", price: 100000,
             blade: "#2a0f4d", tip: "#6b2fd6", edge: "#080214", hi: "#b27bff", guard: "#1a0a30",
             len: 34, width: 8, shape: "broad", fx: "void", fxColor: "#c490ff", glow: "#8a3dff", gem: "#c490ff" },
  sun:     { name: "CELESTIAL SUN-BLADE", rarity: "legendary", price: 100000,
             blade: "#ffd34d", tip: "#fffbe0", edge: "#a8740a", hi: "#ffffff", guard: "#e0a82a",
             len: 34, width: 6, shape: "blade", fx: "sparkle", fxColor: "#fff3a8", glow: "#ffd34d",
             gem: "#ff7a2a", wing: true }
};
const fmt = (n) => n.toLocaleString("en-US");
const skinState = Object.assign(
  { owned: ["starter"], equipped: "starter" },
  JSON.parse(localStorage.getItem("stickgo-skins") || "{}")
);
function saveSkins() { localStorage.setItem("stickgo-skins", JSON.stringify(skinState)); }
function equippedSkin() { return SWORD_SKINS[skinState.equipped] || SWORD_SKINS.starter; }

// --- Game state ---
let state = "ready";         // "ready" | "running" | "paused" | "dying" | "over"
let speed, score, distance, obstacles, clouds, groundBits, spawnTimer, lastTime;
let runDiff = settings.difficulty;  // difficulty of the current run; settings changes apply next run
let jumpBuffer = 0;          // time left on a remembered jump press
let lastMilestone = 0;       // last multiple of 100 reached, for the score flash
let flashTime = 0;
let coins = [];              // gold coins dropped by enemies, waiting to be picked up
let corpses = [];            // ragdolls of slain enemies
let runGold = 0;
let bonusScore = 0;          // points from jumping over enemies and drones
let popups = [];             // floating "+10" texts
let wave = 1;
let waveBanner = 0;          // time left showing the "WAVE n" banner
const JUMP_OVER_BONUS = 10;

const player = {
  x: 80,
  y: 0,
  vy: 0,
  onGround: true,
  ducking: false,
  runPhase: 0,
  attack: 0,                 // time left in the current sword swing
  attackCooldown: 0,
  swingId: 0,                // counts swings, so a shield blocks each swing only once
  standH: 60,
  duckH: 36,
  w: 26,
  get h() { return this.ducking && this.onGround ? this.duckH : this.standH; }
};

function reset() {
  runDiff = settings.difficulty;
  speed = DIFFICULTIES[runDiff].start;
  score = 0;
  distance = 0;
  obstacles = [];
  spawnTimer = 1;
  jumpBuffer = 0;
  lastMilestone = 0;
  flashTime = 0;
  player.y = GROUND_Y - player.standH;
  player.vy = 0;
  player.onGround = true;
  player.ducking = false;
  player.attack = 0;
  player.attackCooldown = 0;
  coins = [];
  corpses = [];
  runGold = 0;
  bonusScore = 0;
  popups = [];
  wave = 1;
  waveBanner = 0;
  ragdoll = null;
  shakeTime = 0;
  clouds = Array.from({ length: 4 }, () => ({
    x: Math.random() * W,
    y: 30 + Math.random() * 90,
    speed: 0.15 + Math.random() * 0.15
  }));
  groundBits = Array.from({ length: 40 }, () => ({
    x: Math.random() * W,
    y: GROUND_Y + 4 + Math.random() * 18,
    w: 2 + Math.random() * 6
  }));
}

// --- Screens & menus ---
const menus = {
  main: document.getElementById("mainMenu"),
  pause: document.getElementById("pauseMenu"),
  settings: document.getElementById("settingsMenu"),
  over: document.getElementById("overMenu"),
  shop: document.getElementById("shopMenu"),
  inventory: document.getElementById("invMenu")
};
let settingsReturnTo = "main";   // which menu BACK returns to
let resetArmed = false;          // reset high score needs a second tap

function showMenu(name) {
  for (const [key, el] of Object.entries(menus)) el.classList.toggle("open", key === name);
  document.body.classList.toggle("playing", name === null);
  if (name === "main") {
    document.getElementById("highText").textContent =
      `HIGH SCORE ${pad5(high(settings.difficulty))} (${DIFFICULTIES[settings.difficulty].label})`;
    document.getElementById("goldText").textContent = `GOLD ${fmt(totalGold)}`;
  }
  if (name === "settings") refreshSettingsLabels();
  if (name === "shop") { shopMessage(""); refreshShop(); }
  if (name === "inventory") { invMessage(""); refreshInventory(); }
  animatePreviews();
}

function refreshSettingsLabels() {
  const nextRun = state === "paused" && settings.difficulty !== runDiff ? " (NEXT RUN)" : "";
  document.getElementById("difficultyBtn").textContent =
    `DIFFICULTY: ${DIFFICULTIES[settings.difficulty].label}${nextRun}`;
  document.getElementById("btnSizeBtn").textContent =
    `BUTTON SIZE: ${BUTTON_SIZES[settings.btnSize].label}`;
  document.getElementById("soundBtn").textContent = `SOUND: ${settings.sound ? "ON" : "OFF"}`;
  document.getElementById("resetHighBtn").textContent =
    resetArmed ? "TAP AGAIN TO CONFIRM" : "RESET HIGH SCORES";
  document.documentElement.style.setProperty("--btn-size", BUTTON_SIZES[settings.btnSize].size);
}

function nextKey(obj, current) {
  const keys = Object.keys(obj);
  return keys[(keys.indexOf(current) + 1) % keys.length];
}

function startGame() {
  reset();
  state = "running";
  showMenu(null);
}

function pauseGame() {
  if (state !== "running") return;
  state = "paused";
  jumpBuffer = 0;
  releaseDuck();
  showMenu("pause");
}

function resumeGame() {
  state = "running";
  showMenu(null);
}

function goToMainMenu() {
  reset();
  state = "ready";
  showMenu("main");
}

function openSettings(from) {
  settingsReturnTo = from;
  resetArmed = false;
  showMenu("settings");
}

const menuActions = {
  play: startGame,
  shop: () => showMenu("shop"),
  shopBack: () => showMenu("main"),
  inventory: () => showMenu("inventory"),
  invBack: () => showMenu("main"),
  resume: resumeGame,
  main: goToMainMenu,
  settings: () => openSettings(state === "paused" ? "pause" : "main"),
  back: () => showMenu(settingsReturnTo),
  difficulty: () => {
    settings.difficulty = nextKey(DIFFICULTIES, settings.difficulty);
    saveSettings();
    refreshSettingsLabels();
  },
  btnSize: () => {

    refreshSettingsLabels();
  },

    saveSettings();
    refreshSettingsLabels();
  },
  resetHigh: () => {

      for (const key of Object.keys(highScores)) delete highScores[key];

};

// --- Shop ---
let shopTab = "common";   // which rarity tab is showing
let previewTimer = null;

// A card with the sword picture, name and rarity. The caller adds the button's text and action.
function swordCard(id) {
  const skin = SWORD_SKINS[id];
  const info = RARITIES[skin.rarity] || { label: "STARTER", color: "#ffffff" };
  const card = document.createElement("div");
  card.className = "card";
  if (RARITIES[skin.rarity]) {
    card.style.setProperty("--rar", info.color);
    card.style.setProperty("--rar-glow", info.glow);
  }
  card.innerHTML = `<canvas width="320" height="128"></canvas>
    <div class="name">${skin.name}</div>
    <div class="tag" style="color:${info.color}">${info.label}</div>
    <button></button>`;
  const canvas = card.querySelector("canvas");
  if (skin.fx || skin.glow) canvas.dataset.anim = id;   // animated while the menu is open
  drawSwordPreview(canvas, skin);
  return card;
}

// Keeps the glowing, sparking swords moving while the shop or inventory is open
function animatePreviews() {
  const open = menus.shop.classList.contains("open") || menus.inventory.classList.contains("open");
  if (!open) { clearInterval(previewTimer); previewTimer = null; return; }
  if (previewTimer) return;
  previewTimer = setInterval(() => {
    for (const c of document.querySelectorAll("canvas[data-anim]")) {
      drawSwordPreview(c, SWORD_SKINS[c.dataset.anim]);
    }
  }, 70);
}

// One tab per rarity, and below it that rarity's swords
function refreshShop() {
  document.getElementById("shopGold").innerHTML = `<span class="coin"></span>${fmt(totalGold)}`;
  const sections = document.getElementById("shopSections");
  sections.innerHTML = "";

  const tabs = document.createElement("div");
  tabs.className = "tabs";
  for (const [rarity, info] of Object.entries(RARITIES)) {
    const tab = document.createElement("button");
    tab.className = "tab" + (rarity === shopTab ? " active" : "");
    tab.style.setProperty("--rar", info.color);
    tab.textContent = info.label;
    tab.addEventListener("click", () => { shopTab = rarity; refreshShop(); });
    tabs.appendChild(tab);
  }

  const row = document.createElement("div");
  row.className = "shop-row";
  for (const [id, skin] of Object.entries(SWORD_SKINS)) {
    if (skin.rarity !== shopTab || skin.legacy) continue;
    const owned = skinState.owned.includes(id);
    const card = swordCard(id);
    const btn = card.querySelector("button");
    btn.innerHTML = owned ? "OWNED" : `<span class="coin"></span>${fmt(skin.price)}`;
    btn.classList.toggle("owned", owned);
    btn.classList.toggle("cant", !owned && totalGold < skin.price);
    btn.addEventListener("click", () => shopTap(id));
    row.appendChild(card);
  }
  sections.append(tabs, row);
}

function shopMessage(text) { document.getElementById("shopMsg").textContent = text; }

// Tapping a card buys it if there's enough gold. Equipping is done in the inventory.
function shopTap(id) {
  const skin = SWORD_SKINS[id];
  if (skinState.owned.includes(id)) {
    shopMessage("YOU OWN THIS — EQUIP IT FROM YOUR INVENTORY");
    return;
  } else if (totalGold >= skin.price) {
    totalGold -= skin.price;
    localStorage.setItem("stickgo-gold", totalGold);
    skinState.owned.push(id);
    shopMessage(`BOUGHT ${skin.name}! EQUIP IT FROM YOUR INVENTORY`);
    sfx.coin();
  } else {
    shopMessage(`NOT ENOUGH GOLD — NEED ${fmt(skin.price - totalGold)} MORE`);
    return;
  }
  saveSkins();
  refreshShop();
}

// --- Inventory ---
// Every owned sword (starter first, then by rarity) with an EQUIP button.
function refreshInventory() {
  const row = document.getElementById("invItems");
  row.innerHTML = "";
  for (const rarity of [null, ...Object.keys(RARITIES)]) {
    for (const [id, skin] of Object.entries(SWORD_SKINS)) {
      if (skin.rarity !== rarity || !skinState.owned.includes(id)) continue;
      const equipped = skinState.equipped === id;
      const card = swordCard(id);
      card.classList.toggle("equipped", equipped);
      const btn = card.querySelector("button");
      btn.textContent = equipped ? "EQUIPPED" : "EQUIP";
      btn.addEventListener("click", () => equipSkin(id));
      row.appendChild(card);
    }
  }
  if (skinState.owned.length < 2) invMessage("BUY MORE SWORDS IN THE SHOP");
}

function equipSkin(id) {
  if (skinState.equipped === id) return;
  skinState.equipped = id;
  saveSkins();
  refreshInventory();
  invMessage(`${SWORD_SKINS[id].name} EQUIPPED`);
}

function invMessage(text) { document.getElementById("invMsg").textContent = text; }

// Called by the Android app when the phone's back button is pressed.
// Returns true if the game handled it, false to let the app close.
window.stickgoBack = function () {
  if (state === "dying") return true;
  if (state === "running") { pauseGame(); return true; }
  if (menus.shop.classList.contains("open")) { showMenu("main"); return true; }
  if (menus.inventory.classList.contains("open")) { showMenu("main"); return true; }
  if (menus.settings.classList.contains("open")) { showMenu(settingsReturnTo); return true; }
  if (state === "paused") { resumeGame(); return true; }
  if (state === "over") { goToMainMenu(); return true; }
  return false;
};

// Pause automatically if the app is switched away from mid-run
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseGame();
});

// --- Sound ---
// Small synthesized beeps, so no audio files are needed. Browsers only allow
// audio after the player has touched or pressed something, so it starts then.
let audio = null;

function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!audio && AC) audio = new AC();
  if (audio && audio.state === "suspended") audio.resume();
}
for (const ev of ["pointerdown", "pointerup", "keydown", "click"]) {
  document.addEventListener(ev, initAudio, true);
}

function beep(freq, dur, { type = "square", vol = 0.06, slideTo, delay = 0 } = {}) {
  if (!settings.sound || !audio || audio.state !== "running") return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur);
}

const sfx = {
  jump: () => beep(500, 0.12, { slideTo: 900 }),
  point: () => { beep(880, 0.08); beep(1320, 0.14, { delay: 0.09 }); },
  hit: () => beep(240, 0.4, { type: "sawtooth", vol: 0.08, slideTo: 50 }),
  slash: () => beep(1400, 0.09, { type: "triangle", vol: 0.05, slideTo: 300 }),
  kill: () => beep(180, 0.18, { vol: 0.07, slideTo: 70 }),
  bonus: () => { beep(660, 0.06, { vol: 0.04 }); beep(990, 0.09, { vol: 0.04, delay: 0.06 }); },
  clang: () => { beep(1900, 0.07, { vol: 0.05 }); beep(950, 0.14, { type: "triangle", vol: 0.05, delay: 0.02 }); },
  laser: () => beep(1200, 0.12, { type: "sawtooth", vol: 0.025, slideTo: 1800 }),
  wave: () => { beep(440, 0.12); beep(554, 0.12, { delay: 0.13 }); beep(659, 0.22, { delay: 0.26 }); },
  coin: () => { beep(990, 0.05, { vol: 0.04 }); beep(1480, 0.1, { vol: 0.04, delay: 0.05 }); }
};

// --- Input ---
// A press is remembered briefly, so tapping just before landing still jumps
function jump() {
  if (state === "running") jumpBuffer = JUMP_BUFFER;
}

function duck() {
  if (state !== "running") return;
  player.ducking = true;
  // Fast-fall when ducking mid-air
  if (!player.onGround) player.vy = Math.max(player.vy, 600);
}

// The sword only works with both feet on the ground; mid-air presses are ignored
function attack() {
  if (state !== "running" || player.attackCooldown > 0 || !player.onGround) return;
  player.attack = ATTACK_DURATION;
  player.attackCooldown = ATTACK_DURATION + ATTACK_COOLDOWN;
  player.swingId++;
  sfx.slash();
}

document.addEventListener("keydown", (e) => {
  if (["Escape", "KeyP"].includes(e.code)) {
    e.preventDefault();
    window.stickgoBack();
    return;
  }
  if (["Space", "ArrowUp", "KeyW"].includes(e.code)) {
    e.preventDefault();
    if (state === "ready" && menus.main.classList.contains("open")) startGame();
    else if (state === "over") startGame();
    else jump();
  }
  if (["ArrowDown", "KeyS"].includes(e.code)) {
    e.preventDefault();
    duck();
  }
  if (["KeyX", "KeyF"].includes(e.code) && !e.repeat) {
    e.preventDefault();
    attack();
  }
});

document.addEventListener("keyup", (e) => {
  if (["ArrowDown", "KeyS"].includes(e.code)) player.ducking = false;
});

// Touch: on-screen JUMP / DUCK / ATTACK buttons (tapping elsewhere does nothing)

const duckBtn = document.getElementById("duckBtn");

// --- Waves ---
// Every WAVE_LENGTH points a new wave starts and everything gets tougher, up
// to MAX_WAVE. The minimum gap between obstacles is never shrunk (a jump
// always takes the same time), so later waves stay hard but possible.
const WAVE_LENGTH = 300;
const MAX_WAVE = 8;

function waveAt(s) { return 1 + Math.floor(s / WAVE_LENGTH); }

// 0 in wave 1 .. 1 from MAX_WAVE on
function waveIntensity() { return Math.min(1, (wave - 1) / (MAX_WAVE - 1)); }

// Spawn x for something moving at objSpeed so it reaches the player when a
// ground obstacle spawned now would. Faster things start further off-screen;
// otherwise they'd catch up with the obstacle ahead and leave no room to land.
function arrivalX(objSpeed) {
  return player.x + (W + 20 - player.x) * objSpeed / speed;
}

// --- Obstacles ---
// Each kind unlocks at a score and has a spawn weight that can grow with the
// wave (t: 0 in wave 1 .. 1 from MAX_WAVE). Later waves lean towards drones,
// enemies and the trickier traps rather than plain rocks.
const SPAWNS = [
  { from: 0,   weight: () => 22,              make: makeRocks },
  { from: 60,  weight: () => 12,              make: makeSpikeTrap },
  { from: 40,  weight: (t) => 20 + 10 * t,    make: makeEnemies },
  { from: 150, weight: (t) => 8 + 4 * t,      make: makeBarrel },
  { from: 200, weight: (t) => 25 + 10 * t,    make: makeDrone },
  { from: 250, weight: (t) => 7 + 3 * t,      make: makeFirePit },
  { from: 100, weight: (t) => 6 + 3 * t,      make: makeSpikeBall },
  { from: 150, weight: (t) => 6 + 3 * t,      make: makeLaserGate }
];

function spawnObstacle() {
  const t = waveIntensity();
  const open = SPAWNS.filter((s) => score >= s.from);
  let roll = Math.random() * open.reduce((sum, s) => sum + s.weight(t), 0);
  for (const s of open) {
    roll -= s.weight(t);
    if (roll <= 0) return s.make(t);
  }
  open[open.length - 1].make(t);
}

// Ground rocks in groups that grow taller and wider each wave
function makeRocks(t) {
  const maxCount = score > 400 ? 3 + Math.round(t) : 2;
  const count = 1 + Math.floor(Math.random() * maxCount);
  const h = 26 + 12 * t + Math.random() * 24;
  const w = 18 * count + 4;
  obstacles.push({ type: "rock", x: W + 20, y: GROUND_Y - h, w, h, count });
}

// Wooden plank with metal spikes on top: jump it
function makeSpikeTrap(t) {
  const w = 40 + Math.random() * 30 + 10 * t;
  const h = 30 + Math.random() * 12 + 6 * t;
  obstacles.push({ type: "spikes", x: W + 20, y: GROUND_Y - h, w, h });
}

// Enemy stickmen charging at the player: slash them or jump over them.
// They run faster each wave and from wave 3 sometimes come in pairs.
// From wave 2 some carry a shield that blocks the sword, so they must be jumped.
function makeEnemies(t) {
  const pair = wave >= 3 && Math.random() < 0.15 + 0.25 * t;
  const run = 80 + 120 * t + Math.random() * 80;  // px/s they run towards the player
  for (let i = 0; i < (pair ? 2 : 1); i++) {
    obstacles.push({
      type: "enemy",
      x: arrivalX(speed + run) + i * (70 + Math.random() * 25),
      y: GROUND_Y - player.standH,
      w: player.w,
      h: player.standH,
      run,
      shield: wave >= 2 && Math.random() < 0.2 + 0.25 * t,
      runPhase: Math.random() * 6,
      onGround: true, ducking: false, vy: 0, attack: 0  // fields read by getPose
    });
  }
}

// Barrel rolling towards the player, faster than the ground: jump it earlier
function makeBarrel(t) {
  const roll = 70 + 90 * t + Math.random() * 50;
  const r = 13;
  obstacles.push({ type: "barrel", x: arrivalX(speed + roll), y: GROUND_Y - r * 2, w: r * 2, h: r * 2, r, roll, turn: 0 });
}

// Flying drone (top of a 22-tall box). Low: skims the ground, must be jumped.
// Mid: head height, hits a standing player but clears a ducking one.
// High: harmless unless you jump into it. The sword can't hurt drones.
// From wave 3 they bob up and down a little (never enough to change
// whether you need to jump or duck).
function makeDrone(t) {
  const tops = [GROUND_Y - 28, GROUND_Y - 58, GROUND_Y - 109];
  const y = tops[Math.floor(Math.random() * tops.length)];
  const mul = 1.1 + 0.2 * t;  // drones fly faster than the ground scrolls, more so each wave
  obstacles.push({
    type: "drone",
    x: arrivalX(speed * mul),
    mul,
    y, baseY: y,
    bob: wave >= 3 ? 3 + 5 * t : 0,
    w: 40,
    h: 22,
    spin: Math.random() * 6
  });
}

// Stone fire pit whose flames rise and fall: always jump it, easiest when low
const FIRE_BASE = 10;
function makeFirePit(t) {
  const w = 44 + Math.random() * 16;
  obstacles.push({
    type: "fire", x: W + 20, y: GROUND_Y - FIRE_BASE, w, h: FIRE_BASE,
    phase: Math.random() * 6, rate: 3.5 + 1.5 * t
  });
}
function flameHeight(o) { return 6 + 32 * (0.5 + 0.5 * Math.sin(o.phase)); }

// Spiked ball swinging on a chain from above. At the bottom of its swing it's
// at head height, so ducking is always safe; standing works if you time it
// while it's swung away, and jumping into it is deadly.
const BALL_PIVOT_Y = 60, BALL_CHAIN = 145, BALL_R = 10;
function makeSpikeBall(t) {
  obstacles.push({
    type: "spikeball", x: W + 20, y: 0, w: 240, h: 1,  // box spans the whole swing
    amp: 0.55 + 0.25 * t, rate: 2.6 + 1.2 * t, phase: Math.random() * 6
  });
}
function spikeBallPos(o) {
  const a = o.amp * Math.sin(o.phase);
  return { pivotX: o.x + o.w / 2, x: o.x + o.w / 2 + Math.sin(a) * BALL_CHAIN, y: BALL_PIVOT_Y + Math.cos(a) * BALL_CHAIN };
}

// Laser gate: two posts with a beam between them that blinks on and off,
// flickering as a warning just before it turns on. A low beam must be jumped
// and a high one ducked while it's on; while it's off just run through.
const LASER_WARN = 0.25;
function makeLaserGate(t) {
  const low = Math.random() < 0.5;
  const beamY = low ? GROUND_Y - 22 : GROUND_Y - 48;
  obstacles.push({
    type: "laser", x: W + 20, y: beamY - 3, w: 56, h: 6, beamY,
    cycle: 1.7 - 0.3 * t, onTime: 1.0, clock: Math.random() * 2
  });
}
function laserPhase(o) { return o.clock % o.cycle; }
function laserOn(o) { return laserPhase(o) < o.onTime; }
function laserWarning(o) { return laserPhase(o) > o.cycle - LASER_WARN; }

// --- Update ---
function update(dt) {
  const diff = DIFFICULTIES[runDiff];
  speed = Math.min(diff.max, speed + diff.gain * dt);
  distance += speed * dt;
  score = Math.floor(distance / 40) + bonusScore;

  if (waveAt(score) > wave) {
    wave = waveAt(score);
    waveBanner = 2;
    sfx.wave();
  }

  if (Math.floor(score / 100) > lastMilestone) {
    lastMilestone = Math.floor(score / 100);
    flashTime = 0.9;
    sfx.point();
  }

  // Player physics
  jumpBuffer -= dt;
  if (jumpBuffer > 0 && player.onGround) {
    player.y = GROUND_Y - player.standH;  // stand up first if he was ducking
    player.vy = JUMP_VELOCITY;
    player.onGround = false;
    player.attack = 0;  // jumping cancels a swing in progress
    jumpBuffer = 0;
    sfx.jump();
  }
  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;
  if (player.y + player.h >= GROUND_Y) {
    player.vy = 0;
    player.onGround = true;
  }
  // On the ground the feet stay on the floor, so ducking or landing while
  // ducked drops him straight down instead of floating for a few frames
  if (player.onGround) player.y = GROUND_Y - player.h;
  if (player.onGround) player.runPhase += dt * speed / 24;
  player.attack = Math.max(0, player.attack - dt);
  player.attackCooldown = Math.max(0, player.attackCooldown - dt);

  // Spawn obstacles — gap shrinks as speed rises, and the random extra
  // breathing room shrinks each wave so obstacles come steadily closer together
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnObstacle();
    const minGap = 0.6 + 260 / speed;
    spawnTimer = minGap + Math.random() * (0.9 - 0.6 * waveIntensity());
  }

  for (const o of obstacles) {
    if (o.type === "drone") {
      o.x -= speed * o.mul * dt;
      o.spin += dt;
      o.y = o.baseY + Math.sin(o.spin * 3) * o.bob;
    } else if (o.type === "enemy") {
      // A blocked enemy staggers briefly, drifting back with the ground
      o.stagger = Math.max(0, (o.stagger || 0) - dt);
      o.x -= (speed + (o.stagger > 0 ? 0 : o.run)) * dt;
      o.runPhase += dt * (o.run + 250) / 24;
    } else if (o.type === "barrel") {
      o.x -= (speed + o.roll) * dt;
      o.turn -= (speed + o.roll) / o.r * dt;
    } else {
      o.x -= speed * dt;
      if (o.type === "fire") {
        o.phase += o.rate * dt;
        o.h = FIRE_BASE + flameHeight(o);
        o.y = GROUND_Y - o.h;
      } else if (o.type === "spikeball") {
        o.phase += o.rate * dt;
      } else if (o.type === "laser") {
        const wasOn = laserOn(o);
        o.clock += dt;
        if (!wasOn && laserOn(o) && o.x < W && o.x + o.w > 0) sfx.laser();
      }
    }
  }
  obstacles = obstacles.filter((o) => o.x + o.w > -50);

  // The sword hits anything in a box just in front of the player while
  // swinging, but only from the ground. Shields block it once per swing and
  // knock the enemy back a little.
  if (player.attack > 0 && player.onGround) {
    const left = player.x + player.w - 6, right = player.x + player.w + 46;
    const top = player.y - 30;
    for (const o of obstacles) {
      if (o.type !== "enemy" || !(o.x < right && o.x + o.w > left && o.y + o.h > top)) continue;
      if (!o.shield) { killEnemy(o); continue; }
      if (o.blockedSwing === player.swingId) continue;
      o.blockedSwing = player.swingId;
      o.x += 30;
      o.stagger = 0.3;
      popups.push({ x: o.x + o.w / 2, y: o.y - 8, t: 0, text: "BLOCKED" });
      sfx.clang();
    }
    obstacles = obstacles.filter((o) => !o.dead);
  }

  // Jumping over an enemy or drone is worth a bonus: it counts if his feet were
  // above it at some point while it passed under him
  for (const o of obstacles) {
    if (o.type !== "enemy" && o.type !== "drone") continue;
    const under = o.x < player.x + player.w && o.x + o.w > player.x;
    if (under && player.y + player.h <= o.y + 4) o.jumpedOver = true;
    if (o.jumpedOver && !o.bonusGiven && o.x + o.w < player.x) {
      o.bonusGiven = true;
      bonusScore += JUMP_OVER_BONUS;
      popups.push({ x: player.x + player.w / 2, y: player.y - 10, t: 0, text: `+${JUMP_OVER_BONUS}` });
      sfx.bonus();
    }
  }
  for (const p of popups) { p.t += dt; p.y -= 40 * dt; }
  popups = popups.filter((p) => p.t < (p.life || 0.8));

  updateCoins(dt);
  // Slain enemies stay where they fell, so they scroll away with the ground
  for (const c of corpses) {
    for (const p of Object.values(c.points)) { p.x -= speed * dt; p.px -= speed * dt; }
  }
  corpses = corpses.filter((c) => Object.values(c.points).some((p) => p.x > -40));

  for (const c of clouds) {
    c.x -= speed * c.speed * dt;
    if (c.x < -80) { c.x = W + Math.random() * 200; c.y = 30 + Math.random() * 90; }
  }
  for (const g of groundBits) {
    g.x -= speed * dt;
    if (g.x < -10) g.x = W + Math.random() * 40;
  }

  // Collision (hitboxes shrunk a little so it feels fair)
  const pad = 6;
  const px = player.x + pad, py = player.y + pad;
  const pw = player.w - pad * 2, ph = player.h - pad * 2;
  for (const o of obstacles) {
    if (hitsPlayer(o, px, py, pw, ph)) {
      crash(o);
      break;
    }
  }
}

// Does obstacle o touch the (already shrunk) player box?
function hitsPlayer(o, px, py, pw, ph) {
  if (o.type === "spikeball") {
    // Circle against box: nearest point of the box to the ball's centre
    const b = spikeBallPos(o);
    const nx = Math.max(px, Math.min(b.x, px + pw)), ny = Math.max(py, Math.min(b.y, py + ph));
    return Math.hypot(b.x - nx, b.y - ny) < BALL_R - 1;
  }
  if (o.type === "laser") {
    // Only the beam hurts, and only while it's on; the posts are scenery
    return laserOn(o) && px < o.x + o.w - 2 && px + pw > o.x + 2 && py < o.y + o.h && py + ph > o.y;
  }
  return px < o.x + o.w - 4 && px + pw > o.x + 4 && py < o.y + o.h - 4 && py + ph > o.y + 4;
}

// --- Enemies & gold ---
// "+N" with a coin, in gold, popping slightly bigger as it appears
function drawGoldPopup(p) {
  const pop = 1 + 0.35 * Math.max(0, 1 - p.t / 0.15);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(pop, pop);
  ctx.font = "bold 20px 'Courier New', monospace";
  ctx.textAlign = "left";
  const textW = ctx.measureText(p.text).width;
  const left = -(textW + 18) / 2;
  drawCoin({ x: left + 7, y: -6, spin: 0 });
  ctx.lineWidth = 4;
  ctx.lineJoin = "round";
  ctx.strokeStyle = GOLD_EDGE;
  ctx.fillStyle = GOLD;
  ctx.strokeText(p.text, left + 18, 0);
  ctx.fillText(p.text, left + 18, 0);
  ctx.restore();
}

function killEnemy(o) {
  o.dead = true;
  shakeTime = Math.max(shakeTime, 0.1);
  sfx.kill();
  // He's flung away from the sword, upper body first
  corpses.push(makeRagdoll(enemyPose(o), (name) => {
    const upper = UPPER_BODY.has(name);
    return [(upper ? 300 : 170) + Math.random() * 80, upper ? -380 : -180];
  }));
  const count = 1 + Math.floor(Math.random() * 3);
  // Show how much gold he dropped, floating up from where he fell
  popups.push({ x: o.x + o.w / 2, y: o.y - 6, t: 0, text: "+" + count, gold: true, life: 1.1 });
  for (let i = 0; i < count; i++) {
    coins.push({
      x: o.x + o.w / 2,
      y: o.y + 20,
      vx: 40 + Math.random() * 160,   // relative to the ground
      vy: -300 - Math.random() * 220,
      spin: Math.random() * 6
    });
  }
}

function updateCoins(dt) {
  const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
  for (const c of coins) {
    c.spin += dt * 8;
    const dx = cx - c.x, dy = cy - c.y, d = Math.hypot(dx, dy) || 1;
    if (d < 110) {
      // Close coins are pulled in, so jumping over them doesn't miss them
      c.x += (dx / d) * 700 * dt;
      c.y += (dy / d) * 700 * dt;
    } else {
      c.vy += GRAVITY * 0.6 * dt;
      c.x += (c.vx - speed) * dt;
      c.y += c.vy * dt;
      if (c.y > GROUND_Y - 7) { c.y = GROUND_Y - 7; c.vy *= -0.45; c.vx *= 0.6; }
    }
    if (Math.abs(c.x - cx) < player.w / 2 + 14 && Math.abs(c.y - cy) < player.h / 2 + 14) {
      c.taken = true;
      runGold++;
      totalGold++;
      localStorage.setItem("stickgo-gold", totalGold);
      sfx.coin();
    }
  }
  coins = coins.filter((c) => !c.taken && c.x > -20);
}

function gameOver() {
  state = "over";
  if (score > high(runDiff)) {
    highScores[runDiff] = score;
    localStorage.setItem("stickgo-highs", JSON.stringify(highScores));
  }
  releaseDuck();
  document.getElementById("overText").textContent =
    `SCORE ${pad5(score)}   HIGH ${pad5(high(runDiff))} (${DIFFICULTIES[runDiff].label})`;
  document.getElementById("overGold").textContent =
    `WAVE ${wave}   GOLD +${runGold}   TOTAL ${fmt(totalGold)}`;
  showMenu("over");
}

// --- Ragdoll ---
// On a hit the world freezes and the stickman's joints become free points
// held together by bone-length constraints (Verlet integration).
const RAGDOLL_STEP = 1 / 120;
const RAGDOLL_DURATION = 1.3;  // seconds before the game-over menu appears
const BONES = [
  ["head", "neck"], ["neck", "shoulder"], ["shoulder", "hip"],
  ["shoulder", "elbowF"], ["elbowF", "handF"], ["shoulder", "elbowB"], ["elbowB", "handB"],
  ["hip", "kneeF"], ["kneeF", "footF"], ["hip", "kneeB"], ["kneeB", "footB"]
];
// Extra links that keep the head and torso from folding up unnaturally
const BRACES = [["head", "shoulder"]];
const UPPER_BODY = new Set(["head", "neck", "shoulder", "elbowF", "handF", "elbowB", "handB"]);

let ragdoll = null;
let shakeTime = 0;

function crash(obstacle) {
  state = "dying";
  releaseDuck();
  document.body.classList.remove("playing");
  shakeTime = 0.25;
  sfx.hit();

  const pose = getPose();
  // An enemy, the spike ball, or anything flying/beaming at the upper body
  // knocks him backwards; things on the ground trip him forwards
  const knockBack = obstacle.type === "enemy" || obstacle.type === "spikeball" ||
    ((obstacle.type === "drone" || obstacle.type === "laser") && obstacle.y + obstacle.h / 2 < pose.hip.y);
  ragdoll = makeRagdoll(pose, (name) => {
    const upper = UPPER_BODY.has(name);
    let vx = knockBack ? (upper ? -0.45 : 0.25) * speed : (upper ? 0.6 : 0.3) * speed;
    vx += (Math.random() - 0.5) * 60;
    const vy = Math.min(player.vy, 0) * 0.6 - (knockBack ? 220 : 480) * (upper ? 1 : 0.4);
    return [vx, vy];
  });
  ragdoll.clamp = true;  // the player's body stays on screen

  // Collision is detected a few pixels late, so he's slightly inside the rock.
  // Step him back to touching it (hidden by the screen shake).
  if (isSolid(obstacle)) {
    const points = Object.values(ragdoll.points);
    let overlap = 0;
    for (const p of points) {
      const b = rockBounds(obstacle, p.r);
      if (p.y > b.top) overlap = Math.max(overlap, p.x - b.left);
    }
    for (const p of points) { p.x -= overlap; p.px -= overlap; }
  }
}

// Turns a pose into free points; velocity(name) gives each joint's [vx, vy]
function makeRagdoll(pose, velocity) {
  const points = {};
  for (const [name, pt] of Object.entries(pose)) {
    const [vx, vy] = velocity(name);
    points[name] = {
      x: pt.x, y: pt.y,
      px: pt.x - vx * RAGDOLL_STEP, py: pt.y - vy * RAGDOLL_STEP,
      r: name === "head" ? BODY.headR : 2
    };
  }
  const links = [...BONES, ...BRACES].map(([a, b]) =>
    [points[a], points[b], Math.hypot(points[a].x - points[b].x, points[a].y - points[b].y)]);
  return { points, links, time: 0, acc: 0, clamp: false };
}

function updateRagdoll(rd, dt) {
  rd.time += dt;
  rd.acc += dt;
  while (rd.acc >= RAGDOLL_STEP) {
    ragdollStep(rd);
    rd.acc -= RAGDOLL_STEP;
  }
}

function ragdollStep(rd) {
  const pts = Object.values(rd.points);
  const g = GRAVITY * RAGDOLL_STEP * RAGDOLL_STEP;

  for (const p of pts) {
    const vx = (p.x - p.px) * 0.998;
    const vy = (p.y - p.py) * 0.998;
    p.px = p.x;
    p.py = p.y;
    p.x += vx;
    p.y += vy + g;
  }

  for (let i = 0; i < 8; i++) {
    for (const [a, b, len] of rd.links) {
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const k = (d - len) / d / 2;
      a.x += dx * k; a.y += dy * k;
      b.x -= dx * k; b.y -= dy * k;
    }
    for (const p of pts) collidePoint(p, rd.clamp);
  }

  // Ground friction so he skids to a stop instead of sliding forever
  for (const p of pts) {
    if (p.y >= GROUND_Y - p.r - 0.5) p.px = p.x - (p.x - p.px) * 0.8;
  }
}

function collidePoint(p, clampToScreen) {
  if (p.y > GROUND_Y - p.r) p.y = GROUND_Y - p.r;
  if (clampToScreen) p.x = Math.max(p.r, Math.min(W - p.r, p.x));
  // Rocks are solid. Only block a point on the face it crossed this
  // step (using its previous position), so nothing gets flung out sideways.
  for (const o of obstacles) {
    if (!isSolid(o)) continue;
    const b = rockBounds(o, p.r);
    if (!(p.x > b.left && p.x < b.right && p.y > b.top)) continue;
    // Moving a Verlet point also changes its implied velocity, so the previous
    // position moves with it; motion into the face is cancelled.
    if (p.py <= b.top) { p.py += b.top - p.y; p.y = b.top; p.py = Math.max(p.py, p.y); }
    else if (p.px <= b.left) { p.px += b.left - p.x; p.x = b.left; p.px = Math.max(p.px, p.x); }
    else if (p.px >= b.right) { p.px += b.right - p.x; p.x = b.right; p.px = Math.min(p.px, p.x); }
  }
}

function isSolid(o) { return o.type === "rock" || o.type === "spikes" || o.type === "barrel"; }

function rockBounds(o, r) {
  return { left: o.x + 3 - r, right: o.x + o.w - 3 + r, top: o.y + 4 - r };
}

// --- Drawing ---
// Day/night cycle: every 1000 points it fades to night around 700 and back by 1000
const DAY = {
  sky: [247, 247, 247], ink: [83, 83, 83], inkBack: [163, 163, 163], cloud: [224, 224, 224],
  enemy: [45, 28, 28], enemyBack: [150, 112, 112], blade: [120, 136, 152]
};
const NIGHT = {
  sky: [32, 35, 42], ink: [214, 214, 214], inkBack: [118, 118, 118], cloud: [58, 62, 72],
  enemy: [232, 190, 190], enemyBack: [128, 96, 96], blade: [196, 212, 228]
};
const EYE_RED = "#ff2020";
const SHIELD_METAL = "#8b97a3";
const GOLD = "#f5b921", GOLD_EDGE = "#a8740a";
const STARS = Array.from({ length: 24 }, () => ({ x: Math.random() * W, y: 10 + Math.random() * 130 }));
let colors;
let night = 0;

function nightLevel(s) {
  const p = s % 1000;
  return Math.max(0, Math.min(1, (p - 650) / 50, (1000 - p) / 50));
}

function paletteAt(t) {
  const out = {};
  for (const key of Object.keys(DAY)) {
    out[key] = `rgb(${DAY[key].map((v, i) => Math.round(v + (NIGHT[key][i] - v) * t)).join(",")})`;
  }
  return out;
}

function updateColors() {
  const t = nightLevel(score);
  if (colors && t === night) return;
  night = t;
  colors = paletteAt(t);
  // The page around the canvas and the on-screen buttons follow along
  document.documentElement.style.setProperty("--sky", colors.sky);
  document.documentElement.style.setProperty("--ink", colors.ink);
}

function line(x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

// --- Stickman pose ---
// Body proportions (game units)
const BODY = { headR: 8, torso: 18, thigh: 12, shin: 12, upperArm: 10, foreArm: 9 };

// Point at the end of a limb. Angle 0 = straight down, positive = forwards (+x).
function limb(from, angle, len) {
  return { x: from.x + Math.sin(angle) * len, y: from.y + Math.cos(angle) * len };
}

// Builds the joint positions for the current frame of a stickman facing right
// (the player by default; enemies pass themselves and get mirrored).
// legs: [thighAngle, kneeBend], arms: [upperArmAngle, elbowBend]; index 0 = front, 1 = back
function getPose(p = player) {
  const ph = p.runPhase;
  let lean, legs, arms;

  if (!p.onGround) {
    // Jump: front knee driven up, back leg trailing, arms reaching
    const t = Math.max(-1, Math.min(1, p.vy / 800));  // -1 rising .. 1 falling
    lean = 0.15;
    legs = [[1.2 - 0.3 * t, 1.9 - 0.4 * t], [-0.35 + 0.2 * t, 0.9]];
    arms = [[2.3 - 0.4 * t, 0.5], [-0.9, 1.2]];
  } else if (p.ducking) {
    // Low crouch-run, leaning far forward
    const s = Math.sin(ph);
    lean = 1.15;
    legs = [[0.9 + 0.45 * s, 1.9], [0.9 - 0.45 * s, 1.9]];
    arms = [[1.1 - 0.4 * s, 1.3], [1.1 + 0.4 * s, 1.3]];
  } else {
    // Run cycle: thighs swing in opposite phase, the knee folds most while
    // the leg is swinging forward, arms swing opposite to the legs
    lean = 0.22;
    legs = [0, Math.PI].map((off) => {
      const a = ph + off;
      return [0.65 * Math.sin(a), 0.2 + 1.35 * Math.max(0, Math.cos(a - 0.5))];
    });
    arms = [0, Math.PI].map((off) => [-0.75 * Math.sin(ph + off), 1.6]);
  }
  if (p.attack > 0) {
    // Sword swing: the front arm sweeps from over the head down to the front
    const t = 1 - p.attack / ATTACK_DURATION;
    arms[0] = [SWING_FROM - SWING_ARC * (1 - (1 - t) * (1 - t)), 0.15];
  }

  // Place hips so the lowest foot rests on the bottom of the player box.
  // This makes the body bob naturally as the legs move.
  const legDrop = ([t, bend]) => BODY.thigh * Math.cos(t) + BODY.shin * Math.cos(t - bend);
  const hip = {
    x: p.x + p.w / 2 - 2,
    y: p.y + p.h - Math.max(legDrop(legs[0]), legDrop(legs[1]))
  };
  const neck = limb(hip, Math.PI - lean, BODY.torso);
  const head = limb(neck, Math.PI - lean, BODY.headR + 2);
  const shoulder = limb(neck, -lean, 3);

  const pose = { head, neck, shoulder, hip };
  ["F", "B"].forEach((side, i) => {
    const [thigh, bend] = legs[i];
    pose["knee" + side] = limb(hip, thigh, BODY.thigh);
    pose["foot" + side] = limb(pose["knee" + side], thigh - bend, BODY.shin);
    const [upper, elbow] = arms[i];
    pose["elbow" + side] = limb(shoulder, upper, BODY.upperArm);
    pose["hand" + side] = limb(pose["elbow" + side], upper + elbow, BODY.foreArm);
  });
  return pose;
}

// Enemies run towards the player, so their pose is mirrored to face left
function enemyPose(o) {
  const pose = getPose(o);
  const cx = o.x + o.w / 2;
  for (const pt of Object.values(pose)) pt.x = 2 * cx - pt.x;
  return pose;
}

function drawFigure(pts, ink = colors.ink, inkBack = colors.inkBack) {
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  const chain = (color, ...names) => {
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[names[0]].x, pts[names[0]].y);
    for (const n of names.slice(1)) ctx.lineTo(pts[n].x, pts[n].y);
    ctx.stroke();
  };

  // Far side first (lighter, for depth) so the near side draws over it
  chain(inkBack, "hip", "kneeB", "footB");
  chain(inkBack, "shoulder", "elbowB", "handB");
  chain(ink, "neck", "shoulder", "hip");
  chain(ink, "hip", "kneeF", "footF");
  chain(ink, "shoulder", "elbowF", "handF");

  ctx.fillStyle = ink;
  ctx.beginPath();
  ctx.arc(pts.head.x, pts.head.y, BODY.headR, 0, Math.PI * 2);
  ctx.fill();
}

// Sword angles use the same convention as limb(): 0 = down, PI = straight up
const SWING_FROM = 3.6;   // upper arm angle at the start of a swing (raised behind the head)
const SWING_ARC = 2.9;    // how far it sweeps forwards

function drawSword(pts, swinging) {
  const hand = pts.handF, elbow = pts.elbowF;
  const forearm = Math.atan2(hand.x - elbow.x, hand.y - elbow.y);
  // Held pointing up and forwards while running; in line with the arm mid-swing
  const angle = forearm + (swinging ? 0 : 0.9);
  const skin = equippedSkin();
  const tip = limb(hand, angle, skin.len);

  if (swinging) {
    // Faint arc showing the path of the blade
    const sh = pts.shoulder;
    const r = Math.hypot(tip.x - sh.x, tip.y - sh.y);
    let tipAngle = Math.atan2(tip.x - sh.x, tip.y - sh.y);
    if (tipAngle < 0) tipAngle += Math.PI * 2;  // the swing starts past straight up
    const now = Math.PI / 2 - tipAngle;         // limb() angle -> canvas arc angle
    const from = Math.max(Math.PI / 2 - (SWING_FROM + 0.15), now - 1.4);
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = skin.glow || skin.blade || colors.blade;
    ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(sh.x, sh.y, r, from, now); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  drawBlade(ctx, hand, angle, skin);
}

// --- Sword drawing ---
// Blade outlines. Each returns how far the top and bottom edges stick out (1 = half the
// skin's width) at t along the blade: 0 at the guard, 1 at the tip.
const table = (pts) => (t) => {
  for (let i = 1; i < pts.length; i++) {
    if (t <= pts[i][0]) {
      const [t0, a0, b0] = pts[i - 1], [t1, a1, b1] = pts[i];
      const f = (t - t0) / (t1 - t0 || 1);
      return [a0 + (a1 - a0) * f, b0 + (b1 - b0) * f];
    }
  }
  const last = pts[pts.length - 1];
  return [last[1], last[2]];
};
const PROFILES = {
  blade:    table([[0, 1, 1], [0.8, 1, 1], [1, 0, 0]]),
  bokken:   table([[0, 0.9, 0.9], [0.94, 1, 1], [1, 0, 0]]),
  saber:    table([[0, 1, 1], [0.7, 1, 1], [1, 0, 0]]),
  cleaver:  table([[0, 0.55, 0.55], [0.1, 1, 1], [0.94, 1, 0.92], [1, 0.9, 0.15]]),
  machete:  table([[0, 0.5, 0.5], [0.25, 0.6, 0.6], [0.8, 1, 1], [0.93, 1, 0.9], [1, 0, 0]]),
  broad:    table([[0, 0.6, 0.6], [0.1, 1, 1], [0.85, 1, 1], [1, 0, 0]]),
  shard:    table([[0, 0.5, 0.5], [0.12, 1, 0.7], [0.3, 0.75, 1], [0.5, 1, 0.8],
                   [0.7, 0.7, 0.95], [0.88, 0.55, 0.4], [1, 0, 0]]),
  ice:      table([[0, 0.6, 0.6], [0.1, 1, 0.9], [0.28, 0.7, 1], [0.45, 1, 0.75],
                   [0.62, 0.7, 0.95], [0.8, 0.8, 0.5], [1, 0, 0]]),
  laser:    table([[0, 1, 1], [0.96, 1, 1], [1, 0.3, 0.3]]),
  // Saw teeth along the top edge
  serrated: (t) => {
    const k = Math.min(1, (1 - t) / 0.12), f = (t * 6) % 1;
    return [k * (0.8 + 0.5 * f), k * 0.8];
  },
  // Wavy, like a flame
  flame: (t) => {
    const k = Math.min(1, (1 - t) / 0.15);
    return [k * (0.8 + 0.25 * Math.sin(t * 14)), k * (0.8 + 0.25 * Math.sin(t * 14 + 2))];
  }
};
const SWORD_START = 4;  // the blade starts this far from the hand, where the guard sits

function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// Animated effects around the blade. at(t, v) = a point t along the blade, v to the side.
function swordFx(g, skin, clock, at, w) {
  g.save();
  g.strokeStyle = g.fillStyle = skin.fxColor || "#ffffff";
  switch (skin.fx) {
    case "electric": {
      const seed = Math.floor(clock * 16);
      g.lineWidth = 0.5;
      for (let k = 0; k < 2; k++) {
        g.beginPath();
        for (let i = 0; i <= 10; i++) {
          const p = at(0.06 + 0.9 * i / 10, (rnd(seed * 7 + i + k * 31) - 0.5) * w * 1.7);
          i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y);
        }
        g.stroke();
      }
      break;
    }
    case "flame":
      for (let i = 0; i < 7; i++) {
        const t = 0.1 + 0.8 * i / 6;
        const h = 0.5 + 0.5 * Math.sin(clock * 9 + i * 2.1);
        const l = at(t - 0.03, w * 0.3), r = at(t + 0.05, w * 0.3);
        const apex = at(t + 0.035, w * 0.5 + 1.4 + 2.4 * h);
        g.globalAlpha = 0.85;
        g.beginPath(); g.moveTo(l.x, l.y); g.lineTo(apex.x, apex.y); g.lineTo(r.x, r.y); g.fill();
      }
      for (let i = 0; i < 4; i++) {   // embers drifting up
        const f = (clock * 0.9 + i * 0.27) % 1;
        const p = at(0.2 + 0.2 * i, w * 0.5 + 3 + 6 * f);
        g.globalAlpha = 1 - f;
        g.beginPath(); g.arc(p.x, p.y, 0.5, 0, Math.PI * 2); g.fill();
      }
      break;
    case "slime":
      g.lineWidth = 0.9;
      for (let i = 0; i < 3; i++) {
        const drop = 1.2 + 0.8 * (0.5 + 0.5 * Math.sin(clock * 2 + i * 2));
        const a = at(0.3 + 0.25 * i, -w * 0.45), b = at(0.3 + 0.25 * i, -w * 0.45 - drop);
        g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
        g.beginPath(); g.arc(b.x, b.y, 0.9, 0, Math.PI * 2); g.fill();
      }
      break;
    case "wisps":
      g.lineWidth = 0.45;
      g.globalAlpha = 0.6;
      for (let k = 0; k < 3; k++) {
        g.beginPath();
        for (let i = 0; i <= 14; i++) {
          const t = 0.05 + 0.95 * i / 14;
          const p = at(t, (k - 1) * w * 0.9 + 1.3 * Math.sin(t * 9 - clock * 7 + k * 2.1));
          i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y);
        }
        g.stroke();
      }
      break;
    case "sparkle":
      g.lineWidth = 0.4;
      for (let i = 0; i < 5; i++) {
        const s = Math.max(0, Math.sin(clock * 4 + i * 1.9)) * 1.5;
        if (s < 0.1) continue;
        const side = rnd(i + 9) > 0.5 ? 1 : -1;
        const p = at(0.15 + 0.8 * rnd(i + 3), side * (w * 0.4 + 1.2));
        g.beginPath();
        g.moveTo(p.x - s, p.y); g.lineTo(p.x + s, p.y);
        g.moveTo(p.x, p.y - s); g.lineTo(p.x, p.y + s);
        g.stroke();
      }
      break;
    case "void":
      for (let i = 0; i < 6; i++) {
        const p = at(((i / 6) + clock * 0.2) % 1, Math.sin(clock * 3 + i * 1.3) * w * 0.7);
        g.globalAlpha = 0.5 + 0.5 * Math.sin(clock * 4 + i);
        g.beginPath(); g.arc(p.x, p.y, 0.6, 0, Math.PI * 2); g.fill();
      }
      break;
    case "rust":
      g.globalAlpha = 0.8;
      for (const [t, v, r] of [[0.3, 0.2, 0.9], [0.55, -0.4, 0.7], [0.75, 0.3, 0.6]]) {
        const p = at(t, v);
        g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.fill();
      }
      break;
    case "laser": {
      g.globalAlpha = 0.85 + 0.15 * Math.sin(clock * 40);
      g.strokeStyle = "#ffffff";
      g.lineWidth = skin.width * 0.38;
      const a = at(0.02, 0), b = at(0.97, 0);
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
      break;
    }
  }
  g.restore();
}

// Draws a sword skin held at `hand`, pointing along `angle` (limb() convention).
// Also used by the shop previews, which pass their own canvas context.
function drawBlade(g, hand, angle, skin, clock = performance.now() / 1000) {
  const S = SWORD_START, L = skin.len - S, w = skin.width;
  const profile = PROFILES[skin.shape || "blade"];
  const bend = (skin.curve || 0) * skin.len;
  // Point on the blade: t runs from the guard (0) to the tip (1), v is the offset to the side
  const at = (t, v = 0) => ({ x: S + L * t, y: 2 * t * (1 - t) * bend + v });

  const N = 28, top = [], bot = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, [a, b] = profile(t);
    top.push(at(t, a * w / 2));
    bot.push(at(t, -b * w / 2));
  }
  const outline = () => {
    g.beginPath();
    top.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)));
    for (let i = N; i >= 0; i--) g.lineTo(bot[i].x, bot[i].y);
    g.closePath();
  };

  g.save();
  g.translate(hand.x, hand.y);
  // From here x runs along the blade and y across it
  g.transform(Math.sin(angle), Math.cos(angle), Math.cos(angle), -Math.sin(angle), 0, 0);
  g.lineCap = "round";
  g.lineJoin = "round";

  if (skin.glow) {
    const pulse = 0.8 + 0.2 * Math.sin(clock * 5);
    g.strokeStyle = skin.glow;
    outline();
    g.globalAlpha = 0.18 * pulse; g.lineWidth = 4.5; g.stroke();
    g.globalAlpha = 0.3 * pulse; g.lineWidth = 2.2; g.stroke();
    g.globalAlpha = 1;
  }

  let fill = skin.blade || colors.blade;
  if (skin.tip) {
    const grad = g.createLinearGradient(S, 0, S + L, 0);
    grad.addColorStop(0, fill);
    grad.addColorStop(1, skin.tip);
    fill = grad;
  }
  g.fillStyle = fill;
  outline();
  g.fill();
  if (skin.edge) { g.strokeStyle = skin.edge; g.lineWidth = 0.7; g.stroke(); }

  if (skin.hi) {   // light ridge down the middle
    g.strokeStyle = skin.hi;
    g.globalAlpha = 0.75;
    g.lineWidth = Math.max(0.5, w * 0.16);
    g.beginPath();
    for (let i = 0; i <= 8; i++) {
      const p = at(0.1 + 0.72 * i / 8);
      i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y);
    }
    g.stroke();
    g.globalAlpha = 1;
  }

  if (skin.fx) swordFx(g, skin, clock, at, w);

  g.strokeStyle = skin.guard || colors.ink;
  if (skin.hilt) {
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(-3, 0); g.lineTo(S + 1, 0); g.stroke();
  }
  g.beginPath();
  if (skin.wing) {
    g.lineWidth = 1.8;
    for (const s of [1, -1]) { g.moveTo(S, 0); g.quadraticCurveTo(S - 1, s * 4, S + 3, s * 7.5); }
  } else {
    g.lineWidth = 3;
    g.moveTo(S, -5); g.lineTo(S, 5);
  }
  g.stroke();
  if (skin.gem) {
    g.fillStyle = skin.gem;
    g.beginPath(); g.arc(S, 0, 1.2, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}

// Shop card picture: the sword lying almost flat, with a short handle
function drawSwordPreview(canvas, skin) {
  const g = canvas.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, canvas.width, canvas.height);
  const scale = canvas.width / 44;  // 44 game units across, ~17 down
  g.setTransform(scale, 0, 0, scale, 0, 0);
  const angle = 1.64;  // pointing right, a touch upwards
  const hand = { x: 7, y: 9 };
  g.lineCap = "round";
  g.strokeStyle = skin.guard || "#8a8a8a";
  g.lineWidth = 3;
  const butt = limb(hand, angle, -3);
  g.beginPath(); g.moveTo(butt.x, butt.y); g.lineTo(hand.x, hand.y); g.stroke();
  drawBlade(g, hand, angle, skin.blade ? skin : { ...skin, blade: "#9fb0c2", guard: "#cfcfcf" });
}

function drawStickman() {
  const pts = ragdoll ? ragdoll.points : getPose();
  drawFigure(pts);
  drawSword(pts, !ragdoll && player.attack > 0);
}

function drawEnemy(pts, alive, shield) {
  drawFigure(pts, colors.enemy, colors.enemyBack);
  if (shield) {
    // Round shield held out in front (he faces left), seen side-on
    const sx = pts.hip.x - 11, sy = pts.shoulder.y + 13;
    ctx.fillStyle = SHIELD_METAL;
    ctx.strokeStyle = colors.enemy;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(sx, sy, 5, 15, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = colors.enemy;
    ctx.beginPath(); ctx.arc(sx - 1, sy, 2, 0, Math.PI * 2); ctx.fill();
  }
  const h = pts.head;
  // Angry brows slanting down towards the middle, over glowing red eyes
  // (he faces left, so the face is on the left of the head)
  ctx.strokeStyle = colors.sky;
  ctx.lineWidth = 1.6;
  line(h.x - 7.5, h.y - 5.5, h.x - 3.5, h.y - 2.8);
  line(h.x + 2, h.y - 5.5, h.x - 1.5, h.y - 2.8);
  ctx.fillStyle = EYE_RED;
  if (alive) { ctx.shadowColor = EYE_RED; ctx.shadowBlur = 6; }
  ctx.beginPath(); ctx.arc(h.x - 4.8, h.y - 0.8, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(h.x - 0.2, h.y - 0.8, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // Snarl
  ctx.strokeStyle = colors.sky;
  ctx.lineWidth = 1.2;
  line(h.x - 5, h.y + 4, h.x - 1.5, h.y + 3.2);
}

function drawCoin(c) {
  // Spinning: the coin's width follows the spin
  const w = Math.max(1.2, Math.abs(Math.cos(c.spin)) * 6);
  ctx.fillStyle = GOLD;
  ctx.strokeStyle = GOLD_EDGE;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(c.x, c.y, w, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}

function drawObstacle(o) {
  ctx.fillStyle = colors.ink;
  ctx.strokeStyle = colors.ink;
  if (o.type === "rock") {
    const each = (o.w - 4) / o.count;
    for (let i = 0; i < o.count; i++) {
      const bx = o.x + 2 + i * each;
      // Spiky rock
      ctx.beginPath();
      ctx.moveTo(bx, GROUND_Y);
      ctx.lineTo(bx + each * 0.15, o.y + o.h * 0.35);
      ctx.lineTo(bx + each * 0.5, o.y);
      ctx.lineTo(bx + each * 0.85, o.y + o.h * 0.3);
      ctx.lineTo(bx + each, GROUND_Y);
      ctx.closePath();
      ctx.fill();
    }
  } else if (o.type === "enemy") {
    drawEnemy(enemyPose(o), true, o.shield);
  } else if (o.type === "spikes") {
    // Wooden plank with a row of metal spikes and a couple of nails
    const plankTop = GROUND_Y - 8;
    ctx.fillRect(o.x, plankTop, o.w, 8);
    const count = Math.max(2, Math.round(o.w / 14));
    const each = o.w / count;
    ctx.fillStyle = colors.blade;
    ctx.lineWidth = 1;
    for (let i = 0; i < count; i++) {
      const bx = o.x + i * each;
      ctx.beginPath();
      ctx.moveTo(bx + each * 0.12, plankTop);
      ctx.lineTo(bx + each * 0.5, o.y);
      ctx.lineTo(bx + each * 0.88, plankTop);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = colors.sky;
    ctx.fillRect(o.x + 4, plankTop + 3, 2, 2);
    ctx.fillRect(o.x + o.w - 6, plankTop + 3, 2, 2);
  } else if (o.type === "barrel") {
    // Rolling barrel: its bands turn as it rolls
    const cx = o.x + o.r, cy = o.y + o.r;
    ctx.beginPath(); ctx.arc(cx, cy, o.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = colors.sky;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, o.r * 0.55, 0, Math.PI * 2); ctx.stroke();
    for (const a of [o.turn, o.turn + Math.PI / 2]) {
      line(cx - Math.cos(a) * o.r * 0.9, cy - Math.sin(a) * o.r * 0.9, cx + Math.cos(a) * o.r * 0.9, cy + Math.sin(a) * o.r * 0.9);
    }
  } else if (o.type === "fire") {
    // Stone ring with three flickering flames
    const baseTop = GROUND_Y - FIRE_BASE;
    ctx.fillRect(o.x, baseTop, o.w, FIRE_BASE);
    ctx.strokeStyle = colors.sky;
    ctx.lineWidth = 1.5;
    for (let sx = o.x + 11; sx < o.x + o.w - 4; sx += 11) line(sx, baseTop + 1, sx, GROUND_Y - 1);
    const fh = flameHeight(o);
    [[0.25, 0.75], [0.5, 1], [0.75, 0.8]].forEach(([at, size], i) => {
      const h = fh * size * (0.9 + 0.1 * Math.sin(o.phase * 3 + i * 2));
      const cx = o.x + o.w * at, fw = o.w * 0.17;
      for (const [color, k] of [["#ff7a1a", 1], ["#ffd23f", 0.55]]) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(cx - fw * k, baseTop);
        ctx.quadraticCurveTo(cx - fw * k, baseTop - h * k * 0.5, cx, baseTop - h * k);
        ctx.quadraticCurveTo(cx + fw * k, baseTop - h * k * 0.5, cx + fw * k, baseTop);
        ctx.closePath();
        ctx.fill();
      }
    });
  } else if (o.type === "spikeball") {
    // Beam mount, chain, and a spiked ball
    const b = spikeBallPos(o);
    ctx.fillRect(b.pivotX - 16, BALL_PIVOT_Y - 7, 32, 5);
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    line(b.pivotX, BALL_PIVOT_Y - 2, b.x, b.y);
    ctx.setLineDash([]);
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2 + o.phase * 0.3;
      const tipX = b.x + Math.cos(a) * (BALL_R + 6), tipY = b.y + Math.sin(a) * (BALL_R + 6);
      ctx.moveTo(b.x + Math.cos(a - 0.3) * BALL_R, b.y + Math.sin(a - 0.3) * BALL_R);
      ctx.lineTo(tipX, tipY);
      ctx.lineTo(b.x + Math.cos(a + 0.3) * BALL_R, b.y + Math.sin(a + 0.3) * BALL_R);
    }
    ctx.fill();
    ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2); ctx.fill();
  } else if (o.type === "laser") {
    // Two posts (scenery) with emitters; the beam glows red while on and
    // flickers faintly as a warning just before switching on
    const postTop = GROUND_Y - 74;
    ctx.fillStyle = colors.inkBack;
    ctx.fillRect(o.x - 2, postTop, 5, 74);
    ctx.fillRect(o.x + o.w - 3, postTop, 5, 74);
    const on = laserOn(o);
    ctx.fillStyle = on ? EYE_RED : colors.ink;
    ctx.fillRect(o.x + 2, o.beamY - 3, 4, 6);
    ctx.fillRect(o.x + o.w - 6, o.beamY - 3, 4, 6);
    ctx.strokeStyle = EYE_RED;
    if (on) {
      ctx.shadowColor = EYE_RED; ctx.shadowBlur = 8;
      ctx.lineWidth = 3;
      line(o.x + 6, o.beamY, o.x + o.w - 6, o.beamY);
      ctx.shadowBlur = 0;
    } else if (laserWarning(o) && Math.sin(o.clock * 70) > 0) {
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 1;
      line(o.x + 6, o.beamY, o.x + o.w - 6, o.beamY);
      ctx.globalAlpha = 1;
    }
  } else {
    // Quadcopter drone: body, camera underneath, two spinning rotors, blinking light
    const top = o.y;
    ctx.lineWidth = 2;
    line(o.x + 6, top + 9, o.x + 34, top + 9);           // arms
    line(o.x + 6, top + 9, o.x + 6, top + 4);            // rotor posts
    line(o.x + 34, top + 9, o.x + 34, top + 4);
    ctx.fillRect(o.x + 11, top + 7, 18, 8);
    ctx.beginPath(); ctx.arc(o.x + 20, top + 17, 3.5, 0, Math.PI * 2); ctx.fill();  // camera
    for (const rx of [o.x + 6, o.x + 34]) {
      const blur = 3 + Math.abs(Math.sin(o.spin * 40 + rx)) * 6;
      ctx.beginPath(); ctx.ellipse(rx, top + 3, blur, 1.6, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (Math.sin(o.spin * 12) > 0) {
      ctx.fillStyle = EYE_RED;
      ctx.beginPath(); ctx.arc(o.x + 13, top + 11, 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawCloud(c) {
  ctx.fillStyle = colors.cloud;
  ctx.beginPath();
  ctx.arc(c.x, c.y, 12, 0, Math.PI * 2);
  ctx.arc(c.x + 16, c.y - 6, 16, 0, Math.PI * 2);
  ctx.arc(c.x + 34, c.y, 12, 0, Math.PI * 2);
  ctx.fill();
}

function pad5(n) { return String(n).padStart(5, "0"); }

function draw() {
  updateColors();
  ctx.fillStyle = colors.sky;
  ctx.fillRect(0, 0, W, H);

  // Moon and stars fade in at night
  if (night > 0) {
    ctx.globalAlpha = night;
    ctx.fillStyle = colors.ink;
    for (const s of STARS) ctx.fillRect(s.x, s.y, 2, 2);
    ctx.beginPath(); ctx.arc(W * 0.72, 55, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = colors.sky;
    ctx.beginPath(); ctx.arc(W * 0.72 + 7, 50, 12, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.save();
  if (shakeTime > 0) {
    const m = shakeTime * 16;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  clouds.forEach(drawCloud);

  // Ground
  ctx.strokeStyle = colors.ink;
  ctx.lineWidth = 2;
  line(0, GROUND_Y, W, GROUND_Y);
  ctx.fillStyle = colors.ink;
  for (const g of groundBits) ctx.fillRect(g.x, g.y, g.w, 2);

  for (const c of corpses) drawEnemy(c.points, false);
  obstacles.forEach(drawObstacle);
  coins.forEach(drawCoin);
  drawStickman();
  ctx.fillStyle = colors.ink;
  ctx.font = "bold 16px 'Courier New', monospace";
  ctx.textAlign = "center";
  for (const p of popups) {
    const life = p.life || 0.8;
    ctx.globalAlpha = Math.min(1, (life - p.t) / 0.3);
    if (p.gold) drawGoldPopup(p);
    else {
      ctx.fillStyle = colors.ink;
      ctx.font = "bold 16px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText(p.text, p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Gold collected this run, under the score
  drawCoin({ x: W - 100, y: 56, spin: 0 });
  ctx.fillStyle = colors.ink;
  ctx.font = "bold 18px 'Courier New', monospace";
  ctx.textAlign = "right";
  ctx.fillText(`x ${String(runGold).padStart(3, "0")}`, W - 20, 62);

  // Current wave, plus a big banner for a moment when a new one starts
  ctx.textAlign = "center";
  ctx.font = "bold 18px 'Courier New', monospace";
  ctx.fillText(`WAVE ${wave}`, W / 2, 36);
  if (waveBanner > 0) {
    ctx.globalAlpha = Math.min(1, waveBanner / 0.5);
    ctx.font = "bold 40px 'Courier New', monospace";
    ctx.fillText(`WAVE ${wave}`, W / 2, 115);
    ctx.font = "bold 16px 'Courier New', monospace";
    ctx.fillText("IT GETS HARDER...", W / 2, 140);
    ctx.globalAlpha = 1;
  }

  // Score (the current score blinks for a moment every 100 points)
  ctx.fillStyle = colors.ink;
  ctx.font = "bold 20px 'Courier New', monospace";
  ctx.textAlign = "right";
  const showScore = flashTime <= 0 || Math.floor(flashTime * 8) % 2 === 0;
  ctx.fillText(`HI ${pad5(high(runDiff))}  ${showScore ? pad5(score) : "     "}`, W - 20, 36);
}

// --- Main loop ---
function loop(time) {
  const dt = Math.min(0.033, (time - (lastTime ?? time)) / 1000);
  lastTime = time;
  if (state === "running") {
    const steps = Math.ceil(dt / PHYSICS_STEP);
    for (let i = 0; i < steps && state === "running"; i++) update(dt / steps);
  }
  if (ragdoll) {
    updateRagdoll(ragdoll, dt);
    if (state === "dying" && ragdoll.time >= RAGDOLL_DURATION) gameOver();
  }
  for (const c of corpses) updateRagdoll(c, dt);
  if (shakeTime > 0) shakeTime -= dt;
  if (flashTime > 0) flashTime -= dt;
  if (waveBanner > 0 && state === "running") waveBanner -= dt;
  draw();
  requestAnimationFrame(loop);
}

reset();
refreshSettingsLabels();
showMenu("main");
requestAnimationFrame(loop);
</script>
