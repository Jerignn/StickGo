  portals.push({ x: fromLeft ? 52 : W - 52, fromLeft, kind: pickKind(), t: 0, spawned: false });
  sfx.warn();
}

function spawnFoe(portal) {
  const kind = portal.kind, fromLeft = portal.fromLeft;
  const d = FOES[kind];
  burst(portal.x, GROUND_Y - 40, 10, "#b27bff", 200);
  foes.push(person({
    type: kind, kind, look: d.look, scale: d.scale || undefined, age: 0,
    x: portal.x - d.w / 2, y: GROUND_Y - d.h, w: d.w, h: d.h, shield: !!d.shield,
    hp: d.hp, maxHp: d.hp, stand: d.stand, speed: d.speed * DIFF_MUL[runDiff] * (0.9 + Math.random() * 0.2),
    dir: fromLeft ? 1 : -1, ai: "walk", timer: 0, stagger: 0, flash: 0, turn: 0, phaseT: Math.random() * 2, solid: true
  }));
  if (kind === "boss") {
    bossBanner = { title: "THE WARLORD", sub: "HE CHARGES AND SLAMS", t: 2.4 };
    sfx.boss();
  }
}

// --- Enemy behaviour ---
function updateFoes(dt0) {
  const pcx = player.x + player.w / 2;
  for (const o of foes) {
    const dt = dt0 * foeTime(o);   // slowed or frozen by a sword perk
    const d = FOES[o.kind];
    const ocx = o.x + o.w / 2, dx = pcx - ocx, dist = Math.abs(dx), toward = dx >= 0 ? 1 : -1;
    o.stagger = Math.max(0, o.stagger - dt);
    o.flash = Math.max(0, o.flash - dt);
    o.age += dt;
    o.timer += dt;
    if (o.kind === "ghost") { o.phaseT += dt; o.solid = o.phaseT % 1.9 < 1.1; }   // flickers in and out
    o.windup = o.ai === "throw" ? 1 : 0;           // read by the bomber's pose
    o.holding = o.kind === "bomber" && (o.ai === "throw" || o.ai === "walk");

    switch (o.ai) {
      case "walk": {
        if (o.stagger > 0) break;
        if (o.shield) {   // a guard turns slowly: that's the moment to hit him from behind
          if (toward !== o.dir) { o.turn += dt; if (o.turn >= 0.7) { o.dir = toward; o.turn = 0; } } else o.turn = 0;
        } else o.dir = toward;
        if (dist > o.stand) {
          // Don't walk through a mate who is already closer to the hero on the same side
          const blocked = foes.some((p) => p !== o && (p.x + p.w / 2 - pcx) * (ocx - pcx) > 0 &&
            Math.abs(p.x + p.w / 2 - pcx) < dist && Math.abs(p.x - o.x) < o.w);
          if (!blocked) {
            o.x += o.dir * o.speed * dt;
            o.runPhase += dt * (o.speed + 120) / 24;
          }
        } else {
          o.timer = 0;
          if (o.kind === "ninja" || (o.kind === "boss" && Math.random() < 0.5)) o.ai = "warn";
          else if (o.kind === "archer") o.ai = "aim";
          else if (o.kind === "bomber") o.ai = "throw";
          else { o.ai = "windup"; o.attack = ATTACK_DURATION; }   // arm held up, ready to swing / slam
        }
        break;
      }
      case "windup":
        if (o.timer >= d.windup) {
          o.timer = 0;
          o.ai = "strike";
          if (o.kind === "brute" || o.kind === "boss") {
            // Slam: a shockwave runs along the ground both ways. Jump it.
            sfx.slam();
            shakeTime = Math.max(shakeTime, 0.25);
            burst(ocx, GROUND_Y - 4, 12, "#ffb04a", 260);
            shocks.push({ x: ocx, dir: -1, dist: 0, dmg: d.dmg }, { x: ocx, dir: 1, dist: 0, dmg: d.dmg });
          } else if (o.solid && dist < 54 && player.y + player.h > GROUND_Y - 30) {
            hurtPlayer(d.dmg, ocx);   // a jump clears the swing; so does being somewhere else
          }
        }
        break;
      case "strike":
        o.attack = Math.max(0, ATTACK_DURATION - o.timer);
        if (o.timer >= ATTACK_DURATION) { o.ai = "recover"; o.timer = 0; o.attack = 0; }
        break;
      case "warn":   // flashes red, then charges through where he was standing
        o.dir = toward;
        o.flash = 0.1;
        if (o.timer >= d.windup) { o.ai = "charge"; o.timer = 0; o.chargeDir = toward; o.chargeHit = false; sfx.dash(); }
        break;
      case "charge":
        o.x += o.chargeDir * 560 * dt;
        o.runPhase += dt * 40;
        if (!o.chargeHit && dist < 28 && player.y + player.h > GROUND_Y - 30) { o.chargeHit = true; hurtPlayer(d.dmg, ocx); }
        if (o.timer >= 0.5 || o.x < -10 || o.x + o.w > W + 10) { o.ai = "recover"; o.timer = 0; o.x = Math.max(-10, Math.min(W + 10 - o.w, o.x)); }
        break;
      case "aim":   // draws the bow, then an arrow flies along the ground at chest height
        o.dir = toward;
        o.draw = Math.min(1, o.timer / d.windup);
        if (o.timer >= d.windup) {
          arrows.push({ x: ocx + o.dir * 20, y: GROUND_Y - 46, vx: o.dir * 430, dmg: d.dmg });
          sfx.arrow();
          o.draw = 0; o.ai = "recover"; o.timer = 0;
        }
        break;
      case "throw":  // lobs a bomb at where the hero is standing
        o.dir = toward;
        if (o.timer >= d.windup) {
          bombs.push({ x: ocx, y: o.y + 14, x0: ocx, y0: o.y + 14, tx: pcx, t: 0, dmg: d.dmg });
          o.ai = "recover"; o.timer = 0;
        }
        break;
      default:   // recover
        if (o.timer >= d.rec) { o.ai = "walk"; o.timer = 0; }
    }
  }
}

function updateProjectiles(dt) {
  const pcx = player.x + player.w / 2;
  for (const a of arrows) {
    a.x += a.vx * dt;
    if (Math.abs(a.x - pcx) < 22 && a.y > player.y + 6 && a.y < player.y + player.h) {
      hurtPlayer(a.dmg, a.x - Math.sign(a.vx) * 20);
      if (player.hurt > 0) a.gone = true;
    }
    if (a.x < -30 || a.x > W + 30) a.gone = true;
  }
  arrows = arrows.filter((a) => !a.gone);

  for (const b of bombs) {
    b.t += dt;
    const flight = 0.9, u = Math.min(1, b.t / flight);
    b.x = b.x0 + (b.tx - b.x0) * u;
    b.y = b.y0 + (GROUND_Y - 8 - b.y0) * u - 90 * 4 * u * (1 - u);
    if (b.t >= flight + 0.5) {   // lands, sizzles, then goes off
      b.gone = true;
      blasts.push({ x: b.x, t: 0, r: 52, dmg: b.dmg, hit: false });
      sfx.boom();
      shakeTime = Math.max(shakeTime, 0.2);
    }
  }
  bombs = bombs.filter((b) => !b.gone);

  for (const b of blasts) {
    b.t += dt;
    if (!b.hit && Math.abs(pcx - b.x) < b.r + 8 && player.y + player.h > GROUND_Y - 50) { b.hit = true; hurtPlayer(b.dmg, b.x); }
  }
  blasts = blasts.filter((b) => b.t < 0.35);

  for (const s of shocks) {
    s.x += s.dir * 300 * dt;
    s.dist += 300 * dt;
    if (!s.hit && Math.abs(s.x - pcx) < 20 && player.y + player.h > GROUND_Y - 22) { s.hit = true; hurtPlayer(s.dmg, s.x - s.dir * 20); }
  }
  shocks = shocks.filter((s) => s.dist < 360);
}

// --- Hero ---
function hurtPlayer(dmg, fromX) {
  if (state !== "running" || player.hurt > 0 || player.inv > 0 || player.dash > 0) return;
  player.hp -= dmg;
  player.hurt = HURT_TIME;
  player.stun = 0.3;
  player.act = null;
  shakeTime = Math.max(shakeTime, 0.2);
  sfx.hit();
  const away = player.x + player.w / 2 >= fromX ? 1 : -1;
  player.x = Math.max(8, Math.min(W - 8 - player.w, player.x + away * 22));   // shoved away
  burst(player.x + player.w / 2, player.y + 24, 8, "#ffe14d", 220);
  if (player.hp <= 0 && swordPerk().revive && !player.revived) {   // phoenix blade: back up once per wave
    player.revived = true;
    player.hp = 35;
    player.inv = 1.5;
    burst(player.x + player.w / 2, player.y + 30, 30, "#ff8a1f", 320);
    popups.push({ x: player.x + player.w / 2, y: player.y - 20, t: 0, text: "REBORN!", perk: true, life: 1.4 });
    sfx.skill();
  }
  if (player.hp <= 0) { player.hp = 0; die(); }
}

function die() {
  state = "dying";
  dyingT = 0;
  releaseInput();
  document.body.classList.remove("playing");
  shakeTime = 0.3;
}

function startAction(spec) {
  player.act = spec;
  player.actT = 0;
  player.fired = spec.hits.map(() => false);
  player.buffered = false;
  player.lungeV = spec.lunge || 0;
  if (spec.skill) sfx.skill();
  else if (spec.basic && weaponFx()) weaponFx().swing();   // rare and legendary weapons have their own swing
  else sfx.slash();
}

// Lands one hit of the current action on every enemy in its reach
function dealHit(hit) {
  const f = player.facing, pcx = player.x + player.w / 2;
  const basic = !!(player.act && player.act.basic), perk = basic ? swordPerk() : {};
  const finisher = basic && player.act === COMBO[COMBO.length - 1];
  const struck = [];
  for (const o of foes) {
    if (o.dead || (!o.solid && !hit.screen)) continue;   // a ghost between flickers can't be touched
    const ocx = o.x + o.w / 2;
    const ahead = (ocx - pcx) * f;   // how far in front of him it stands
    if (!hit.screen && (ahead < -hit.back - o.w / 2 || ahead > hit.front + o.w / 2)) continue;
    if (!hit.screen && player.y + player.h < GROUND_Y - 70) continue;   // too high above them to reach
    // A guard's shield stops anything from the side he's facing; only the ultimate gets past
    if (o.shield && !hit.screen && !perk.pierce && o.dir === (pcx >= ocx ? 1 : -1)) {
      sfx.clang();
      burst(o.x + o.w / 2 + o.dir * 12, o.y + 30, 6, "#d6e4f0", 200);
      popups.push({ x: ocx, y: o.y - 10, t: 0, text: "BLOCK" });
      continue;
    }
    // Only the 3rd swing of the combo staggers; the first two just hurt, so enemies can still fight back
    const light = basic && !finisher && !perk.stagger;
    hurtFoe(o, basic ? perkDamage(perk, o, finisher, hit.dmg) : hit.dmg, f * hit.kb * (perk.kb || 1) * (light ? LIGHT_PUSH : 1), !light);
    if (basic) { perkOnHit(perk, o, finisher); struck.push(o); }
  }
  if (basic) perkOnSwing(perk, finisher, struck[0], hit, struck);
  foes = foes.filter((o) => !o.dead);
}

function hurtFoe(o, dmg, push, stagger = true, quiet = false) {
  if (o.dead) return;
  o.hp -= dmg;
  if (o.hp <= 0) {
    const d = FOES[o.kind];
    o.fling = Math.sign(push) || player.facing;
    killEnemy(o, randInt(d.gold[0], d.gold[1]));
    kills++;
    bumpStat("kills");
    if (o.kind === "boss") bumpStat("bosses");
    score += d.pts;
    return;
  }
  const heavy = o.kind === "brute" || o.kind === "boss";
  o.x = Math.max(-10, Math.min(W + 10 - o.w, o.x + push * (heavy ? 0.3 : 1)));
  if (stagger && o.kind !== "boss" && o.ai !== "charge") { o.stagger = heavy ? 0.2 : 0.4; o.ai = "walk"; o.timer = 0; o.attack = 0; o.draw = 0; }
  o.flash = 0.12;
  popups.push({ x: o.x + o.w / 2, y: o.y - 10, t: 0, text: String(dmg), dmg: true, hue: Math.random() * 360 });
  if (quiet) return;
  shakeTime = Math.max(shakeTime, 0.08);
  if (player.act && player.act.basic && weaponFx()) { weaponImpact(o); return; }
  burst(o.x + o.w / 2, o.y + 40, 8, "#ffe14d", 240);
  sfx.clang();
}

// --- Sword perks: every shop sword adds something to his BASIC attacks (never to skills) ---
// Commons tweak numbers, uncommons and rares add an on-hit effect, and most legendaries go off on
// the 3rd hit of the combo (the finisher). text is what the shop and inventory cards show.
const SWORD_PERKS = {
  rusty:         { text: "+5% DAMAGE", dmg: 1.05 },
  wooden:        { text: "+25% KNOCKBACK", kb: 1.25 },
  cleaver:       { text: "BIG KNOCKBACK, EVERY HIT STAGGERS", kb: 1.6, stagger: true },
  cutlass:       { text: "KILLS DROP +1 GOLD", gold: 1 },
  iron:          { text: "+10% DAMAGE", dmg: 1.1 },
  serrated:      { text: "HITS BLEED (3 DMG/S, 3 S)", dot: { dps: 3, time: 3, color: "#c01818" } },
  frost_staff:   { text: "25% CHANCE TO SLOW", slowChance: 0.25 },
  void_blade:    { text: "20% CHANCE OF DOUBLE DAMAGE", critChance: 0.2 },
  vine:          { text: "HEAL 1 HP PER HIT", heal: 1 },
  bone:          { text: "KILLS RESTORE +5 MANA", killMana: 5 },
  inferno:       { text: "HITS BURN, BURN SPREADS ON KILL", dot: { dps: 4, time: 3, color: "#ff6a1a", fire: true }, spread: true },
  shadow:        { text: "HITS FROM BEHIND DEAL X2", backstab: 2 },
  gale:          { text: "SWINGS SEND A WIND WAVE", gust: true },
  glacier:       { text: "3RD HIT FREEZES FOR 1 S", freeze: 1 },
  phoenix:       { text: "3RD HIT: FIRE PATCH. REVIVE ONCE PER WAVE", patch: true, revive: true },
  plasma:        { text: "PIERCES SHIELDS, 3RD HIT +50%", pierce: true, finisherDmg: 1.5 },
  nebula:        { text: "3RD HIT PULLS ENEMIES IN", pull: true },
  seraph:        { text: "3RD HIT FIRES A LIGHT BEAM", beam: true },
  ember_feather: { text: "3RD HIT THROWS 3 FIRE FEATHERS", feathers: true },
  thunder:       { text: "3RD HIT CHAINS LIGHTNING TO 2", chain: 2 },
  toxic:         { text: "3RD HIT LEAVES A POISON CLOUD", cloud: true },
  gearblade:     { text: "EVERY 5TH HIT IS A CRIT (X2)", every: 5 }
};
function swordPerk() { return SWORD_PERKS[skinState.equipped] || {}; }

let zones = [];    // fire patches, poison clouds and pull vortexes on the ground
let shots = [];    // wind waves and fire feathers flying out of his swings
let bolts = [];    // lightning and light beams (just drawn for a moment)
let perkHits = 0;  // basic hits landed this run (the clockwork blade's every-5th crit)

// Basic-hit damage after the perk: bonus %, finisher bonus, backstab, crits
function perkDamage(perk, o, finisher, dmg) {
  let m = perk.dmg || 1, label = "";
  if (finisher && perk.finisherDmg) m *= perk.finisherDmg;
  if (perk.backstab && o.dir === player.facing) { m *= perk.backstab; label = "BACKSTAB!"; }
  if ((perk.critChance && Math.random() < perk.critChance) || (perk.every && ++perkHits % perk.every === 0)) { m *= 2; label = "CRIT!"; }
  if (label) popups.push({ x: o.x + o.w / 2, y: o.y - 30, t: 0, text: label, perk: true });
  return Math.round(dmg * m);
}

// After a basic hit lands on o (which may have just died)
function perkOnHit(perk, o, finisher) {
  if (perk.heal) player.hp = Math.min(PLAYER_MAX_HP, player.hp + perk.heal);
  if (o.dead) {
    if (perk.gold) dropGold(o.x + o.w / 2, o.y + 20, perk.gold, o.y - 30);
    if (perk.killMana) {
      player.mana = Math.min(MANA_MAX, player.mana + perk.killMana);
      popups.push({ x: player.x + player.w / 2, y: player.y - 12, t: 0, text: `+${perk.killMana} MANA` });
    }
    return;
  }
  if (perk.dot) o.dot = { ...perk.dot, tick: 0.5 };
  if (perk.slowChance && Math.random() < perk.slowChance) { o.slow = 1.5; burst(o.x + o.w / 2, o.y + 20, 6, "#9fe3ff", 120); }
  if (finisher && perk.freeze) { o.freeze = o.kind === "boss" ? 0.4 : perk.freeze; burst(o.x + o.w / 2, o.y + 30, 10, "#cdf3ff", 160); }
}

// Effects of the swing itself (once per basic hit, whether or not it touched anyone)
function perkOnSwing(perk, finisher, target, hit, struck) {
  const f = player.facing, pcx = player.x + player.w / 2;
  const at = target && !target.dead ? target.x + target.w / 2 : pcx + f * 70;
  if (perk.gust) {
    shots.push({ kind: "gust", x: pcx + f * 30, y: GROUND_Y - 34, vx: f * 520, vy: 0, t: 0, life: 0.55, dmg: Math.round(hit.dmg * 0.5), hits: new Set(struck), left: 2 });
  }
  if (!finisher) return;
  if (perk.patch) { zones.push({ kind: "fire", x: at, r: 50, t: 0, life: 3, dps: 8, tick: 0 }); sfx.boom(); }
  if (perk.cloud) { zones.push({ kind: "poison", x: at, r: 64, t: 0, life: 3, dps: 7, tick: 0 }); }
  if (perk.pull) {
    zones.push({ kind: "vortex", x: at, r: 200, t: 0, life: 0.5 });
    for (const o of foes) {
      const ocx = o.x + o.w / 2;
      if (o.dead || Math.abs(ocx - at) > 220) continue;
      o.x += (at - ocx) * (o.kind === "boss" ? 0.25 : 0.6);
      hurtFoe(o, 6, 0, false, true);
    }
  }
  if (perk.beam) {
    bolts.push({ kind: "beam", x0: pcx, x1: pcx + f * 560, y: GROUND_Y - 38, t: 0, life: 0.3 });
    for (const o of foes) {
      const ahead = (o.x + o.w / 2 - pcx) * f;
      if (!o.dead && ahead > 0 && ahead < 560 && !struck.includes(o)) hurtFoe(o, Math.round(hit.dmg * 0.6), f * 20, false, true);
    }
    sfx.skill();
  }
  if (perk.feathers) {
    for (let i = -1; i <= 1; i++) {
      shots.push({ kind: "feather", x: pcx + f * 20, y: GROUND_Y - 40, vx: f * 620, vy: i * 70, t: 0, life: 0.8, dmg: 10, hits: new Set(), left: 1, burn: true });
    }
  }
  if (perk.chain && target) {
    let from = target;
    const done = new Set([target]);
    for (let n = 0; n < perk.chain; n++) {
      const fx = from.x + from.w / 2;
      const next = foes.filter((o) => !o.dead && !done.has(o) && Math.abs(o.x + o.w / 2 - fx) < 240)
        .sort((a, b) => Math.abs(a.x - from.x) - Math.abs(b.x - from.x))[0];
      if (!next) break;
      bolts.push({ kind: "bolt", x0: fx, y0: from.y + 26, x1: next.x + next.w / 2, y1: next.y + 26, t: 0, life: 0.25, seed: Math.random() * 1000 });
      hurtFoe(next, Math.round(hit.dmg * 0.6), 0, true, true);
      burst(next.x + next.w / 2, next.y + 26, 8, "#fff6a0", 200);
      done.add(next);
      from = next;
    }
    if (done.size > 1) sfx.clang();
  }
}

// A burning enemy that dies sets the ones near him on fire (inferno edge)
function spreadBurn(o) {
  if (!o.dot || !o.dot.fire || !swordPerk().spread) return;
  const ocx = o.x + o.w / 2;
  for (const p of foes) {
    if (p === o || p.dead || Math.abs(p.x + p.w / 2 - ocx) > 90) continue;
    p.dot = { ...o.dot, time: 3, tick: 0.5 };
    burst(p.x + p.w / 2, p.y + 30, 6, "#ff6a1a", 150);
  }
}

// How fast an enemy's own clock runs: frozen stops him, slowed halves him
function foeTime(o) { return o.freeze > 0 ? 0 : o.slow > 0 ? 0.5 : 1; }

function updatePerks(dt) {
  for (const o of foes) {
    o.freeze = Math.max(0, (o.freeze || 0) - dt);
    o.slow = Math.max(0, (o.slow || 0) - dt);
    if (o.dot) {
      o.dot.time -= dt;
      o.dot.tick -= dt;
      if (Math.random() < dt * 12) burst(o.x + o.w / 2 + (Math.random() - 0.5) * o.w, o.y + Math.random() * o.h * 0.7, 1, o.dot.color, 60);
      if (o.dot.tick <= 0) { o.dot.tick = 0.5; hurtFoe(o, Math.max(1, Math.round(o.dot.dps * 0.5)), 0, false, true); }
      if (o.dot && o.dot.time <= 0) o.dot = null;
    }
  }
  for (const z of zones) {
    z.t += dt;
    if (!z.dps) continue;
    z.tick -= dt;
    if (z.tick > 0) continue;
    z.tick = 0.5;
    for (const o of foes) if (!o.dead && Math.abs(o.x + o.w / 2 - z.x) < z.r + o.w / 2) hurtFoe(o, Math.round(z.dps * 0.5), 0, false, true);
  }
  zones = zones.filter((z) => z.t < z.life);
  for (const s of shots) {
    s.t += dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    for (const o of foes) {
      if (o.dead || !o.solid || s.hits.has(o) || s.left <= 0) continue;
      if (Math.abs(o.x + o.w / 2 - s.x) < o.w / 2 + 10 && s.y > o.y && s.y < o.y + o.h) {
        s.hits.add(o);
        s.left--;
        hurtFoe(o, s.dmg, Math.sign(s.vx) * 16, false, true);
        if (s.burn && !o.dead) o.dot = { dps: 4, time: 2, color: "#ff6a1a", fire: true, tick: 0.5 };
        burst(s.x, s.y, 5, s.kind === "gust" ? "#e6f6ff" : "#ffb02e", 150);
      }
    }
  }
  shots = shots.filter((s) => s.t < s.life && s.left > 0 && s.x > -40 && s.x < W + 40);
  for (const b of bolts) b.t += dt;
  bolts = bolts.filter((b) => b.t < b.life);
  foes = foes.filter((o) => !o.dead);
}

// Ground effects, status marks on enemies, and the flying perk shots
function drawPerks() {
  const now = performance.now() / 1000;
  for (const z of zones) {
    const k = z.t / z.life, fade = Math.min(1, (z.life - z.t) / 0.4);
    if (z.kind === "fire") {
      for (let i = 0; i <= 10; i++) {
        const x = z.x - z.r + (i * z.r * 2) / 10, h = 8 + Math.abs(Math.sin(now * 14 + i * 1.7)) * 12;
        ctx.globalAlpha = fade;
        ctx.fillStyle = "#ff5a1a"; ctx.fillRect(snap(x), snap(GROUND_Y - h), PX * 2, snap(h));
        ctx.fillStyle = "#ffe14d"; ctx.fillRect(snap(x), snap(GROUND_Y - h * 0.5), PX * 2, snap(h * 0.5));
      }
    } else if (z.kind === "poison") {
      ctx.globalAlpha = 0.32 * fade;
      ctx.fillStyle = "#6fdc3a";
      pixEllipse(z.x, GROUND_Y - 22, z.r, 24);
      ctx.globalAlpha = 0.7 * fade;
      ctx.fillStyle = "#b6ff7a";
      for (let i = 0; i < 6; i++) {
        const bx = z.x + Math.sin(i * 2.3) * z.r * 0.8, by = GROUND_Y - ((now * 30 + i * 13) % 46);
        ctx.fillRect(snap(bx), snap(by), PX, PX);
      }
    } else if (z.kind === "vortex") {
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = "#b266ff";
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(z.x, GROUND_Y - 36, z.r * (1 - k) * 0.5 + 6, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  for (const o of foes) {
    if (o.freeze > 0) {
      ctx.fillStyle = "rgba(170, 225, 255, 0.5)";
      ctx.fillRect(snap(o.x - 4), snap(o.y), snap(o.w + 8), snap(o.h));
    } else if (o.slow > 0) {
      ctx.fillStyle = "#9fe3ff";
      for (let i = 0; i < 3; i++) ctx.fillRect(snap(o.x + o.w / 2 - 9 + i * 9), snap(o.y - 14 + Math.sin(now * 6 + i) * 3), PX, PX);
    }
  }
  for (const s of shots) {
    const d = Math.sign(s.vx);
    if (s.kind === "gust") {
      ctx.globalAlpha = 1 - s.t / s.life;
      ctx.strokeStyle = "#e6f6ff";
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(s.x - d * 10, s.y, 20, d > 0 ? -1.1 : Math.PI - 1.1, d > 0 ? 1.1 : Math.PI + 1.1); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = "#ff6a1a"; ctx.fillRect(snap(s.x - (d > 0 ? 15 : 0)), snap(s.y), 15, PX);
      ctx.fillStyle = "#ffe14d"; ctx.fillRect(snap(s.x - (d > 0 ? 3 : 0)), snap(s.y - 1), PX, PX + 2);
    }
  }
  for (const b of bolts) {
    const k = b.t / b.life;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.shadowColor = b.kind === "beam" ? "#fff6c0" : "#fff6a0";
    ctx.shadowBlur = 14;
    if (b.kind === "beam") {
      const h = 16 * (1 - k) + 4;
      ctx.fillStyle = "#ffe98a"; ctx.fillRect(Math.min(b.x0, b.x1), b.y - h / 2, Math.abs(b.x1 - b.x0), h);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(Math.min(b.x0, b.x1), b.y - h / 6, Math.abs(b.x1 - b.x0), h / 3);
    } else {
      const r = seeded(Math.floor(b.seed + b.t * 30));
      ctx.strokeStyle = "#fff6a0";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(b.x0, b.y0);
      for (let i = 1; i < 6; i++) ctx.lineTo(b.x0 + ((b.x1 - b.x0) * i) / 6, b.y0 + ((b.y1 - b.y0) * i) / 6 + (r() - 0.5) * 26);
      ctx.lineTo(b.x1, b.y1);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function actionTick(dt) {
  const spec = player.act;
  player.actT += dt;
  spec.hits.forEach((h, i) => {
    if (!player.fired[i] && player.actT >= spec.hitT[i]) { player.fired[i] = true; dealHit(h); }
  });
  if (spec.invuln) player.inv = Math.max(player.inv, 0.1);
  const sp = slashProgress();
  if (sp >= 0) {   // the tip of a rare or legendary slash sheds sparks as it travels
    const u = slashAngle(sp), fx = weaponFx();
    const tx = player.x + player.w / 2 + Math.cos(u) * 62 * player.facing, ty = player.y + player.h - 36 + Math.sin(u) * 62;
    for (let i = 0; i < (weaponIsLegendary() ? 3 : 2); i++) burst(tx, ty, 1, fx.sparks[randInt(0, fx.sparks.length - 1)], 120);
  }
  if (player.lungeV) {   // a short step into the swing that fades quickly
    player.x = Math.max(8, Math.min(W - 8 - player.w, player.x + player.facing * player.lungeV * dt));
    player.lungeV *= Math.pow(0.02, dt);
    if (player.lungeV < 5) player.lungeV = 0;
  }
  if (spec.basic && queued.attack > 0) { player.buffered = true; queued.attack = 0; }
  if (player.actT >= spec.total) {
    player.act = null;
    if (spec.basic) {
      if (spec === COMBO[COMBO.length - 1]) player.recover = COMBO_RECOVERY;   // the finisher leaves him open
      player.combo = (player.combo + 1) % COMBO.length;
      player.comboTimer = 0.5;
      if (player.buffered) queued.attack = 0.2;   // chain straight into the next swing
    }
  }
}

// The cooldown clock on a skill button: shaded sweep plus the seconds left; a pop when it's ready again
function showCooldown(btn, left, max, whole = false) {
  const cooling = left > 0;
  if (cooling) {
    btn.style.setProperty("--cd", (left / max).toFixed(3));
    btn.lastChild.textContent = whole || left >= 10 ? String(Math.ceil(left)) : left.toFixed(1);
  }
  if (btn.classList.contains("cooling") === cooling) return;
  btn.classList.toggle("cooling", cooling);
  if (!cooling) { btn.classList.remove("ready"); void btn.offsetWidth; btn.classList.add("ready"); }
}

// --- Update ---
function update(dt) {
  for (const k of Object.keys(queued)) queued[k] = Math.max(0, queued[k] - dt);
  player.hurt = Math.max(0, player.hurt - dt);
  player.inv = Math.max(0, player.inv - dt);
  player.stun = Math.max(0, player.stun - dt);
  player.recover = Math.max(0, player.recover - dt);
  player.dashCooldown = Math.max(0, player.dashCooldown - dt);
  if (!player.act) {
    player.comboTimer = Math.max(0, player.comboTimer - dt);
    if (player.comboTimer === 0) player.combo = 0;
  }

  if (player.act) actionTick(dt);
  const free = !player.act && player.stun <= 0 && player.dash <= 0;
  if (free) {   // skills first (3, then 2, then 1), then the basic attack
    for (const i of [2, 1, 0]) {
      if (queued["s" + (i + 1)] > 0 && player.mana >= SKILL_MANA[i]) {
        queued["s" + (i + 1)] = 0;
        player.mana -= SKILL_MANA[i];
        startAction(SKILLS[i]);
        break;
      }
    }
    if (!player.act && player.recover <= 0 && queued.attack > 0) { queued.attack = 0; startAction(COMBO[player.combo]); }
  }

  // Walking, or the dash
  const dir = inputDir();
  const walking = !player.act && player.stun <= 0 && player.dash <= 0;
  player.moving = walking && dir !== 0;
  if (player.dash > 0) {
    player.x = Math.max(8, Math.min(W - 8 - player.w, player.x + player.dashDir * (DASH_DIST / DASH_TIME) * dt));
    player.dash = Math.max(0, player.dash - dt);
    ghostTimer -= dt;
    if (ghostTimer <= 0) {   // afterimages trail behind him
      const fr = heroSprite();
      ghosts.push({ sheet: fr.sheet, frame: fr.frame, cx: player.x + player.w / 2, feet: player.y + player.h, facing: player.facing, t: 0 });
      ghostTimer = 0.03;
    }
  } else if (player.moving) {
    player.facing = dir;
    player.x = Math.max(8, Math.min(W - 8 - player.w, player.x + dir * PLAYER_SPEED * dt));
    player.runT += dt;
  }
  for (const g of ghosts) g.t += dt;
  ghosts = ghosts.filter((g) => g.t < 0.25);

  // Jump (a press just before landing still counts), gravity, landing
  if (queued.jump > 0 && player.onGround && walking) {
    player.vy = JUMP_VELOCITY;
    player.onGround = false;
    queued.jump = 0;
    sfx.jump();
  }
  if (player.dash <= 0) {
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;
  }
  if (player.y + player.h >= GROUND_Y) {
    if (!player.onGround) burst(player.x + player.w / 2, GROUND_Y - 2, 6, "#ffb43a", 140);   // touchdown
    player.vy = 0;
    player.onGround = true;
  }
  if (player.onGround) player.y = GROUND_Y - player.h;

  // The shaded clock on a skill fills with the mana it still lacks (and shows how many points that is)
  [[dashBtn, player.dashCooldown, DASH_COOLDOWN],
   ...[sk1Btn, sk2Btn, sk3Btn].map((b, i) => [b, Math.max(0, SKILL_MANA[i] - player.mana), SKILL_MANA[i]])
  ].forEach(([b, left, max], i) => showCooldown(b, left, max, i > 0));
  if (hintTimer > 0) {
    hintTimer -= dt;
    if (hintTimer <= 2) document.body.classList.remove("show-hint");   // then it fades over those last 2 s
  }

  // Waves: enemies come through portals until the wave is used up, then a rest, then the next wave
  if (waveToSpawn > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0 && foes.length + portals.length < Math.min(8, 3 + Math.floor(wave / 2))) {
      openPortal();
      waveToSpawn--;
      spawnTimer = Math.max(0.6, 2.2 - 0.12 * wave) / DIFF_MUL[runDiff];
    }
  } else if (foes.length === 0 && portals.every((p) => p.spawned)) {
    if (waveClearTimer < 0) {
      waveClearTimer = 2.5;
      score += 50;
      player.hp = Math.min(PLAYER_MAX_HP, player.hp + WAVE_CLEAR_HP);
      player.mana = Math.min(MANA_MAX, player.mana + WAVE_CLEAR_MANA);
      bossBanner = { title: `WAVE ${wave} CLEARED`, sub: `+50 SCORE   +${WAVE_CLEAR_HP} HP   +${WAVE_CLEAR_MANA} MANA`, t: 2.2 };
      sfx.point();
    } else {
      waveClearTimer -= dt;
      if (waveClearTimer <= 0) startWave(wave + 1);
    }
  }
  for (const p of portals) {
    p.t += dt;
    if (!p.spawned && p.t >= 0.5) { p.spawned = true; spawnFoe(p); }
  }
  portals = portals.filter((p) => p.t < 1.4);
  updateFoes(dt);
  updatePerks(dt);
  updateProjectiles(dt);

  for (const p of popups) { p.t += dt; p.y -= 40 * dt; }
  popups = popups.filter((p) => p.t < (p.life || 0.8));
  for (const p of sparks) {
    p.t += dt;
    p.vy += 900 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  sparks = sparks.filter((p) => p.t < p.life);
  emitCosmetics(dt);
  for (const p of fxParts) p.t += dt;
  fxParts = fxParts.filter((p) => p.t < p.life);
  for (const m of impacts) m.t += dt;
  impacts = impacts.filter((m) => m.t < 0.3);
  updateCoins(dt);
  updatePotions(dt);
  corpses = corpses.filter((c) => c.t < 3.5);   // bodies fade away after a few seconds
}

// --- Enemies & gold ---
// "+N" with a coin, in gold, popping slightly bigger as it appears
function drawGoldPopup(p) {
  const pop = 1 + 0.35 * Math.max(0, 1 - p.t / 0.15);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(pop, pop);
  ctx.font = "bold 20px 'Courier New', monospace";
  ctx.textAlign = "left";
  const textW = ctx.measureText(p.text).width;
  const left = -(textW + 18) / 2;
  drawCoin({ x: left + 7, y: -6, spin: 0 });
  ctx.lineWidth = 4;
  ctx.lineJoin = "round";
  ctx.strokeStyle = GOLD_EDGE;
  ctx.fillStyle = GOLD;
  ctx.strokeText(p.text, left + 18, 0);
  ctx.fillText(p.text, left + 18, 0);
  ctx.restore();
}

function killEnemy(o, gold = 1 + Math.floor(Math.random() * 3)) {
  o.dead = true;
  spreadBurn(o);
  shakeTime = Math.max(shakeTime, o.scale ? 0.25 : 0.1);
  sfx.kill();
  // He topples away from the blow and plays his death animation
  corpses.push({ kind: o.kind, cx: o.x + o.w / 2, feet: o.y + o.h, dir: o.dir, fling: o.fling || 1, t: 0 });
  // Show how much gold he dropped, floating up from where he fell
  dropGold(o.x + o.w / 2, o.y + 20, gold, o.y - 6);
  dropPotions(o.x + o.w / 2, o.y + 24, o.kind === "boss");
  const kfx = KILL_FX[look.equipped.kill];
  if (kfx.burst) kfx.burst(addFx, o.x + o.w / 2, o.y + o.h * 0.45, Math.random);
}

// Enemies sometimes drop a potion (red = health, blue = mana); bosses drop one of each. He picks one up by walking over it.
function dropPotions(x, y, boss) {
  const kinds = boss ? ["hp", "mp"] : Math.random() < POTION_CHANCE ? [Math.random() < 0.5 ? "hp" : "mp"] : [];
  kinds.forEach((kind, i) => potions.push({ kind, x: x + (i ? 26 : 0), y, vy: -330, vx: i ? 60 : -20, age: 0 }));
}
function updatePotions(dt) {
  const pcx = player.x + player.w / 2;
  for (const p of potions) {
    p.age += dt;
    p.vy += GRAVITY * 0.6 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.y > GROUND_Y - 9) { p.y = GROUND_Y - 9; p.vy *= -0.35; p.vx *= 0.5; if (Math.abs(p.vy) < 40) p.vy = 0; }
    if (Math.abs(p.x - pcx) < 34 && player.y + player.h > GROUND_Y - 60 && state === "running") {
      p.taken = true;
      if (p.kind === "hp") player.hp = Math.min(PLAYER_MAX_HP, player.hp + POTION_HEAL);
      else player.mana = Math.min(MANA_MAX, player.mana + POTION_MANA);
      popups.push({ x: p.x, y: p.y - 22, t: 0, text: p.kind === "hp" ? "+" + POTION_HEAL + " HP" : "+" + POTION_MANA + " MANA" });
      burst(p.x, p.y, 8, p.kind === "hp" ? "#ff5a5a" : "#5aa8ff", 160);
      sfx.point();
    } else if (p.age > POTION_LIFE) p.taken = true;
  }
  potions = potions.filter((p) => !p.taken);
}
// A little pixel bottle: red for health, blue for mana (it blinks before it disappears)
function drawPotion(p) {
  if (p.age > POTION_LIFE - 3 && Math.floor(p.age * 8) % 2) return;
  const x = Math.round(p.x) - 6, y = Math.round(p.y) - 9 + Math.round(Math.sin(p.age * 5) * 1.5);
  const fill = p.kind === "hp" ? "#e8403a" : "#3d8bff", light = p.kind === "hp" ? "#ff9a8f" : "#9fd0ff";
  ctx.fillStyle = "#1a1a22";
  ctx.fillRect(x + 4, y - 1, 4, 3); ctx.fillRect(x + 2, y + 2, 8, 1); ctx.fillRect(x - 1, y + 5, 14, 12); ctx.fillRect(x + 1, y + 3, 10, 2);
  ctx.fillStyle = "#c9b58a"; ctx.fillRect(x + 5, y, 2, 2);   // cork
  ctx.fillStyle = "#e8e8f0"; ctx.fillRect(x + 3, y + 3, 6, 2);   // glass neck
  ctx.fillStyle = fill; ctx.fillRect(x + 1, y + 6, 10, 10);
  ctx.fillStyle = light; ctx.fillRect(x + 2, y + 7, 2, 5);
}

// Coins pop out of the enemy, then fly straight to the gold icon in the HUD and are counted there
const COIN_TARGET = { x: W - 100, y: 56 };
function collectCoin() {
  runGold++;
  totalGold++;
  localStorage.setItem("stickgo-gold", totalGold);
}
function updateCoins(dt) {
  for (const c of coins) {
    c.spin += dt * 8;
    c.age += dt;
    if (c.age < c.hold) {   // the pop
      c.vy += GRAVITY * 0.6 * dt;
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      if (c.y > GROUND_Y - 7) { c.y = GROUND_Y - 7; c.vy *= -0.45; c.vx *= 0.6; }
    } else {                // the flight, speeding up
      const dx = COIN_TARGET.x - c.x, dy = COIN_TARGET.y - c.y, d = Math.hypot(dx, dy) || 1;
      const step = (500 + (c.age - c.hold) * 3000) * dt;
      const cfx = COIN_FX[look.equipped.coin];
      if (d <= step + 6) {
        c.taken = true; collectCoin(); sfx.coin();
        if (cfx.pop) cfx.pop(addFx, COIN_TARGET.x, COIN_TARGET.y, Math.random);
      } else {
        c.x += (dx / d) * step; c.y += (dy / d) * step;
        if (cfx.trail && Math.random() < dt * 25) cfx.trail(addFx, c.x, c.y, Math.random);
      }
    }
  }
  coins = coins.filter((c) => !c.taken);
}

function gameOver() {
  state = "over";
  for (const c of coins) collectCoin();   // coins still in the air count too
  coins = [];
  const newBest = score > high(runDiff);
  if (newBest) {
    highScores[runDiff] = score;
    localStorage.setItem("stickgo-highs", JSON.stringify(highScores));
  }
  releaseInput();
  document.getElementById("overBest").classList.toggle("show", newBest);
  document.getElementById("overSub").textContent = `${DIFFICULTIES[runDiff].label} MODE`;
  countUp("oScore", score, pad5);
  countUp("oBest", high(runDiff), pad5);
  countUp("oWave", wave);
  countUp("oKills", kills);
  countUp("oGold", runGold, (n) => "+" + fmt(n));
  countUp("oTotal", totalGold);
  showMenu("over");
}

// A number on the game-over panel ticks up to its value, quickly at first and settling at the end
function countUp(id, to, format = fmt, time = 0.9) {
  const el = document.getElementById(id), t0 = performance.now();
  const step = () => {
    const k = Math.min(1, (performance.now() - t0) / 1000 / time);
    el.textContent = format(Math.round(to * (1 - Math.pow(1 - k, 3))));
    if (k < 1) requestAnimationFrame(step);
  };
  step();
}

let colors;
let night = 0;

function nightLevel(s) {
  return 1;   // the backdrops are dusk scenes, so the light-on-dark palette is always on
  const p = s % 1000;
  return Math.max(0, Math.min(1, (p - 650) / 50, (1000 - p) / 50));
}

function paletteAt(t) {
  const out = {};
  for (const key of Object.keys(DAY)) {
    out[key] = `rgb(${DAY[key].map((v, i) => Math.round(v + (NIGHT[key][i] - v) * t)).join(",")})`;
  }
  return out;
}

function updateColors() {
  const t = nightLevel(score);
  if (colors && t === night) return;
  night = t;
  colors = paletteAt(t);
  // The page around the canvas and the on-screen buttons follow along
  document.documentElement.style.setProperty("--sky", colors.sky);
  document.documentElement.style.setProperty("--ink", colors.ink);
}

function line(x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

// --- Stickman pose ---
// Body proportions (game units)
const BODY = { headR: 8, torso: 18, thigh: 12, shin: 12, upperArm: 10, foreArm: 9 };

// Point at the end of a limb. Angle 0 = straight down, positive = forwards (+x).
function limb(from, angle, len) {
  return { x: from.x + Math.sin(angle) * len, y: from.y + Math.cos(angle) * len };
}

// Builds the joint positions for the current frame of a stickman facing right
// (the player by default; enemies pass themselves and get mirrored).
// legs: [thighAngle, kneeBend], arms: [upperArmAngle, elbowBend]; index 0 = front, 1 = back
function getPose(p = player) {
  const ph = p.runPhase;
  let lean, legs, arms, lift = 0;

  if (p.dash > 0) {
    // Dash: flat out, leaning right into it, one leg driving and one trailing
    lean = 1.0;
    legs = [[1.3, 0.35], [-1.15, 0.25]];
    arms = [[1.7, 0.2], [-1.5, 0.2]];
  } else if (!p.onGround) {
    // Jump: rising = front knee tucked up, one fist punched skyward, back leg folded;
    // falling = legs stretch down and apart, arms flung out for balance
    const k = (Math.max(-1, Math.min(1, p.vy / 800)) + 1) / 2;  // 0 rising .. 1 falling
    const mix = (a, b) => a + (b - a) * k;
    lean = mix(0.1, 0.2);
    legs = [[mix(1.1, 0.45), mix(1.8, 0.9)], [mix(-0.5, -0.55), mix(1.5, 0.7)]];
    arms = [[mix(2.7, 2.0), mix(0.3, 0.4)], [mix(-1.0, -1.4), mix(1.0, 0.6)]];
  } else if (p.ducking) {
    // Slide: body low and leaning back, front leg stretched out along the ground,
    // back leg folded under, arms thrown out for balance
    const s = Math.sin(ph * 0.5);
    lean = -0.85;
    legs = [[1.4 + 0.05 * s, 0.15], [-0.5, 1.7]];
    arms = [[1.9 + 0.1 * s, 0.4], [-1.6 - 0.1 * s, 0.5]];
  } else if (p === player && state === "countdown") {
    // Walk (READY / SET): upright, short relaxed steps, a gentle bob, arms swinging softly
    lean = 0.08;
    legs = [0, Math.PI].map((off) => {
      const a = ph + off;
      return [0.45 * Math.sin(a), 0.1 + 0.8 * Math.max(0, Math.cos(a - 0.5))];
    });
    arms = [0, Math.PI].map((off) => [-0.45 * Math.sin(ph + off), 0.35]);
    lift = 1.5 * Math.max(0, -Math.cos(ph * 2));
  } else if (p.landT > 0) {
    // Landing: knees and hips absorb the drop
    lean = 0.6;
    legs = [[1.0, 2.0], [0.2, 1.9]];
    arms = [[1.3, 0.8], [-0.6, 0.8]];
  } else if (p.attack > 0) {
    // Lunge: deep front knee, back leg driving, body leaning into the cut
    lean = 0.5;
    legs = [[1.0, 0.9], [-0.7, 0.2]];
    arms = [[0, 0], [0.8, 1.0]];
  } else if (p === player && !p.moving) {
    // Standing: relaxed, knees slightly bent, a slow breath
    lean = 0.1;
    legs = [[0.14, 0.12], [-0.14, 0.12]];
    arms = [[0.3, 0.5], [-0.25, 0.5]];
    lift = 0.8 + 0.8 * Math.sin(performance.now() / 330);
  } else {
    // Run cycle: thighs swing in opposite phase, the knee folds most while
    // the leg is swinging forward, arms swing opposite to the legs
    // (push off -> airborne -> land -> compression, like the reference sheet: a forward
    // lean, a long stride, and the body springing up between footfalls)
    lean = 0.42 + 0.06 * Math.cos(ph * 2);
    legs = [0, Math.PI].map((off) => {
      const a = ph + off;
      return [0.95 * Math.sin(a), 0.25 + 1.5 * Math.max(0, Math.cos(a - 0.6))];
    });
    arms = [0, Math.PI].map((off) => [-1.0 * Math.sin(ph + off) + 0.15, 1.5]);
    lift = 3.5 * Math.max(0, Math.cos(ph * 2 - 0.4));   // airborne moment of each stride
  }
  if (p.attack > 0) {
    // Sword swing: the front arm sweeps from over the head down to the front
    const t = 1 - p.attack / ATTACK_DURATION;
    arms[0] = [SWING_FROM - SWING_ARC * (1 - (1 - t) * (1 - t)), 0.15];
  }

  // Place hips so the lowest foot rests on the bottom of the player box.
  // This makes the body bob naturally as the legs move.
  const legDrop = ([t, bend]) => BODY.thigh * Math.cos(t) + BODY.shin * Math.cos(t - bend);
  const hip = {
    x: p.x + p.w / 2 - 2,
    y: p.y + p.h - Math.max(legDrop(legs[0]), legDrop(legs[1])) - lift
  };
  const neck = limb(hip, Math.PI - lean, BODY.torso);
  const head = limb(neck, Math.PI - lean, BODY.headR + 2);
  const shoulder = limb(neck, -lean, 3);

  const pose = { head, neck, shoulder, hip };
  ["F", "B"].forEach((side, i) => {
    const [thigh, bend] = legs[i];
    pose["knee" + side] = limb(hip, thigh, BODY.thigh);
    pose["foot" + side] = limb(pose["knee" + side], thigh - bend, BODY.shin);
    const [upper, elbow] = arms[i];
    pose["elbow" + side] = limb(shoulder, upper, BODY.upperArm);
    pose["hand" + side] = limb(pose["elbow" + side], upper + elbow, BODY.foreArm);
  });
  return pose;
}

function drawFigure(pts, ink = colors.ink, inkBack = colors.inkBack, width = 4, headR = BODY.headR) {
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  const chain = (color, ...names) => {
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[names[0]].x, pts[names[0]].y);
    for (const n of names.slice(1)) ctx.lineTo(pts[n].x, pts[n].y);
    ctx.stroke();
  };

  // Far side first (lighter, for depth) so the near side draws over it
  chain(inkBack, "hip", "kneeB", "footB");
  chain(inkBack, "shoulder", "elbowB", "handB");
  chain(ink, "neck", "shoulder", "hip");
  chain(ink, "hip", "kneeF", "footF");
  chain(ink, "shoulder", "elbowF", "handF");

  ctx.fillStyle = ink;
  ctx.beginPath();
  ctx.arc(pts.head.x, pts.head.y, headR, 0, Math.PI * 2);
  ctx.fill();
}

// Sword angles use the same convention as limb(): 0 = down, PI = straight up
const SWING_FROM = 3.6;   // upper arm angle at the start of a swing (raised behind the head)
const SWING_ARC = 2.9;    // how far it sweeps forwards

function drawSword(pts, swinging) {
  const hand = pts.handF, elbow = pts.elbowF;
  const forearm = Math.atan2(hand.x - elbow.x, hand.y - elbow.y);
  // Held pointing up and forwards while running; in line with the arm mid-swing
  const angle = forearm + (swinging ? 0 : 0.9);
  const skin = equippedSkin();
  const tip = limb(hand, angle, skin.len);

  if (swinging) {
    // Faint arc showing the path of the blade
    const sh = pts.shoulder;
    const r = Math.hypot(tip.x - sh.x, tip.y - sh.y);
    let tipAngle = Math.atan2(tip.x - sh.x, tip.y - sh.y);
    if (tipAngle < 0) tipAngle += Math.PI * 2;  // the swing starts past straight up
    const now = Math.PI / 2 - tipAngle;         // limb() angle -> canvas arc angle
    const from = Math.max(Math.PI / 2 - (SWING_FROM + 0.15), now - 2.1);
    const fx = SLASH_FX[equippedSkin().slash];
    if (fx) {
      // Rare and legendary swords leave their own slash instead of the plain arc
      ctx.save();
      ctx.globalAlpha = Math.min(1, 4 * player.attack / ATTACK_DURATION);
      fx({ sh, r, from, now, pts, seed: Math.floor(performance.now() / 60), clock: performance.now() / 1000 });
      ctx.restore();
      drawBlade(ctx, hand, angle, skin);
      return;
    }
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = skin.glow || "#7fd4ff";
    ctx.shadowColor = skin.glow || "#7fd4ff";
    ctx.shadowBlur = 10;
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(sh.x, sh.y, r, from, now); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  drawBlade(ctx, hand, angle, skin);
}

// --- Slash effects (rare and legendary swords) ---
// Each one is drawn along the blade's swing: the arc runs from `from` to `now` (canvas angles)
// at radius r around the shoulder `sh`.
function arcPt(s, r, u) { return { x: s.sh.x + Math.cos(u) * r, y: s.sh.y + Math.sin(u) * r }; }

// A crescent along the swing: thin where it began, widest at the blade
function crescent(s, w, color, grow = 1.2, shift = 0) {
  const n = 18, out = [], inn = [];
  for (let i = 0; i <= n; i++) {
    const f = i / n, u = s.from + (s.now - s.from) * f, th = w * Math.pow(f, grow);
    out.push(arcPt(s, s.r + shift + th / 2, u));
    inn.push(arcPt(s, s.r + shift - th / 2, u));
  }
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(out[0].x, out[0].y);
  for (const p of out) ctx.lineTo(p.x, p.y);
  for (let i = n; i >= 0; i--) ctx.lineTo(inn[i].x, inn[i].y);
  ctx.closePath();
  ctx.fill();
}

// Flickering dots scattered along the swing
function specks(s, n, spread, size, color, round = true) {
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const f = rnd(i * 3.1 + s.seed), u = s.from + (s.now - s.from) * f;
    const p = arcPt(s, s.r + (rnd(i * 7.7 + s.seed) - 0.5) * spread * (0.4 + f), u);
    const d = size * (0.4 + rnd(i * 1.9 + s.seed));
    ctx.beginPath();
    if (round) ctx.arc(p.x, p.y, d, 0, Math.PI * 2); else ctx.rect(p.x - d, p.y - d, d * 2, d * 2);
    ctx.fill();
  }
}

function sparkle4(x, y, k, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - k);
  ctx.quadraticCurveTo(x, y, x + k, y); ctx.quadraticCurveTo(x, y, x, y + k);
  ctx.quadraticCurveTo(x, y, x - k, y); ctx.quadraticCurveTo(x, y, x, y - k);
  ctx.fill();
}

// Spikes sticking out of the outer edge of the swing (ice, flames)
function spikes(s, n, len, color, jag = 0.5) {
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const f = 0.25 + 0.75 * i / n, u = s.from + (s.now - s.from) * f;
    const base = arcPt(s, s.r + 5 * f, u), tipP = arcPt(s, s.r + 6 + len * (0.6 + jag * rnd(i * 5.3 + s.seed * 0.3)) * f, u + 0.06);
    const side = arcPt(s, s.r + 5 * f, u + 0.12);
    ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(tipP.x, tipP.y); ctx.lineTo(side.x, side.y); ctx.fill();
  }
}

function drawGear(x, y, R, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = "#c98a3a";
  for (let k = 0; k < 8; k++) { ctx.rotate(Math.PI / 4); ctx.fillRect(-1.6, -R - 2.5, 3.2, 4); }
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3a2410";
  ctx.beginPath(); ctx.arc(0, 0, R * 0.38, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
