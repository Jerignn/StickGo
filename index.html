<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StickGo</title>
<style>
  /* --sky and --ink are updated by the game for the day/night cycle */
  :root { --btn-size: 18vh; --sky: #f7f7f7; --ink: #535353; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--sky);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #game {
    /* Keep the 3:1 shape and fill as much of the screen as possible */
    width: min(100vw, 300vh);
    height: min(100vh, 33.333vw);
    background: var(--sky);
  }
  .btn {
    position: fixed;
    bottom: 5vh;
    width: var(--btn-size);
    height: var(--btn-size);
    min-width: 64px;
    min-height: 64px;
    border-radius: 50%;
    border: 3px solid var(--ink);
    background: rgba(128, 128, 128, 0.15);
    color: var(--ink);
    font: bold 16px "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn.pressed { background: rgba(128, 128, 128, 0.4); }
  #duckBtn { left: 4vw; }
  #jumpBtn { right: 4vw; }
  /* Attack sits next to jump so the right thumb can reach both */
  #attackBtn { right: calc(7vw + max(var(--btn-size), 64px)); font-size: 14px; }
  /* Hide the buttons on computers with a mouse; keyboard is used there */
  @media (hover: hover) and (pointer: fine) {
    .btn { display: none; }
  }
  /* Jump/duck/pause only show while playing */
  body:not(.playing) .btn,
  body:not(.playing) #pauseBtn { display: none; }

  #pauseBtn {
    position: fixed;
    top: 4vh;
    left: 3vw;
    width: 52px;
    height: 52px;
    border-radius: 12px;
    border: 3px solid var(--ink);
    background: rgba(128, 128, 128, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  #pauseBtn span { width: 7px; height: 22px; background: var(--ink); border-radius: 2px; }

  .menu {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #14161c;
    color: #d6d6d6;
  }
  .menu.open { display: flex; }
  .menu h1 { margin: 0 0 6px; font-size: 32px; letter-spacing: 4px; }
  .menu p { margin: 0; font-size: 14px; }
  .menu button {
    min-width: 240px;
    padding: 10px 20px;
    font: bold 18px "Courier New", monospace;
    color: #d6d6d6;
    background: #2a2d36;
    border: 3px solid #d6d6d6;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .menu button:active { background: #444855; }
  #settingsMenu {
    flex-direction: row;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    gap: 12px 14px;
    padding: 0 5vw;
    box-sizing: border-box;
  }
  #settingsMenu h1, #settingsMenu p { flex-basis: 100%; text-align: center; margin: 0; }

  /* Main menu: full-screen artwork (it already has the logo) with buttons on the left */
  #mainMenu {
    background: #1a1430 url("pictures/mainmenu.jpg") center 25% / cover no-repeat;
    align-items: flex-start;
    justify-content: flex-end;
    padding: 0 0 9vh 6vw;
    box-sizing: border-box;
  }
  #mainMenu button, .store-menu button {
    color: #fff;
    background: rgba(20, 12, 30, 0.6);
    border-color: #ff8a1f;
    box-shadow: 0 0 12px rgba(255, 110, 20, 0.45);
    text-shadow: 0 1px 2px #000;
  }
  #mainMenu button:active, .store-menu button:active { background: rgba(255, 120, 30, 0.55); }
  #mainMenu p, .store-menu p {
    color: #fff;
    text-shadow: 0 1px 3px #000, 0 0 6px #000;
  }

  /* Gold and high score sit in the top-right corner of the main menu */
  .menu-stats {
    position: absolute;
    top: 2.5vh;
    right: 2vw;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 96px;
    box-sizing: border-box;
    padding: 4px 12px;
    border: 2px solid #ff8a1f;
    border-radius: 999px;
    background: rgba(20, 12, 30, 0.7);
    box-shadow: 0 0 12px rgba(255, 110, 20, 0.45);
    font: bold 16px "Courier New", monospace;
    text-shadow: 0 1px 2px #000;
  }
  .stat .coin { width: 14px; height: 14px; margin: 0; box-shadow: 0 0 8px rgba(255, 211, 77, 0.8); }
  .stat-value { margin-left: auto; letter-spacing: 1px; }
  .stat-gold .stat-value { color: #ffd34d; }
  .stat-high {
    flex-direction: column;
    align-items: flex-end;
    gap: 0;
    border-radius: 16px;
    padding: 3px 12px 4px;
  }
  .stat-high .stat-value { margin-left: 0; color: #fff; line-height: 1.1; }
  .stat-label { color: #ff8a1f; font-size: 10px; letter-spacing: 2px; }
  .stat-label small { color: #cbb7e0; font-size: 10px; letter-spacing: 1px; }

  /* Shop + inventory: same artwork as the main menu, dimmed so the cards stand out */
  .store-menu {
    background: linear-gradient(rgba(12, 8, 24, 0.62), rgba(12, 8, 24, 0.62)),
                #1a1430 url("pictures/mainmenu.jpg") center 25% / cover no-repeat;
    gap: 8px;
  }
  .store-menu h1 { color: #fff; font-size: 28px; margin: 0; text-shadow: 0 2px 4px #000; }
  .shop-head { display: flex; align-items: baseline; gap: 28px; }
  #shopGold { color: #ffd34d; font: bold 20px "Courier New", monospace; text-shadow: 0 1px 3px #000; }
  .coin {
    display: inline-block;
    width: 11px;
    height: 11px;
    margin-right: 6px;
    border-radius: 50%;
    background: #f5b921;
    border: 2px solid #a8740a;
    vertical-align: -1px;
  }
  .rarity-head {
    font: bold 13px "Courier New", monospace;
    letter-spacing: 4px;
    text-shadow: 0 1px 3px #000;
  }
  .shop-row { display: flex; gap: 14px; }
  /* Customize: a live preview of the hero next to the hats / scarves / auras */
  .look-wrap { display: flex; align-items: center; gap: 22px; max-width: 96vw; }
  #lookPreview {
    height: min(62vh, 300px);
    width: auto;
    border: 3px solid #ff8a1f;
    border-radius: 14px;
    background: radial-gradient(circle at 50% 40%, #e9ebf5, #9da2bd);
    box-shadow: 0 0 14px rgba(255, 110, 20, 0.5);
  }
  .look-side { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  #lookItems {
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    width: min(560px, 62vw);
    max-height: calc(100vh - 160px);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 4px;
  }
  .look-side .shop-head h1 { font-size: 22px; }
  #lookItems .card { width: 108px; padding: 5px; gap: 2px; }
  #lookItems .card .name { min-height: 2.3em; font-size: 10px; }
  #lookItems .card canvas { width: 96px; height: 60px; }
  #lookItems .card button { min-width: 0; width: 100%; padding: 5px 4px; font-size: 13px; }
  #lookItems .card button.cant { opacity: 0.55; }
  #lookMsg { min-height: 1.2em; color: #ffd34d; font-size: 13px; }
  #shopSections { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tabs { display: flex; gap: 8px; }
  .store-menu .tab {
    min-width: 0;
    padding: 6px 12px;
    font-size: 12px;
    letter-spacing: 1px;
    border-color: var(--rar);
    box-shadow: none;
  }
  .store-menu .tab.active { background: var(--rar); color: #111; text-shadow: none; }
  /* Inventory: wraps into rows and scrolls when there are more swords than fit */
  #invItems {
    flex-wrap: wrap;
    justify-content: center;
    max-width: 800px;
    max-height: calc(100vh - 150px);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 4px;
  }
  #invMsg { min-height: 1.2em; color: #ffd34d; font-size: 13px; }
  /* Shop and inventory share one row on the main menu */
  .menu-pair { display: flex; gap: 10px; width: 240px; }
  #mainMenu .menu-pair button { min-width: 0; flex: 1; padding: 10px 6px; font-size: 15px; }
  .card {
    box-sizing: border-box;
    width: 178px;
    padding: 10px;
    border: 3px solid var(--rar, #ff8a1f);
    border-radius: 12px;
    background: rgba(20, 12, 30, 0.7);
    box-shadow: 0 0 12px var(--rar-glow, rgba(255, 110, 20, 0.35));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .card.equipped { border-color: #ffd34d; box-shadow: 0 0 18px rgba(255, 211, 77, 0.7); }
  .card canvas { width: 100%; height: auto; }
  .card .name {
    color: #fff;
    font: bold 12px "Courier New", monospace;
    line-height: 1.15;
    min-height: 2.3em;               /* two lines, so every card is the same height */
    display: flex;
    align-items: center;
    text-align: center;
    text-shadow: 0 1px 2px #000;
  }
  .card .tag { font: bold 11px "Courier New", monospace; letter-spacing: 3px; }
  .store-menu .card button { min-width: 0; width: 100%; padding: 6px 8px; font-size: 15px; }
  .store-menu .card button.cant,
  .store-menu .card button.owned { opacity: 0.55; }
  #shopMsg { min-height: 1.2em; color: #ffd34d; font-size: 13px; }
  .shop-foot { display: flex; gap: 12px; }
  .store-menu .shop-foot button { min-width: 0; padding: 8px 18px; font-size: 15px; }
</style>
</head>
<body>
<canvas id="game" width="900" height="300"></canvas>
<div class="btn" id="duckBtn">DUCK</div>
<div class="btn" id="jumpBtn">JUMP</div>
<div class="btn" id="attackBtn">ATTACK</div>
<div id="pauseBtn" aria-label="Pause"><span></span><span></span></div>

<div class="menu" id="mainMenu">
  <button data-action="play">PLAY</button>
  <div class="menu-pair">
    <button data-action="shop">SHOP</button>
    <button data-action="inventory">INVENTORY</button>
  </div>
  <button data-action="look">CUSTOMIZE</button>
  <button data-action="settings">SETTINGS</button>
  <div class="menu-stats">
    <div class="stat stat-gold"><span class="coin"></span><span class="stat-value" id="goldText"></span></div>
    <div class="stat stat-high">
      <span class="stat-label">BEST <small id="highDiff"></small></span>
      <span class="stat-value" id="highText"></span>
    </div>
  </div>
</div>

<div class="menu store-menu" id="shopMenu">
  <div class="shop-head"><h1>SHOP</h1><span id="shopGold"></span></div>
  <div id="shopSections"></div>
  <p id="shopMsg"></p>
  <div class="shop-foot">
    <button data-action="shopBack">BACK</button>
  </div>
</div>

<div class="menu store-menu" id="invMenu">
  <div class="shop-head"><h1>INVENTORY</h1></div>
  <div class="shop-row" id="invItems"></div>
  <p id="invMsg"></p>
  <div class="shop-foot">
    <button data-action="invBack">BACK</button>
  </div>
</div>

<div class="menu store-menu" id="lookMenu">
  <div class="look-wrap">
    <canvas id="lookPreview" width="240" height="300"></canvas>
    <div class="look-side">
      <div class="shop-head"><h1>CUSTOMIZE</h1><span id="lookGold"></span></div>
      <div class="tabs" id="lookTabs"></div>
      <div class="shop-row" id="lookItems"></div>
      <p id="lookMsg"></p>
    </div>
  </div>
  <div class="shop-foot">
    <button data-action="lookBack">BACK</button>
  </div>
</div>

<div class="menu" id="pauseMenu">
  <h1>PAUSED</h1>
  <button data-action="resume">RESUME</button>
  <button data-action="settings">SETTINGS</button>
  <button data-action="main">MAIN MENU</button>
</div>

<div class="menu" id="settingsMenu">
  <h1>SETTINGS</h1>
  <button data-action="difficulty" id="difficultyBtn"></button>
  <button data-action="btnSize" id="btnSizeBtn"></button>
  <button data-action="sound" id="soundBtn"></button>
  <button data-action="music" id="musicBtn"></button>
  <button data-action="comfort" id="comfortBtn"></button>
  <button data-action="resetHigh" id="resetHighBtn">RESET HIGH SCORES</button>
  <button data-action="back">BACK</button>
  <p id="comfortHint">COMFORT MODE: slower top speed, no screen shake, dark screen. Good if fast games make you dizzy.</p>
</div>

<div class="menu" id="overMenu">
  <h1>GAME OVER</h1>
  <p id="overText"></p>
  <p id="overGold"></p>
  <button data-action="play">PLAY AGAIN</button>
  <button data-action="main">MAIN MENU</button>
</div>

<script>
const canvas = document.getElementById("game");
let ctx = canvas.getContext("2d");   // swapped briefly to draw the hero into the customize preview

// Game world is always 900x300 units; the canvas is scaled to the screen's
// real pixel density so lines stay crisp instead of being stretched.
const W = 900;
const H = 300;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();
const GROUND_Y = 250;

// --- Tunable settings ---
// Comfort Mode: a lower top speed, no screen shake, a dark screen and a quieter ground
const COMFORT_MAX_SPEED = 650;
const GRAVITY = 2400;        // px/s^2
const JUMP_VELOCITY = -820;  // px/s
const JUMP_BUFFER = 0.1;     // s a jump press is remembered while still in the air
// Movement is split into steps no longer than this, so at top speed the world
// moves ~10px per step and small rocks can't skip past the player on slow phones.
const PHYSICS_STEP = 1 / 120;
const ATTACK_DURATION = 0.25;  // s a sword swing lasts (and can hit for)
const ATTACK_COOLDOWN = 0.1;   // s after a swing before the next one

// Speeds in px/s; gain is px/s added per second
const DIFFICULTIES = {
  easy:   { label: "EASY",   start: 320, max: 800,  gain: 5 },
  normal: { label: "NORMAL", start: 380, max: 1000, gain: 8 },
  hard:   { label: "HARD",   start: 460, max: 1200, gain: 12 }
};
const BUTTON_SIZES = {
  small:  { label: "SMALL",  size: "14vh" },
  medium: { label: "MEDIUM", size: "18vh" },
  large:  { label: "LARGE",  size: "24vh" }
};

const settings = Object.assign(
  { difficulty: "normal", btnSize: "medium", sound: true, music: true, comfort: false },
  JSON.parse(localStorage.getItem("stickgo-settings") || "{}")
);

function saveSettings() {
  localStorage.setItem("stickgo-settings", JSON.stringify(settings));
}

// High scores are kept per difficulty, since harder modes score faster
const highScores = JSON.parse(localStorage.getItem("stickgo-highs") || "{}");
// Older versions kept a single high score; carry it over to the current difficulty
const oldHigh = Number(localStorage.getItem("stickgo-high") || 0);
if (oldHigh) {
  highScores[settings.difficulty] = Math.max(oldHigh, highScores[settings.difficulty] || 0);
  localStorage.setItem("stickgo-highs", JSON.stringify(highScores));
  localStorage.removeItem("stickgo-high");
}
function high(diff) { return highScores[diff] || 0; }

// Gold dropped by enemies; the total is kept across runs
let totalGold = Number(localStorage.getItem("stickgo-gold") || 0);

// --- Sword skins (cosmetic only: every sword has the same reach) ---
// The shop groups skins by rarity. How a skin is drawn (see drawBlade):
//   blade = fill colour (null = day/night palette), tip = colour the blade fades to,
//   edge = outline, hi = highlight ridge, guard = crossguard and grip, gem = jewel on the guard,
//   shape = blade outline from PROFILES, curve = sabre-like bend, glow = soft halo,
//   fx = animated effect (see swordFx) in fxColor, hilt = visible handle, wing = winged guard.
// legacy skins stay in the inventory of people who bought them but are no longer sold.
const RARITIES = {
  common:    { label: "COMMON",    color: "#7ed957", glow: "rgba(126, 217, 87, 0.40)" },
  uncommon:  { label: "UNCOMMON",  color: "#4aa8ff", glow: "rgba(74, 168, 255, 0.45)" },
  rare:      { label: "RARE",      color: "#b266ff", glow: "rgba(178, 102, 255, 0.50)" },
  legendary: { label: "LEGENDARY", color: "#ffa930", glow: "rgba(255, 169, 48, 0.60)" }
};
const SWORD_SKINS = {
  starter: { name: "STARTER SWORD", rarity: null, price: 0, blade: null, guard: null, len: 26, width: 3 },

  // Common
  wooden:  { name: "TRAINING WOODEN BOKKEN", rarity: "common", price: 25,
             blade: "#a8743d", edge: "#4a2e14", hi: "#c99358", guard: "#5a3a1a",
             len: 30, width: 4.4, shape: "bokken" },
  sabre:   { name: "RUSTY CUTLASS", rarity: "common", price: 60,
             blade: "#a5a8a6", edge: "#4a4d4f", hi: "#d6d9d8", guard: "#5b3a22",
             len: 30, width: 4.4, shape: "saber", curve: 0.16, fx: "rust", fxColor: "#a8522a" },
  cleaver: { name: "SCRAP METAL CLEAVER", rarity: "common", price: 90,
             blade: "#9aa0a3", edge: "#3f4446", hi: "#cfd4d6", guard: "#cdbb8a",
             len: 27, width: 9, shape: "cleaver", fx: "rust", fxColor: "#8a6a3a" },
  oldguard: { name: "OLD GUARD'S SABER", rarity: "common", price: 120,
             blade: "#cfd4d8", edge: "#5d646a", hi: "#ffffff", guard: "#b7842b",
             len: 32, width: 4, shape: "saber", curve: 0.12 },
  bronze:  { name: "BRONZE SWORD", rarity: "common", price: 40, legacy: true,
             blade: "#e3ac3f", edge: "#6a4a12", guard: "#5a3a12", len: 27, width: 3.5 },

  // Uncommon
  spiketooth: { name: "SPIKE-TOOTH BLADE", rarity: "uncommon", price: 500,
             blade: "#454c56", edge: "#111418", hi: "#8892a0", guard: "#2a2f36",
             len: 32, width: 6.4, shape: "serrated" },
  electro: { name: "ELECTRO-BATON SWORD", rarity: "uncommon", price: 750,
             blade: "#a9c4d6", edge: "#2f5878", hi: "#f2fbff", guard: "#2d4a63",
             len: 31, width: 4, shape: "blade", fx: "electric", fxColor: "#8fe9ff", glow: "#4fc3f7" },
  obsidian: { name: "OBSIDIAN SHARD", rarity: "uncommon", price: 1000,
             blade: "#372a58", edge: "#6a50b4", hi: "#a583f0", guard: "#2a2048",
             len: 30, width: 7.4, shape: "shard" },
  jungle:  { name: "JUNGLE MACHETE", rarity: "uncommon", price: 1250,
             blade: "#566b34", edge: "#1f2a10", hi: "#9fc45a", guard: "#4a3418",
             len: 30, width: 7, shape: "machete", fx: "slime", fxColor: "#7ee04a" },

  // Rare
  crimson: { name: "CRIMSON FURY", rarity: "rare", price: 15000,
             blade: "#c4162d", edge: "#3d050d", hi: "#ff7a66", guard: "#3a0a10",
             len: 33, width: 6.4, shape: "flame", fx: "flame", fxColor: "#ff5a2a", glow: "#ff2a2a" },
  shadow:  { name: "SHADOW EDGE", rarity: "rare", price: 18000,
             blade: "#1c1430", edge: "#05030a", hi: "#7a4fd0", guard: "#120b20",
             len: 33, width: 6.4, shape: "flame", fx: "wisps", fxColor: "#8a5cf0", glow: "#7a3fe0" },
  aero:    { name: "AERO-SABER", rarity: "rare", price: 22000,
             blade: "#dff6fb", edge: "#6fb4c8", hi: "#ffffff", guard: "#5d8fa0",
             len: 33, width: 5, shape: "saber", curve: 0.2, fx: "wisps", fxColor: "#d8fbff", glow: "#8fe3ff" },
  frostbite: { name: "FROSTBITE", rarity: "rare", price: 25000,
             blade: "#a8e0ff", edge: "#3a82b4", hi: "#f2fcff", guard: "#2c5f8a",
             len: 32, width: 7.4, shape: "ice", fx: "sparkle", fxColor: "#ffffff", glow: "#6fd0ff" },

  // Legendary
  dragon:  { name: "DRAGON'S BREATH", rarity: "legendary", price: 100000,
             blade: "#7a1a0a", tip: "#ffb02e", edge: "#2a0803", hi: "#ffd36a", guard: "#3a2a1c",
             len: 34, width: 8.4, shape: "broad", fx: "flame", fxColor: "#ff8a1f", glow: "#ff6a00", gem: "#ff3b1f" },
  laser:   { name: "CYBERNETIC LASER BLADE", rarity: "legendary", price: 100000,
             blade: "#7ff4ff", guard: "#46505e", len: 34, width: 3.6, shape: "laser",
             fx: "laser", fxColor: "#27d7ff", glow: "#27d7ff", gem: "#27d7ff", hilt: true },
  voidbringer: { name: "VOID BRINGER", rarity: "legendary", price: 100000,
             blade: "#2a0f4d", tip: "#6b2fd6", edge: "#080214", hi: "#b27bff", guard: "#1a0a30",
             len: 34, width: 8, shape: "broad", fx: "void", fxColor: "#c490ff", glow: "#8a3dff", gem: "#c490ff" },
  sun:     { name: "CELESTIAL SUN-BLADE", rarity: "legendary", price: 100000,
             blade: "#ffd34d", tip: "#fffbe0", edge: "#a8740a", hi: "#ffffff", guard: "#e0a82a",
             len: 34, width: 6, shape: "blade", fx: "sparkle", fxColor: "#fff3a8", glow: "#ffd34d",
             gem: "#ff7a2a", wing: true }
};
const fmt = (n) => n.toLocaleString("en-US");
const skinState = Object.assign(
  { owned: ["starter"], equipped: "starter" },
  JSON.parse(localStorage.getItem("stickgo-skins") || "{}")
);
function saveSkins() { localStorage.setItem("stickgo-skins", JSON.stringify(skinState)); }
function equippedSkin() { return SWORD_SKINS[skinState.equipped] || SWORD_SKINS.starter; }

// --- Game state ---

// --- Screens & menus ---
const menus = {
  main: document.getElementById("mainMenu"),
  pause: document.getElementById("pauseMenu"),
  settings: document.getElementById("settingsMenu"),
  over: document.getElementById("overMenu"),
  shop: document.getElementById("shopMenu"),
  inventory: document.getElementById("invMenu"),
  look: document.getElementById("lookMenu")
};
let settingsReturnTo = "main";   // which menu BACK returns to
let resetArmed = false;          // reset high score needs a second tap

function showMenu(name) {
  for (const [key, el] of Object.entries(menus)) el.classList.toggle("open", key === name);
  document.body.classList.toggle("playing", name === null);
  if (name === "main") {
    document.getElementById("highText").textContent = pad5(high(settings.difficulty));
    document.getElementById("highDiff").textContent = DIFFICULTIES[settings.difficulty].label;
    document.getElementById("goldText").textContent = fmt(totalGold);
  }
  if (name === "settings") refreshSettingsLabels();
  if (name === "shop") { shopMessage(""); refreshShop(); }
  if (name === "inventory") { invMessage(""); refreshInventory(); }
  if (name === "look") { lookMessage(""); refreshLook(); }
  animatePreviews();
  animateLook();
}

function refreshSettingsLabels() {
  const nextRun = state === "paused" && settings.difficulty !== runDiff ? " (NEXT RUN)" : "";
  document.getElementById("difficultyBtn").textContent =
    `DIFFICULTY: ${DIFFICULTIES[settings.difficulty].label}${nextRun}`;
  document.getElementById("btnSizeBtn").textContent =
    `BUTTON SIZE: ${BUTTON_SIZES[settings.btnSize].label}`;
  document.getElementById("soundBtn").textContent = `SOUND: ${settings.sound ? "ON" : "OFF"}`;
  document.getElementById("musicBtn").textContent = `MUSIC: ${settings.music ? "ON" : "OFF"}`;
  document.getElementById("comfortBtn").textContent = `COMFORT MODE: ${settings.comfort ? "ON" : "OFF"}`;
  document.getElementById("resetHighBtn").textContent =
    resetArmed ? "TAP AGAIN TO CONFIRM" : "RESET HIGH SCORES";
  document.documentElement.style.setProperty("--btn-size", BUTTON_SIZES[settings.btnSize].size);
}

function nextKey(obj, current) {
  const keys = Object.keys(obj);
  return keys[(keys.indexOf(current) + 1) % keys.length];
}

// PLAY starts a short READY - SET - RUN! countdown; the run itself begins on "RUN!"
function startGame() {
  reset();
  state = "countdown";
  countdown = 0;
  countdownStage = -1;
  showMenu(null);
}

function updateCountdown(dt) {
  countdown += dt;
  player.runPhase += dt * 5.5;   // walking in place while the words count down
  const stage = Math.min(COUNTDOWN_WORDS.length - 1, Math.floor(countdown / COUNTDOWN_STEP));
  if (stage !== countdownStage) {
    countdownStage = stage;
    [sfx.ready, sfx.ready, sfx.go][stage]();
  }
  if (countdown >= COUNTDOWN_STEP * COUNTDOWN_WORDS.length) {
    state = "running";
    goBanner = GO_BANNER_TIME;   // keep "RUN!" on screen for a moment after the start
  }
}

function pauseGame() {
  if (state !== "running") return;
  state = "paused";
  jumpBuffer = 0;
  releaseDuck();
  showMenu("pause");
}

function resumeGame() {
  state = "running";
  showMenu(null);
}

function goToMainMenu() {
  reset();
  state = "ready";
  showMenu("main");
}

function openSettings(from) {
  settingsReturnTo = from;
  resetArmed = false;
  showMenu("settings");
}

const menuActions = {
  play: startGame,
  shop: () => showMenu("shop"),
  shopBack: () => showMenu("main"),
  inventory: () => showMenu("inventory"),
  invBack: () => showMenu("main"),
  look: () => showMenu("look"),
  lookBack: () => showMenu("main"),
  resume: resumeGame,
  main: goToMainMenu,
  settings: () => openSettings(state === "paused" ? "pause" : "main"),
  back: () => showMenu(settingsReturnTo),
  difficulty: () => {
    settings.difficulty = nextKey(DIFFICULTIES, settings.difficulty);
    saveSettings();
    refreshSettingsLabels();
  },
  btnSize: () => {
    settings.btnSize = nextKey(BUTTON_SIZES, settings.btnSize);
    saveSettings();
    refreshSettingsLabels();
  },
  comfort: () => {
    settings.comfort = !settings.comfort;
    saveSettings();
    refreshSettingsLabels();
  },
  sound: () => {
    settings.sound = !settings.sound;
    saveSettings();
    refreshSettingsLabels();
  },
  music: () => {
    settings.music = !settings.music;
    saveSettings();
    refreshSettingsLabels();
  },
  resetHigh: () => {
    if (resetArmed) {
      for (const key of Object.keys(highScores)) delete highScores[key];
      localStorage.removeItem("stickgo-highs");
      resetArmed = false;
    } else {
      resetArmed = true;
    }
    refreshSettingsLabels();
  }
};

document.querySelectorAll(".menu button").forEach((b) => {
  b.addEventListener("click", () => menuActions[b.dataset.action]());
});

// --- Shop ---
let shopTab = "common";   // which rarity tab is showing
let previewTimer = null;

// A card with the sword picture, name and rarity. The caller adds the button's text and action.
function swordCard(id) {
  const skin = SWORD_SKINS[id];
  const info = RARITIES[skin.rarity] || { label: "STARTER", color: "#ffffff" };
  const card = document.createElement("div");
  card.className = "card";
  if (RARITIES[skin.rarity]) {
    card.style.setProperty("--rar", info.color);
    card.style.setProperty("--rar-glow", info.glow);
  }
  card.innerHTML = `<canvas width="320" height="128"></canvas>
    <div class="name">${skin.name}</div>
    <div class="tag" style="color:${info.color}">${info.label}</div>
    <button></button>`;
  const canvas = card.querySelector("canvas");
  if (skin.fx || skin.glow) canvas.dataset.anim = id;   // animated while the menu is open
  drawSwordPreview(canvas, skin);
  return card;
}

// Keeps the glowing, sparking swords moving while the shop or inventory is open
function animatePreviews() {
  const open = menus.shop.classList.contains("open") || menus.inventory.classList.contains("open");
  if (!open) { clearInterval(previewTimer); previewTimer = null; return; }
  if (previewTimer) return;
  previewTimer = setInterval(() => {
    for (const c of document.querySelectorAll("canvas[data-anim]")) {
      drawSwordPreview(c, SWORD_SKINS[c.dataset.anim]);
    }
  }, 70);
}

// One tab per rarity, and below it that rarity's swords
function refreshShop() {
  document.getElementById("shopGold").innerHTML = `<span class="coin"></span>${fmt(totalGold)}`;
  const sections = document.getElementById("shopSections");
  sections.innerHTML = "";

  const tabs = document.createElement("div");
  tabs.className = "tabs";
  for (const [rarity, info] of Object.entries(RARITIES)) {
    const tab = document.createElement("button");
    tab.className = "tab" + (rarity === shopTab ? " active" : "");
    tab.style.setProperty("--rar", info.color);
    tab.textContent = info.label;
    tab.addEventListener("click", () => { shopTab = rarity; refreshShop(); });
    tabs.appendChild(tab);
  }

  const row = document.createElement("div");
  row.className = "shop-row";
  for (const [id, skin] of Object.entries(SWORD_SKINS)) {
    if (skin.rarity !== shopTab || skin.legacy) continue;
    const owned = skinState.owned.includes(id);
    const card = swordCard(id);
    const btn = card.querySelector("button");
    btn.innerHTML = owned ? "OWNED" : `<span class="coin"></span>${fmt(skin.price)}`;
    btn.classList.toggle("owned", owned);
    btn.classList.toggle("cant", !owned && totalGold < skin.price);
    btn.addEventListener("click", () => shopTap(id));
    row.appendChild(card);
  }
  sections.append(tabs, row);
}

function shopMessage(text) { document.getElementById("shopMsg").textContent = text; }

// Tapping a card buys it if there's enough gold. Equipping is done in the inventory.
function shopTap(id) {
  const skin = SWORD_SKINS[id];
  if (skinState.owned.includes(id)) {
    shopMessage("YOU OWN THIS — EQUIP IT FROM YOUR INVENTORY");
    return;
  } else if (totalGold >= skin.price) {
    totalGold -= skin.price;
    localStorage.setItem("stickgo-gold", totalGold);
    skinState.owned.push(id);
    shopMessage(`BOUGHT ${skin.name}! EQUIP IT FROM YOUR INVENTORY`);
    sfx.coin();
  } else {
    shopMessage(`NOT ENOUGH GOLD — NEED ${fmt(skin.price - totalGold)} MORE`);
    return;
  }
  saveSkins();
  refreshShop();
}

// --- Inventory ---
// Every owned sword (starter first, then by rarity) with an EQUIP button.
function refreshInventory() {
  const row = document.getElementById("invItems");
  row.innerHTML = "";
  for (const rarity of [null, ...Object.keys(RARITIES)]) {
    for (const [id, skin] of Object.entries(SWORD_SKINS)) {
      if (skin.rarity !== rarity || !skinState.owned.includes(id)) continue;
      const equipped = skinState.equipped === id;
      const card = swordCard(id);
      card.classList.toggle("equipped", equipped);
      const btn = card.querySelector("button");
      btn.textContent = equipped ? "EQUIPPED" : "EQUIP";
      btn.addEventListener("click", () => equipSkin(id));
      row.appendChild(card);
    }
  }
  if (skinState.owned.length < 2) invMessage("BUY MORE SWORDS IN THE SHOP");
}

function equipSkin(id) {
  if (skinState.equipped === id) return;
  skinState.equipped = id;
  saveSkins();
  refreshInventory();
  invMessage(`${SWORD_SKINS[id].name} EQUIPPED`);
}

function invMessage(text) { document.getElementById("invMsg").textContent = text; }

// Rainbow items drift slowly through the colours (a gentle fade, not a flash)
function rainbowHue() { return (performance.now() / 1000 * 50) % 360; }
function scarfColors() {
  const s = SCARVES[look.equipped.scarf] || SCARVES.red;
  if (!s.rainbow) return s;
  const h = rainbowHue();
  return { a: `hsl(${h}, 85%, 58%)`, b: `hsl(${(h + 25) % 360}, 85%, 40%)` };
}
function auraColors() {
  const a = AURAS[look.equipped.aura] || AURAS.blue;
  if (a.rainbow) { const h = rainbowHue(); return { front: `hsla(${h}, 100%, 60%, 0.30)`, back: `hsla(${h}, 100%, 60%, 0.16)` }; }
  return { front: `rgba(${a.rgb}, 0.30)`, back: `rgba(${a.rgb}, 0.16)` };
}

// Each hat is drawn upright around the head's centre (the head is a circle of radius 8, he
// faces right); drawHat tilts it with his head.
function drawHatShape(id, t) {
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  const poly = (color, pts) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]);
    ctx.closePath();
    ctx.fill();
  };
  const dome = (color, r, cy) => {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(0, cy, r, Math.PI, 0); ctx.closePath(); ctx.fill();
  };
  switch (id) {
    case "cap":
      dome("#d62c2c", 8.7, -3.6);
      ctx.fillStyle = "#a31d1d";
      ctx.beginPath(); ctx.moveTo(2, -4.4); ctx.quadraticCurveTo(12, -6.5, 15, -2.4); ctx.lineTo(2, -2.8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, -12.3, 1.3, 0, Math.PI * 2); ctx.fill();
      break;
    case "headband": {
      const w = Math.sin(t * 8) * 2;
      ctx.strokeStyle = "#e53030";
      ctx.lineWidth = 3.2;
      ctx.beginPath(); ctx.moveTo(-7.4, -5.2); ctx.lineTo(7.4, -5.2); ctx.stroke();
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(-7, -5); ctx.quadraticCurveTo(-13, -4 + w, -19, -1 + w * 1.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-7, -4.2); ctx.quadraticCurveTo(-12, -1 - w, -17, 2 - w); ctx.stroke();
      break;
    }
    case "party":
      poly("#ff5fa8", [[-6, -6.4], [6, -6.4], [0.5, -21]]);
      ctx.strokeStyle = "#ffe14d"; ctx.lineWidth = 1.6;
      for (const [y, hw] of [[-9.5, 4.8], [-13.5, 3.4], [-17, 2]]) { ctx.beginPath(); ctx.moveTo(0.3 - hw, y); ctx.lineTo(0.3 + hw, y); ctx.stroke(); }
      ctx.fillStyle = "#ffe14d"; ctx.beginPath(); ctx.arc(0.5, -21.5, 2.2, 0, Math.PI * 2); ctx.fill();
      break;
    case "cowboy":
      ctx.fillStyle = "#8b5a2b";
      ctx.beginPath(); ctx.ellipse(0, -6.8, 15, 3.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#a06a35";
      ctx.beginPath(); ctx.moveTo(-6.6, -7); ctx.lineTo(-5.6, -16); ctx.quadraticCurveTo(0, -13.2, 5.6, -16); ctx.lineTo(6.6, -7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#5a3a1a"; ctx.fillRect(-6.6, -9.8, 13.2, 2.2);
      break;
    case "tophat":
      ctx.fillStyle = "#16161d";
      ctx.fillRect(-10.5, -8.8, 21, 2.6);
      ctx.fillRect(-6.6, -22, 13.2, 13.6);
      ctx.fillStyle = "#b33"; ctx.fillRect(-6.6, -11.8, 13.2, 3);
      break;
    case "viking":
      dome("#9aa3ad", 8.8, -4);
      ctx.fillStyle = "#6a5030"; ctx.fillRect(-8.8, -6.4, 17.6, 2.4);
      ctx.strokeStyle = "#f1e9d0"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-7.8, -6); ctx.quadraticCurveTo(-14, -8, -11.5, -17); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(7.8, -6); ctx.quadraticCurveTo(14, -8, 11.5, -17); ctx.stroke();
      break;
    case "wizard":
      ctx.fillStyle = "#4b2a8c";
      ctx.beginPath(); ctx.ellipse(0, -6.6, 12.5, 2.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#6a3cc4";
      ctx.beginPath(); ctx.moveTo(-8, -6.8); ctx.quadraticCurveTo(-4, -22, 8, -30); ctx.quadraticCurveTo(5, -16, 8, -6.8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffe14d";
      for (const [x, y, r] of [[0.5, -13, 1.5], [3.4, -21, 1.2]]) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
      break;
    case "crown":
      poly("#ffd34d", [[-7, -6.6], [-8, -16.5], [-3.7, -11.8], [0, -18.5], [3.7, -11.8], [8, -16.5], [7, -6.6]]);
      ctx.strokeStyle = "#a8740a"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-7, -6.6); ctx.lineTo(-8, -16.5); ctx.lineTo(-3.7, -11.8); ctx.lineTo(0, -18.5); ctx.lineTo(3.7, -11.8); ctx.lineTo(8, -16.5); ctx.lineTo(7, -6.6); ctx.closePath(); ctx.stroke();
      for (const [x, c] of [[-4.2, "#3a7bff"], [0, "#e03030"], [4.2, "#3fcf5a"]]) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, -9.3, 1.3, 0, Math.PI * 2); ctx.fill(); }
      break;
    case "halo":
      ctx.strokeStyle = "#ffe27a"; ctx.lineWidth = 2.2;
      ctx.shadowColor = "#ffd34d"; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.ellipse(0, -15 + Math.sin(t * 3) * 0.8, 8.5, 2.6, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.shadowBlur = 0;
      break;
  }
}

function drawHat(id, head, neck) {
  if (!id || id === "none") return;
  ctx.save();
  ctx.translate(head.x, head.y);
  ctx.rotate(Math.atan2(head.x - neck.x, -(head.y - neck.y)));   // follow the tilt of his head
  drawHatShape(id, performance.now() / 1000);
  ctx.restore();
}

// Draws into another canvas by pointing ctx at it for a moment
function withContext(g, fn) {
  const savedCtx = ctx, savedColors = colors;
  ctx = g;
  colors = paletteAt(0);          // the day colours, so the dark hero shows on the light preview
  try { fn(); } finally { ctx = savedCtx; colors = savedColors; }
}

let lookPhase = 0;
function drawLookPreview() {
  const cv = document.getElementById("lookPreview");
  const g = cv.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
  const S = cv.height / 92;
  g.setTransform(S, 0, 0, S, cv.width / 2 - 11 * S, 30 * S);
  withContext(g, () => {
    const pose = getPose({ runPhase: lookPhase, onGround: true, ducking: false, vy: 0, attack: 0, x: 0, y: 0, w: 26, h: 60 });
    drawHero(pose, false);
    drawSword(pose, false);
  });
}

function drawLookIcon(cv, group, id) {
  const g = cv.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
  const item = LOOK_GROUPS[group].items[id];
  const hue = rainbowHue();
  if (group === "hat") {
    const S = cv.height / 42;
    g.setTransform(S, 0, 0, S, cv.width / 2, cv.height * 0.78);
    withContext(g, () => {
      g.fillStyle = "#2a2a36";
      g.beginPath(); g.arc(0, 0, 8, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#cfe7ff";
      g.beginPath(); g.ellipse(2.6, -0.8, 1.5, 2.2, 0.18, 0, Math.PI * 2); g.fill();
      drawHatShape(id, performance.now() / 1000);
    });
  } else if (group === "scarf") {
    const a = item.rainbow ? `hsl(${hue}, 85%, 58%)` : item.a, b = item.rainbow ? `hsl(${(hue + 25) % 360}, 85%, 40%)` : item.b;
    g.lineCap = "round";
    g.lineWidth = 11;
    g.strokeStyle = b;
    g.beginPath(); g.moveTo(cv.width * 0.72, cv.height * 0.44); g.quadraticCurveTo(cv.width * 0.45, cv.height * 0.62, cv.width * 0.12, cv.height * 0.8); g.stroke();
    g.strokeStyle = a;
    g.beginPath(); g.moveTo(cv.width * 0.72, cv.height * 0.4); g.quadraticCurveTo(cv.width * 0.45, cv.height * 0.3, cv.width * 0.1, cv.height * 0.42); g.stroke();
    g.fillStyle = a;
    g.beginPath(); g.arc(cv.width * 0.74, cv.height * 0.42, 11, 0, Math.PI * 2); g.fill();
  } else {
    const c = item.rainbow ? `${hue}, 100%, 60%` : null;
    const cx = cv.width / 2, cy = cv.height / 2;
    const grad = g.createRadialGradient(cx, cy, 8, cx, cy, 58);
    grad.addColorStop(0, item.rainbow ? `hsla(${c}, 0.85)` : `rgba(${item.rgb}, 0.85)`);
    grad.addColorStop(1, item.rainbow ? `hsla(${c}, 0)` : `rgba(${item.rgb}, 0)`);
    g.fillStyle = grad;
    g.beginPath(); g.arc(cx, cy, 58, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#1a1a22";
    g.beginPath(); g.arc(cx, cy, 18, 0, Math.PI * 2); g.fill();
  }
}

let lookTab = "hat";
let lookTimer = null;

function refreshLook() {
  document.getElementById("lookGold").innerHTML = `<span class="coin"></span>${fmt(totalGold)}`;
  const tabs = document.getElementById("lookTabs");
  const row = document.getElementById("lookItems");
  tabs.innerHTML = "";
  row.innerHTML = "";
  for (const [group, info] of Object.entries(LOOK_GROUPS)) {
    const tab = document.createElement("button");
    tab.className = "tab" + (group === lookTab ? " active" : "");
    tab.style.setProperty("--rar", "#ff8a1f");
    tab.textContent = info.label;
    tab.addEventListener("click", () => { lookTab = group; lookMessage(""); refreshLook(); });
    tabs.appendChild(tab);
  }
  for (const [id, item] of Object.entries(LOOK_GROUPS[lookTab].items)) {
    const owned = look.owned[lookTab].includes(id);
    const equipped = look.equipped[lookTab] === id;
    const card = document.createElement("div");
    card.className = "card" + (equipped ? " equipped" : "");
    card.style.setProperty("--rar", "#ff8a1f");
    card.innerHTML = `<canvas width="192" height="120"></canvas><div class="name">${item.name}</div><button></button>`;
    const cv = card.querySelector("canvas");
    if (item.rainbow || id === "headband" || id === "halo") cv.dataset.anim = id;
    cv.dataset.group = lookTab;
    cv.dataset.id = id;
    drawLookIcon(cv, lookTab, id);
    const btn = card.querySelector("button");
    if (equipped) btn.textContent = "EQUIPPED";
    else if (owned) btn.textContent = "EQUIP";
    else { btn.innerHTML = `<span class="coin"></span>${fmt(item.price)}`; btn.classList.toggle("cant", totalGold < item.price); }
    btn.addEventListener("click", () => lookTap(lookTab, id));
    row.appendChild(card);
  }
  drawLookPreview();
}

// Tapping an item equips it; if you don't own it yet it is bought first
function lookTap(group, id) {
  const item = LOOK_GROUPS[group].items[id];
  if (!look.owned[group].includes(id)) {
    if (totalGold < item.price) { lookMessage(`NOT ENOUGH GOLD — NEED ${fmt(item.price - totalGold)} MORE`); return; }
    totalGold -= item.price;
    localStorage.setItem("stickgo-gold", totalGold);
    look.owned[group].push(id);
    sfx.coin();
  }
  look.equipped[group] = id;
  saveLook();
  lookMessage(id === "none" ? "HAT REMOVED" : `${item.name} EQUIPPED`);
  refreshLook();
}

function lookMessage(text) { document.getElementById("lookMsg").textContent = text; }

// Keeps the preview running and the animated items (rainbow, headband, halo) moving
function animateLook() {
  if (!menus.look.classList.contains("open")) { clearInterval(lookTimer); lookTimer = null; return; }
  if (lookTimer) return;
  lookTimer = setInterval(() => {
    lookPhase += 0.45;
    drawLookPreview();
    for (const cv of document.querySelectorAll("#lookItems canvas[data-anim]")) drawLookIcon(cv, cv.dataset.group, cv.dataset.id);
  }, 70);
}

// Called by the Android app when the phone's back button is pressed.
// Returns true if the game handled it, false to let the app close.
window.stickgoBack = function () {
  if (state === "dying") return true;
  if (state === "countdown") { goToMainMenu(); return true; }
  if (state === "running") { pauseGame(); return true; }
  if (menus.shop.classList.contains("open")) { showMenu("main"); return true; }
  if (menus.inventory.classList.contains("open")) { showMenu("main"); return true; }
  if (menus.look.classList.contains("open")) { showMenu("main"); return true; }
  if (menus.settings.classList.contains("open")) { showMenu(settingsReturnTo); return true; }
  if (state === "paused") { resumeGame(); return true; }
  if (state === "over") { goToMainMenu(); return true; }
  return false;
};

// --- Sound ---
// Small synthesized beeps, so no audio files are needed. Browsers only allow
// audio after the player has touched or pressed something, so it starts then.
let audio = null;

function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!audio && AC) audio = new AC();
  if (audio && audio.state === "suspended") audio.resume();
}
for (const ev of ["pointerdown", "pointerup", "keydown", "click", "touchstart", "touchend"]) {
  document.addEventListener(ev, initAudio, true);
}
initAudio();   // the app allows autoplay, so the menu music can start right away

function beep(freq, dur, { type = "square", vol = 0.06, slideTo, delay = 0 } = {}) {
  if (!settings.sound || !audio || audio.state !== "running") return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur);
}

// --- Music ---
// A looping synthesized tune (Am - F - C - G): bass, arpeggio and drums, scheduled a
// little ahead of time from the main loop. It plays only while a run is going.
const MUSIC_STEP = 60 / 150 / 2;   // one eighth note at 150 bpm
const MUSIC_CHORDS = [
  { bass: 45, notes: [69, 72, 76] },   // Am
  { bass: 41, notes: [65, 69, 72] },   // F
  { bass: 48, notes: [72, 76, 79] },   // C
  { bass: 43, notes: [71, 74, 79] }    // G
];
const ARP_ORDER = [0, 1, 2, 1, 0, 1, 2, 1];
let musicNext = 0, musicStep = 0, noiseBuf = null;

const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

function musicTone(freq, t, dur, type, vol, slideTo) {
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur);
}

function musicNoise(t, dur, vol) {
  if (!noiseBuf) {
    noiseBuf = audio.createBuffer(1, audio.sampleRate * 0.1, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = audio.createBufferSource();
  const gain = audio.createGain();
  src.buffer = noiseBuf;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(gain).connect(audio.destination);
  src.start(t);
}

function scheduleMusicStep(step, t) {
  const bar = Math.floor(step / 8) % MUSIC_CHORDS.length;
  const s = step % 8;
  const chord = MUSIC_CHORDS[bar];
  // Phone speakers are weak on low notes, so the bass is an octave up and doubled with a square
  musicTone(midiHz(chord.notes[ARP_ORDER[s]]), t, MUSIC_STEP * 0.9, "square", 0.05);
  if (s === 0 || s === 3 || s === 4 || s === 6) {
    musicTone(midiHz(chord.bass + 12), t, MUSIC_STEP * 1.6, "triangle", 0.2);
    musicTone(midiHz(chord.bass + 12), t, MUSIC_STEP * 1.2, "square", 0.03);
  }
  if (s === 0 || s === 4) musicTone(180, t, 0.12, "sine", 0.25, 60);
  if (s === 2 || s === 6) musicNoise(t, 0.09, 0.08);
  if (s % 2 === 1) musicNoise(t, 0.03, 0.03);
}

function musicTick() {
  if (!audio || audio.state !== "running" || !settings.sound || !settings.music || (state !== "running" && state !== "ready" && state !== "countdown")) {
    musicNext = 0;   // restart cleanly from the next beat once it can play again
    return;
  }
  const now = audio.currentTime;
  if (musicNext < now) musicNext = now + 0.05;
  while (musicNext < now + 0.25) {
    scheduleMusicStep(musicStep++, musicNext);
    musicNext += MUSIC_STEP;
  }
}

  player.attack = ATTACK_DURATION;
  player.attackCooldown = ATTACK_DURATION + ATTACK_COOLDOWN;
  player.swingId++;
  sfx.slash();
}

// --- Waves ---
// Every WAVE_LENGTH points a new wave starts and everything gets tougher, up
// to MAX_WAVE. The minimum gap between obstacles is never shrunk (a jump
// always takes the same time), so later waves stay hard but possible.
const WAVE_LENGTH = 300;
const MAX_WAVE = 8;

function waveAt(s) { return 1 + Math.floor(s / WAVE_LENGTH); }

// 0 in wave 1 .. 1 from MAX_WAVE on
function waveIntensity() { return Math.min(1, (wave - 1) / (MAX_WAVE - 1)); }

// Spawn x for something moving at objSpeed so it reaches the player when a
// ground obstacle spawned now would. Faster things start further off-screen;
// otherwise they'd catch up with the obstacle ahead and leave no room to land.
function arrivalX(objSpeed) {
  return player.x + (W + 20 - player.x) * objSpeed / speed;
}

// --- Obstacles ---
// Each kind unlocks at a score and has a spawn weight that can grow with the
// wave (t: 0 in wave 1 .. 1 from MAX_WAVE). Later waves lean towards drones,
// enemies and the trickier traps rather than plain rocks.
const SPAWNS = [
  { from: 0,   weight: () => 22,              make: makeRocks },
  { from: 60,  weight: () => 12,              make: makeSpikeTrap },
  { from: 40,  weight: (t) => 20 + 10 * t,    make: makeEnemies },
  { from: 150, weight: (t) => 8 + 4 * t,      make: makeBarrel },
  { from: 200, weight: (t) => 25 + 10 * t,    make: makeDrone },
  { from: 250, weight: (t) => 7 + 3 * t,      make: makeFirePit },
  { from: 100, weight: (t) => 6 + 3 * t,      make: makeSpikeBall },
  { from: 150, weight: (t) => 6 + 3 * t,      make: makeLaserGate },
  // Newer arrivals. extra = seconds of breathing room added after it spawns; when = only if true.
  { from: 100, weight: () => 5,               make: makeChest },
  { from: 250, weight: (t) => 9 + 2 * t,      make: makeArcher,  when: noRanged, extra: 1.0 },
  { from: 350, weight: (t) => 9 + 4 * t,      make: makeNinja,   extra: 0.7 },
  { from: 450, weight: (t) => 8 + 3 * t,      make: makeBat,     extra: 0.4 },
  { from: 550, weight: (t) => 8 + 3 * t,      make: makePhantom, extra: 0.4 },
  { from: 700, weight: (t) => 7 + 3 * t,      make: makeBrute,   extra: 0.8 },
  { from: 850, weight: (t) => 7 + 2 * t,      make: makeBomber,  when: noRanged, extra: 1.0 }
];

// Spawns one obstacle; returns the extra breathing room it needs
function spawnObstacle() {
  const t = waveIntensity();
  const open = SPAWNS.filter((s) => score >= s.from && (!s.when || s.when()));
  let roll = Math.random() * open.reduce((sum, s) => sum + s.weight(t), 0);
  for (const s of open) {
    roll -= s.weight(t);
    if (roll <= 0) { s.make(t); return s.extra || 0; }
  }
  const last = open[open.length - 1];
  last.make(t);
  return last.extra || 0;
}

// Ground rocks in groups that grow taller and wider each wave
function makeRocks(t) {
  const maxCount = score > 400 ? 3 + Math.round(t) : 2;
  const count = 1 + Math.floor(Math.random() * maxCount);
  const h = 26 + 12 * t + Math.random() * 24;
  const w = 18 * count + 4;
  obstacles.push({ type: "rock", x: W + 20, y: GROUND_Y - h, w, h, count });
}

// Wooden plank with metal spikes on top: jump it
function makeSpikeTrap(t) {
  const w = 40 + Math.random() * 30 + 10 * t;
  const h = 30 + Math.random() * 12 + 6 * t;
  obstacles.push({ type: "spikes", x: W + 20, y: GROUND_Y - h, w, h });
}

// Enemy stickmen charging at the player: slash them or jump over them.
// They run faster each wave and from wave 3 sometimes come in pairs.
// From wave 2 some carry a shield that blocks the sword, so they must be jumped.
function makeEnemies(t) {
  const pair = wave >= 3 && Math.random() < 0.15 + 0.25 * t;
  const run = 80 + 120 * t + Math.random() * 80;  // px/s they run towards the player
  for (let i = 0; i < (pair ? 2 : 1); i++) {
    obstacles.push({
      type: "enemy",
      x: arrivalX(speed + run) + i * (70 + Math.random() * 25),
      y: GROUND_Y - player.standH,
      w: player.w,
      h: player.standH,
      run,
      shield: wave >= 2 && Math.random() < 0.2 + 0.25 * t,
      runPhase: Math.random() * 6,
      onGround: true, ducking: false, vy: 0, attack: 0  // fields read by getPose
    });
  }
}

// Barrel rolling towards the player, faster than the ground: jump it earlier
function makeBarrel(t) {
  const roll = 70 + 90 * t + Math.random() * 50;
  const r = 13;
  obstacles.push({ type: "barrel", x: arrivalX(speed + roll), y: GROUND_Y - r * 2, w: r * 2, h: r * 2, r, roll, turn: 0 });
}

// Flying drone (top of a 22-tall box). Low: skims the ground, must be jumped.
// Mid: head height, hits a standing player but clears a ducking one.
// High: harmless unless you jump into it. The sword can't hurt drones.
// From wave 3 they bob up and down a little (never enough to change
// whether you need to jump or duck).
function makeDrone(t) {
  const tops = [GROUND_Y - 28, GROUND_Y - 58, GROUND_Y - 109];
  const y = tops[Math.floor(Math.random() * tops.length)];
  const mul = 1.1 + 0.2 * t;  // drones fly faster than the ground scrolls, more so each wave
  obstacles.push({
    type: "drone",
    x: arrivalX(speed * mul),
    mul,
    y, baseY: y,
    bob: wave >= 3 ? 3 + 5 * t : 0,
    w: 40,
    h: 22,
    spin: Math.random() * 6
  });
}

// Stone fire pit whose flames rise and fall: always jump it, easiest when low
const FIRE_BASE = 10;
function makeFirePit(t) {
  const w = 44 + Math.random() * 16;
  obstacles.push({
    type: "fire", x: W + 20, y: GROUND_Y - FIRE_BASE, w, h: FIRE_BASE,
    phase: Math.random() * 6, rate: 3.5 + 1.5 * t
  });
}
function flameHeight(o) { return 6 + 32 * (0.5 + 0.5 * Math.sin(o.phase)); }

// Spiked ball swinging on a chain from above. At the bottom of its swing it's
// at head height, so ducking is always safe; standing works if you time it
// while it's swung away, and jumping into it is deadly.
const BALL_PIVOT_Y = 60, BALL_CHAIN = 145, BALL_R = 10;
function makeSpikeBall(t) {
  obstacles.push({
    type: "spikeball", x: W + 20, y: 0, w: 240, h: 1,  // box spans the whole swing
    amp: 0.55 + 0.25 * t, rate: 2.6 + 1.2 * t, phase: Math.random() * 6
  });
}
function spikeBallPos(o) {
  const a = o.amp * Math.sin(o.phase);
  return { pivotX: o.x + o.w / 2, x: o.x + o.w / 2 + Math.sin(a) * BALL_CHAIN, y: BALL_PIVOT_Y + Math.cos(a) * BALL_CHAIN };
}

// Laser gate: two posts with a beam between them that blinks on and off,
// a faint steady line as a warning just before it turns on. A low beam must be jumped
// and a high one ducked while it's on; while it's off just run through.
const LASER_WARN = 0.25;
function makeLaserGate(t) {
  const low = Math.random() < 0.5;
  const beamY = low ? GROUND_Y - 22 : GROUND_Y - 48;
  obstacles.push({
    type: "laser", x: W + 20, y: beamY - 3, w: 56, h: 6, beamY,
    cycle: 1.7 - 0.3 * t, onTime: 1.0, clock: Math.random() * 2
  });
}
function laserPhase(o) { return o.clock % o.cycle; }
function laserOn(o) { return laserPhase(o) < o.onTime; }
function laserWarning(o) { return laserPhase(o) > o.cycle - LASER_WARN; }

// --- More enemies and the treasure chest ---
// Archers and bombers run along at the right edge of the screen and shoot or throw
// from there, then leave. The others charge, dive or fight up close. Each kind has a
// mover (MOVERS), a sword reaction (SLASH) and a picture (OBSTACLE_DRAW).
const RANGED = new Set(["archer", "bomber"]);
const BONUS_JUMP = new Set(["enemy", "drone", "ninja", "brute", "phantom"]);  // +10 for jumping over
const SHOOTER_X = W - 80;                  // where archers and bombers stand
const BOSS_X = 400, BOSS_FIGHT_X = 128;    // where the boss waits, and where he stands to be hit
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const rand = (a, b) => a + Math.random() * (b - a);

let sparks = [];                // little particles: feathers, sparks, gold glints
let bossBanner = null;          // { title, sub, t } shown big for a moment

// Only one shooter at a time, and none during a boss fight
function noRanged() { return !obstacles.some((o) => RANGED.has(o.type) || o.type === "boss"); }

// Fields getPose() reads, so any of these can be drawn as a stickman
function person(fields) {
  return { onGround: true, ducking: false, vy: 0, attack: 0, runPhase: Math.random() * 6, ...fields };
}

function burst(x, y, n, color, power = 220) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = power * (0.3 + Math.random() * 0.7);
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, t: 0,
                  life: 0.4 + Math.random() * 0.4, color, r: 1.5 + Math.random() * 1.5 });
  }
}

// Coins burst out and a gold "+N" floats up
function dropGold(x, y, count, popupY = y - 26) {
  popups.push({ x, y: popupY, t: 0, text: "+" + count, gold: true, life: 1.1 });
  for (let i = 0; i < count; i++) {
    coins.push({ x, y, vx: 30 + Math.random() * 170, vy: -300 - Math.random() * 240, spin: Math.random() * 6 });
  }
}

// Runs [time, fn] events once each as o.timer passes their time; true once past `end`
function timeline(o, dt, events, end) {
  o.timer += dt;
  while (o.next < events.length && o.timer >= events[o.next][0]) events[o.next++][1]();
  return o.timer >= end;
}
function setState(o, state) { o.state = state; o.timer = 0; o.next = 0; }

const MOVERS = {};   // type -> (o, dt): moves one obstacle; types without one just scroll
const SLASH = {};    // type -> (o): what happens when the sword catches it

// Treasure chest: harmless, slash it open for gold. If you ignore it, it just passes by.
function makeChest() {
  obstacles.push({ type: "chest", x: W + 20, y: GROUND_Y - 26, w: 36, h: 26,
                   open: false, openT: 0, gold: randInt(8, 14) + 2 * wave });
}
MOVERS.chest = (o, dt) => { o.x -= speed * dt; if (o.open) o.openT += dt; };
SLASH.chest = (o) => {
  if (o.open) return;
  o.open = true;
  dropGold(o.x + o.w / 2, o.y, o.gold, o.y - 14);
  burst(o.x + o.w / 2, o.y + 4, 14, GOLD, 260);
  shakeTime = Math.max(shakeTime, 0.12);
  sfx.chest();
};

// Archer: keeps pace at the right edge and fires three arrows, high (duck) or low (jump).
// A red line shows where the next arrow will fly, half a second before it does.
function makeArcher() {
  obstacles.push(person({ type: "archer", look: "archer", x: W + 30, y: GROUND_Y - player.standH,
    w: player.w, h: player.standH, state: "enter", timer: 1.1, shots: 3,
    low: Math.random() < 0.5, draw: 0, warn: false }));
}
const arrowY = (low) => (low ? GROUND_Y - 14 : GROUND_Y - 48);
MOVERS.archer = (o, dt) => {
  o.runPhase += dt * speed / 24;
  if (o.state === "enter") {
    o.x -= (speed + 160) * dt;
    if (o.x <= SHOOTER_X) { o.x = SHOOTER_X; o.state = "aim"; }
  } else if (o.state === "aim") {
    o.timer -= dt;
    o.warn = o.timer < 0.5;
    o.draw = o.warn ? 1 - Math.max(0, o.timer) / 0.5 : 0;
    if (o.warn && !o.warned) { o.warned = true; sfx.warn(); }
    if (o.timer <= 0) {
      obstacles.push({ type: "arrow", x: o.x - 8, y: arrowY(o.low) - 3, w: 28, h: 6, vx: -(speed + 450) });
      sfx.arrow();
      o.shots--; o.warned = false; o.warn = false; o.draw = 0;
      if (o.shots > 0) { o.timer = 1.25; o.low = Math.random() < 0.5; } else o.state = "leave";
    }
  } else {
    o.x += 280 * dt;
    if (o.x > W + 60) o.gone = true;
  }
};
MOVERS.arrow = (o, dt) => { o.x += o.vx * dt; };
SLASH.arrow = (o) => {   // cut an arrow out of the air
  o.gone = true;
  dropGold(o.x, o.y, 2, o.y - 16);
  burst(o.x, o.y, 6, "#c9a36a", 180);
  sfx.clang();
};

// Bomber: lobs two bombs. A red ring shows where each lands; it explodes on landing and the
// fire sweeps past, so be in the air then. A slash catches a bomb before it lands.
function makeBomber() {
  obstacles.push(person({ type: "bomber", look: "bomber", x: W + 30, y: GROUND_Y - player.standH,
    w: player.w, h: player.standH, state: "enter", timer: 1.0, shots: 2, windup: 0, holding: true }));
}
const BOMB_FLIGHT = 0.85, BOMB_GRAVITY = 1500, BLAST_R = 44;
function throwBomb(x, y) {
  const tx = player.x + player.w + 12 + Math.random() * 26;   // lands just in front of the player
  const ty = GROUND_Y - 7;
  obstacles.push({ type: "bomb", x, y, w: 14, h: 14, targetX: tx, flight: 0, spin: 0,
    vx: (tx - x - 7) / BOMB_FLIGHT, vy: (ty - (y + 7) - 0.5 * BOMB_GRAVITY * BOMB_FLIGHT * BOMB_FLIGHT) / BOMB_FLIGHT });
}
MOVERS.bomber = (o, dt) => {
  o.runPhase += dt * speed / 24;
  if (o.state === "enter") {
    o.x -= (speed + 160) * dt;
    if (o.x <= SHOOTER_X) { o.x = SHOOTER_X; o.state = "aim"; }
  } else if (o.state === "aim") {
    o.timer -= dt;
    o.windup = o.timer < 0.45 ? 1 : 0;
    o.holding = true;
    if (o.windup && !o.warned) { o.warned = true; sfx.warn(); }
    if (o.timer <= 0) {
      throwBomb(o.x - 12, o.y + 6);
      o.holding = false; o.windup = 0; o.warned = false; o.shots--;
      if (o.shots > 0) o.timer = 1.5; else o.state = "leave";
    }
  } else {
    o.x += 280 * dt;
    if (o.x > W + 60) o.gone = true;
  }
};
MOVERS.bomb = (o, dt) => {
  o.flight += dt;
  o.spin += dt * 10;
  o.vy += BOMB_GRAVITY * dt;
  o.x += o.vx * dt;
  o.y += o.vy * dt;
  if (o.y + 14 >= GROUND_Y) {
    o.gone = true;
    obstacles.push({ type: "blast", x: o.x + 7, y: GROUND_Y - 1, w: 1, h: 1, r: BLAST_R, t: 0, life: 0.45 });
    shakeTime = Math.max(shakeTime, 0.15);
    burst(o.x + 7, GROUND_Y - 4, 10, "#ff9a2a", 280);
    sfx.boom();
  }
};
SLASH.bomb = (o) => {
  o.gone = true;
  dropGold(o.x + 7, o.y, 3, o.y - 16);
  burst(o.x + 7, o.y + 7, 12, "#ffd23f", 240);
  popups.push({ x: o.x + 7, y: o.y - 34, t: 0, text: "DEFUSED" });
  sfx.clang();
};
MOVERS.blast = (o, dt) => {
  o.x -= speed * dt;
  o.t += dt;
  if (o.t >= o.life) o.gone = true;
};

// Ninja: runs in, stops and crouches (red flash), then leaps at you very fast.
// Jump over the leap or slash him as he arrives.
function makeNinja(t) {
  obstacles.push(person({ type: "ninja", look: "ninja", x: W + 30, y: GROUND_Y - player.standH,
    w: player.w, h: player.standH, run: 90 + 60 * t, state: "run", timer: 0,
    holdX: Math.min(W - 50, player.x + player.w + 250 + 0.3 * speed) }));
}
MOVERS.ninja = (o, dt) => {
  if (o.state === "run") {
    o.x -= (speed + o.run) * dt;
    o.runPhase += dt * (o.run + 250) / 24;
    if (o.x <= o.holdX) { o.x = o.holdX; setState(o, "hold"); o.ducking = true; sfx.warn(); }
  } else if (o.state === "hold") {
    o.runPhase += dt * speed / 40;
    o.timer += dt;
    if (o.timer >= 0.55) { setState(o, "dash"); o.ducking = false; o.onGround = false; o.vy = 0; sfx.dash(); }
  } else {
    o.x -= (speed + 380) * dt;
    if (o.x < -80) o.gone = true;
  }
};
SLASH.ninja = (o) => killEnemy(o, randInt(2, 4));

// Brute: big and slow, takes three sword hits (each shoves him back) and pays well
function makeBrute(t) {
  const run = 40 + 20 * t;
  obstacles.push(person({ type: "brute", look: "brute", scale: 1.6, x: arrivalX(speed + run),
    y: GROUND_Y - 96, w: 42, h: 96, run, hp: 3, maxHp: 3, stagger: 0 }));
}
MOVERS.brute = (o, dt) => {
  // A hit makes him stumble back and hold his distance just long enough for the
  // sword to swing again; otherwise the ground would carry him into you first
  o.stagger = Math.max(0, o.stagger - dt);
  o.x -= (o.stagger > 0 ? 0 : speed + o.run) * dt;
  o.runPhase += dt * (o.run + 250) / 30;
};
SLASH.brute = (o) => {
  if (o.hitSwing === player.swingId) return;
  o.hitSwing = player.swingId;
  o.hp--;
  if (o.hp <= 0) return killEnemy(o, randInt(8, 10));
  o.x += 34;
  o.stagger = 0.4;
  shakeTime = Math.max(shakeTime, 0.1);
  burst(o.x + 4, o.y + 40, 8, "#ffb04a", 240);
  popups.push({ x: o.x + o.w / 2, y: o.y - 10, t: 0, text: "HIT" });
  sfx.clang();
};

// Bat: flies in a wave, hovers a moment (red eyes), then dives at head height.
// Duck under the dive, or slash it. Jumping into it hurts.
function makeBat() {
  const y = rand(80, 125);
  obstacles.push({ type: "bat", look: "bat", x: W + 30, y, baseY: y, w: 30, h: 18,
    state: "fly", t: Math.random() * 6, vx: 0, vy: 0, hover: 0 });
}
MOVERS.bat = (o, dt) => {
  o.t += dt;
  if (o.state === "fly") {
    o.x -= (speed + 40) * dt;
    o.y = o.baseY + Math.sin(o.t * 5) * 18;
    if (o.x - player.x < 330 + 0.2 * speed) { o.state = "hover"; o.hover = 0.4; sfx.screech(); }
  } else if (o.state === "hover") {
    o.y += Math.sin(o.t * 30) * 0.6;
    o.hover -= dt;
    if (o.hover <= 0) {
      const dx = player.x + 6 - (o.x + 15), dy = GROUND_Y - 48 - (o.y + 9), d = Math.hypot(dx, dy);
      const v = 300 + speed;   // dives faster as the game speeds up
      o.vx = dx / d * v; o.vy = dy / d * v;
      o.state = "dive";
    }
  } else if (o.state === "dive") {
    o.x += o.vx * dt; o.y += o.vy * dt;
    if (o.x < player.x - 50) { o.state = "away"; o.vx = -120; o.vy = -260; }
  } else {
    o.x += o.vx * dt; o.y += o.vy * dt;
    if (o.y < -40 || o.x < -60) o.gone = true;
  }
};
SLASH.bat = (o) => {
  o.gone = true;
  shakeTime = Math.max(shakeTime, 0.08);
  burst(o.x + 15, o.y + 9, 10, "#555", 200);
  dropGold(o.x + 15, o.y + 9, randInt(2, 3), o.y - 10);
  sfx.kill();
};

// Phantom: fades between solid and ghost. As a ghost it can't hurt you and your sword
// passes through; it fades back in just before it turns solid again.
function makePhantom(t) {
  const run = 70 + 70 * t;
  obstacles.push(person({ type: "phantom", look: "phantom", x: arrivalX(speed + run),
    y: GROUND_Y - player.standH, w: player.w, h: player.standH, run, t: Math.random() * 1.8, solid: true }));
}
const PHANTOM_CYCLE = 1.8;
// Fades out over the last part of its solid half, and back in over the last part of its
// ghost half, so the change is gradual. It only hurts while solid, and it's fully
// visible again before it becomes solid.
function phantomAlpha(o) {
  const ph = o.ph || 0, half = PHANTOM_CYCLE / 2, k = (a, b, t) => a + (b - a) * Math.min(1, Math.max(0, t));
  if (ph > 0.72 && ph < half) return k(0.95, 0.4, (ph - 0.72) / (half - 0.72));
  if (ph > 1.62) return k(0.2, 0.95, (ph - 1.62) / (PHANTOM_CYCLE - 1.62));
  return o.solid ? 0.95 : 0.2;
}
MOVERS.phantom = (o, dt) => {
  o.x -= (speed + o.run) * dt;
  o.runPhase += dt * (o.run + 250) / 24;
  o.t += dt;
  // A ghost that's inside you waits until it has passed before turning solid,
  // so it can never appear on top of you with no way out
  const inside = o.x < player.x + player.w && o.x + o.w > player.x;
  if (!o.solid && inside && (o.t % PHANTOM_CYCLE) < PHANTOM_CYCLE / 2) o.t -= dt * 2;
  const ph = o.t % PHANTOM_CYCLE;
  o.solid = ph < PHANTOM_CYCLE / 2;
  o.ph = ph;
};
SLASH.phantom = (o) => { if (o.solid) killEnemy(o, randInt(3, 5)); };

// Boss: the Warlord arrives with every 4th wave. While he's here nothing else spawns.
// He slams (a shockwave to jump), lobs bombs, or calls runners; after two attacks he
// steps up to you, and that's when you can hit him. Watch for his sweep.
function spawnBoss() {
  const n = Math.floor(wave / 4);
  const hp = 10 + 5 * n;
  obstacles.push(person({ type: "boss", look: "brute", scale: 2.1, x: W + 80, y: GROUND_Y - 126,
    w: 55, h: 126, hp, maxHp: hp, state: "enter", timer: 0, next: 0, rounds: 0, last: "",
    sweep: 0, sweepWarn: false, warn: false, hold: false, vulnerable: false, flash: 0 }));
  bossBanner = { title: "BOSS", sub: "THE WARLORD", t: 2.4 };
  sfx.boss();
}
function spawnShock(x) { obstacles.push({ type: "shock", x, y: GROUND_Y - 30, w: 28, h: 30 }); }
MOVERS.shock = (o, dt) => { o.x -= (speed + 380) * dt; };
function pushRunner(x, run) {
  obstacles.push(person({ type: "enemy", x, y: GROUND_Y - player.standH, w: player.w, h: player.standH, run, shield: false }));
}
MOVERS.boss = (o, dt) => {
  o.runPhase += dt * speed / 30;
  o.flash = Math.max(0, o.flash - dt);
  o.sweep = Math.max(0, o.sweep - dt);
  if (!o.hold) o.attack = Math.max(0, o.attack - dt);
  const raise = () => { o.attack = ATTACK_DURATION; o.hold = true; o.warn = true; sfx.warn(); };
  const lower = () => { o.hold = false; o.warn = false; };
  switch (o.state) {
    case "enter":
      o.x -= (speed + 80) * dt;
      if (o.x <= BOSS_X) { o.x = BOSS_X; setState(o, "choose"); }
      break;
    case "choose":
      o.timer += dt;
      if (o.timer >= 0.9) {
        if (o.rounds >= 2) { o.rounds = 0; setState(o, "advance"); break; }
        o.rounds++;
        const options = ["slam", "bombs", "summon"].filter((s) => s !== o.last);
        o.last = options[Math.floor(Math.random() * options.length)];
        setState(o, o.last);
      }
      break;
    case "slam":
      if (timeline(o, dt, [[0, raise], [0.75, () => {
        lower(); spawnShock(o.x - 10); sfx.slam(); shakeTime = Math.max(shakeTime, 0.25);
      }]], 1.5)) setState(o, "choose");
      break;
    case "bombs":
      if (timeline(o, dt, [
        [0, raise], [0.6, () => { lower(); throwBomb(o.x - 6, o.y + 40); }],
        [1.2, raise], [1.8, () => { lower(); throwBomb(o.x - 6, o.y + 40); }]], 2.6)) setState(o, "choose");
      break;
    case "summon":
      if (timeline(o, dt, [[0, raise], [0.7, () => {
        lower(); pushRunner(o.x - 10, 150); pushRunner(o.x + 50, 190); sfx.screech();
      }]], 1.8)) setState(o, "choose");
      break;
    case "advance":
      o.x -= 320 * dt;
      if (o.x <= BOSS_FIGHT_X) { o.x = BOSS_FIGHT_X; o.vulnerable = true; setState(o, "expose"); }
      break;
    case "expose":
      if (timeline(o, dt, [
        [1.0, () => { raise(); o.sweepWarn = true; }],
        [1.6, () => { lower(); o.sweepWarn = false; o.sweep = 0.25; sfx.slam(); shakeTime = Math.max(shakeTime, 0.2); }]], 3.4)) {
        o.vulnerable = false; setState(o, "retreat");
      }
      break;
    case "retreat":
      o.x += 340 * dt;
      if (o.x >= BOSS_X) { o.x = BOSS_X; setState(o, "choose"); }
      break;
  }
};
SLASH.boss = (o) => {
  if (!o.vulnerable || o.hitSwing === player.swingId) return;
  o.hitSwing = player.swingId;
  o.hp--;
  o.flash = 0.15;
  shakeTime = Math.max(shakeTime, 0.08);
  burst(o.x + 10, o.y + o.h * 0.5, 8, "#ff6a6a", 260);
  popups.push({ x: o.x + o.w / 2, y: o.y - 10, t: 0, text: "-1" });
  sfx.clang();
  if (o.hp <= 0) {
    bonusScore += 100;
    bossBanner = { title: "BOSS DEFEATED", sub: "+100", t: 2.6 };
    sfx.wave();
    killEnemy(o, 40);
  }
};

// Ordinary enemies keep their old behaviour (shields block the sword)
SLASH.enemy = (o) => {
  if (!o.shield) return killEnemy(o);
  if (o.blockedSwing === player.swingId) return;
  o.blockedSwing = player.swingId;
  o.x += 30;
  o.stagger = 0.3;
  popups.push({ x: o.x + o.w / 2, y: o.y - 8, t: 0, text: "BLOCKED" });
  sfx.clang();
};

// --- Update ---
function update(dt) {
  const diff = DIFFICULTIES[runDiff];
  speed = Math.min(settings.comfort ? Math.min(diff.max, COMFORT_MAX_SPEED) : diff.max, speed + diff.gain * dt);
  distance += speed * dt;
  score = Math.floor(distance / 40) + bonusScore;

  if (waveAt(score) > wave) {
    const before = wave;
    wave = waveAt(score);
    waveBanner = 2;
    sfx.wave();
    if (Math.floor(wave / 4) > Math.floor(before / 4)) spawnBoss();
  }

  if (Math.floor(score / 100) > lastMilestone) {
    lastMilestone = Math.floor(score / 100);
    flashTime = 0.9;
    sfx.point();
  }

  // Player physics
  jumpBuffer -= dt;
  if (jumpBuffer > 0 && player.onGround) {
    player.y = GROUND_Y - player.standH;  // stand up first if he was ducking
    player.vy = JUMP_VELOCITY;
    player.onGround = false;
    player.attack = 0;  // jumping cancels a swing in progress
    jumpBuffer = 0;
    sfx.jump();
  }
  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;
  if (player.y + player.h >= GROUND_Y) {
    if (!player.onGround && !player.ducking) {   // touchdown: brief crouch and a puff of sparks
      player.landT = 0.13;
      burst(player.x + player.w / 2, GROUND_Y - 2, 6, "#ffb43a", 140);
    }
    player.vy = 0;
    player.onGround = true;
  }
  player.landT = Math.max(0, (player.landT || 0) - dt);
  // Sliding kicks up sparks from the front foot
  if (player.ducking && player.onGround && Math.random() < dt * 40) {
    burst(player.x + player.w / 2 + 22, GROUND_Y - 2, 1, "#ffb43a", 130);
  }
  // On the ground the feet stay on the floor, so ducking or landing while
  // ducked drops him straight down instead of floating for a few frames
  if (player.onGround) player.y = GROUND_Y - player.h;
  if (player.onGround) player.runPhase += dt * speed / 24;
  player.attack = Math.max(0, player.attack - dt);
  player.attackCooldown = Math.max(0, player.attackCooldown - dt);

  // Spawn obstacles — gap shrinks as speed rises, and the random extra
  // breathing room shrinks each wave so obstacles come steadily closer together
  spawnTimer -= dt;
  if (obstacles.some((o) => o.type === "boss")) spawnTimer = Math.max(spawnTimer, 0.8);  // a boss fight is a duel
  if (spawnTimer <= 0) {
    const extra = spawnObstacle();
    const minGap = 0.6 + 260 / speed;
    spawnTimer = minGap + Math.random() * (0.9 - 0.6 * waveIntensity()) + extra;
  }

  for (const o of obstacles) {
    if (MOVERS[o.type]) { MOVERS[o.type](o, dt); continue; }
    if (o.type === "drone") {
      o.x -= speed * o.mul * dt;
      o.spin += dt;
      o.y = o.baseY + Math.sin(o.spin * 3) * o.bob;
    } else if (o.type === "enemy") {
      // A blocked enemy staggers briefly, drifting back with the ground
      o.stagger = Math.max(0, (o.stagger || 0) - dt);
      o.x -= (speed + (o.stagger > 0 ? 0 : o.run)) * dt;
      o.runPhase += dt * (o.run + 250) / 24;
    } else if (o.type === "barrel") {
      o.x -= (speed + o.roll) * dt;
      o.turn -= (speed + o.roll) / o.r * dt;
    } else {
      o.x -= speed * dt;
      if (o.type === "fire") {
        o.phase += o.rate * dt;
        o.h = FIRE_BASE + flameHeight(o);
        o.y = GROUND_Y - o.h;
      } else if (o.type === "spikeball") {
        o.phase += o.rate * dt;
      } else if (o.type === "laser") {
        const wasOn = laserOn(o);
        o.clock += dt;
        if (!wasOn && laserOn(o) && o.x < W && o.x + o.w > 0) sfx.laser();
      }
    }
  }
  obstacles = obstacles.filter((o) => o.x + o.w > -50 && !o.gone);

  // The sword hits anything in a box just in front of the player while swinging, but
  // only from the ground. What happens to each kind is in SLASH (shields block it, a
  // brute takes three hits, a ghost passes through, a chest opens...).
  if (player.attack > 0 && player.onGround) {
    const left = player.x + player.w - 6, right = player.x + player.w + 46;
    const top = player.y - 30;
    for (const o of obstacles) {
      const slash = SLASH[o.type];
      if (!slash || o.dead || o.gone) continue;
      if (o.x < right && o.x + o.w > left && o.y + o.h > top) slash(o);
    }
    obstacles = obstacles.filter((o) => !o.dead);
  }

  // Jumping over an enemy or drone is worth a bonus: it counts if his feet were
  // above it at some point while it passed under him
  for (const o of obstacles) {
    if (!BONUS_JUMP.has(o.type)) continue;
    const under = o.x < player.x + player.w && o.x + o.w > player.x;
    if (under && player.y + player.h <= o.y + 4) o.jumpedOver = true;
    if (o.jumpedOver && !o.bonusGiven && o.x + o.w < player.x) {
      o.bonusGiven = true;
      bonusScore += JUMP_OVER_BONUS;
      popups.push({ x: player.x + player.w / 2, y: player.y - 10, t: 0, text: `+${JUMP_OVER_BONUS}` });
      sfx.bonus();
    }
  }
  for (const p of popups) { p.t += dt; p.y -= 40 * dt; }
  popups = popups.filter((p) => p.t < (p.life || 0.8));
  for (const p of sparks) {
    p.t += dt;
    p.vy += 900 * dt;
    p.x += (p.vx - speed) * dt;
    p.y += p.vy * dt;
  }
  sparks = sparks.filter((p) => p.t < p.life);

  updateCoins(dt);
  // Slain enemies stay where they fell, so they scroll away with the ground
  for (const c of corpses) {
    for (const p of Object.values(c.points)) { p.x -= speed * dt; p.px -= speed * dt; }
  }
  corpses = corpses.filter((c) => Object.values(c.points).some((p) => p.x > -40));

  for (const c of clouds) {
    c.x -= speed * c.speed * dt;
    if (c.x < -80) { c.x = W + Math.random() * 200; c.y = 30 + Math.random() * 90; }
  }
  for (const g of groundBits) {
    g.x -= speed * dt;
    if (g.x < -10) g.x = W + Math.random() * 40;
  }

  // Collision (hitboxes shrunk a little so it feels fair)
  const pad = 6;
  const px = player.x + pad, py = player.y + pad;
  const pw = player.w - pad * 2, ph = player.h - pad * 2;
  for (const o of obstacles) {
    if (hitsPlayer(o, px, py, pw, ph)) {
      crash(o);
      break;
    }
  }
}

// Does obstacle o touch the (already shrunk) player box?
function hitsPlayer(o, px, py, pw, ph) {
  const overlap = (x0, y0, x1, y1) => px < x1 && px + pw > x0 && py < y1 && py + ph > y0;
  switch (o.type) {
    case "spikeball": {
      // Circle against box: nearest point of the box to the ball's centre
      const b = spikeBallPos(o);
      const nx = Math.max(px, Math.min(b.x, px + pw)), ny = Math.max(py, Math.min(b.y, py + ph));
      return Math.hypot(b.x - nx, b.y - ny) < BALL_R - 1;
    }
    case "laser":
      // Only the beam hurts, and only while it's on; the posts are scenery
      return laserOn(o) && px < o.x + o.w - 2 && px + pw > o.x + 2 && py < o.y + o.h && py + ph > o.y;
    // These never touch you themselves: archers and bombers keep their distance, and
    // bombs and chests are harmless (arrows and the blast do the damage)
    case "archer": case "bomber": case "bomb": case "chest":
      return false;
    case "arrow":
      return overlap(o.x, o.y, o.x + o.w, o.y + o.h);
    case "blast": {
      const r = o.r * Math.min(1, 0.4 + o.t / 0.1);
      const nx = Math.max(px, Math.min(o.x, px + pw)), ny = Math.max(py, Math.min(GROUND_Y, py + ph));
      return Math.hypot(o.x - nx, GROUND_Y - ny) < r;
    }
    case "phantom":
      if (!o.solid) return false;   // a ghost passes straight through
      break;
    case "boss":
      if (o.sweep > 0 && overlap(o.x - 62, GROUND_Y - 32, o.x + 4, GROUND_Y)) return true;
      break;
  }
  return px < o.x + o.w - 4 && px + pw > o.x + 4 && py < o.y + o.h - 4 && py + ph > o.y + 4;
}

// --- Enemies & gold ---
// "+N" with a coin, in gold, popping slightly bigger as it appears
function drawGoldPopup(p) {
  const pop = 1 + 0.35 * Math.max(0, 1 - p.t / 0.15);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(pop, pop);
  ctx.font = "bold 20px 'Courier New', monospace";
  ctx.textAlign = "left";
  const textW = ctx.measureText(p.text).width;
  const left = -(textW + 18) / 2;
  drawCoin({ x: left + 7, y: -6, spin: 0 });
  ctx.lineWidth = 4;
  ctx.lineJoin = "round";
  ctx.strokeStyle = GOLD_EDGE;
  ctx.fillStyle = GOLD;
  ctx.strokeText(p.text, left + 18, 0);
  ctx.fillText(p.text, left + 18, 0);
  ctx.restore();
}

function killEnemy(o, gold = 1 + Math.floor(Math.random() * 3)) {
  o.dead = true;
  const heavy = o.scale ? 0.6 : 1;   // big ones don't fly as far
  shakeTime = Math.max(shakeTime, o.scale ? 0.25 : 0.1);
  sfx.kill();
  // He's flung away from the sword, upper body first
  const corpse = makeRagdoll(enemyPose(o), (name) => {
    const upper = UPPER_BODY.has(name);
    return [((upper ? 300 : 170) + Math.random() * 80) * heavy, (upper ? -380 : -180) * heavy];
  });
  corpse.look = o.look;     // so a ninja or brute still looks like one when he's down
  corpse.type = o.type;
  corpse.scale = o.scale;
  corpses.push(corpse);
  // Show how much gold he dropped, floating up from where he fell
  dropGold(o.x + o.w / 2, o.y + 20, gold, o.y - 6);
}

function updateCoins(dt) {
  const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
  for (const c of coins) {
    c.spin += dt * 8;
    const dx = cx - c.x, dy = cy - c.y, d = Math.hypot(dx, dy) || 1;
    if (d < 110) {
      // Close coins are pulled in, so jumping over them doesn't miss them
      c.x += (dx / d) * 700 * dt;
      c.y += (dy / d) * 700 * dt;
    } else {
      c.vy += GRAVITY * 0.6 * dt;
      c.x += (c.vx - speed) * dt;
      c.y += c.vy * dt;
      if (c.y > GROUND_Y - 7) { c.y = GROUND_Y - 7; c.vy *= -0.45; c.vx *= 0.6; }
    }
    if (Math.abs(c.x - cx) < player.w / 2 + 14 && Math.abs(c.y - cy) < player.h / 2 + 14) {
      c.taken = true;
      runGold++;
      totalGold++;
      localStorage.setItem("stickgo-gold", totalGold);
      sfx.coin();
    }
  }
  coins = coins.filter((c) => !c.taken && c.x > -20);
}

function gameOver() {
  state = "over";
  if (score > high(runDiff)) {
    highScores[runDiff] = score;
    localStorage.setItem("stickgo-highs", JSON.stringify(highScores));
  }
  releaseDuck();
  document.getElementById("overText").textContent =
    `SCORE ${pad5(score)}   HIGH ${pad5(high(runDiff))} (${DIFFICULTIES[runDiff].label})`;
  document.getElementById("overGold").textContent =
    `WAVE ${wave}   GOLD +${runGold}   TOTAL ${fmt(totalGold)}`;
  showMenu("over");
}

// --- Ragdoll ---
// On a hit the world freezes and the stickman's joints become free points
// held together by bone-length constraints (Verlet integration).
const RAGDOLL_STEP = 1 / 120;
const RAGDOLL_DURATION = 1.3;  // seconds before the game-over menu appears
const BONES = [
  ["head", "neck"], ["neck", "shoulder"], ["shoulder", "hip"],
  ["shoulder", "elbowF"], ["elbowF", "handF"], ["shoulder", "elbowB"], ["elbowB", "handB"],
  ["hip", "kneeF"], ["kneeF", "footF"], ["hip", "kneeB"], ["kneeB", "footB"]
];
// Extra links that keep the head and torso from folding up unnaturally
const BRACES = [["head", "shoulder"]];
const UPPER_BODY = new Set(["head", "neck", "shoulder", "elbowF", "handF", "elbowB", "handB"]);

let ragdoll = null;
let shakeTime = 0;

function crash(obstacle) {
  state = "dying";
  releaseDuck();
  document.body.classList.remove("playing");
  shakeTime = 0.25;
  sfx.hit();

  const pose = getPose();
  // An enemy, the spike ball, or anything flying/beaming at the upper body
  // knocks him backwards; things on the ground trip him forwards
  const knockBack = ["enemy", "ninja", "brute", "phantom", "boss", "spikeball"].includes(obstacle.type) ||
    (["drone", "laser", "bat", "arrow"].includes(obstacle.type) && obstacle.y + obstacle.h / 2 < pose.hip.y);
  ragdoll = makeRagdoll(pose, (name) => {
    const upper = UPPER_BODY.has(name);
    let vx = knockBack ? (upper ? -0.45 : 0.25) * speed : (upper ? 0.6 : 0.3) * speed;
    vx += (Math.random() - 0.5) * 60;
    const vy = Math.min(player.vy, 0) * 0.6 - (knockBack ? 220 : 480) * (upper ? 1 : 0.4);
